<script>
"use strict";

/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "결과 전송 중...";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "✓ 결과가 지나티처에게 자동 전송되었어요"; el.style.color = "#2e7d6e"; }
  else { el.textContent = "전송이 안 됐어요 — 아래 버튼으로 복사해서 카톡으로 보내주세요!"; el.style.color = "#c0392b"; }
}


/* ══════ 문제 데이터 (개념 페이지 + 쌍둥이 문제) ══════ */
var STEPS = [
 {
  "type": "concept",
  "html": "<div class='ctitle'>① 가주어 It + 형용사 + (for/of + 목적격) + to 동사원형 (7과)</div><div class='box'><div class='lab'>교과서 · 문법 문장 (7과)</div>It is exciting to watch the parade. / It is kind of you to help me.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div><b>That</b> is fun to ~ / It is safe <b>of</b> kids ~ / It is polite <b>for</b> him ~ / It is easy for me <b>ride</b> ~</div><div class='box ok'><div class='lab'>정답 모양</div><b>It</b> is + 형용사 + (for/of + 목적격) + <b>to 동사원형</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>To 동사원형 주어가 길면 뒤로 보내고 주어 자리에 <b>It</b>을 둬요(That·This ✕). for와 of는 뜻이 같아 보여서 <b>형용사</b>로 골라요. 사람의 <b>성격·태도</b>(nice, smart, silly)면 <b>of</b>, 일이 쉽다·위험하다·필요하다 같은 <b>판단</b>이면 <b>for</b>. 그리고 뒤에 <b>to</b>를 빠뜨리지 않기!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>To walk alone at night is dangerous. → <b class='hl'>It</b> is dangerous <b class='hl'>to walk</b> alone at night.</li><li>It is necessary <b class='hl'>for</b> us to ~ (판단) / It is smart <b class='hl'>of</b> her to ~ (성격)</li></ul></div><div class='trap'>⚠️ 함정: That/This ✕ · for/of 뒤 주격·소유격 ✕ · to 빠뜨리기 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>It was generous ______ Mr. Park to pay for our lunch.</div>",
  "choices": ["for", "to", "of", "at"],
  "answer": "of",
  "exp": "generous(너그러운)는 사람의 <b>성격·태도</b> → <b>of</b> + 목적격."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (우리가 여름에 물을 충분히 마시는 것은 중요하다)<div class='pass'>It is important ______ to drink enough water in summer.</div>",
  "choices": ["for us", "of us", "for we", "us"],
  "answer": "for us",
  "exp": "important(중요한)는 일에 대한 <b>판단</b> → <b>for</b> + 목적격 <b>us</b> (for we ✕)."
 },
 {
  "type": "twin",
  "q": "어법상 <b>옳은</b> 문장은?",
  "choices": ["It is hard for my grandma read small letters.", "It was careless of him to leave the door open.", "It was careless for him to leave the door open.", "This is easy for me to solve the puzzle."],
  "answer": "It was careless of him to leave the door open.",
  "exp": "careless(부주의한)는 사람의 태도 → <b>of him</b> + <b>to leave</b> ○. to 빠뜨리기 ✕, This로 시작 ✕(가주어는 <b>It</b>)."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>② 현재완료 계속 for / since · 경험 Have(Has) ~ ever (8과)</div><div class='box'><div class='lab'>교과서 · 문법 문장 (8과 Wrap Up)</div>My grandparents have lived in this city for 10 years. / We have lived here since last year. / Have you ever seen a musical before?</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>have lived ~ <b>since</b> 10 years / <b>for</b> last year / <b>Did</b> you ever seen ~?</div><div class='box ok'><div class='lab'>정답 모양</div><b>for</b> + 기간(숫자) · <b>since</b> + 시작 시점 · <b>Have/Has</b> + 주어 + ever + p.p.?</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>for와 since 모두 '~ 동안 / ~부터'로 해석돼요. 뒤를 보세요. <b>얼마 동안</b>(10 years, two months)이면 <b>for</b>, <b>언제부터</b>(2020, last year, I was ten)면 <b>since</b>. since 뒤에는 주어 + 동사(과거)도 올 수 있어요. 경험을 물을 때는 Did가 아니라 <b>Have/Has</b>로 시작하고 동사는 <b>p.p.</b>!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>I have known her <b class='hl'>for</b> five years. / <b class='hl'>since</b> 2021. / <b class='hl'>since</b> I was ten.</li><li><b class='hl'>Has</b> he ever <b class='hl'>visited</b> Jeju? — Yes, he <b class='hl'>has</b>. / No, he <b class='hl'>hasn't</b>.</li></ul></div><div class='trap'>⚠️ 함정: since + 기간 ✕ · for + 시점 ✕ · ago 와 현재완료 ✕ · Did ~ ever + p.p. ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (우리 가족은 2019년부터 이 아파트에 살아왔다)<div class='pass'>My family has lived in this apartment ______ 2019.</div>",
  "choices": ["for", "since", "ago", "during"],
  "answer": "since",
  "exp": "2019는 <b>시작 시점</b> → <b>since</b>. for 뒤에는 기간(숫자 + years)."
 },
 {
  "type": "twin",
  "q": "대화의 빈칸에 알맞은 말은?<div class='pass'>A: ______ you ever eaten Thai food?<br>B: No, I haven't. I want to try it.</div>",
  "choices": ["Did", "Do", "Have", "Has"],
  "answer": "Have",
  "exp": "경험을 묻는 말 + eaten(p.p.) + 주어 you → <b>Have</b> you ever ~? (Did ✕)"
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["She has taught English for twenty years.", "I have never ridden a horse.", "Have you finished your report yet?", "My uncle has bought a new car a month ago."],
  "answer": "My uncle has bought a new car a month ago.",
  "exp": "a month ago는 과거 시점 → 현재완료 ✕, <b>My uncle bought</b> a new car a month ago."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>③ 지각동사 see / hear / feel + 목적어 + 동사원형 / -ing (8과)</div><div class='box'><div class='lab'>교과서 문장 (8과 본문 · Time Travel)</div>He felt the machine moving under his feet.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>felt the machine <b>to move</b></div><div class='box ok'><div class='lab'>정답 모양</div>felt the machine <b>move</b> / <b>moving</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>want me <b>to</b> go처럼 '목적어가 ~하는 것'에 to를 붙이는 동사가 많아서, 지각동사에도 to를 붙이고 싶어져요. 하지만 <b>보고(see, watch) · 듣고(hear) · 느끼는(feel)</b> 동사는 목적어 뒤에 <b>동사원형</b> 또는 <b>-ing</b>만! 진행 중인 느낌을 살리면 -ing예요.</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>I <b class='hl'>saw</b> him <b class='hl'>cross</b> the street. / <b class='hl'>crossing</b> the street.</li><li>She <b class='hl'>heard</b> the dog <b class='hl'>bark</b>. (to bark ✕)</li></ul></div><div class='trap'>⚠️ 함정: 지각동사 + 목적어 + to 동사원형 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (우리는 해가 산 뒤로 지는 것을 지켜보았다)<div class='pass'>We watched the sun ______ down behind the mountains.</div>",
  "choices": ["to go", "go", "went", "goes"],
  "answer": "go",
  "exp": "지각동사 <b>watch + 목적어 + 동사원형</b> → watched the sun <b>go</b> down (to go ✕)."
 },
 {
  "type": "twin",
  "q": "우리말을 영어로 바르게 옮긴 것은?<div class='pass'>나는 빗방울이 창문을 두드리는 소리를 들었다.</div>",
  "choices": ["I heard the rain hitting the window.", "I heard the rain to hit the window.", "I heard the rain hits the window.", "I heard the rain was hit the window."],
  "answer": "I heard the rain hitting the window.",
  "exp": "<b>hear + 목적어 + -ing</b>(또는 동사원형) → heard the rain <b>hitting</b>. to hit ✕."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["I saw a cat climbing the tree.", "She felt her heart beat fast.", "We heard the baby cry at night.", "He watched his son to ride a bike."],
  "answer": "He watched his son to ride a bike.",
  "exp": "지각동사 watch 뒤에는 동사원형/-ing → watched his son <b>ride</b> (또는 riding) a bike. to ride ✕."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>④ want / tell / ask + 목적어 + to 동사원형 (8과)</div><div class='box'><div class='lab'>교과서 문장 (8과 본문 · Time Travel)</div>I don't want you to do anything foolish. / You don't want it to see you.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>want you <b>do</b> / want you <b>doing</b> / want <b>that you</b> ~</div><div class='box ok'><div class='lab'>정답 모양</div>want + <b>목적격</b> + <b>to 동사원형</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>③의 지각동사와 반대예요! <b>want · tell · ask</b>는 '목적어가 ~하기를 원하다 / ~하라고 말하다 / 부탁하다'라서 목적어 뒤에 꼭 <b>to</b>가 와요. 목적어 자리는 목적격(me, him, my sister)!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>The teacher <b class='hl'>told</b> us <b class='hl'>to be</b> quiet.</li><li>I <b class='hl'>asked</b> her <b class='hl'>to help</b> me.</li></ul></div><div class='trap'>⚠️ 함정: 지각동사(see/hear/feel)는 to ✕ · want/tell/ask 는 to ○ — 짝을 바꾸지 않기!</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (엄마는 나에게 저녁 식사 후에 설거지를 해 달라고 부탁하셨다)<div class='pass'>Mom asked me ______ the dishes after dinner.</div>",
  "choices": ["wash", "washing", "to wash", "washed"],
  "answer": "to wash",
  "exp": "<b>ask + 목적어 + to 동사원형</b> → asked me <b>to wash</b>."
 },
 {
  "type": "twin",
  "q": "우리말을 영어로 바르게 옮긴 것은?<div class='pass'>선생님은 우리가 휴대폰을 끄기를 원하신다.</div>",
  "choices": ["The teacher wants us turn off our phones.", "The teacher wants us to turn off our phones.", "The teacher wants we to turn off our phones.", "The teacher wants that us turn off our phones."],
  "answer": "The teacher wants us to turn off our phones.",
  "exp": "<b>want + 목적격(us) + to 동사원형</b>. we ✕, to 빠뜨리기 ✕."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (지호의 누나는 추워서 지호에게 창문을 닫으라고 말했다)<div class='pass'>Jiho's sister told him ______ the window because it was cold.</div>",

  "answer": "to close",
  "exp": "<b>tell + 목적어 + to 동사원형</b> → told him <b>to close</b>. 지각동사와 짝 바꾸지 않기!"
 },
 {
  "type": "concept",

 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>Please don't talk on the phone ______ the movie.</div>",
  "choices": ["while", "for", "during", "since"],
  "answer": "during",
  "exp": "뒤에 명사(the movie)만 → <b>during</b>."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (아빠가 세차하시는 동안 나는 차고를 청소했다)<div class='pass'>______ my dad was washing the car, I cleaned the garage.</div>",
  "choices": ["While", "During", "For", "Since"],
  "answer": "While",
  "exp": "뒤에 주어 + 동사(my dad was washing) → 접속사 <b>While</b>."
 },
 {

  "q": "어법상 <b>옳은</b> 문장은?",
  "choices": ["I fell asleep while the long speech.", "She broke her arm during she was skiing.", "During we were eating, the lights went out.", "We met a famous singer during our trip to Busan."],
  "answer": "We met a famous singer during our trip to Busan.",

var QUIZ_ID = "clinic-hte-1108";
var QUIZ_TITLE = "한태은 사진 클리닉 개념+쌍둥이 11/08";
var TW = STEPS.filter(function (x) { return x.type === "twin"; });
var CONCEPT_OF = {};
(function () { var last = ""; STEPS.forEach(function (x, i) { if (x.type === "concept") last = x.html; else CONCEPT_OF[i] = last; }); })();

var studentName = "", cur = 0, twinNo = 0, correctCount = 0, wrongNumbers = [], unknownNumbers = [], answersLog = [], startTime = 0, locked = false;
var nameInput = document.getElementById("name-input"), startBtn = document.getElementById("start-btn");
var CIRCLED = ["①", "②", "③", "④", "⑤"];
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function $(id) { return document.getElementById(id); }

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  $("start-card").classList.add("hidden");
  $("quiz-card").classList.remove("hidden");
  show();
});
$("read-btn").addEventListener("click", function () { cur++; show(); });

function show() {
  if (cur >= STEPS.length) return showResult();
  var st = STEPS[cur];
  $("bar-fill").style.width = Math.round(cur / STEPS.length * 100) + "%";
  $("fb").innerHTML = "";
  if (st.type === "concept") {
    $("progress").textContent = "틀린 이유 읽기 · 쌍둥이 문제 " + (twinNo + 1) + "번 전";
    $("part").classList.add("hidden");
    $("concept-box").innerHTML = st.html; $("concept-box").classList.remove("hidden");
    $("read-btn").classList.remove("hidden");
    $("qtext").innerHTML = ""; $("choices").innerHTML = "";
    window.scrollTo(0, 0);
  } else {
    $("progress").textContent = "쌍둥이 문제 " + (twinNo + 1) + " / " + TW.length;
    $("concept-box").classList.add("hidden"); $("read-btn").classList.add("hidden");
    $("qtext").innerHTML = "Q" + (twinNo + 1) + ". " + st.q;
    var box = $("choices"); box.innerHTML = "";
    shuffle(st.choices).forEach(function (c, i) {
      var b = document.createElement("button"); b.className = "choice"; b.setAttribute("data-c", c);
      b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
      b.addEventListener("click", function () { pick(c); });
      box.appendChild(b);
    });
    var u = document.createElement("button"); u.className = "unk"; u.id = "unk-btn"; u.textContent = "🤔 모름";
    u.addEventListener("click", function () { unknown(); });
    box.appendChild(u);
    window.scrollTo(0, 0);
  }
}

function pick(choice) {
  if (locked) return; locked = true;
  var st = STEPS[cur], ok = choice === st.answer;
  if (ok) correctCount++; else wrongNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: ok, chosen: choice, answer: st.answer });
  [].forEach.call($("choices").children, function (b) {
    b.disabled = true;
    if (b.getAttribute("data-c") === st.answer) b.classList.add("right");
    else if (b.getAttribute("data-c") === choice) b.classList.add("bad");
  });
  var h = '<div class="exp' + (ok ? "" : " wrong") + '"><b>' + (ok ? "정답! 🎉" : "아쉬워요 — 정답: " + st.answer) + "</b><br>" + st.exp + "</div>";
  if (!ok) h += '<div class="lab2">📖 개념 정리 다시 보기</div>' + CONCEPT_OF[cur];
  h += '<button class="btn" id="next-btn">' + (twinNo + 1 < TW.length ? "다음 ▶" : "결과 보기") + "</button>";
  $("fb").innerHTML = h;
  $("next-btn").addEventListener("click", function () { locked = false; twinNo++; cur++; show(); });
}

function unknown() {
  if (locked) return; locked = true;
  var st = STEPS[cur];
  wrongNumbers.push(twinNo + 1); unknownNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: false, chosen: "모름", answer: st.answer, unknown: true });
  locked = false; twinNo++; cur++; show();
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}

function showResult() {
  $("quiz-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  $("score-line").textContent = correctCount + " / " + TW.length;
  var um = document.createElement("div"); um.id = "unknown-line"; um.className = "sub"; um.style.textAlign = "center"; um.textContent = unknownLine();
  $("score-line").parentNode.insertBefore(um, $("submit-status"));
  var expBox = $("explanations");
  TW.forEach(function (q, i) {
    var log = answersLog[i], d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>쌍둥이 " + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 (정답: " + q.answer + ")" : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correctCount, total: TW.length, wrong: wrongNumbers,
    unknown: unknownNumbers, durationSec: Math.round((Date.now() - startTime) / 1000), detail: answersLog });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 사진 클리닉 11/08 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + TW.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n" + unknownLine();
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});

</script>
