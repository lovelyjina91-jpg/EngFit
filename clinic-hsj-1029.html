"use strict";

/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "결과 전송 중...";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "✓ 결과가 지나티처에게 자동 전송되었어요"; el.style.color = "#2e7d6e"; }
  else { el.textContent = "전송이 안 됐어요 — 아래 버튼으로 복사해서 카톡으로 보내주세요!"; el.style.color = "#c0392b"; }
}


/* ══════ 문제 데이터 ══════ */
var QUESTIONS = [
{"q": "빈칸에 알맞은 말은?<br>There is ______ juice in the bottle, so we need to buy more. (거의 없어서)", "choices": ["little", "few", "a few", "many"], "answer": "little", "exp": "juice는 셀 수 없는 명사라서 <b>little(거의 없는)</b>을 써요. few는 셀 수 있는 명사 앞, many도 셀 수 있는 명사 앞이에요.", "part": "Part 1 · 수량형용사 little / few / a few / a little"},

{"q": "관계대명사가 생략된 문장 중 어법상 <b>틀린</b> 것은?<br>① This is the hat I bought in Jeju.<br>② The man I saw at the station was tall.<br>③ The girl lives next door is my friend.<br>④ The pizza we ordered was cold.", "choices": ["① This is the hat I bought in Jeju.", "② The man I saw at the station was tall.", "③ The girl lives next door is my friend.", "④ The pizza we ordered was cold."], "answer": "③ The girl lives next door is my friend.", "exp": "<b>목적격</b> 관계대명사는 생략 가능하지만(①②④), ③은 who가 주어 역할을 하는 <b>주격</b>이라 생략할 수 없어요. → The girl who lives next door is my friend. 관계대명사 뒤에 주어(I, we)가 오면 목적격, 바로 동사가 오면 주격!"},
{"q": "다음 우리말을 영어로 바르게 옮긴 것은?<br>그는 내가 가장 좋아하는 가수이다.", "choices": ["He is the singer whom I like best.", "He is the singer I like him best.", "He is the singer whom I like best him.", "He is singer the whom I like best."], "answer": "He is the singer whom I like best.", "exp": "사진 39번(She is the person whom I respect most)과 같은 구조예요. <b>선행사(the singer) + whom + 주어 + 동사</b> 순서이고, 관계대명사 뒤에 목적어를 다시 쓰지 않아요."},
{"q": "다음 중 빈칸에 <b>that을 쓸 수 없는</b> 것은?<br>① The song ______ I heard was nice.<br>② The friend ______ I trust is Sam.<br>③ The house in ______ he lives is old.<br>④ This is the best movie ______ I have ever seen.", "choices": ["① The song ______ I heard was nice.", "② The friend ______ I trust is Sam.", "③ The house in ______ he lives is old.", "④ This is the best movie ______ I have ever seen."], "answer": "③ The house in ______ he lives is old.", "exp": "관계대명사 that은 <b>전치사 바로 뒤</b>에는 쓸 수 없어요. ③은 in which가 맞아요(= The house that he lives in). 사진 40번(I love the gift that you gave me)처럼 that은 평범한 목적격 자리에서는 OK!"},
{"q": "밑줄 친 부분 중 어법상 <b>틀린 부분</b>을 고르세요.<br>My brother has ① rode ② his bike ③ to school ④ since March.", "choices": ["① rode", "② his bike", "③ to school", "④ since March"], "answer": "① rode", "exp": "has 뒤에는 과거분사가 와요. ride-rode-<b>ridden</b>. rode는 과거형이라 현재완료(has + p.p.)에 쓸 수 없어요. 10/21 데일리에서도 틀렸던 개념!", "part": "Part 3 · 누적 오답 다시 잡기"},
{"q": "다음 우리말을 영어로 바르게 옮긴 것은?<br>이곳은 우리 동네에서 가장 좋은 식당들 중 하나이다.", "choices": ["This is one of the best restaurants in my town.", "This is one of the best restaurant in my town.", "This is one of best restaurants in my town.", "This is the one of best restaurants in my town."], "answer": "This is one of the best restaurants in my town.", "exp": "<b>one of the + 최상급 + 복수명사</b>. 'one of' 뒤에는 복수명사가 와요(restaurants). 7/6 기말 오답 1번(one of the oldest building)과 같은 개념이에요."},
{"q": "다음 중 어법상 <b>틀린</b> 문장은?<br>① My parents want me to exercise every morning.<br>② The teacher told us to be quiet.<br>③ I asked him close the window.<br>④ She wants her son to study hard.", "choices": ["① My parents want me to exercise every morning.", "② The teacher told us to be quiet.", "③ I asked him close the window.", "④ She wants her son to study hard."], "answer": "③ I asked him close the window.", "exp": "want / tell / ask + 목적어 + <b>to부정사</b>. ③은 <b>to close</b>가 맞아요. 7/6 기말에서 틀렸던 'want me to exercise' 개념이에요."},
{"q": "다음 우리말을 영어로 바르게 옮긴 것은?<br>우리는 이번 주말에 캠핑을 가기로 계획했다.", "choices": ["We planned to go camping this weekend.", "We planned to go to camping this weekend.", "We planned going camping this weekend.", "We planned go camping this week."], "answer": "We planned to go camping this weekend.", "exp": "plan은 <b>to부정사</b>를 목적어로 취해요(plan to go). 또 go camping은 '캠핑 가다'로 <b>to를 붙이지 않아요</b>(go to camping X). 10/21 데일리 8번에서 틀렸던 부분이에요."},
{"q": "다음 우리말을 영어로 바르게 옮긴 것은?<br>내가 도서관에서 빌린 책 몇 권은 아주 재미있었다.", "choices": ["A few books I borrowed from the library were very interesting.", "A little books I borrowed from the library were very interesting.", "A few books I borrowed them from the library were very interesting.", "Few books I borrowed from the library were very interesting."], "answer": "A few books I borrowed from the library were very interesting.", "exp": "<b>a few + 복수명사</b>(몇 권) + 생략된 목적격 관계대명사 + <b>주어 + 동사</b>. books가 복수라 동사는 were. 'them'을 또 쓰면 안 되고, few(a 없음)는 '거의 없다'로 뜻이 달라져요. 수량형용사 + 관계대명사를 합친 종합 문제!"}
]
;

var QUIZ_ID = "clinic-hsj-1029";
var QUIZ_TITLE = "한승주 사진 클리닉 10/29";
var KEEP = false;
var SAVE_KEY = "engfit-" + QUIZ_ID;

/* ══════ 진행 로직 ══════ */
var studentName = "";
var current = 0;
var correctCount = 0;
var wrongNumbers = [];
var unknownNumbers = [];
var answersLog = [];
var startTime = 0;
var elapsedBefore = 0;

var nameInput = document.getElementById("name-input");
var startBtn = document.getElementById("start-btn");

function loadSaved() {
  if (!KEEP) return null;
  try { var s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function saveProgress() {
  if (!KEEP) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ name: studentName, current: current, correctCount: correctCount, wrongNumbers: wrongNumbers, unknownNumbers: unknownNumbers, answersLog: answersLog, elapsed: elapsedBefore + Math.round((Date.now() - startTime) / 1000) })); } catch (e) {}
}
function clearSaved() { if (!KEEP) return; try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

var saved = loadSaved();
if (saved && saved.answersLog && saved.answersLog.length > 0 && saved.answersLog.length < QUESTIONS.length) {
  var note = document.getElementById("resume-note");
  note.textContent = "이어 풀기 가능: " + saved.answersLog.length + "/" + QUESTIONS.length + " 풀었어요. 시작하기를 누르면 이어서 풀어요.";
  note.classList.remove("hidden");
  if (saved.name) nameInput.value = saved.name;
}

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  var sv = loadSaved();
  if (sv && sv.name === studentName && sv.answersLog && sv.answersLog.length > 0 && sv.answersLog.length < QUESTIONS.length) {
    current = sv.current; correctCount = sv.correctCount; wrongNumbers = sv.wrongNumbers; unknownNumbers = sv.unknownNumbers || []; answersLog = sv.answersLog; elapsedBefore = sv.elapsed || 0;
  }
  document.getElementById("start-card").classList.add("hidden");
  document.getElementById("quiz-card").classList.remove("hidden");
  showQuestion();
});

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

var CIRCLED = ["①", "②", "③", "④", "⑤"];

function partFor(idx) {
  for (var i = idx; i >= 0; i--) if (QUESTIONS[i].part) return QUESTIONS[i].part;
  return "";
}

function showQuestion() {
  var q = QUESTIONS[current];
  document.getElementById("progress").textContent = (current + 1) + " / " + QUESTIONS.length;
  document.getElementById("bar-fill").style.width = Math.round(current / QUESTIONS.length * 100) + "%";
  var pt = document.getElementById("part"), ptxt = partFor(current);
  if (ptxt) { pt.textContent = ptxt; pt.classList.remove("hidden"); } else pt.classList.add("hidden");
  document.getElementById("qtext").innerHTML = "Q" + (current + 1) + ". " + q.q;
  var box = document.getElementById("choices");
  box.innerHTML = "";
  shuffle(q.choices).forEach(function (c, i) {
    var b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
    b.addEventListener("click", function () { pick(c, CIRCLED[i]); });
    box.appendChild(b);
  });
  var u = document.createElement("button");
  u.className = "unknown"; u.id = "unknown-btn";
  u.textContent = "🤔 모름";
  u.addEventListener("click", function () { pick("모름", "", true); });
  box.appendChild(u);
}

var locked = false;
function pick(choice, mark, unknown) {
  if (locked) return; locked = true;
  var q = QUESTIONS[current];
  var ok = !unknown && choice === q.answer;
  if (ok) correctCount++;
  else wrongNumbers.push(current + 1);
  var entry = { no: current + 1, ok: ok, chosen: choice, answer: q.answer };
  if (unknown) { entry.unknown = true; unknownNumbers.push(current + 1); }
  answersLog.push(entry);
  current++;
  saveProgress();
  setTimeout(function () {
    locked = false;
    if (current < QUESTIONS.length) showQuestion();
    else showResult();
  }, 250);
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}

function showResult() {
  clearSaved();
  document.getElementById("quiz-card").classList.add("hidden");
  document.getElementById("result-card").classList.remove("hidden");
  document.getElementById("score-line").textContent = correctCount + " / " + QUESTIONS.length;

  var ul = document.createElement("div");
  ul.className = "sub"; ul.id = "unknown-line"; ul.style.textAlign = "center";
  ul.textContent = unknownLine();
  document.getElementById("score-line").insertAdjacentElement("afterend", ul);
  var expBox = document.getElementById("explanations");
  QUESTIONS.forEach(function (q, i) {
    var log = answersLog[i];
    var d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>Q" + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 → 정답: " + q.answer : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });

  engfitSubmitWithStatus({
    quizId: QUIZ_ID,
    quizTitle: QUIZ_TITLE,
    student: studentName,
    score: correctCount,
    total: QUESTIONS.length,
    wrong: wrongNumbers,
    unknown: unknownNumbers,
    durationSec: elapsedBefore + Math.round((Date.now() - startTime) / 1000),
    detail: answersLog
  });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 사진 클리닉 10/29 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + QUESTIONS.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n" + unknownLine();
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});
</script>
</body>
</html>
