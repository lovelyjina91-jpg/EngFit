<script>
"use strict";

/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "결과 전송 중...";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "✓ 결과가 지나티처에게 자동 전송되었어요"; el.style.color = "#2e7d6e"; }
  else { el.textContent = "전송이 안 됐어요 — 아래 버튼으로 복사해서 카톡으로 보내주세요!"; el.style.color = "#c0392b"; }
}

/* ══════ 규칙 카드 ══════ */
/* ══════ 규칙 카드: 본동사 ══════ */
var R_ONE = "<b>규칙</b> 한 문장에 <em>본동사는 딱 하나</em>!<br>· 본동사 = 주어가 실제로 <em>하는 일 / 상태</em> (like, eat, is, has …)<br>· be동사(am/is/are)와 일반동사(like, eat)는 <em>같이 쓰지 않아요</em><br>예) I <em>like</em> carrots. (⭕) / I am like carrots. (❌)";
var R_NEG = "<b>규칙</b> 본동사가 <em>일반동사</em>면 부정·질문은 <em>do / does / did</em>가 도와줘요<br>· I <em>don't like</em> ~ / She <em>doesn't eat</em> ~ / <em>Does</em> he <em>play</em> ~?<br>· be동사 본동사(is, are)일 때만 is not / Are you ~?<br>예) I'm not like (❌) → I <em>don't like</em> (⭕)";
var R_AUX = "<b>규칙</b> 조동사(can, will, must, should)는 <em>본동사를 도와주는 말</em><br>· 조동사 + <em>동사원형</em> (s, -ed, -ing ❌)<br>예) She can <em>speak</em> English. (⭕) / She can speaks (❌)";
var R_TO = "<b>규칙</b> <em>to + 동사, 동사ing</em>는 본동사가 아니에요 (꾸며 주는 말)<br>· 본동사를 먼저 찾고 → 그 뒤에 to·ing가 붙어요<br>예) I <em>want</em> to be a doctor. (본동사 want) / He <em>enjoys</em> playing soccer. (본동사 enjoys)";
var R_REL = "<b>규칙</b> who / which / that 뒤에 나오는 동사는 <em>설명하는 동사</em>, 문장 전체의 본동사는 따로 있어요<br>· The boy who sits next to me <em>helps</em> me. → 문장의 본동사 = <em>helps</em> (주어 The boy)<br>· 본동사는 맨 앞 진짜 주어에 맞춰 s 붙이기";

/* ══════ 문제 데이터: 10/22 진단평가 오답 → 본동사 이유 + 쌍둥이 ══════ */
var ITEMS = [
 { no: 1, part: "Part 1 · 본동사는 하나", rule: R_ONE,

   q: "본동사에 맞게 알맞은 것을 고르세요.<br>She ______ milk. (그녀는 우유를 마시지 않는다.)", choices: ["doesn't drink", "isn't drink", "not drinks"], answer: "doesn't drink",
   exp: "본동사 drink 하나 + 부정 도우미 doesn't. is 를 같이 쓰지 않아요." },
 { no: 2, rule: R_ONE,
   orig: "본동사 찾기: My mom makes me a sandwich every morning.", mine: "(본동사를 못 찾고 me 위치 혼동)", right: "본동사 = makes",
   why: "주어 My mom 다음에 오는 <b>makes</b>가 본동사예요. 본동사를 먼저 찾으면 그 뒤에 '누구에게(me) + 무엇을(a sandwich)' 순서가 보여요.",

 { no: 3, rule: R_ONE,
   orig: "올바른 문장 고르기", mine: "She looks sadly today.", right: "She looks sad today.",
   why: "본동사 <b>looks</b>(~해 보이다) 뒤에는 어떤 상태인지 말하는 <b>형용사</b>가 와요. sadly 는 본동사를 꾸미는 부사라 어울리지 않아요.",

   exp: "본동사 look + 형용사 <b>tired</b>." },
 { no: 4, part: "Part 2 · 일반동사 본동사의 부정·질문", rule: R_NEG,
   orig: "A: ______ he play the guitar? B: No, he doesn't.", mine: "Is", right: "Does",

 { no: 5, rule: R_NEG,

   orig: "틀린 문장 고르기", mine: "(골랐지만 이유 모름)", right: "She can speaks three languages. (❌)",

 { no: 9, rule: R_TO,

var QUIZ_ID = "clinic-psj-1023";
var QUIZ_TITLE = "박상준 본동사 클리닉 10/23";

/* ══════ 진행 ══════ */
var studentName = "", cur = 0, correct = 0, wrong = [], unknown = [], detail = [], startTime = 0, answered = false;
function $(id) { return document.getElementById(id); }
function show(id) { ["start-card", "why-card", "twin-card", "result-card"].forEach(function (c) { $(c).classList.add("hidden"); }); $(id).classList.remove("hidden"); window.scrollTo(0, 0); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function partOf(i) { for (var k = i; k >= 0; k--) if (ITEMS[k].part) return ITEMS[k].part; return ""; }
function prog(i) { return (i + 1) + " / " + ITEMS.length + " · 진단평가 오답 " + (i+1); }

$("start-btn").addEventListener("click", function () {
  var n = $("name-input").value.trim();
  if (!n) { $("name-input").focus(); return; }
  studentName = n; startTime = Date.now(); showWhy();
});

function showWhy() {
  var it = ITEMS[cur];
  $("why-progress").textContent = prog(cur);
  $("why-bar").style.width = (cur / ITEMS.length * 100) + "%";
  var p = it.part || "";
  if (p) { $("why-part").textContent = p; $("why-part").classList.remove("hidden"); } else { $("why-part").textContent = partOf(cur); $("why-part").classList.remove("hidden"); }
  $("why-orig").innerHTML = "<b>원래 문제</b><br>" + it.orig;
  $("why-mine").textContent = it.mine;
  $("why-right").textContent = it.right;
  $("why-text").innerHTML = "<b>왜 틀렸을까?</b><br>" + it.why;
  $("why-rule").innerHTML = it.rule;
  show("why-card");
}
$("read-btn").addEventListener("click", showTwin);

function showTwin() {
  var it = ITEMS[cur]; answered = false;
  $("twin-progress").textContent = prog(cur);
  $("twin-bar").style.width = ((cur + 0.5) / ITEMS.length * 100) + "%";
  $("twin-q").innerHTML = it.q;
  var box = $("choices"); box.innerHTML = "";
  shuffle(it.choices).forEach(function (c, k) {
    var b = document.createElement("button");
    b.className = "choice"; b.innerHTML = '<span class="num">' + (k + 1) + "</span>" + c;
    b.dataset.v = c;
    b.addEventListener("click", function () { pick(c, b); });
    box.appendChild(b);
  });
  $("unknown-btn").classList.remove("hidden");
  $("fb").classList.add("hidden"); $("next-btn").classList.add("hidden");
  show("twin-card");
}

function pick(c, btn) {
  if (answered) return; answered = true;
  var it = ITEMS[cur], ok = (c === it.answer);
  if (ok) correct++; else wrong.push(cur + 1);
  detail.push({ no: cur + 1, orig: it.no, ok: ok, chosen: c, answer: it.answer });
  Array.prototype.forEach.call(document.querySelectorAll(".choice"), function (b) {
    if (b.dataset.v === it.answer) b.classList.add("ok"); else if (b === btn) b.classList.add("no");
  });
  $("unknown-btn").classList.add("hidden");
  var fb = $("fb"); fb.classList.remove("hidden");
  fb.className = "fb " + (ok ? "good" : "bad");
  fb.innerHTML = ok ? "⭕ 맞았어요! " + it.exp : "❌ 아쉬워요. " + it.exp + "<br><br>" + it.rule;
  $("next-btn").classList.remove("hidden");
}

$("unknown-btn").addEventListener("click", function () {
  if (answered) return; answered = true;
  var it = ITEMS[cur];
  wrong.push(cur + 1); unknown.push(cur + 1);
  detail.push({ no: cur + 1, orig: it.no, ok: false, chosen: "모름", answer: it.answer, unknown: true });
  next();
});
$("next-btn").addEventListener("click", next);

function next() { cur++; if (cur < ITEMS.length) showWhy(); else finish(); }

function unkText() { return "🤔 모름: " + unknown.length + "개" + (unknown.length ? " (" + unknown.join(", ") + "번)" : ""); }

function finish() {
  var total = ITEMS.length, sec = Math.round((Date.now() - startTime) / 1000);
  $("score-line").textContent = correct + " / " + total;
  $("unk-line").textContent = unkText();
  var html = "";
  ITEMS.forEach(function (it, i) {
    var d = detail[i];
    html += '<div class="exp' + (d.ok ? "" : " wrong") + '"><b>' + (i + 1) + ". " + (d.ok ? "⭕" : (d.unknown ? "🤔 모름" : "❌")) + "</b> " + it.q.replace(/<br>/g, " ") + "<br>정답: <b>" + it.answer + "</b>" + (d.ok || d.unknown ? "" : " (고른 답: " + d.chosen + ")") + "<br>" + it.exp + "</div>";
  });
  $("explanations").innerHTML = html;
  show("result-card");
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correct, total: total, wrong: wrong, unknown: unknown, durationSec: sec, detail: detail });
}

$("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 본동사 클리닉 10/23 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName + "\n점수: " + correct + "/" + ITEMS.length + "\n틀린 문항: " + (wrong.length ? wrong.join(", ") : "없음") + "\n" + unkText();
  navigator.clipboard.writeText(msg).then(function () {
    $("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});
</script>
</body>
</html>
