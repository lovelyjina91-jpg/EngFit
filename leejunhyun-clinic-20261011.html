<title>이준현 심화 클리닉 · Unit 05 Society | 영핏 지나티처</title>
<style>
:root{color-scheme:light;--teal:#2F7C83;--teal-d:#235E64;--teal-l:#E6F1F1;--line:#DBE4E5;--ink:#2B3A3D;--mut:#6B7B7E;--cream:#FFF6E8;--warn:#C0392B}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#F3F7F7;color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:14px 12px 40px;line-height:1.6}
.wrap{width:100%;max-width:640px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{display:flex;align-items:center;gap:8px}
.logo .mk{width:34px;height:34px;border-radius:9px;background:var(--teal);color:#fff;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center}
.logo .tx{font-weight:800;color:var(--teal-d);font-size:15px;line-height:1.1}
.logo .tx small{display:block;font-weight:500;color:var(--mut);font-size:10.5px}
.mute{background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin-bottom:14px;box-shadow:0 1px 6px rgba(35,94,100,.06)}
h1{font-size:1.3rem;color:var(--teal-d);margin-bottom:4px}
h2{font-size:1.1rem;color:var(--teal-d);margin-bottom:10px}
.sub{color:var(--mut);font-size:.9rem;margin-bottom:14px}
.lbl{font-weight:700;font-size:.9rem;margin:14px 0 6px;color:var(--teal-d)}
input[type=text]{width:100%;padding:13px;font-size:1.05rem;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{text-align:left;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font-family:inherit}
.sec b{display:block;font-size:.95rem}
.sec span{display:block;font-size:.78rem;color:var(--mut)}
.sec.on{border-color:var(--teal);background:var(--teal-l)}
.badge{display:inline-block;margin-top:4px;font-size:.74rem;font-weight:700;border-radius:999px;padding:1px 8px}
.b-prog{background:#FFE9C7;color:#9A5B00}.b-done{background:var(--teal);color:#fff}
.descbox{background:var(--cream);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-top:12px;min-height:44px;color:var(--ink)}
.btn{display:block;width:100%;margin-top:12px;padding:14px;font-size:1.02rem;font-weight:700;color:#fff;background:var(--teal);border:none;border-radius:10px;cursor:pointer;font-family:inherit}
.btn:disabled{background:#B8C7C8;color:#fff;cursor:default}
.btn.ghost{background:#fff;color:var(--teal-d);border:1.5px solid var(--teal)}
.btn.sm{width:auto;display:inline-block;padding:8px 14px;font-size:.88rem;margin:6px 6px 0 0}
.notes{font-size:.8rem;color:var(--mut);margin-top:14px}
.notes li{margin-left:16px}
.prog{font-size:.85rem;color:var(--mut);margin-bottom:8px;display:flex;justify-content:space-between}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.psg{background:#F6FAFA;border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;padding:12px 14px;font-size:.93rem;margin-bottom:14px;color:var(--ink);line-height:1.75}
.psg u{text-decoration:underline;text-underline-offset:3px}
.mut{color:var(--mut);font-size:.8rem}
.qt{font-size:1.04rem;font-weight:700;line-height:1.65;margin-bottom:12px}
.qt u{text-underline-offset:3px}
.ch{display:block;width:100%;text-align:left;padding:12px 13px;margin-bottom:9px;font-size:.98rem;background:#F8FBFB;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-family:inherit;line-height:1.5}
.ch .n{color:var(--teal);font-weight:800;margin-right:6px}
.ch.sel{background:var(--teal-l);border-color:var(--teal)}
.say{background:#fff;color:var(--teal-d);border:1.5px solid var(--teal);border-radius:999px;padding:5px 12px;font-size:.82rem;cursor:pointer;margin-bottom:10px;font-family:inherit}
.chip{display:inline-block;background:var(--teal-l);color:var(--teal-d);border:1px solid var(--teal);border-radius:999px;padding:0 9px;font-size:.88rem;font-weight:700;cursor:pointer;font-family:inherit;line-height:1.7}
.chip:before{content:"🔊 ";font-size:.75rem}
table.t{width:100%;border-collapse:collapse;font-size:.9rem;margin:8px 0}
table.t th,table.t td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--teal-l);color:var(--teal-d)}
.cardbody p{margin-bottom:10px}.cardbody ol{margin-left:20px}.cardbody li{margin-bottom:6px}
.score{font-size:2.1rem;font-weight:800;color:var(--teal);text-align:center;margin:8px 0}
#submit-status{text-align:center;font-size:.9rem;min-height:1.3em;margin:8px 0;color:var(--mut)}
.exp{background:#F8FBFB;border-left:4px solid var(--teal);border-radius:8px;padding:11px 13px;margin-bottom:10px;font-size:.9rem;line-height:1.65}
.exp.w{border-left-color:var(--warn);background:#FFF8F6}
.exp .h{font-weight:800;color:var(--teal-d);margin-bottom:4px}
.exp.w .h{color:var(--warn)}
.exp .qq{color:var(--mut);font-size:.85rem;margin-bottom:6px}
.foot{text-align:center;color:var(--mut);font-size:.78rem;margin-top:18px}
.hidden{display:none}
</style>
</head>

<script>
"use strict";
var SECTIONS = [
/* ───────────── 1영역 ───────────── */
{
  name: "낱말 심화", short: "invest · donate · expand", desc: "뜻이 비슷해 보이는 낱말 구별 · 파생어 · 짝꿍 표현",
  cards: [
    { title: "왜 틀렸을까?", html:
      "<p>Word Check 5문제 중 <b>1번 nonprofit · 3번 consumer · 4번 remote</b> 세 개는 정확하게 썼어요. 👍</p>" +
      "<p>헷갈린 건 <b>2번과 5번</b>이에요. 2번 <i>“돈을 넣어서 자라게 하다”</i> 자리에 <b>donate</b>를, 5번 <i>“도움이 되도록 주다”</i> 자리에 <b>expand</b>를 썼어요. 두 정의가 서로 바뀐 거예요.</p>" +
      "<p>둘 다 “돈이나 자원을 쓰는 일” 같은 느낌이라 <u>느낌만으로 고르면</u> 헷갈려요. 정의 안의 <b>동사(put money / give)</b>와 <b>목적(grow / help)</b>을 먼저 보면 바로 구별돼요.</p>" },
    { title: "규칙 카드 · 세 낱말 구별", html:
      "<table class='t'><tr><th>낱말</th><th>핵심 그림</th><th>짝꿍</th></tr>" +
      "<tr><td>[[invest]] 투자하다</td><td>돈을 <b>넣어서 키운다</b> (이익을 기대)</td><td>invest <b>in</b> ~</td></tr>" +
      "<tr><td>[[donate]] 기부하다</td><td>대가 없이 <b>그냥 준다</b></td><td>donate A <b>to</b> B</td></tr>" +
      "<tr><td>[[expand]] 커지다·넓히다</td><td>크기·수·양이 <b>커진다</b></td><td>expand into ~</td></tr></table>" +
      "<p><b>가족 낱말:</b> [[investment]] 투자 · [[investor]] 투자자 / [[donation]] 기부 · [[donor]] 기부자 / [[expansion]] 확장</p>" +
      "<p><b>profit 짝꿍(Word Focus):</b> earn a profit · maximize profits · huge profit · handsome profit</p>" }
  ],
  qs: [
    { q: "Which word matches this definition?<br><i>“to put money into something so that it can grow or bring a profit”</i>",
      ch: ["invest","donate","expand","consume","protect"], a: 0, say: "invest",
      exp: "<b>invest</b>(투자하다)가 정답이에요. 정의의 <i>so that it can grow</i>(자라도록)가 단서예요. <b>donate</b>는 대가 없이 주는 것, <b>expand</b>는 스스로 커지는 것, <b>consume</b>은 써서 없애는 것, <b>protect</b>는 지키는 것이라 ‘키우려고 넣는다’는 뜻이 없어요." },
    { q: "Which word matches this definition?<br><i>“to give something, such as money or goods, to help a person or organization”</i>",
      ch: ["donate","invest","expand","remain","practice"], a: 0, say: "donate",
      exp: "<b>donate</b>(기부하다)가 정답이에요. <i>to give</i>가 핵심이고 돌려받을 걸 기대하지 않아요. <b>invest</b>는 이익을 기대하고 넣는 것이고, <b>expand</b>는 커지는 것, <b>remain</b>은 남아 있는 것, <b>practice</b>는 연습하거나 실천하는 것이에요." },
    { q: "Which word matches this definition?<br><i>“to become larger in size, number, or amount”</i>",
      ch: ["expand","invest","donate","reject","protect"], a: 0, say: "expand",
      exp: "<b>expand</b>(커지다)가 정답이에요. <i>become larger</i>가 그대로 뜻이에요. 돈이나 물건을 ‘주거나 넣는’ 동작은 아니라서 donate·invest와 달라요. reject는 거절하다, protect는 보호하다예요." },
    { q: "Which word matches this definition?<br><i>“not having the purpose of making money”</i>",
      ch: ["nonprofit","consumer","remote","profitable","handsome"], a: 0, say: "nonprofit",
      exp: "<b>nonprofit</b>은 non(아닌) + profit(이익) = 이익이 목적이 아닌 단체예요. <b>profitable</b>은 반대로 ‘이익이 나는’이고, consumer는 사는 사람, remote는 외딴, handsome은 잘생긴(profit과 짝이 되면 ‘꽤 큰’)이에요." },
    { q: "Which word matches this definition?<br><i>“a person who buys products or services”</i>",
      ch: ["consumer","donor","investor","producer","volunteer"], a: 0, say: "consumer",
      exp: "<b>consumer</b>(소비자)가 정답이에요. <b>donor</b>는 기부하는 사람, <b>investor</b>는 투자하는 사람, <b>producer</b>는 만드는 사람, <b>volunteer</b>는 자원봉사자예요. ‘사는 사람’은 consumer 하나뿐이에요." },
    { q: "Which word matches this definition?<br><i>“located far away from towns or cities”</i>",
      ch: ["remote","nonprofit","careful","crowded","local"], a: 0, say: "remote",
      exp: "<b>remote</b>(외딴)가 정답이에요. <b>crowded</b>(붐비는)와 <b>local</b>(그 지역의, 가까운)은 오히려 반대 느낌이고, nonprofit·careful은 위치와 관계없어요." },
    { q: "The company decided to ______ in solar energy, hoping it would bring huge profits later.",
      ch: ["invest","donate","consume","protect","practice"], a: 0, say: "The company decided to invest in solar energy, hoping it would bring huge profits later.",
      exp: "<b>invest in ~</b>(~에 투자하다)가 짝꿍 표현이에요. 뒤의 <i>hoping it would bring huge profits</i>(이익을 기대)도 invest의 뜻과 맞아요. <b>donate in</b>, <b>consume in</b>, <b>protect in</b>은 이런 짝꿍이 없어요. donate는 <b>donate A to B</b> 모양이에요." },
    { q: "Every winter, many families ______ warm coats to children who cannot afford them.",
      ch: ["donate","invest","expand","consume","participate"], a: 0, say: "Every winter, many families donate warm coats to children who cannot afford them.",
      exp: "필요한 아이들에게 <b>그냥 주는 것</b>이니 <b>donate</b>예요. <b>invest</b>는 이익을 기대하며 넣는 것이라 어울리지 않고, <b>expand</b>와 <b>consume</b>은 목적어 coats를 ‘아이들에게 주는’ 뜻이 아니에요. participate는 <b>participate in</b>으로 쓰고 직접 목적어를 받지 않아요." },
    { q: "Her ______ in a small bakery turned out to be a wise decision.",
      ch: ["investment","invest","invests","invested","investor"], a: 0, say: "Her investment in a small bakery turned out to be a wise decision.",
      exp: "<b>Her</b>(소유격) 뒤에는 명사가 와야 해요. 문장의 주어가 ‘투자(행동)’이므로 <b>investment</b>예요. invest·invests·invested는 동사라서 소유격 뒤에 올 수 없고, <b>investor</b>는 ‘투자한 사람’이라 ‘현명한 결정이 되었다’와 뜻이 맞지 않아요." },
    { q: "The firm managed to ______ its profits by cutting unnecessary costs.",
      ch: ["maximize","shrink","borrow","translate","introduce"], a: 0, say: "The firm managed to maximize its profits by cutting unnecessary costs.",
      exp: "비용을 줄이면 이익이 커지니 <b>maximize profits</b>(이익을 최대로 하다)가 알맞아요. <b>shrink</b>(줄이다)는 결과가 반대이고, borrow(빌리다)·translate(번역하다)·introduce(소개하다)는 profits와 함께 쓰지 않아요." }
  ]
},
/* ───────────── 2영역 ───────────── */
{
  name: "제목 · 주제 추론", short: "제목을 지문 전체로", desc: "모의고사 제목 찾기 5지문 · 추론 · 글쓴이의 의도",
  cards: [
    { title: "왜 틀렸을까?", html:
      "<p>1번 제목 문제에서 처음엔 <b>a. The Definition of CSR</b>을 골랐다가 스스로 <b>b</b>로 고쳤어요. 고친 것부터 대단해요! 👏</p>" +
      "<p>처음에 a를 고른 이유는 <u>첫 문단이 CSR의 뜻(정의)을 설명</u>했기 때문이에요. 그런데 글 전체는 <b>IBM · Starbucks · TOMS 같은 회사 사례</b>가 중심이었어요. <b>한 문단의 내용 = 글 전체 제목</b>이라고 착각하기 쉬운 대표 함정이에요.</p>" },
    { title: "규칙 카드 · 제목 고르기 3단계", html:
      "<ol><li><b>반복되는 핵심어</b>를 찾아요. (예: 사례마다 반복되는 ‘회사가 무엇을 한다’)</li>" +
      "<li>보기를 이렇게 지워요.<br>· <b>너무 좁은 것</b>: 한 문단·한 예시만 말함<br>· <b>너무 넓은 것</b>: 지문에 없는 큰 주제<br>· <b>반대·엉뚱한 것</b>: 지문 내용과 다름</li>" +
      "<li>남은 것 중 <b>글 전체(처음~끝)를 덮는 보기</b>를 골라요.</li></ol>" +
      "<p>※ 마지막 문단의 <b>결과·효과</b>까지 들어간 제목이 가장 안전해요.</p>" }
  ],
  qs: [
    { psg: "<b>Passage ①</b><br>Many coffee farmers earn too little to support their families. Fair trade companies try to change this by agreeing to pay farmers a minimum price, no matter how low the market price falls. They also give extra money to the community, which villages often use to build schools and clinics. For shoppers, a small label on the package shows that their coffee was bought this way. As more people choose such products, more farmers can plan for the future with confidence.",
      q: "What is the best title for the passage?",
      ch: ["How Fair Trade Gives Farmers and Villages a Better Future","The Long History of Coffee Farming","Why Coffee Prices Fall Every Year","Reading Labels: A Shopper’s Guide to Coffee","Villages That Build Schools Without Any Help"], a: 0,
      say: "How Fair Trade Gives Farmers and Villages a Better Future",
      exp: "글 전체는 <b>공정무역이 농부와 마을에 주는 도움</b>이에요. <b>Reading Labels</b>는 4번째 문장 하나만 다룬 ‘너무 좁은’ 제목이에요. <b>History of Coffee Farming</b>과 <b>Why Prices Fall</b>은 지문에 없는 내용이고, <b>Without Any Help</b>는 지문(회사가 돈을 줌)과 반대예요." },
    { psg: "<b>Passage ①</b> (위와 같은 글)<br>Many coffee farmers earn too little to support their families. Fair trade companies try to change this by agreeing to pay farmers a minimum price, no matter how low the market price falls. They also give extra money to the community, which villages often use to build schools and clinics. For shoppers, a small label on the package shows that their coffee was bought this way. As more people choose such products, more farmers can plan for the future with confidence.",
      q: "Which can be inferred from the passage?",
      ch: ["Shoppers’ choices can help farmers plan their future.","Fair trade prices change every day with the market.","Most villages already have enough schools.","Shoppers must pay double for labeled coffee.","Farmers prefer the low market price."], a: 0,
      say: "Shoppers’ choices can help farmers plan their future.",
      exp: "마지막 문장 <i>As more people choose such products, more farmers can plan for the future</i>에서 알 수 있어요. 가격은 <b>시장 가격이 떨어져도 최소 가격</b>을 주므로 ‘매일 바뀐다’는 틀렸고, 마을이 학교를 짓는다는 말이 있지 ‘이미 충분하다’는 근거가 없어요. ‘두 배’와 ‘낮은 시장 가격을 선호’도 지문에 없어요." },
    { psg: "<b>Passage ②</b><br>In some towns, libraries lend more than books. Residents can borrow a ladder, a sewing machine, or a camping tent for a week, then return it for the next person. A tool that sits unused in a garage 350 days a year is wasteful, the organizers say. Sharing lets neighbors save money, keep clutter out of their homes, and meet one another. Some libraries report that these “things” are borrowed more often than their novels.",
      q: "What is the best title for the passage?",
      ch: ["Libraries That Lend Tools: Sharing Instead of Owning","Why Novels Are Losing Their Readers","How to Fix a Broken Sewing Machine","The Decline of Public Libraries","Ten Ways to Clean Your Garage"], a: 0,
      say: "Libraries That Lend Tools: Sharing Instead of Owning",
      exp: "중심은 <b>도서관이 물건을 빌려주고 함께 쓰는 것</b>이에요. <b>Novels Are Losing Readers</b>는 마지막 문장을 지나치게 넓힌 오해이고(소설보다 물건이 더 많이 빌려진다는 것이지 독자가 줄었다는 말은 아니에요), <b>Decline of Libraries</b>는 반대 흐름이에요. 수리법·차고 청소는 지문에 없어요." },
    { psg: "<b>Passage ②</b> (위와 같은 글)<br>In some towns, libraries lend more than books. Residents can borrow a ladder, a sewing machine, or a camping tent for a week, then return it for the next person. A tool that sits unused in a garage 350 days a year is wasteful, the organizers say. Sharing lets neighbors save money, keep clutter out of their homes, and meet one another. Some libraries report that these “things” are borrowed more often than their novels.",
      q: "Why does the writer mention “350 days a year”?",
      ch: ["To show that owning a tool alone is often inefficient","To prove that garages are too small","To advertise a camping tent","To explain why libraries are closing","To show that tools break after 350 days"], a: 0,
      say: "To show that owning a tool alone is often inefficient",
      exp: "<i>sits unused … 350 days a year</i>는 ‘가지고만 있고 거의 안 쓴다’를 보여 주는 숫자예요. 그래서 <b>혼자 소유하는 것은 비효율적</b>이라는 근거가 돼요. 차고 크기·텐트 광고·도서관 폐쇄·고장 이야기는 이 문장과 관계없어요." },
    { psg: "<b>Passage ③</b><br>Some companies give each employee a paid day off every year to volunteer for a cause they care about. Workers might clean a river, teach children to code, or serve meals at a shelter. The company does not directly earn money from these days. However, managers say employees return more motivated and proud of where they work, and fewer of them quit. In the long run, the company benefits too.",
      q: "What is the best title for the passage?",
      ch: ["Paid Volunteer Days: Good for Workers, Communities, and Companies","Why So Many Employees Quit Their Jobs","Teaching Children to Code at a Shelter","A Day Off Every Week for Everyone","Companies That Lose Money on Purpose"], a: 0,
      say: "Paid Volunteer Days: Good for Workers, Communities, and Companies",
      exp: "<b>유급 봉사 휴가</b>가 직원·사회·회사 모두에게 이롭다는 내용이에요. <b>Why Employees Quit</b>은 ‘이직이 줄어든다’는 한 조각만 뒤집은 것이고, <b>Teaching Children to Code at a Shelter</b>는 예시 두 개를 섞은 엉뚱한 제목, <b>Every Week</b>는 ‘1년에 하루’와 달라요. <b>Lose Money on Purpose</b>도 마지막 문장(결국 회사에도 이득)과 반대예요." },
    { psg: "<b>Passage ③</b> (위와 같은 글)<br>Some companies give each employee a paid day off every year to volunteer for a cause they care about. Workers might clean a river, teach children to code, or serve meals at a shelter. The company does not directly earn money from these days. However, managers say employees return more motivated and proud of where they work, and fewer of them quit. In the long run, the company benefits too.",
      q: "Which can be inferred from the passage?",
      ch: ["The company’s benefit may come indirectly, such as fewer workers leaving.","Employees must choose the cause the company picks.","Volunteer days cost the company nothing.","Managers think volunteering wastes time.","Only workers who code can take part."], a: 0,
      say: "The company’s benefit may come indirectly, such as fewer workers leaving.",
      exp: "<i>does not directly earn money</i>와 <i>However … fewer of them quit</i>를 이으면 ‘직접 돈은 안 벌지만 <b>간접적으로 이득</b>’이라는 추론이 나와요. 직원이 원하는 일(a cause they care about)을 고르므로 ‘회사가 정한 일’은 틀렸고, 유급 휴가라 ‘비용 0’도 틀렸어요. 관리자의 생각과 코딩 조건은 지문과 반대·무관해요." },
    { psg: "<b>Passage ④</b><br>A sports brand collects plastic bottles from beaches and turns them into thread for running shoes. Each pair uses about eleven bottles. The brand admits that making shoes still creates some pollution, so it also sets a goal to reduce waste at its factories. Customers get stylish shoes, and beaches get a little cleaner.",
      q: "What is the best title for the passage?",
      ch: ["From Beach Trash to Running Shoes: A Brand’s Recycling Effort","The Dangers of Plastic Bottles to Sea Animals","Why Running Shoes Are So Expensive","A Shoe Factory With No Pollution at All","How to Clean a Beach in One Day"], a: 0,
      say: "From Beach Trash to Running Shoes: A Brand’s Recycling Effort",
      exp: "해변 쓰레기를 신발 실로 바꾸는 <b>브랜드의 재활용 노력</b>이 중심이에요. <b>Dangers to Sea Animals</b>는 지문에 없는 큰 주제이고, <b>Expensive</b>도 없는 이야기예요. <b>No Pollution at All</b>은 ‘아직 오염이 생긴다’고 인정한 3번째 문장과 반대예요. <b>One Day</b>는 해변 청소 방법을 말한 글이 아니에요." },
    { psg: "<b>Passage ④</b> (위와 같은 글)<br>A sports brand collects plastic bottles from beaches and turns them into thread for running shoes. Each pair uses about eleven bottles. The brand admits that making shoes still creates some pollution, so it also sets a goal to reduce waste at its factories. Customers get stylish shoes, and beaches get a little cleaner.",
      q: "Why does the writer mention that the brand “admits” some pollution still exists?",
      ch: ["To show the effort is honest but not yet finished","To say the brand’s shoes are dangerous","To prove recycling never works","To advertise a new factory","To blame the customers"], a: 0,
      say: "To show the effort is honest but not yet finished",
      exp: "<i>admits … still creates some pollution, so it also sets a goal</i>는 ‘완벽하진 않지만 솔직하게 인정하고 <b>더 줄이려고 한다</b>’는 흐름이에요. 신발이 위험하다거나 재활용이 소용없다는 말은 없고, 새 공장 광고나 고객 비난도 문장과 맞지 않아요." },
    { psg: "<b>Passage ⑤</b><br>A small bank in a rural area gives tiny loans, sometimes under fifty dollars, to people who have no savings. A woman might use the money to buy a sewing machine and start a clothing business. Once she earns enough, she pays the loan back, and the bank lends the same money to someone else. Because the money is used again and again, the bank helps more people over time.",
      q: "What is the best title for the passage?",
      ch: ["Tiny Loans, Big Changes: How One Bank Helps People Start Businesses","How to Open a Savings Account","Sewing as a Hobby for Busy Women","Banks That Refuse to Lend Money","Why Rural Areas Have Fewer Banks"], a: 0,
      say: "Tiny Loans, Big Changes: How One Bank Helps People Start Businesses",
      exp: "<b>작은 대출로 사업을 시작하게 돕는 은행</b>이 글 전체예요. <b>Sewing as a Hobby</b>는 예시 하나를 취미로 바꾼 ‘너무 좁은’ 제목이고, <b>Refuse to Lend</b>는 반대예요. 저축 계좌 개설과 시골 은행 수는 지문에 없어요." },
    { psg: "<b>Passage ⑤</b> (위와 같은 글)<br>A small bank in a rural area gives tiny loans, sometimes under fifty dollars, to people who have no savings. A woman might use the money to buy a sewing machine and start a clothing business. Once she earns enough, she pays the loan back, and the bank lends the same money to someone else. Because the money is used again and again, the bank helps more people over time.",
      q: "What does “the money is used again and again” suggest?",
      ch: ["Repaid money can help many people, one after another.","The bank loses money every time.","Each customer borrows the same machine.","The loans are getting larger each year.","Only one woman receives help."], a: 0,
      say: "Repaid money can help many people, one after another.",
      exp: "갚은 돈이 <b>다시 다른 사람에게 빌려지니</b> 같은 돈이 여러 사람을 돕는다는 뜻이에요(<i>the bank helps more people over time</i>). 은행이 매번 손해 본다거나 대출이 커진다는 근거는 없고, 같은 기계를 빌린다는 말도 없어요. 한 명만 돕는다는 건 ‘more people’과 반대예요." }
  ]
},
/* ───────────── 3영역 ───────────── */
{
  name: "CSR 지문 정독", short: "Unit 05 Society 다시 읽기", desc: "5지선다 · 빈칸 · 지칭 · 내용 일치 · 요약 · 해석",
  psg: "<b>Corporate Social Responsibility (CSR)</b> <span class='mut'>(교재 글을 학습용으로 다시 정리한 지문)</span><br>" +
       "<b>[1]</b> These days, many companies care about Corporate Social Responsibility (CSR). It includes investing in communities and protecting nature. Such efforts improve the <u>(A)</u> of a company and its products, which can lead to higher <u>(B)</u> in the end.<br>" +
       "<b>[2]</b> There are many ways to practice CSR. IBM, for example, offers a small program that people can install on their personal computers. Whenever a computer is idle, the program donates its unused computing power to a huge shared supercomputer. <u>They</u> have created it so that the supercomputer can help medical researchers look for cures for serious diseases.<br>" +
       "<b>[3]</b> Starbucks works with nonprofit groups in places that grow coffee. In Guatemala, it joined Save the Children to bring education programs to remote villages.<br>" +
       "<b>[4]</b> Some companies exist only to practice CSR. TOMS Shoes was started by Blake Mycoskie, who saw many children without shoes while traveling in Argentina. For every pair the company sells, it gives one pair to a child in need.<br>" +
       "<b>[5]</b> CSR lets consumers see that a company is not only making profits but also trying to improve society. As a result, shoppers become more likely to choose its products, and CSR is expected to expand in the future.",
  cards: [
    { title: "왜 틀렸을까?", html:
      "<p>이 지문의 문제들은 <b>대부분 정확히 풀었어요</b>. 제목(1번)만 처음에 고쳤고, 서술형(3번 supercomputer)과 4번 추론, 요약 빈칸(donates · profits · society)도 잘 채웠어요. 👍</p>" +
      "<p>그래서 이번 영역은 <b>같은 글을 모의고사 5지선다 방식</b>으로 한 번 더 단단하게 확인해요. 보기가 5개로 늘면 ‘그럴듯한 오답’이 많아서, <u>근거 문장에 밑줄을 긋는 습관</u>이 점수를 지켜 줘요.</p>" },
    { title: "규칙 카드 · 근거 문장 찾기", html:
      "<ol><li><b>지칭(They·it)</b>: 대명사 바로 앞 문장에서 <b>같은 수(단수/복수)</b>의 주어를 찾아요.</li>" +
      "<li><b>빈칸(A)(B)</b>: 앞뒤 연결어(<b>Such efforts · which can lead to</b>)가 알려 주는 원인→결과 흐름을 봐요.</li>" +
      "<li><b>내용 일치</b>: 보기의 숫자·부정어(<b>only, never</b>)를 본문과 하나씩 대조해요.</li>" +
      "<li><b>계산 추론</b>: 본문 규칙(<b>every pair → one pair</b>)을 숫자에 그대로 적용해요.</li></ol>" +
      "<p>핵심 낱말: [[idle]] · [[nonprofit]] · [[remote]] · [[consumers]] · [[expand]]</p>" }
  ],
  qs: [
    { q: "What is the best pair for blanks (A) and (B) in paragraph [1]?",
      ch: ["(A) reputations — (B) financial returns","(A) quality — (B) tax cuts","(A) conditions — (B) labor supply","(A) satisfaction — (B) cost savings","(A) reputations — (B) tax cuts"], a: 0,
      say: "Such efforts improve the reputations of a company and its products, which can lead to higher financial returns in the end.",
      exp: "봉사·환경 보호 같은 노력은 회사의 <b>평판(reputations)</b>을 높이고, 평판이 좋아지면 결국 <b>재정적 수익(financial returns)</b>이 늘 수 있어요. (A)가 reputations인 보기는 둘인데, 세금 감면(tax cuts)은 평판과 이어지는 결과가 아니라서 틀려요. quality·satisfaction·conditions는 ‘회사와 제품의 평판’이라는 뜻에 덜 맞고, labor supply·cost savings는 CSR의 직접 결과로 본문에 나오지 않아요." },
    { q: "What is closest in meaning to “idle” in paragraph [2]?",
      ch: ["not being used","broken","very fast","expensive","connected to the internet"], a: 0,
      say: "Whenever a computer is idle, the program donates its unused computing power.",
      exp: "<i>idle … unused computing power</i>에서 idle은 <b>쓰지 않고 놀고 있는 상태(not being used)</b>예요. ‘고장 난(broken)’이 아니라 멀쩡하지만 놀고 있는 거예요. very fast·expensive는 근거가 없고, internet 연결은 본문에 나오지 않아요." },
    { q: "What does “They” (underlined) in paragraph [2] refer to?",
      ch: ["IBM","personal computers","medical researchers","serious diseases","the supercomputer"], a: 0,
      say: "IBM",
      exp: "<b>They have created it</b> = IBM이 프로그램을 만들었다는 뜻이에요. 앞 문장의 주어는 <b>IBM</b>(회사, 사람들처럼 복수 취급)예요. personal computers·the supercomputer는 만들어진 ‘대상’이고, researchers·diseases는 프로그램을 만드는 주체가 아니에요." },
    { q: "Which is true about the program in paragraph [2]?",
      ch: ["It shares unused computing power with a shared supercomputer.","It makes computers run faster all day.","It is sold only to hospitals.","It works only when the user is typing.","It replaces medical researchers."], a: 0,
      say: "It shares unused computing power with a shared supercomputer.",
      exp: "<i>donates its unused computing power</i>가 근거예요. ‘하루 종일 더 빠르게’나 ‘병원에만 판매’는 본문에 없고, ‘타자 칠 때만 작동’은 <b>Whenever a computer is idle</b>(쓰지 않을 때)과 반대예요. 연구자를 ‘대신한다’는 말도 없고 <b>도와준다(help)</b>고만 해요." },
    { q: "Which is NOT mentioned in the passage?",
      ch: ["Starbucks sells its coffee machines to villages.","IBM’s program helps medical research.","Starbucks worked with Save the Children in Guatemala.","TOMS Shoes gives one pair for every pair it sells.","CSR is expected to grow."], a: 0,
      say: "",
      exp: "‘커피 기계를 마을에 판다’는 본문에 없어요. 나머지는 모두 본문에 있어요 — IBM 프로그램은 의학 연구를 돕고, 스타벅스는 과테말라에서 Save the Children과 함께했고, TOMS는 한 켤레당 한 켤레를 주고, CSR은 커질 것으로 기대돼요." },
    { q: "If TOMS Shoes sells 250,000 pairs in a year, about how many pairs does it give away, according to the passage?",
      ch: ["250,000","125,000","500,000","25,000","It does not give any."], a: 0,
      say: "For every pair the company sells, it gives one pair to a child in need.",
      exp: "<b>For every pair the company sells, it gives one pair</b> → 판 수만큼 줘요. 250,000켤레를 팔면 <b>250,000켤레</b>를 줘요. 125,000(절반)이나 500,000(두 배)은 ‘한 켤레당 한 켤레’가 아니에요. 25,000(10분의 1)도 틀리고, 아무것도 안 준다는 말은 본문과 반대예요." },
    { q: "According to paragraph [5], why are shoppers more likely to choose products made by CSR companies?",
      ch: ["They see that the company is working to improve society.","The products are always cheaper.","The companies advertise on TV all day.","The products are made by volunteers.","The companies avoid paying taxes."], a: 0,
      say: "CSR lets consumers see that a company is not only making profits but also trying to improve society.",
      exp: "<i>consumers see that a company is not only making profits but also trying to improve society</i> 때문이에요. 가격이 더 싸다, TV 광고, 봉사자가 만들었다, 세금 회피는 본문 어디에도 없는 이유예요." },
    { q: "In paragraph [5], “expand” is closest in meaning to ______.",
      ch: ["grow","disappear","stay the same","expect","protect"], a: 0,
      say: "CSR is expected to expand in the future.",
      exp: "<b>expand = grow</b>(커지다)예요. <b>disappear</b>(사라지다)와 <b>stay the same</b>(그대로)는 반대, <b>expect</b>(기대하다)는 문장에 이미 따로 쓰여 있고, <b>protect</b>(보호하다)는 뜻이 달라요." },
    { q: "What is the best title for the whole passage?",
      ch: ["How Companies Practice CSR and Why It Helps","The Definition of CSR","Famous Shoes Around the World","Why Computers Are Left Idle","Starbucks Coffee in Guatemala"], a: 0,
      say: "How Companies Practice CSR and Why It Helps",
      exp: "글 전체는 <b>회사들의 CSR 사례와 그 효과</b>예요. <b>The Definition of CSR</b>는 1문단만 본 ‘너무 좁은’ 제목이에요(지난 시험 1번에서 처음 고른 함정!). Shoes·Idle·Starbucks는 각각 사례 하나만 다룬 제목이에요." },
    { q: "다음 문장의 해석으로 가장 알맞은 것은?<br><i>CSR lets consumers see that a company is not only making profits but also trying to improve society.</i>",
      ch: ["CSR은 소비자가 회사가 이익만 내는 것이 아니라 사회를 개선하려고도 노력한다는 것을 알게 해 준다.","CSR은 소비자가 이익을 내지 않는 회사를 좋아한다는 것을 보여 준다.","CSR 때문에 회사는 사회를 개선하는 일에서 이익을 내지 못한다.","CSR은 소비자에게 이익을 나누어 주는 방법이다.","CSR은 사회를 개선하려는 소비자를 회사가 찾는 일이다."], a: 0,
      say: "CSR lets consumers see that a company is not only making profits but also trying to improve society.",
      exp: "<b>let A see that ~</b> = A가 ~을 알게 해 주다, <b>not only A but also B</b> = A뿐만 아니라 B도예요. 그래서 ‘이익만 내는 것이 아니라 사회를 개선하려고도 노력한다’가 정답이에요. ‘이익을 안 낸다’(not 뒤를 잘못 읽음)와 ‘이익을 못 낸다’는 not only의 뜻을 놓친 해석이고, ‘이익을 나눠 준다’나 ‘소비자를 찾는다’는 문장 구조를 바꿔 버린 해석이에요." }
  ]
},

  cards: [

      "<p>하지만 Word Check에서 <b>donate</b>를 다른 자리에 썼던 만큼, 이번엔 그 낱말이 들어간 <b>문장 구조</b>(수일치 · 병렬 · 관계사)로 한 번 더 단단히 확인해요. 시험에서는 이런 구조를 <b>밑줄 어법 문제</b>로 물어봐요.</p>" },
    { title: "규칙 카드 · 어법 핵심 5가지", html:
      "<table class='t'><tr><th>구조</th><th>핵심</th></tr>" +
      "<tr><td><b>Whenever</b> S + V</td><td>때를 나타내는 부사절은 <b>현재시제</b>로 미래·반복을 나타내요.</td></tr>" +
      "<tr><td><b>The number of</b> ~ is / <b>A number of</b> ~ are</td><td>the number of = ~의 수(단수) / a number of = 많은(복수)</td></tr>" +
      "<tr><td>not only A <b>but</b> (also) B</td><td>A와 B는 <b>같은 형태</b>로 짝을 맞춰요(making ~ / working ~).</td></tr>" +
      "<tr><td>계속적 용법 , <b>who / which</b></td><td>콤마 뒤에서는 <b>that을 쓸 수 없어요.</b> 사람 → who, 사물 → which</td></tr>" +
      "<tr><td>more <b>likely</b> to + 동사원형</td><td>‘~할 가능성이 더 높은’</td></tr></table>" }

  qs: [

var muted = false, VOICE = null, pendingSay = null;
var PREF = ["Google US English","Microsoft Zira","Microsoft Aria","Microsoft Jenny","Samantha","Ava","Allison","Joanna","Kendra","Kimberly","Salli","Susan","Nicky","Zoe"];
function pickVoice() {
  try {
    var vs = speechSynthesis.getVoices();
    if (!vs || !vs.length) return;
    var us = vs.filter(function (v) { return /^en[-_]US$/i.test(v.lang); });
    var v = null;
    for (var i = 0; i < PREF.length && !v; i++) {
      for (var j = 0; j < us.length; j++) { if (us[j].name.indexOf(PREF[i]) === 0 || us[j].name.indexOf(PREF[i]) > -1) { v = us[j]; break; } }

    if (VOICE && pendingSay) { var t = pendingSay; pendingSay = null; say(t); }

}

  if ("speechSynthesis" in window) {
    pickVoice();

} catch (e) {}

}

function plan(si) {
  var qs = SECTIONS[si].qs, n = qs.length, free = [], i;
  for (i = 0; i < n; i++) if (!qs[i].fixed) free.push(i);
  var base = []; for (i = 0; i < free.length; i++) base.push(i % 5);
  function sh(a) { a = a.slice(); for (var k = a.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var t = a[k]; a[k] = a[j]; a[j] = t; } return a; }
  var pos, ok = false, tries = 0;
  while (!ok && tries++ < 800) {
    var t = sh(base), seq = [], fi = 0;
    for (i = 0; i < n; i++) seq.push(qs[i].fixed ? qs[i].a : t[fi++]);
    ok = true;
    for (i = 2; i < n; i++) if (seq[i] === seq[i - 1] && seq[i] === seq[i - 2]) { ok = false; break; }
    for (i = 1; i < n && ok; i++) if (seq[i] === seq[i - 1]) ok = false;
    pos = seq;
  }
  var orders = [];
  for (i = 0; i < n; i++) {
    var q = qs[i], idx = q.ch.map(function (_, k) { return k; });
    if (q.fixed) { orders.push(idx); continue; }
    var others = sh(idx.filter(function (k) { return k !== q.a; })), o = [], p = 0;
    for (var k = 0; k < idx.length; k++) o.push(k === pos[i] ? q.a : others[p++]);
    orders.push(o);
  }
  return orders;
}

}
function copyText(t, btn) {
  function okMsg() { var o = btn.textContent; btn.textContent = "✓ 복사됐어요! 카톡에 붙여넣기"; setTimeout(function () { btn.textContent = o; }, 2200); }
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(okMsg, fb); return; } } catch (e) {}
  fb();
  function fb() { var ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) {} document.body.removeChild(ta); okMsg(); }
}
function renderResult() {
  var s = SECTIONS[curSec], st = ST.secs[curSec], n = s.qs.length, nextI = curSec + 1 < SECTIONS.length ? curSec + 1 : null;
  var h = '<div class="card"><h1>' + (curSec + 1) + "영역 수고했어요! 🎉</h1><p class='sub'>" + s.name + '</p><div class="score">' + st.score + " / " + n + '</div><div id="submit-status"></div>' +
    '<button class="btn" id="cp">결과 복사 (카톡으로 보내기)</button>' +
    (nextI !== null ? '<button class="btn ghost" id="nxs">다음 영역 풀러 가기 → ' + (nextI + 1) + "영역</button>" : "") +
    '<button class="btn ghost" id="bk" style="margin-top:8px">← 영역 선택으로</button></div>';
  h += '<div class="card"><h2>📝 자세한 해설</h2>';
  s.qs.forEach(function (q, i) {
    var l = st.log[i]; if (!l) return;
    h += '<div class="exp' + (l.ok ? "" : " w") + '"><div class="h">Q' + (i + 1) + ". " + (l.ok ? "정답!" : "오답") + "</div>" +
      (l.ok ? "" : '<div class="qq">내 답: ' + esc(l.chosen) + "<br>정답: " + esc(l.answer) + "</div>") + q.exp +
      (q.say ? '<br><button class="say" style="margin:8px 0 0" data-s="' + i + '">🔊 정답 문장 듣고 따라 읽기</button>' : "") + "</div>";
  });
  h += "</div>";
  show(h);
  Array.prototype.forEach.call(app.querySelectorAll("[data-s]"), function (b) { b.addEventListener("click", function () { say(s.qs[+b.getAttribute("data-s")].say); }); });
  document.getElementById("cp").addEventListener("click", function () { copyText(secText(curSec), this); });
  document.getElementById("bk").addEventListener("click", function () { selSec = curSec; renderStart(); });
  var nx = document.getElementById("nxs"); if (nx) nx.addEventListener("click", function () { selSec = nextI; stopSay(); renderStart(); });
  if (!st.sent) {
    st.sent = true; save(); _engfitSent = false;
    engfitSubmitWithStatus({
      quizId: QUIZ_CODE + "-p" + (curSec + 1), quizTitle: TITLE + " · " + (curSec + 1) + "영역 " + s.name, student: ST.name,
      score: st.score, total: n, wrong: wrongList(curSec), durationSec: st.elapsed || 0,
      detail: st.log.map(function (l) { return { no: l.no, ok: l.ok, chosen: l.chosen, answer: l.answer }; })
    });
  }
}

load();
if (ST.name) { /* 저장된 이름 유지 */ }
renderStart();
</script>
