<script>
"use strict";

/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#2e7d6e"; }
  else { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#c0392b"; }
}


/* ══════ 문제 데이터 (개념 페이지 + 쌍둥이 문제) ══════ */
var STEPS = [
 {
  "type": "concept",
  "html": "<div class='ctitle'>① 현재완료 ↔ 과거 — 과거 시점(ago · last ~ · yesterday · When)은 과거형 (8과)</div><div class='box'><div class='lab'>8과 본문 소재</div>Eckels <b>has</b> never <b>traveled</b> in time before. → 현재완료는 '언제'를 콕 집어 말하지 않아요</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>has lost ~ <b>yesterday</b> / have gone ~ <b>two weeks ago</b> / How long <b>did</b> ~? — Since ~</div><div class='box ok'><div class='lab'>정답 모양</div>ago · last ~ · yesterday · When ~? → <b>과거형</b> · since · for · How long · ever · never · twice → <b>have/has + p.p.</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>11/11 클리닉 사진에서도 다시 나온 부분이에요. 우리말 '~했다'만 보면 둘 다 맞아 보여서 그래요. 동사를 고르기 전에 <b>시간 표현</b>부터 동그라미! 과거의 <b>한 점</b>이면 과거형, 과거부터 <b>지금까지 이어지는 선</b>이면 현재완료.</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>She <b class='hl'>bought</b> the ticket <b class='hl'>two days ago</b>. (has bought ✕)</li><li>We <b class='hl'>have been</b> friends <b class='hl'>since</b> 2020. / I <b class='hl'>have tried</b> it <b class='hl'>twice</b>.</li></ul></div><div class='trap'>⚠️ 함정: 현재완료 + ago / last / yesterday ✕ · When + 현재완료 ✕ · Since 대답인데 did ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>Jiwoo ______ to the science museum two weeks ago.</div>",
  "choices": ["has gone", "has been", "went", "goes"],
  "answer": "went",
  "exp": "<b>two weeks ago</b>(과거의 한 점) → 과거형 <b>went</b>. 현재완료 ✕"
 },
 {
  "type": "twin",
  "q": "대화의 빈칸에 알맞은 말은?<div class='pass'>A: How long ______ Ms. Yoon ______ at this school?<br>B: Since 2016.</div>",
  "choices": ["did – teach", "does – teach", "has – teach", "has – taught"],
  "answer": "has – taught",
  "exp": "<b>Since 2016</b>(그때부터 지금까지) → 현재완료 <b>How long has she taught</b> ~? has 뒤에는 p.p.(taught)."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["I have read this novel twice.", "He has lost his key yesterday.", "We have known each other since first grade.", "Mina has never tried Thai food."],
  "answer": "He has lost his key yesterday.",
  "exp": "<b>yesterday</b> 는 과거 시점 → <b>He lost his key yesterday.</b> twice · since · never 는 현재완료와 잘 어울려요."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>② call + A + B — A를 B라고 부르다 (7과)</div><div class='box'><div class='lab'>7과 소재 예문</div>People <b>call</b> Holi <b>the Festival of Colors</b>. → call + 누구/무엇(A) + 이름(B)</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>call <b>he</b> ~ / call A <b>as</b> B / call <b>to</b> A B</div><div class='box ok'><div class='lab'>정답 모양</div><b>call + A(목적격) + B</b> — A 와 B 사이에 아무것도 넣지 않아요 (as ✕, to ✕)</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>우리말 'A를 B<b>라고</b>'의 '라고'를 영어로 옮기고 싶어서 as 를 넣게 돼요. 하지만 call 은 <b>A B</b> 를 그냥 나란히! 그리고 A 자리는 '~를' 자리라서 he · she 가 아니라 <b>him · her</b>.</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>We <b class='hl'>call him</b> 'Captain'. (call he ✕)</li><li>They <b class='hl'>call the city</b> 'the Big Apple'. (call ~ as ✕)</li></ul></div><div class='trap'>⚠️ 함정: A 자리에 주격 ✕ · as / to 넣기 ✕ · A 와 B 순서 바꾸기 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>He is really good at science, so we call ______ 'Little Einstein'.</div>",
  "choices": ["he", "his", "him", "to him"],
  "answer": "him",
  "exp": "call + <b>A(목적격)</b> + B → call <b>him</b> 'Little Einstein'."
 },
 {
  "type": "twin",
  "q": "다음 문장의 뜻으로 알맞은 것은?<div class='pass'>My friends call me Sunny.</div>",
  "choices": ["친구들이 나에게 써니라고 전화한다.", "친구들은 나를 써니라고 부른다.", "친구들이 써니에게 나를 부른다.", "내 친구 써니가 나를 부른다."],
  "answer": "친구들은 나를 써니라고 부른다.",
  "exp": "call + <b>me(A)</b> + <b>Sunny(B)</b> = 나를 써니라고 부르다."
 },
 {
  "type": "twin",
  "q": "우리말을 영어로 바르게 옮긴 것은?<div class='pass'>사람들은 그 축제를 '빛의 축제'라고 부른다.</div>",
  "choices": ["People call the festival as the Festival of Lights.", "People call to the festival the Festival of Lights.", "People call the Festival of Lights to the festival.", "People call the festival the Festival of Lights."],
  "answer": "People call the festival the Festival of Lights.",
  "exp": "call + <b>the festival(A)</b> + <b>the Festival of Lights(B)</b>. as · to ✕"
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>③ 지각동사 see / hear / feel / watch + 목적어 + 동사원형 / -ing (8과)</div><div class='box'><div class='lab'>8과 본문 소재</div>Eckels <b>heard</b> the dinosaur <b>roar</b>. / He <b>saw</b> the trees <b>shaking</b>.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>saw her <b>to cross</b> / heard someone <b>calls</b> / felt the ground <b>shook</b></div><div class='box ok'><div class='lab'>정답 모양</div>지각동사 + 목적어 + <b>동사원형</b>(전체를 봄) 또는 <b>-ing</b>(하고 있는 중을 봄) · to ✕ · 3인칭 -s ✕ · 과거형 ✕</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>want · tell · ask 처럼 목적어 뒤에 to 를 붙이는 동사랑 섞이기 때문이에요. '보다 · 듣다 · 느끼다' 동사가 보이면 <b>to 지우개</b>를 떠올리세요!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>I <b class='hl'>saw</b> him <b class='hl'>run</b> / <b class='hl'>running</b>. (to run ✕)</li><li>We <b class='hl'>heard</b> the bell <b class='hl'>ring</b>. (rings ✕, rang ✕)</li></ul></div><div class='trap'>⚠️ 함정: 지각동사 + 목적어 + to 동사원형 ✕ · 목적어 뒤에 -s · 과거형 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>I heard someone ______ my name in the hallway.</div>",
  "choices": ["to call", "calls", "is calling", "call"],
  "answer": "call",
  "exp": "heard(지각동사) + someone + <b>동사원형 call</b> (또는 calling). to call · calls ✕"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>Did you see the kids ______ in the river?</div>",
  "choices": ["to swim", "swimming", "swam", "swims"],
  "answer": "swimming",
  "exp": "see + 목적어 + <b>-ing</b>(헤엄치고 있는 중) → <b>swimming</b>. to swim ✕"
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["I felt the ground shake.", "We watched the sun rise.", "She saw her brother to cross the street.", "I heard the baby crying."],
  "answer": "She saw her brother to cross the street.",
  "exp": "saw(지각동사) 뒤에는 to ✕ → saw her brother <b>cross</b> (crossing) the street."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>④ want / tell / ask + 목적어 + to 동사원형 (8과)</div><div class='box'><div class='lab'>8과 본문 소재</div>The guide <b>told</b> Eckels <b>to stay</b> on the path.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>told me <b>clean</b> / wants <b>I</b> to ~ / asked <b>to us</b> ~</div><div class='box ok'><div class='lab'>정답 모양</div>want · tell · ask + <b>목적격</b>(me, us, him) + <b>to 동사원형</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>방금 본 지각동사는 to 를 지웠죠? want · tell · ask 는 반대로 to 가 <b>꼭</b> 있어야 해요. '누구에게 ~하라고(하기를)' → 사람은 목적격, 하는 일은 to 동사원형!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>Dad <b class='hl'>wants me to be</b> careful.</li><li>She <b class='hl'>asked us to wait</b> outside. (asked to us ✕)</li></ul></div><div class='trap'>⚠️ 함정: to 빼기 ✕ · 목적어 자리에 주격(I, we) ✕ · 목적어 앞에 to ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>Mom told me ______ my room before dinner.</div>",
  "choices": ["clean", "cleaning", "to clean", "cleaned"],
  "answer": "to clean",
  "exp": "tell + 목적어(me) + <b>to 동사원형</b> → told me <b>to clean</b>."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>My coach wants ______ harder for the next match.</div>",
  "choices": ["me practice", "I to practice", "me to practice", "to me practice"],
  "answer": "me to practice",
  "exp": "want + <b>목적격(me)</b> + <b>to 동사원형</b> → wants <b>me to practice</b>."
 },
 {
  "type": "twin",
  "q": "우리말을 영어로 바르게 옮긴 것은?<div class='pass'>선생님은 우리에게 조용히 하라고 부탁하셨다.</div>",
  "choices": ["The teacher asked us be quiet.", "The teacher asked to us be quiet.", "The teacher asked we to be quiet.", "The teacher asked us to be quiet."],
  "answer": "The teacher asked us to be quiet.",
  "exp": "ask + <b>목적격(us)</b> + <b>to 동사원형(to be)</b>."
 },
 {
  "type": "concept",

/* 원장님 11/14 "태은이는 왜 막찍고 넘어가져?" — 막 넘기기 방지: 개념은 읽을 시간만큼 잠금, 문제는 읽을 시간 뒤에 보기 열림, 정답 문장을 끝까지 들어야 다음 */
var waitTimer = null;

function holdBtn(btn, sec, label, after) {

    clearInterval(waitTimer); btn.disabled = false; btn.style.opacity = ""; btn.textContent = label; if (after) after(); }, 1000);

function show() {
  if (cur >= STEPS.length) return showResult();
  var st = STEPS[cur];
  $("bar-fill").style.width = Math.round(cur / STEPS.length * 100) + "%";
  $("fb").innerHTML = "";
  if (st.type === "concept") {
    $("progress").textContent = "틀린 이유 읽기 · 쌍둥이 문제 " + (twinNo + 1) + "번 전";

    $("concept-box").innerHTML = st.html; $("concept-box").classList.remove("hidden");
    $("read-btn").classList.remove("hidden");
    $("qtext").innerHTML = ""; $("choices").innerHTML = "";
    /* 원장님 11/14 "초반부분 설명좀 내 목소리로 읽어주던가… 애들이 뭔 재미로 글자를 보것냐" — 원장님 목소리 설명 + 지금 읽는 칸 반짝, 다 듣기 전 잠금 */
    var rb = $("read-btn"); if (!rb.getAttribute("data-label")) rb.setAttribute("data-label", rb.textContent);
    var ci = 0; for (var s = 0; s <= cur; s++) if (STEPS[s].type === "concept") ci++;
    var cb = $("concept-box"), two = cb.querySelectorAll(".two .box");
    var spots = [cb.querySelector(".ctitle"), cb.querySelector(":scope > .box"), cb.querySelector(":scope > .box"), two[0], two[1], cb.querySelector(".why"), cb.querySelector(".rule"), cb.querySelector(".trap")];
    var list = []; if (ci === 1) list.push("g"); for (var z = 1; z <= 8; z++) list.push("n" + ci + "_" + z);
    var again = document.createElement("button"); again.className = "btn"; again.style.cssText = "background:#eef3ff;color:#2c3e8f;margin-top:8px"; again.textContent = "🔊 설명 다시 듣기";
    rb.parentNode.insertBefore(again, rb.nextSibling); qAgainBtn = again;
    function lit(i) { [].forEach.call(cb.querySelectorAll(".talking"), function (e) { e.classList.remove("talking"); }); var nm = list[i] || ""; var m = /_(\d)$/.exec(nm); var el = m ? spots[+m[1] - 1] : spots[0]; if (el) { el.classList.add("talking"); try { el.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) {} } }
    function talk(first) { rb.disabled = true; rb.style.opacity = ".5"; rb.textContent = "👂 지나티처 설명 듣는 중…"; again.disabled = true; again.style.opacity = ".5";
      playList(first ? list : list.filter(function (x) { return x !== "g"; }), function () { [].forEach.call(cb.querySelectorAll(".talking"), function (e) { e.classList.remove("talking"); }); rb.disabled = false; rb.style.opacity = ""; rb.textContent = rb.getAttribute("data-label"); again.disabled = false; again.style.opacity = ""; window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); }, lit); }
    again.addEventListener("click", function () { if (!again.disabled) talk(false); });
    talk(true);
    window.scrollTo(0, 0);
  } else {
    $("progress").textContent = "쌍둥이 문제 " + (twinNo + 1) + " / " + TW.length;
    $("concept-box").classList.add("hidden"); $("read-btn").classList.add("hidden");
    $("qtext").innerHTML = "Q" + (twinNo + 1) + ". " + st.q;
    var box = $("choices"); box.innerHTML = "";
    shuffle(st.choices).forEach(function (c, i) {
      var b = document.createElement("button"); b.className = "choice"; b.setAttribute("data-c", c);
      b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
      b.addEventListener("click", function () { pick(c); });
      box.appendChild(b);
    });
    var u = document.createElement("button"); u.className = "unk"; u.id = "unk-btn"; u.textContent = "🤔 모름";
    u.addEventListener("click", function () { unknown(); });
    box.appendChild(u);
    /* 원장님 11/14 "태은이도 문제 나오면 영어문장 읽어줘야징" — 지시문(한글)→영어 문장(→영어 보기)을 끝까지 읽어 줄 때까지 보기·모름 잠금 */
    var kids = [].slice.call(box.children); kids.forEach(function (b) { b.disabled = true; b.style.opacity = ".45"; });
    var tip = document.createElement("div"); tip.style.cssText = "text-align:center;color:#8a6d00;font-weight:700;margin-top:8px"; tip.textContent = "👂 지나티처가 문제 읽는 중…"; box.appendChild(tip);
    var again = document.createElement("button"); again.className = "btn"; again.style.cssText = "background:#eef3ff;color:#2c3e8f;margin-top:8px"; again.textContent = "🔊 문제 다시 듣기"; again.disabled = true; again.style.opacity = ".5";
    box.parentNode.insertBefore(again, box.nextSibling); qAgainBtn = again;
    var n = twinNo + 1, info = QSEQ[n] || { seq: [], ch: 0 }, list = info.seq.slice();
    if (info.ch) kids.forEach(function (b) { var c = b.getAttribute("data-c"); var k = st.choices.indexOf(c); if (k >= 0 && !/[가-힣]/.test(c)) list.push("c" + n + "_" + (k + 1)); });
    function open() { kids.forEach(function (b) { b.disabled = false; b.style.opacity = ""; }); tip.remove(); again.disabled = false; again.style.opacity = ""; }
    function readQ() { again.disabled = true; again.style.opacity = ".5"; playList(list, open); }
    again.addEventListener("click", function () { if (!again.disabled && !locked) readQ(); });
    readQ();
    window.scrollTo(0, 0);
  }
}

function pick(choice) {
  if (locked) return; locked = true;
  var st = STEPS[cur], ok = choice === st.answer;
  if (ok) correctCount++; else wrongNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: ok, chosen: choice, answer: st.answer });
  [].forEach.call($("choices").children, function (b) {
    b.disabled = true;
    if (b.getAttribute("data-c") === st.answer) b.classList.add("right");
    else if (b.getAttribute("data-c") === choice) b.classList.add("bad");
  });
  feedback(ok, st);
}

/* 11/14 원장님 목소리(v4) 칭찬·틀림·모름 한 마디 → 정답 문장. 칭찬은 원장님 선택 전부 3번 */
var CHEER = { ok: ["praise/p1_3","praise/p2_3","praise/p3_3","praise/p4_3","praise/p5_3","praise/p6_3","praise/p7_3","praise/p8_3","praise/p9_3"], no: ["oops/p1_3","oops/p2_3","oops/p3_1","oops/p4_3","oops/p5_3"], un: ["oops/p6_3","oops/p7_3","oops/p8_3"] };
var cheerAud = new Audio();
function cheerHte(kind, done) {
  var list = CHEER[kind] || [], fin = false;
  function f() { if (fin) return; fin = true; cheerAud.onended = cheerAud.onerror = null; done(); }
  if (!list.length) return f();
  cheerAud.onended = f; cheerAud.onerror = f; setTimeout(f, 4000);
  try { cheerAud.pause(); cheerAud.src = "audio/fx/" + list[Math.floor(Math.random() * list.length)] + ".mp3?v=1114"; var pr = cheerAud.play(); if (pr && pr.catch) pr.catch(f); } catch (e) { f(); }
}
function feedback(ok, st, isUnknown) {
  var h = '<div class="exp' + (ok ? "" : " wrong") + '"><b>' + (ok ? "정답! 🎉" : (isUnknown ? "🤔 괜찮아요! 정답: " : "아쉬워요 — 정답: ") + st.answer) + "</b><br>" + st.exp + "</div>";
  if (!ok) h += '<div class="lab2">📖 개념 정리 다시 보기</div>' + CONCEPT_OF[cur];
  h += '<button class="btn" id="say-btn" style="background:#eef3ff;color:#2c3e8f;margin-bottom:8px">🔊 정답 문장 다시 듣기</button>';
  h += '<button class="btn" id="next-btn">' + (twinNo + 1 < TW.length ? "다음 ▶" : "결과 보기") + "</button>";
  $("fb").innerHTML = h;
  var nb = $("next-btn"), nLabel = nb.textContent;
  function ready() { nb.disabled = false; nb.style.opacity = ""; nb.textContent = nLabel; }
  function listen() { nb.disabled = true; nb.style.opacity = ".5"; nb.textContent = "👂 정답 문장 듣는 중…"; playTwin(twinNo + 1, ready); }
  nb.disabled = true; nb.style.opacity = ".5"; nb.textContent = "👂 정답 문장 듣는 중…";
  cheerHte(isUnknown ? "un" : (ok ? "ok" : "no"), listen);
  $("say-btn").addEventListener("click", listen);
  nb.addEventListener("click", function () { if (nb.disabled) return; stopTwin(); locked = false; twinNo++; cur++; show(); });
}

/* 원장님 11/14 "태은이 링크도 영어 문장은 정답 누르면 읽어줘" — 답을 고르면 정답 영어 문장을 소리로 (문항마다 다른 목소리, Eleven v4) */
var twinAud = new Audio();
var twinDone = null, twinGuard = null;
function playTwin(n, done) {
  listToken++; if (qAgainBtn) { qAgainBtn.remove(); qAgainBtn = null; }
  clearTimeout(twinGuard); twinDone = done || null;
  function fin() { clearTimeout(twinGuard); var f = twinDone; twinDone = null; if (f) f(); }
  /* 소리가 막히거나 안 나오면 6초 뒤 열어 줌 (갇히지 않게) */
  twinGuard = setTimeout(fin, 6000);
  try { twinAud.pause(); twinAud.onended = fin; twinAud.onerror = fin; twinAud.onplaying = function () { clearTimeout(twinGuard); twinGuard = setTimeout(fin, 20000); };
    twinAud.src = "audio/clinic/clinic-hte-1113/t" + n + ".mp3?v=202611140130"; var p = twinAud.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
}
var QSEQ = {"1":{"seq":["k1","p1"],"ch":0},"2":{"seq":["k2","p2_1","p2_2"],"ch":0},"3":{"seq":["k3"],"ch":1},"4":{"seq":["k4","p4"],"ch":0},"5":{"seq":["k5","p5"],"ch":0},"6":{"seq":["k6","p6"],"ch":1},"7":{"seq":["k7","p7"],"ch":0},"8":{"seq":["k8","p8"],"ch":0},"9":{"seq":["k9"],"ch":1},"10":{"seq":["k10","p10"],"ch":0},"11":{"seq":["k11","p11"],"ch":0},"12":{"seq":["k12","p12"],"ch":1},"13":{"seq":["k13","p13"],"ch":0},"14":{"seq":["k14","p14"],"ch":0},"15":{"seq":["k15"],"ch":1}};
var qAgainBtn = null, listToken = 0;
/* 파일 여러 개를 차례로 (같은 Audio 하나로 → 휴대폰에서도 계속 소리). 막히면 파일당 6초 뒤 다음으로 */
function playList(list, done, onEach) {
  var my = ++listToken, i = 0;
  function nextOne() {
    if (my !== listToken) return;
    if (i >= list.length) { clearTimeout(twinGuard); twinDone = null; if (done) done(); return; }
    if (onEach) try { onEach(i); } catch (e) {}
    var name = list[i++]; clearTimeout(twinGuard); twinDone = null;
    twinGuard = setTimeout(nextOne, 6000);
    try { twinAud.pause(); twinAud.onended = function () { if (my === listToken) { clearTimeout(twinGuard); setTimeout(nextOne, 250); } };
      twinAud.onerror = function () { if (my === listToken) { clearTimeout(twinGuard); nextOne(); } };
      twinAud.onplaying = function () { if (my === listToken) { clearTimeout(twinGuard); twinGuard = setTimeout(nextOne, 20000); } };
      twinAud.src = "audio/clinic/clinic-hte-1113/" + name + ".mp3?v=202611140930"; var p = twinAud.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
  nextOne();
}
function stopTwin() { listToken++; if (qAgainBtn) { qAgainBtn.remove(); qAgainBtn = null; } clearTimeout(twinGuard); twinDone = null; try { twinAud.pause(); } catch (e) {} }

function unknown() {
  if (locked) return; locked = true;
  var st = STEPS[cur];
  wrongNumbers.push(twinNo + 1); unknownNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: false, chosen: "모름", answer: st.answer, unknown: true });
  /* 모름도 정답·해설 보고 정답 문장 들은 뒤 넘어가기 */
  [].forEach.call($("choices").children, function (b) { b.disabled = true; if (b.getAttribute && b.getAttribute("data-c") === st.answer) b.classList.add("right"); });
  feedback(false, st, true);
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}

function showResult() {
  $("quiz-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  $("score-line").textContent = correctCount + " / " + TW.length;
  var um = document.createElement("div"); um.id = "unknown-line"; um.className = "sub"; um.style.textAlign = "center"; um.textContent = unknownLine();
  $("score-line").parentNode.insertBefore(um, $("submit-status"));
  var expBox = $("explanations");
  TW.forEach(function (q, i) {
    var log = answersLog[i], d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>쌍둥이 " + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 (정답: " + q.answer + ")" : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correctCount, total: TW.length, wrong: wrongNumbers,
    unknown: unknownNumbers, durationSec: Math.round((Date.now() - startTime) / 1000), detail: answersLog });
}
