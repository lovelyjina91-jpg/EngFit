async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");

}


/* ══════ 문제 데이터 (개념 페이지 + 쌍둥이 문제) ══════ */
var STEPS = [
 {
  "type": "concept",
  "html": "<div class='ctitle'>① 가주어 It + 형용사 + to 동사원형 (7과)</div><div class='box'><div class='lab'>교과서 문장 (7과 본문 · Day of the Dead / Fur Rondy)</div>They believe it is important to remember dead people. / Is it possible to do so?</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>That is ~ / to remembering / Is it possibly ~</div><div class='box ok'><div class='lab'>정답 모양</div><b>It</b> is + <b>형용사</b> + <b>to 동사원형</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>to부정사 주어(To remember dead people)가 길어서 뒤로 보내고, 빈 주어 자리에 <b>It</b>을 세워요. It은 해석하지 않아요. It 대신 That·This ✕, to 뒤는 늘 <b>동사원형</b>, is 뒤는 <b>형용사</b>(possible, important) 자리라 -ly 부사 ✕!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>To ride a horse is exciting. → <b class='hl'>It</b> is exciting <b class='hl'>to ride</b> a horse.</li><li>의문문: <b class='hl'>Is it</b> + 형용사 + to 동사원형 ~?</li></ul></div><div class='trap'>⚠️ 함정: That / This ✕ · to + -ing ✕ · to 빠뜨리기 ✕ · possibly(부사) ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(하루 만에 케이크 한 판을 굽는 것이 가능할까?)<div class='pass'>Is it possible ______ a whole cake in one day?</div>",
  "choices": ["to bake", "baking", "bake", "bakes"],
  "answer": "to bake",
  "exp": "Is it + 형용사(possible) + <b>to 동사원형</b> ~? 본문 Is it possible to do so?와 같은 모양이에요. to 없이 bake ✕, -ing ✕."
 },
 {
  "type": "twin",
  "q": "어법상 <b>옳은</b> 문장은?",
  "choices": ["It is exciting to watch the fireworks at night.", "That is exciting to watch the fireworks at night.", "It is exciting watch the fireworks at night.", "It is excitingly to watch the fireworks at night."],
  "answer": "It is exciting to watch the fireworks at night.",
  "exp": "가주어는 <b>It</b>(That ✕), 진주어는 <b>to watch</b>(to 빠짐 ✕), is 뒤는 형용사 <b>exciting</b>(-ly ✕)."
 },
 {
  "type": "twin",
  "q": "두 문장의 뜻이 같도록 바꾼 것은?<div class='pass'>To keep a diary in English is helpful.</div>",
  "choices": ["It is helpful keep a diary in English.", "This is helpful to keep a diary in English.", "It is helpful to keep a diary in English.", "It is helpfully to keep a diary in English."],
  "answer": "It is helpful to keep a diary in English.",
  "exp": "To ~ 주어를 뒤로 보내고 앞에 <b>It</b> → It is helpful <b>to keep</b> a diary in English. 서술형 단골 전환이에요."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>② call / name + A + B — A를 B라고 부르다 / 이름 짓다 (7과)</div><div class='box'><div class='lab'>교과서 문장 (7과 본문 · Midsummer / Day of the Dead)</div>They call it the Midsummer festival. / They call this day the Day of the Dead.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>call this day <b>as</b> the Day of the Dead / call the Midsummer festival it</div><div class='box ok'><div class='lab'>정답 모양</div>call + <b>A(누구·무엇을)</b> + <b>B(뭐라고)</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>우리말 '~라고'를 as로 옮기고 싶어지지만, call·name 뒤에는 <b>아무것도 끼우지 않고</b> A, B를 나란히 써요. 순서도 <b>부르는 대상(A)이 먼저</b>, 이름(B)이 나중!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>My friends <b class='hl'>call me Jenny</b>. (나를 → 제니라고)</li><li>They <b class='hl'>named the dog Lucky</b>. (개를 → 럭키라고)</li></ul></div><div class='trap'>⚠️ 함정: as ✕ · to ✕ · A와 B 순서 바꾸기 ✕</div>"
 },
 {
  "type": "twin",
  "q": "우리말을 영어로 바르게 옮긴 것은?<div class='pass'>우리는 그 고양이를 '구름이'라고 부른다.</div>",
  "choices": ["We call the cat as Gureumi.", "We call the cat Gureumi.", "We call Gureumi the cat.", "We call to the cat Gureumi."],
  "answer": "We call the cat Gureumi.",
  "exp": "<b>call + A(the cat) + B(Gureumi)</b>. as·to를 끼우면 ✕, Gureumi the cat은 '구름이를 고양이라고 부른다'가 되어 뜻이 바뀌어요."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(미나의 부모님은 그녀의 남동생을 '준'이라고 이름 지었다)<div class='pass'>Mina's parents named ______.</div>",
  "choices": ["her brother as Jun", "Jun her brother", "her brother to Jun", "her brother Jun"],
  "answer": "her brother Jun",
  "exp": "<b>name + A(her brother) + B(Jun)</b>. 이름 짓는 대상이 먼저, 이름이 나중. as·to ✕."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>③ 진짜 주어 찾기 — 수일치 · 동명사 주어는 단수 (7과)</div><div class='box'><div class='lab'>교과서 문장 (7과 본문 · Fallas / Fur Rondy)</div>The stars of the festival are fallas. / Burning them symbolizes ~ / People who participate in this race wear ~</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>the festival is / them symbolize / this race wears</div><div class='box ok'><div class='lab'>정답 모양</div>꾸미는 말을 지우고 <b>맨 앞 진짜 주어</b>에 맞추기</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>동사 바로 앞에 있는 단어(festival, them, race)에 맞추고 싶어져요. 하지만 of ~, in ~, who ~ 는 <b>꾸미는 말</b>이라 괄호 치고 지워요. 그리고 <b>-ing로 시작하는 주어</b>(Burning them)는 '~하는 것' 한 덩어리라 늘 <b>단수</b>!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>The stars (of the festival) <b class='hl'>are</b> ~ → 주어 stars(여럿)</li><li><b class='hl'>Burning them</b> symbolize<b class='hl'>s</b> ~ → 동명사 주어 = 단수</li></ul></div><div class='trap'>⚠️ 함정: 동사 바로 앞 단어에 맞추기 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>The girls in the photo ______ my cousins.</div>",
  "choices": ["is", "was", "are", "be"],
  "answer": "are",
  "exp": "in the photo는 꾸미는 말 → 진짜 주어 <b>The girls</b>(여럿) → <b>are</b>. photo(하나)에 맞추면 ✕."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>Making paper lanterns ______ a lot of patience.</div>",
  "choices": ["need", "needs", "are needing", "needing"],
  "answer": "needs",
  "exp": "<b>Making paper lanterns</b>(종이 등을 만드는 것)는 동명사 주어 → 단수 → <b>needs</b>. lanterns(여럿)에 속으면 ✕."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["People in this town hold a parade every May.", "Watching old cartoons make me sleepy.", "The leaves of the tree are turning red.", "Students who join the club wear red caps."],
  "answer": "Watching old cartoons make me sleepy.",
  "exp": "Watching old cartoons는 동명사 주어 → 단수 → <b>makes</b>. 나머지는 진짜 주어(People, leaves, Students)가 여럿이라 hold·are·wear가 맞아요."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>④ during + 명사 / while + 주어 + 동사 (7과)</div><div class='box'><div class='lab'>교과서 문장 (7과 본문 · Midsummer)</div>During the festival, people decorate a tall pole ~</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div><b>While</b> the festival, ~</div><div class='box ok'><div class='lab'>정답</div><b>During</b> the festival (뒤에 명사만)</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>둘 다 '~ 동안'이라 뜻으로는 못 골라요. <b>뒤를 보고</b> 골라요. 명사(구)만 있으면 전치사 <b>during</b>, 주어 + 동사가 있으면 접속사 <b>while</b>. because of(+ 명사) / because(+ 주어 + 동사)도 같은 방법!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li><b class='hl'>during</b> + the summer / the movie / the trip</li><li><b class='hl'>while</b> + I was sleeping / we were walking</li></ul></div><div class='trap'>⚠️ 함정: 뜻으로 고르지 말고 뒤에 동사가 있는지 보기!</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>______ the winter vacation, I learned to skate.</div>",
  "choices": ["While", "Because", "During", "When"],
  "answer": "During",
  "exp": "뒤에 명사구(the winter vacation)만 있고 동사가 없어요 → 전치사 <b>During</b>. While·Because·When은 뒤에 주어 + 동사가 와야 해요."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(나는 버스를 기다리는 동안 단어를 외웠다)<div class='pass'>I memorized words ______ I was standing at the bus stop.</div>",
  "choices": ["during", "while", "because of", "for"],
  "answer": "while",
  "exp": "뒤에 주어 + 동사(I was standing)가 있어요 → 접속사 <b>while</b>. during·because of·for는 뒤에 명사만 와요."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>⑤ 현재완료 have / has + p.p. (8과)</div><div class='box'><div class='lab'>교과서 문장 (8과 본문 · Time Travel)</div>I've always wanted to see a dinosaur. / We've just arrived ~ / I've never seen such a huge thing.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>I've never <b>saw</b> / has finished ~ <b>last night</b></div><div class='box ok'><div class='lab'>정답</div>I've never <b>seen</b> / <b>finished</b> ~ last night</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>have 뒤에는 꼭 <b>p.p.(과거분사)</b>예요. 과거형(saw, went)을 쓰면 ✕. 그리고 현재완료는 '지금까지'와 이어진 말이라 <b>yesterday · last ~ · ~ ago · When ~?</b> 같은 딱 끝난 과거 시점과는 같이 못 써요.</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>경험: I <b class='hl'>have seen</b> it before. / Have you ever ~?</li><li>계속: She <b class='hl'>has lived</b> here since 2020.</li><li>대답: Yes, I <b class='hl'>have</b>. / No, I <b class='hl'>haven't</b>.</li></ul></div><div class='trap'>⚠️ 함정: have + 과거형 ✕ · 현재완료 + last / ago / yesterday ✕</div>"
 },
 {

 },

  "choices": ["very", "such", "too", "so"],

var QUIZ_ID = "clinic-hte-1105";
var QUIZ_TITLE = "한태은 사진 클리닉 개념+쌍둥이 11/05";
var TW = STEPS.filter(function (x) { return x.type === "twin"; });
var CONCEPT_OF = {};
(function () { var last = ""; STEPS.forEach(function (x, i) { if (x.type === "concept") last = x.html; else CONCEPT_OF[i] = last; }); })();

var studentName = "", cur = 0, twinNo = 0, correctCount = 0, wrongNumbers = [], unknownNumbers = [], answersLog = [], startTime = 0, locked = false;
var nameInput = document.getElementById("name-input"), startBtn = document.getElementById("start-btn");
var CIRCLED = ["①", "②", "③", "④", "⑤"];
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function $(id) { return document.getElementById(id); }

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  $("start-card").classList.add("hidden");
  $("quiz-card").classList.remove("hidden");
  show();
});
$("read-btn").addEventListener("click", function () { cur++; show(); });

function show() {
  if (cur >= STEPS.length) return showResult();
  var st = STEPS[cur];
  $("bar-fill").style.width = Math.round(cur / STEPS.length * 100) + "%";
  $("fb").innerHTML = "";
  if (st.type === "concept") {
    $("progress").textContent = "틀린 이유 읽기 · 쌍둥이 문제 " + (twinNo + 1) + "번 전";
    $("part").classList.add("hidden");
    $("concept-box").innerHTML = st.html; $("concept-box").classList.remove("hidden");
    $("read-btn").classList.remove("hidden");
    $("qtext").innerHTML = ""; $("choices").innerHTML = "";
    window.scrollTo(0, 0);
  } else {
    $("progress").textContent = "쌍둥이 문제 " + (twinNo + 1) + " / " + TW.length;
    $("concept-box").classList.add("hidden"); $("read-btn").classList.add("hidden");
    $("qtext").innerHTML = "Q" + (twinNo + 1) + ". " + st.q;
    var box = $("choices"); box.innerHTML = "";
    shuffle(st.choices).forEach(function (c, i) {
      var b = document.createElement("button"); b.className = "choice"; b.setAttribute("data-c", c);
      b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
      b.addEventListener("click", function () { pick(c); });
      box.appendChild(b);
    });
    var u = document.createElement("button"); u.className = "unk"; u.id = "unk-btn"; u.textContent = "🤔 모름";
    u.addEventListener("click", function () { unknown(); });
    box.appendChild(u);
    window.scrollTo(0, 0);
  }
}

function pick(choice) {
  if (locked) return; locked = true;
  var st = STEPS[cur], ok = choice === st.answer;
  if (ok) correctCount++; else wrongNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: ok, chosen: choice, answer: st.answer });
  [].forEach.call($("choices").children, function (b) {
    b.disabled = true;
    if (b.getAttribute("data-c") === st.answer) b.classList.add("right");
    else if (b.getAttribute("data-c") === choice) b.classList.add("bad");
  });
  var h = '<div class="exp' + (ok ? "" : " wrong") + '"><b>' + (ok ? "정답! 🎉" : "아쉬워요 — 정답: " + st.answer) + "</b><br>" + st.exp + "</div>";
  if (!ok) h += '<div class="lab2">📖 개념 정리 다시 보기</div>' + CONCEPT_OF[cur];
  h += '<button class="btn" id="next-btn">' + (twinNo + 1 < TW.length ? "다음 ▶" : "결과 보기") + "</button>";
  $("fb").innerHTML = h;
  $("next-btn").addEventListener("click", function () { locked = false; twinNo++; cur++; show(); });
}

function unknown() {
  if (locked) return; locked = true;
  var st = STEPS[cur];
  wrongNumbers.push(twinNo + 1); unknownNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: false, chosen: "모름", answer: st.answer, unknown: true });
  locked = false; twinNo++; cur++; show();
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}

function showResult() {
  $("quiz-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  $("score-line").textContent = correctCount + " / " + TW.length;
  var um = document.createElement("div"); um.id = "unknown-line"; um.className = "sub"; um.style.textAlign = "center"; um.textContent = unknownLine();
  $("score-line").parentNode.insertBefore(um, $("submit-status"));
  var expBox = $("explanations");
  TW.forEach(function (q, i) {
    var log = answersLog[i], d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>쌍둥이 " + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 (정답: " + q.answer + ")" : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correctCount, total: TW.length, wrong: wrongNumbers,
    unknown: unknownNumbers, durationSec: Math.round((Date.now() - startTime) / 1000), detail: answersLog });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 사진 클리닉 11/05 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + TW.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n" + unknownLine();
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});

</script>
</body>
</html>
