<script>
"use strict";

/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "결과 전송 중...";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "✓ 결과가 지나티처에게 자동 전송되었어요"; el.style.color = "#2e7d6e"; }
  else { el.textContent = "전송이 안 됐어요 — 아래 버튼으로 복사해서 카톡으로 보내주세요!"; el.style.color = "#c0392b"; }
}


/* ══════ 문제 데이터 (개념 페이지 + 쌍둥이 문제) ══════ */
var STEPS = [
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">① 간접의문문 — 의문사 + 주어 + 동사(3인칭 단수면 -s)<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/27 숙제 2번 · 간접의문문 쓰기)<\/div>… when the library ______ … (도서관이 언제 문을 여는지)<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>… when the library <u>open<\/u><\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>… when the library <b>opens<\/b><\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">간접의문문에서는 do / does가 사라지고 <b>의문사 + 주어 + 동사<\/b> 순서가 돼요. 그런데 does가 사라질 때 3인칭 단수 표시는 <b>동사로 옮겨 가요<\/b>. 그래서 the library(단수)에 맞춰 open → <b>opens<\/b>가 돼요. 같은 실수를 10/24(stop → stops), 10/27(close → closes)에도 했어요. 의문사 뒤 주어를 보면 'he / she / it 인가?'를 꼭 확인해요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>When does the bus <b>leave<\/b>? → Do you know when the bus <b class=\"hl\">leaves<\/b>?<\/p><ul><li>I don't know where Jisu <b class=\"hl\">lives<\/b>. (does live ✕)<\/li><li>Tell me what time the class <b class=\"hl\">starts<\/b>.<\/li><li>복수 주어는 원형: I wonder where they <b>live<\/b>.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: does를 지웠다고 -s까지 지우면 안 돼요. does의 -s가 동사로 이사 간다고 생각해요!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">Can you tell me how often the shuttle bus ______ here?<\/div>",
  "choices": ["runs", "run", "does run", "running"],
  "answer": "runs",
  "exp": "간접의문문은 <b>how often + 주어(the shuttle bus) + 동사<\/b>. 주어가 3인칭 단수라 <b>runs<\/b>예요. does run은 의문문 어순이 남아 있어서 틀려요."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린<\/b> 문장은?",
  "choices": ["I don't know where Mr. Park lives.", "Do you know what time the concert start?", "Tell me how much the ticket costs.", "I wonder who made this cake."],
  "answer": "Do you know what time the concert start?",
  "exp": "the concert는 3인칭 단수라 start → <b>starts<\/b>가 맞아요. 10/27 숙제의 the store close → closes와 똑같은 실수 자리예요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">② 의문사가 없는 간접의문문 — if(~인지)를 꼭 넣기<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/27 데일리 9번)<\/div>눈이 올지 궁금하다.<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>I wonder it will snow.<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>I wonder <b>if<\/b> it will snow.<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">원래 질문 Will it snow?에는 의문사(what, when…)가 없어요. 이런 Yes / No 질문을 문장 속에 넣을 때는 <b>if(또는 whether) + 주어 + 동사<\/b>로 써야 해요. if를 빼면 '~인지'라는 뜻이 사라져서 틀린 문장이 돼요. 10/27 숙제 8번(if the train arrive → arrives)처럼 if 뒤에서도 3인칭 단수 -s를 챙겨요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>Yes / No 의문문 → <b class=\"hl\">if + 주어 + 동사<\/b><\/p><ul><li>Is he at home? → I wonder <b class=\"hl\">if<\/b> he is at home.<\/li><li>Does the shop open today? → Ask <b class=\"hl\">if<\/b> the shop <b>opens<\/b> today.<\/li><li>Will she come? → I'm not sure <b class=\"hl\">if<\/b> she will come.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: 우리말 '~인지, ~할지'가 보이면 if 자리부터 만들어요. that은 '~인지' 뜻이 아니에요!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (박물관이 월요일에 문을 여는지 궁금하다)<div class=\"pass\">I wonder ______ the museum is open on Mondays.<\/div>",
  "choices": ["if", "that", "what", "which"],
  "answer": "if",
  "exp": "원래 질문 Is the museum open on Mondays?에 의문사가 없으니 '~인지'의 <b>if<\/b>를 써요. what · which는 뒤 문장에 빠진 말이 있어야 쓸 수 있어요."
 },
 {
  "type": "twin",
  "q": "다음 우리말을 영어로 바르게 옮긴 것은?<div class=\"pass\">이번 토요일에 날씨가 맑을지 궁금하다.<\/div>",
  "choices": ["I wonder if it will be sunny this Saturday.", "I wonder it will be sunny this Saturday.", "I wonder will it be sunny this Saturday.", "I wonder if will it be sunny this Saturday."],
  "answer": "I wonder if it will be sunny this Saturday.",
  "exp": "<b>I wonder + if + 주어(it) + 동사(will be)<\/b>. if를 빼면 10/27 데일리와 같은 실수, will it처럼 의문문 어순을 남겨도 틀려요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">③ 간접의문문에서도 동사(be동사)는 빠지면 안 돼요<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/27 숙제 7번 · 간접의문문 쓰기)<\/div>그가 왜 늦었는지<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>… why he late<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>… why he <b>was<\/b> late<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">late는 '늦은'이라는 형용사라서 혼자서는 동사가 될 수 없어요. 원래 질문 Why <b>was<\/b> he late?를 문장 속에 넣으면 <b>why + he + was + late<\/b>가 돼요. 어순만 바꾸고 was를 빼먹으면 동사가 없는 문장이 돼요. '늦었는지'의 '-었'을 보고 과거 was까지 챙겨요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>Why <b>is<\/b> she sad? → I know why she <b class=\"hl\">is<\/b> sad.<\/p><ul><li>Where <b>were<\/b> you? → Tell me where you <b class=\"hl\">were<\/b>.<\/li><li>How old <b>is<\/b> he? → I wonder how old he <b class=\"hl\">is<\/b>.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: 형용사(late, sad, angry) 앞에는 be동사가 필요해요. 주어 뒤에 동사가 있는지 손가락으로 짚어 봐요!<\/div>"
 },
 {
  "type": "twin",
  "q": "다음 우리말을 영어로 바르게 옮긴 것은?<div class=\"pass\">그녀가 왜 화가 났는지 아니?<\/div>",
  "choices": ["Do you know why she was angry?", "Do you know why she angry?", "Do you know why was she angry?", "Do you know why did she angry?"],
  "answer": "Do you know why she was angry?",
  "exp": "<b>why + 주어(she) + 동사(was) + angry<\/b>. was를 빼면 10/27 숙제처럼 동사가 없고, was she · did she는 의문문 어순이라 틀려요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">④ 관계대명사 what(~한 것) vs that<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/28 데일리 5번)<\/div>그가 나에게 보여 준 것은 오래된 사진이었다.<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>He showed me a old picture what is old.<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>What<\/b> he showed me was <b>an<\/b> old photo.<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">'~한 것'이 주어일 때는 <b>What + 주어 + 동사<\/b>가 문장 맨 앞에 와서 큰 주어가 돼요. 그 뒤에 진짜 동사 <b>was<\/b>가 나와요. 10/23(That → What), 10/27 숙제 6번(that → what)에서도 같은 자리를 틀렸어요. that은 앞에 선행사(명사)가 있어야 쓰고, 선행사가 없으면 what이에요. 그리고 old는 모음 소리로 시작해서 <b>an<\/b> old예요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>선행사 없음 → <b class=\"hl\">what<\/b> / 선행사 있음 → that<\/p><ul><li><b class=\"hl\">What<\/b> I want is a long rest. (What = the thing which)<\/li><li>This is the bike <b>that<\/b> I want. (선행사 the bike)<\/li><li>모음 소리 앞은 <b class=\"hl\">an<\/b>: an old photo, an hour<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: 빈칸 앞에 명사가 없는데 '~한 것'으로 해석되면 무조건 what! 뒤 문장에 목적어나 주어가 빠져 있는지도 확인해요.<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">______ surprised me most was his kind smile.<\/div>",
  "choices": ["What", "That", "Which", "It"],
  "answer": "What",
  "exp": "앞에 선행사가 없고 '나를 가장 놀라게 한 <b>것<\/b>'이라는 뜻이라 <b>What<\/b>이에요. What surprised me most가 주어, was가 동사예요."
 },
 {
  "type": "twin",
  "q": "다음 우리말을 영어로 바르게 옮긴 것은?<div class=\"pass\">그녀가 나에게 준 것은 오래된 편지였다.<\/div>",
  "choices": ["What she gave me was an old letter.", "What she gave me was a old letter.", "That she gave me was an old letter.", "She gave me what was an old letter."],
  "answer": "What she gave me was an old letter.",
  "exp": "<b>What she gave me<\/b>(그녀가 나에게 준 것)가 주어, was가 동사예요. That으로 시작하면 선행사가 없어 틀리고, old 앞은 <b>an<\/b>이에요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">⑤ to부정사의 의미상 주어 — for + 사람 / of + 사람<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/24 · 10/25 · 10/26 · 10/27)<\/div>It is hard <u>for me<\/u> to ~ / It was careless <u>of you<\/u> to ~<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>to me, to him, what, (모름), that answer<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>for me<\/b>, <b>for him<\/b>, <b>of<\/b>, careless <b>of you<\/b>, difficult for me <b>to answer<\/b><\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">이 개념은 5번이나 틀린 태은이의 1순위 약점이에요. to부정사의 주인(의미상 주어)은 <b>to + 사람이 아니라 for + 사람<\/b>으로 써요. 그런데 kind, careless, rude, wise처럼 <b>사람의 성격·태도를 칭찬하거나 꾸짖는 형용사<\/b> 뒤에서는 <b>of + 사람<\/b>을 써요. 그리고 for me 뒤에는 that이 아니라 <b>to + 동사원형<\/b>이 와요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>It is + 형용사 + <b class=\"hl\">for / of<\/b> + 사람 + <b class=\"hl\">to 동사원형<\/b><\/p><ul><li>보통 형용사(easy, hard, important): It is easy <b class=\"hl\">for<\/b> her to swim.<\/li><li>성격 형용사(kind, careless, rude, wise, silly): It was kind <b class=\"hl\">of<\/b> you to help me.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: '그 사람이 ~하다니 친절하다/무례하다'처럼 <b>사람을 평가<\/b>하면 of! to + 사람은 어떤 경우에도 ✕.<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">It was rude ______ him to leave without a word.<\/div>",
  "choices": ["of", "for", "to", "with"],
  "answer": "of",
  "exp": "rude(무례한)는 그 사람의 태도를 평가하는 형용사라 <b>of + 사람<\/b>이에요. 10/27 데일리의 careless of you와 같은 자리예요."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">It is important ______ us to drink enough water.<\/div>",
  "choices": ["for", "of", "to", "by"],
  "answer": "for",
  "exp": "important는 성격 형용사가 아니라서 <b>for + 사람<\/b>이에요. 10/24 · 10/25처럼 to us라고 쓰면 틀려요."
 },
 {
  "type": "twin",
  "q": "다음 우리말을 영어로 바르게 옮긴 것은?<div class=\"pass\">내가 그 노래를 외우는 것은 쉬웠다.<\/div>",
  "choices": ["It was easy for me to memorize the song.", "It was easy for me that memorize the song.", "It was easy of me to memorize the song.", "It was easy to me memorizing the song."],
  "answer": "It was easy for me to memorize the song.",
  "exp": "<b>It was easy + for me + to memorize<\/b>. 10/27 숙제 20번처럼 that을 쓰면 틀리고, easy는 성격 형용사가 아니라 of도 ✕예요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">⑥ 과거진행형 — was / were + 동사-ing<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/28 데일리 4번 · 과거진행 쓰기)<\/div>~하고 있었다 (먹고 있었다)<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div><u>ate<\/u> (10/25: was play, 10/23: am taking)<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>was eating<\/b> (10/25: was playing, 10/23: was taking)<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">'~하고 있었다'는 과거의 어느 순간에 <b>진행 중이던 동작<\/b>이라 과거진행형을 써요. 형태는 <b>was / were + 동사-ing<\/b> 두 조각이 꼭 함께 있어야 해요. ate는 그냥 '먹었다', was play는 -ing가 빠졌고, am taking은 현재라서 시제가 맞지 않아요. 같은 개념을 세 번(10/23 · 10/25 · 10/28) 틀렸어요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>~하고 있었다 = <b class=\"hl\">was / were + -ing<\/b><\/p><ul><li>I <b class=\"hl\">was reading<\/b> when the bell rang.<\/li><li>They <b class=\"hl\">were playing<\/b> soccer at 5 p.m. yesterday.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: was만 쓰고 동사를 원형으로 두면(was play) 반쪽짜리예요. be + -ing 세트를 한 번에 써요!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (내가 집에 왔을 때 아빠는 설거지를 하고 계셨다)<div class=\"pass\">Dad ______ the dishes when I got home.<\/div>",
  "choices": ["was washing", "washed", "is washing", "was wash"],
  "answer": "was washing",
  "exp": "'하고 계셨다'는 과거진행 <b>was washing<\/b>이에요. was wash는 10/25의 was play와 같은 실수(-ing 빠짐)예요."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린<\/b> 문장은?",
  "choices": ["The kids were building a snowman at noon.", "I was read a comic book when Mom called me.", "It was raining hard all morning.", "What were you doing at eight last night?"],
  "answer": "I was read a comic book when Mom called me.",
  "exp": "과거진행은 was + <b>-ing<\/b>라서 was read → <b>was reading<\/b>이에요. 나머지는 모두 was / were + -ing가 맞게 쓰였어요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">⑦ Some ~, others ~ (일부는 ~, 다른 사람들은 ~)<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/22 클리닉 · 10/26 데일리 8번)<\/div>Some people take the subway, and <u>others<\/u> take the bus.<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>another<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>others<\/b><\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">여럿 중에서 '어떤 사람들은 ~, 또 다른 사람들은 ~'처럼 <b>복수 무리끼리<\/b> 나눌 때는 Some ~, <b>others<\/b> ~예요. another는 '또 다른 하나'라서 단수예요. 뒤 동사 take가 복수형인 것도 others가 답이라는 힌트예요. 두 번(10/22, 10/26) 똑같이 another를 썼으니 이번에 확실히 잡아요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>Some + 복수, <b class=\"hl\">others<\/b> + 복수 동사<\/p><ul><li>Some kids like dogs, and <b class=\"hl\">others<\/b> like cats.<\/li><li>another = 또 다른 하나: I want <b>another<\/b> cookie.<\/li><li>둘 중 나머지 하나 = the other<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: Some이 보이면 짝꿍은 others! another는 a + other라서 한 개예요.<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">Some of the guests drank coffee, and ______ drank orange juice.<\/div>",
  "choices": ["others", "another", "other", "the another"],
  "answer": "others",
  "exp": "Some(일부 손님들) ~ <b>others<\/b>(다른 손님들) ~ 짝이에요. another는 단수 '또 하나'라서 복수 무리를 가리킬 수 없어요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">⑧ 비교급 강조 — much / far / even + 비교급<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/22 클리닉 · 10/24 데일리 2번)<\/div>The film was much ______ than I expected. (boring) / 비교급 강조 빈칸<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>much boringer / more<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>much <b>more boring<\/b> / <b>much<\/b> bigger<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">'훨씬 더 ~한'은 비교급 앞에 <b>much, far, even, a lot<\/b>을 붙여요. very나 more는 비교급을 강조할 수 없어요. 그리고 boring처럼 긴 단어는 -er이 아니라 <b>more boring<\/b>으로 비교급을 만들어요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p><b class=\"hl\">much / far / even<\/b> + 비교급 = 훨씬 더<\/p><ul><li>This box is <b class=\"hl\">much<\/b> heavier than that one.<\/li><li>The movie was <b class=\"hl\">far<\/b> more exciting than the book.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: very는 원급 앞(very tall), much는 비교급 앞(much taller)!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">The second test was ______ harder than the first one.<\/div>",
  "choices": ["much", "very", "more", "most"],
  "answer": "much",
  "exp": "harder는 이미 비교급이라 '훨씬'은 <b>much<\/b>예요. 10/24에 more를 쓴 것과 같은 자리예요. very는 비교급을 꾸밀 수 없어요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">⑨ Every + 단수명사 + 단수동사 (10/29 클리닉 다시 보기)<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/29 클리닉 5 · 6번)<\/div>Every child in the class ______ a pencil case. / 어법상 올바른 문장 고르기<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 고른 답<\/div>have / Every girls in my school knows the singer.<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>has<\/b> / Every <b>girl<\/b> in my school <b>knows<\/b> the singer.<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">10/29 클리닉에서 개념을 읽고도 every 문제를 또 틀렸어요. every는 뜻은 '모든'이지만 문법으로는 <b>하나하나를 가리키는 단수<\/b>예요. 그래서 뒤의 명사도 단수(girl), 동사도 단수(knows, has)로 맞춰요. 중간에 in my school 같은 수식어가 끼어도 주어는 every girl이에요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p><b class=\"hl\">Every + 단수명사 + 단수동사<\/b><\/p><ul><li>Every seat on the bus <b class=\"hl\">is<\/b> taken.<\/li><li>Every student <b class=\"hl\">has<\/b> a locker.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: All은 복수(All students have), Every는 단수(Every student has)!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">Every player on our team ______ a different number on the back.<\/div>",
  "choices": ["wears", "wear", "are wearing", "wearing"],
  "answer": "wears",
  "exp": "주어는 <b>Every player<\/b>(단수)예요. on our team은 수식어라서 동사는 단수 <b>wears<\/b>예요."
 }
];
var QUIZ_ID = "clinic-hte-1030";
var QUIZ_TITLE = "한태은 사진 클리닉 개념+쌍둥이 10/30";
var TW = STEPS.filter(function (x) { return x.type === "twin"; });
var CONCEPT_OF = {};
(function () { var last = ""; STEPS.forEach(function (x, i) { if (x.type === "concept") last = x.html; else CONCEPT_OF[i] = last; }); })();

var studentName = "", cur = 0, twinNo = 0, correctCount = 0, wrongNumbers = [], unknownNumbers = [], answersLog = [], startTime = 0, locked = false;
var nameInput = document.getElementById("name-input"), startBtn = document.getElementById("start-btn");
var CIRCLED = ["①", "②", "③", "④", "⑤"];
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function $(id) { return document.getElementById(id); }

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  $("start-card").classList.add("hidden");
  $("quiz-card").classList.remove("hidden");
  show();
});
$("read-btn").addEventListener("click", function () { cur++; show(); });

function show() {
  if (cur >= STEPS.length) return showResult();
  var st = STEPS[cur];
  $("bar-fill").style.width = Math.round(cur / STEPS.length * 100) + "%";
  $("fb").innerHTML = "";
  if (st.type === "concept") {
    $("progress").textContent = "틀린 이유 읽기 · 쌍둥이 문제 " + (twinNo + 1) + "번 전";
    $("part").classList.add("hidden");
    $("concept-box").innerHTML = st.html; $("concept-box").classList.remove("hidden");
    $("read-btn").classList.remove("hidden");
    $("qtext").innerHTML = ""; $("choices").innerHTML = "";
    window.scrollTo(0, 0);
  } else {
    $("progress").textContent = "쌍둥이 문제 " + (twinNo + 1) + " / " + TW.length;
    $("concept-box").classList.add("hidden"); $("read-btn").classList.add("hidden");
    $("qtext").innerHTML = "Q" + (twinNo + 1) + ". " + st.q;
    var box = $("choices"); box.innerHTML = "";
    shuffle(st.choices).forEach(function (c, i) {
      var b = document.createElement("button"); b.className = "choice"; b.setAttribute("data-c", c);
      b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
      b.addEventListener("click", function () { pick(c); });
      box.appendChild(b);
    });
    var u = document.createElement("button"); u.className = "unk"; u.id = "unk-btn"; u.textContent = "🤔 모름";
    u.addEventListener("click", function () { unknown(); });
    box.appendChild(u);
    window.scrollTo(0, 0);
  }
}

function pick(choice) {
  if (locked) return; locked = true;
  var st = STEPS[cur], ok = choice === st.answer;
  if (ok) correctCount++; else wrongNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: ok, chosen: choice, answer: st.answer });
  [].forEach.call($("choices").children, function (b) {
    b.disabled = true;
    if (b.getAttribute("data-c") === st.answer) b.classList.add("right");
    else if (b.getAttribute("data-c") === choice) b.classList.add("bad");
  });
  var h = '<div class="exp' + (ok ? "" : " wrong") + '"><b>' + (ok ? "정답! 🎉" : "아쉬워요 — 정답: " + st.answer) + "</b><br>" + st.exp + "</div>";
  if (!ok) h += '<div class="lab2">📖 개념 정리 다시 보기</div>' + CONCEPT_OF[cur];
  h += '<button class="btn" id="next-btn">' + (twinNo + 1 < TW.length ? "다음 ▶" : "결과 보기") + "</button>";
  $("fb").innerHTML = h;
  $("next-btn").addEventListener("click", function () { locked = false; twinNo++; cur++; show(); });
}

function unknown() {
  if (locked) return; locked = true;
  var st = STEPS[cur];
  wrongNumbers.push(twinNo + 1); unknownNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: false, chosen: "모름", answer: st.answer, unknown: true });
  locked = false; twinNo++; cur++; show();
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}

function showResult() {
  $("quiz-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  $("score-line").textContent = correctCount + " / " + TW.length;
  var um = document.createElement("div"); um.id = "unknown-line"; um.className = "sub"; um.style.textAlign = "center"; um.textContent = unknownLine();
  $("score-line").parentNode.insertBefore(um, $("submit-status"));
  var expBox = $("explanations");
  TW.forEach(function (q, i) {
    var log = answersLog[i], d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>쌍둥이 " + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 (정답: " + q.answer + ")" : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correctCount, total: TW.length, wrong: wrongNumbers,
    unknown: unknownNumbers, durationSec: Math.round((Date.now() - startTime) / 1000), detail: answersLog });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 사진 클리닉 10/30 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + TW.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n" + unknownLine();
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});

</script>
</body>
