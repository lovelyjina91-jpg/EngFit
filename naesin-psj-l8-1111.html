<style>

<script>
"use strict";

/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#5b34b0"; }
  else { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#c0392b"; }
}

/* ══════ 개념 (퀴즈 앞에 보여 줌) ══════ */
var LESSONS = {
0: '<h2>① "누가" 하는지 알려 주는 for · of<small>to부정사의 의미상 주어</small></h2>' +
 '<div class="step"><h3><i>1</i>to + 동사 = "~하는 것"</h3><div class="ex">It is easy <b class="b">to swim</b>.<small>수영하는 것은 쉽다.</small></div>맨 앞 <b>It</b> 은 자리만 채우는 가짜 주어예요. "그것"이라고 읽지 않아요.</div>' +
 '<div class="step"><h3><i>2</i>"누가?" 를 넣으려면 → to 앞에 for + 사람</h3><div class="ex">It is easy <b class="p">for me</b> <b class="b">to swim</b>.<small><b>내가</b> 수영하는 것은 쉽다.</small></div><div class="ex">It was impossible <b class="p">for him</b> <b class="b">to catch</b> any fish.<small>교과서 문장 ★ <b>그가</b> 물고기를 잡는 것은 불가능했다.</small></div>순서: <b>It is + 어떤지 + <span style="color:#d6336c">for 누구</span> + <span style="color:#1c5fd0">to 동사</span></b></div>' +
 '<div class="step"><h3><i>3</i>for 뒤에는 me · him · her · us · them</h3>for <s>I</s> → for <b class="g">me</b> &nbsp; for <s>he</s> → for <b class="g">him</b><br>for <s>she</s> → for <b class="g">her</b> &nbsp; for <s>we</s> → for <b class="g">us</b><br>to 뒤에는 동사 원래 모양만! to <s>caught</s> → to <b class="g">catch</b></div>' +
 '<div class="step"><h3><i>4</i>사람을 칭찬하거나 혼내는 말이면 for 대신 of</h3><div class="ex">It is kind <b class="p">of you</b> to help me.<small>나를 도와주다니 <b>너는</b> 친절하구나.</small></div><b class="g">of</b> (사람 성격): kind 친절한 · nice 착한 · wise 현명한 · polite 예의 바른 · rude 무례한 · foolish 어리석은<br><b class="b">for</b> (일이 어떤지): easy 쉬운 · hard 어려운 · important 중요한 · dangerous 위험한 · impossible 불가능한</div>' +
 '<div class="key">🔑 헷갈리면 "You are ___." 에 넣어 봐요.<br>You are <b class="g">kind</b>. 말이 돼요 → of<br>You are <s>easy</s>. 이상해요 → for</div>',
10: '<h2>② 상상 놀이 문장<small>가정법 과거</small></h2>' +
 '<div class="step"><h3><i>1</i>진짜가 아니에요, 상상이에요</h3><div class="ex">If I <b class="p">had</b> wings, I <b class="b">could fly</b>.<small>나에게 날개가 있다면 날 수 있을 텐데.</small></div>진짜로는? 나는 날개가 <b>없어요</b>. 그래서 날 수 <b>없어요</b>.</div>' +
 '<div class="step"><h3><i>2</i>만드는 법: 두 군데를 "옛날 모양"으로</h3><table class="tb"><tr><th>If 쪽</th><th>뒤쪽</th></tr><tr><td>If + 누가 + <b class="p">과거형</b></td><td><b class="b">would / could</b> + 동사 원래 모양</td></tr><tr><td>If I <b class="p">knew</b> his number,</td><td>I <b class="b">would call</b> him.</td></tr></table>have → <b class="p">had</b> · know → <b class="p">knew</b> · will → <b class="b">would</b> · can → <b class="b">could</b></div>' +
 '<div class="step"><h3><i>3</i>am · is · are 는 전부 were</h3><div class="ex">If I <b class="p">were</b> you, I <b class="b">would</b> say sorry.<small>내가 너라면 미안하다고 말할 텐데.</small></div>I 든 he 든 she 든 <b>were</b> 를 써요.</div>' +
 '<div class="step"><h3><i>4</i>모양은 옛날, 뜻은 지금</h3>과거형을 쓰지만 <b>어제 일이 아니에요.</b> 지금 이야기예요.<div class="ex">It <b class="b">would be</b> wonderful if I <b class="p">could eat</b> fresh fish.<small>교과서 문장 ★ 신선한 물고기를 먹을 수 있다면 정말 좋을 텐데.</small></div></div>' +
 '<div class="key">🔑 If 쪽은 과거형, 뒤쪽은 would / could + 동사 원래 모양. be 는 were!<br>If I <s>have</s> → <b class="g">had</b> &nbsp; I <s>will</s> → <b class="g">would</b></div>',
20: '<h2>③ 본문 이야기: 문자도<small>Munjado</small></h2>' +
 '<div class="step"><h3><i>1</i>문자도가 뭐예요?</h3><b>글자(한자) 하나 + 동물이나 물건 그림</b>이 함께 있는 옛날 그림이에요.<br>조선 시대 <b>뒤쪽(후기)</b>에 인기가 많았던 민화예요.<br>나오는 글자는 <b>8개</b> 중 하나 (효·제·충·신·예·의·염·치). 그때 사람들이 <b>중요하게 여긴 마음</b>이에요.</div>' +
 '<div class="step"><h3><i>2</i>그림은 그냥 꾸민 게 아니에요. 뜻이 있어요.</h3><table class="tb"><tr><th>그림</th><th>숨은 뜻</th><th>왜?</th></tr><tr><td>잉어<br>carp</td><td>부모님을 잘 모시는 마음 (효)</td><td>옛이야기 때문에</td></tr><tr><td>대나무<br>bamboo</td><td>왕을 끝까지 따르는 마음 (충)</td><td>안 휘고 늘 푸르러서</td></tr><tr><td>연꽃<br>lotus</td><td>힘들어도 옳은 일을 하는 마음 (의)</td><td>진흙 연못에서도 예쁘게 피어서</td></tr></table></div>' +
 '<div class="step"><h3><i>3</i>잉어 옛이야기</h3>① 한 남자가 나이 든 어머니와 살았어요.<br>② 겨울에 어머니가 아파서 아무것도 못 드셨어요.<br>③ 어머니: "신선한 물고기를 먹을 수 있다면 좋을 텐데." <b class="p">← 상상 놀이 문장</b><br>④ 강에 갔지만 강이 꽁꽁 얼어 있었어요.<br>⑤ 그가 물고기를 잡는 것은 불가능했어요. <b class="p">← for him to catch</b><br>⑥ 속상해서 하늘에 "도와주세요!" 하고 외쳤어요.<br>⑦ 얼음이 녹고 <b>잉어 세 마리</b>가 나왔어요.<br>⑧ 요리해 드렸더니 어머니가 나았어요.</div>' +
 '<div class="step"><h3><i>4</i>그래서 문자도는?</h3>그냥 그림보다 <b>훨씬 더 큰 것</b>이었어요. 중요한 마음을 떠올리게 해 주었어요.<br>특히 <b>아이들에게는 공부 도구</b>였어요. 가족과 사회에서 <b>사이좋게 지내는 것(조화)</b>이 중요하다는 걸 배웠어요.</div>'
};

/* ══════ 문제 데이터 ══════ */
var OX = ["○ 맞아요", "✕ 틀려요"];
var M3 = ["부모님을 잘 모시는 마음", "왕을 끝까지 따르는 마음", "힘들어도 옳은 일을 하는 마음"];
var QUESTIONS = [
{part:"① for · of", tag:"의미상 주어", q:'알맞은 말을 골라요.<span class="en">It is easy <b>____</b> me to ride a bike.</span>', choices:["for","of"], answer:"for", exp:"easy 는 일이 어떤지 말하는 말 → <b>for</b>"},
{tag:"의미상 주어", q:'알맞은 말을 골라요.<span class="en">It is kind <b>____</b> you to carry my bag.</span>', choices:["for","of"], answer:"of", exp:"kind 는 사람 성격 (You are kind 가 말이 돼요) → <b>of</b>"},
{tag:"의미상 주어", q:'알맞은 말을 골라요.<span class="en">It was hard <b>____</b> Mina to wake up early.</span>', choices:["for","of"], answer:"for", exp:"hard 는 일이 어떤지 → <b>for</b>"},
{tag:"의미상 주어", q:'알맞은 말을 골라요.<span class="en">It is rude <b>____</b> him to talk loudly in the library.</span>', choices:["for","of"], answer:"of", exp:"rude(무례한)는 사람 성격 → <b>of</b>"},
{tag:"의미상 주어", q:'알맞은 말을 골라요.<span class="en">It is important for <b>____</b> to drink water.</span>', choices:["we","us","our"], answer:"us", exp:"for 뒤에는 me·him·her·us·them → <b>us</b>"},
{tag:"의미상 주어", q:'알맞은 말을 골라요.<span class="en">It was wise of <b>____</b> to bring an umbrella.</span>', choices:["she","her","hers"], answer:"her", exp:"of 뒤에도 me·him·her·us·them → <b>her</b>"},
{tag:"의미상 주어", q:'<b>틀린</b> 낱말을 골라요.<span class="en">It is dangerous for he to swim here.</span>', choices:["dangerous","he","to swim","here"], answer:"he", exp:"for 뒤에는 he 가 아니라 <b>him</b>"},
{tag:"의미상 주어", q:'바르게 고친 문장을 골라요.<span class="en">It is nice for you to share your snack. (✕)</span>', choices:["It is nice of you to share your snack.","It is nice for your to share your snack.","It is nice for you sharing your snack.","It is nice to you share your snack."], answer:"It is nice of you to share your snack.", exp:"nice 는 사람 성격 → for 를 <b>of</b> 로"},
{tag:"의미상 주어", q:'바른 문장을 골라요.<span class="en">내가 이 퍼즐을 푸는 것은 어렵다.</span>', choices:["It is difficult for me to solve this puzzle.","It is difficult to solve for me this puzzle.","It is for me difficult to solve this puzzle.","It for me is difficult to solve this puzzle."], answer:"It is difficult for me to solve this puzzle.", exp:"순서: It is + 어떤지 + <b>for 누구 + to 동사</b>"},
{tag:"의미상 주어", q:'바른 문장을 골라요.<span class="en">그 할아버지를 도와드리다니 그는 예의 바르구나.</span>', choices:["It was polite of him to help the old man.","It was polite for him to help the old man.","It was polite of he to help the old man.","It was polite of him to helped the old man."], answer:"It was polite of him to help the old man.", exp:"polite 는 사람 성격 → <b>of him</b>, to 뒤에는 동사 원래 모양 help"},

{part:"② 상상 놀이 문장", tag:"가정법 과거", q:'알맞은 말을 골라요.<span class="en">If I <b>____</b> a robot, I would be happy.</span>', choices:["have","had"], answer:"had", exp:"If 쪽은 과거형 → <b>had</b>"},
{tag:"가정법 과거", q:'알맞은 말을 골라요.<span class="en">If I were tall, I <b>____</b> play basketball.</span>', choices:["will","would"], answer:"would", exp:"뒤쪽은 will 이 아니라 <b>would</b>"},
{tag:"가정법 과거", q:'알맞은 말을 골라요.<span class="en">If she <b>____</b> here, she would help us.</span>', choices:["is","were"], answer:"were", exp:"상상 문장의 be 는 <b>were</b>"},
{tag:"가정법 과거", q:'알맞은 말을 골라요.<span class="en">If we had a car, we could <b>____</b> to the beach.</span>', choices:["go","went"], answer:"go", exp:"could 뒤에는 동사 원래 모양 → <b>go</b>"},
{tag:"가정법 과거", q:'알맞은 말을 골라요.<span class="en">If I <b>____</b> her name, I could call her.</span>', choices:["know","knew"], answer:"knew", exp:"뒤에 could 가 있는 상상 문장 → If 쪽은 과거형 <b>knew</b>"},
{tag:"가정법 과거", q:'<b>틀린</b> 낱말을 골라요.<span class="en">If I am a bird, I would fly to you.</span>', choices:["am","a bird","would","fly"], answer:"am", exp:"뒤가 would → 상상 문장. am 이 아니라 <b>were</b>"},
{tag:"가정법 과거", q:'<b>틀린</b> 낱말을 골라요.<span class="en">If he had time, he will play with us.</span>', choices:["had","time","will","play"], answer:"will", exp:"If 쪽이 had → 뒤쪽은 <b>would</b>"},
{tag:"가정법 과거", q:'진짜로는 어떤가요?<span class="en">If I had a dog, I would walk it every day.</span>', choices:["나는 개가 있다","나는 개가 없다"], answer:"나는 개가 없다", exp:"상상 문장은 진짜와 반대예요 → 지금 <b>개가 없어요</b>"},
{tag:"가정법 과거", q:'빈칸에 알맞은 것을 골라요.<span class="en">내가 부자라면 큰 집을 살 텐데.<br><b>________</b>, I would buy a big house.</span>', choices:["If I were rich","If I am rich","If were I rich","I if were rich"], answer:"If I were rich", exp:"If + 주어 + <b>were</b> + rich"},
{tag:"가정법 과거", q:'빈칸 두 곳에 알맞은 짝을 골라요.<span class="en">내가 너라면 일찍 잘 텐데.<br>If I <b>____</b> you, I <b>____</b> go to bed early.</span>', choices:["were / would","am / will","were / will","am / would"], answer:"were / would", exp:"내가 너라면 = If I <b>were</b> you, 뒤쪽은 <b>would</b> + 동사 원래 모양"},

{part:"③ 본문 이야기", tag:"본문 내용", q:"문자도는 글자와 그림이 함께 있는 그림이다.", choices:OX, answer:OX[0], exp:"한자 하나 + 동물·물건 그림이 함께 있어요."},
{tag:"본문 내용", q:"문자도는 조선 시대 앞쪽(초기)에 인기가 있었다.", choices:OX, answer:OX[1], exp:"조선 <b>후기</b>(late)에 인기가 있었어요."},
{tag:"본문 내용", q:"문자도에 나오는 글자는 10개 중 하나이다.", choices:OX, answer:OX[1], exp:"글자는 <b>8개</b> (효·제·충·신·예·의·염·치) 중 하나예요."},
{tag:"본문 내용", q:"그림 속 동물과 물건은 그냥 꾸미려고 그린 것이다.", choices:OX, answer:OX[1], exp:"꾸밈만이 아니라 <b>뜻</b>이 숨어 있어요 (symbolic)."},
{tag:"본문 내용", q:"잉어 (carp) 에 숨은 뜻은?", choices:M3, answer:M3[0], exp:"잉어 = 효, <b>부모님</b>을 잘 모시는 마음 (옛이야기 때문에)"},
{tag:"본문 내용", q:"대나무 (bamboo) 에 숨은 뜻은?", choices:M3, answer:M3[1], exp:"대나무 = 충, 안 휘고 늘 푸르러서 <b>왕</b>을 따르는 마음"},
{tag:"본문 내용", q:"연꽃 (lotus flower) 에 숨은 뜻은?", choices:M3, answer:M3[2], exp:"연꽃 = 의, 진흙 연못에서도 예쁘게 피어서 <b>옳은 일</b>을 하는 마음"},
{tag:"본문 내용", q:"남자가 물고기를 잡을 수 없었던 까닭은?", choices:["강이 꽁꽁 얼어서","낚싯대가 없어서","비가 많이 와서"], answer:"강이 꽁꽁 얼어서", exp:"강이 완전히 <b>얼어</b> 있었어요."},
{tag:"본문 내용", q:"얼음이 녹고 물 밖으로 나온 것은?", choices:["잉어 한 마리","잉어 세 마리","거북이 세 마리"], answer:"잉어 세 마리", exp:"<b>잉어 세 마리</b> (three carp) 가 나왔어요."},
{tag:"본문 내용", q:"조선 시대 아이들에게 문자도는 무엇이었나요?", choices:["장난감","공부 도구","돈"], answer:"공부 도구", exp:"아이들에게는 <b>공부 도구</b> (study tool) 였어요."}
];

var QUIZ_ID = "naesin-psj-l8-1111";
var QUIZ_TITLE = "박상준 8과 쉬운 개념+퀴즈 30";
var KEEP = true;
var SAVE_KEY = "engfit-" + QUIZ_ID;

/* ══════ 진행 로직 ══════ */
var studentName = "";
var current = 0;
var correctCount = 0;
var wrongNumbers = [];
var unknownNumbers = [];
var answersLog = [];
var startTime = 0;
var elapsedBefore = 0;
var lessonSeen = {};

var nameInput = document.getElementById("name-input");
var startBtn = document.getElementById("start-btn");

function loadSaved() {
  if (!KEEP) return null;
  try { var s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function saveProgress() {
  if (!KEEP) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ name: studentName, current: current, correctCount: correctCount, wrongNumbers: wrongNumbers, unknownNumbers: unknownNumbers, answersLog: answersLog, elapsed: elapsedBefore + Math.round((Date.now() - startTime) / 1000) })); } catch (e) {}
}
function clearSaved() { if (!KEEP) return; try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

var saved = loadSaved();
if (saved && saved.answersLog && saved.answersLog.length > 0 && saved.answersLog.length < QUESTIONS.length) {
  var note = document.getElementById("resume-note");
  note.textContent = "이어 풀기 가능: " + saved.answersLog.length + "/" + QUESTIONS.length + " 풀었어요. 시작하기를 누르면 이어서 풀어요.";
  note.classList.remove("hidden");
  if (saved.name) nameInput.value = saved.name;
}

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  var sv = loadSaved();
  if (sv && sv.name === studentName && sv.answersLog && sv.answersLog.length > 0 && sv.answersLog.length < QUESTIONS.length) {
    current = sv.current; correctCount = sv.correctCount; wrongNumbers = sv.wrongNumbers; unknownNumbers = sv.unknownNumbers || []; answersLog = sv.answersLog; elapsedBefore = sv.elapsed || 0;
  }
  document.getElementById("start-card").classList.add("hidden");
  showQuestion();
});

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

var CIRCLED = ["①", "②", "③", "④", "⑤"];

function partStart(idx) {
  for (var i = idx; i >= 0; i--) if (QUESTIONS[i].part) return i;
  return 0;
}

function showLesson(idx) {
  lessonSeen[idx] = true;
  document.getElementById("quiz-card").classList.add("hidden");
  document.getElementById("lesson-body").innerHTML = LESSONS[idx];
  document.getElementById("lesson-card").classList.remove("hidden");
  window.scrollTo(0, 0);
}
document.getElementById("lesson-btn").addEventListener("click", function () {
  document.getElementById("lesson-card").classList.add("hidden");
  showQuestion();
});
document.getElementById("again-btn").addEventListener("click", function () { showLesson(partStart(current)); });

function showQuestion() {
  var ps = partStart(current);
  if (LESSONS[ps] && !lessonSeen[ps]) { showLesson(ps); return; }
  document.getElementById("quiz-card").classList.remove("hidden");
  window.scrollTo(0, 0);
  var q = QUESTIONS[current];
  document.getElementById("progress").textContent = (current + 1) + " / " + QUESTIONS.length;
  document.getElementById("bar-fill").style.width = Math.round(current / QUESTIONS.length * 100) + "%";
  var pt = document.getElementById("part");
  pt.textContent = "퀴즈 " + QUESTIONS[ps].part + " · " + (current - ps + 1) + " / 10"; pt.classList.remove("hidden");
  document.getElementById("qtext").innerHTML = "Q" + (current + 1) + ". " + q.q;
  var box = document.getElementById("choices");
  box.innerHTML = "";
  var list = (q.choices === OX || q.choices === M3) ? q.choices : shuffle(q.choices);
  list.forEach(function (c, i) {
    var b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
    b.addEventListener("click", function () { pick(c); });
    box.appendChild(b);
  });
  var u = document.createElement("button");
  u.className = "unknown"; u.id = "unknown-btn";
  u.textContent = "🤔 모름";
  u.addEventListener("click", function () { pick("모름", true); });
  box.appendChild(u);
}

var locked = false;
function pick(choice, unknown) {
  if (locked) return; locked = true;
  var q = QUESTIONS[current];
  var ok = !unknown && choice === q.answer;
  if (ok) correctCount++;
  else wrongNumbers.push(current + 1);
  var entry = { no: current + 1, ok: ok, chosen: choice, answer: q.answer, tag: q.tag };
  if (unknown) { entry.unknown = true; unknownNumbers.push(current + 1); }
  answersLog.push(entry);
  current++;
  saveProgress();
  setTimeout(function () {
    locked = false;
    if (current < QUESTIONS.length) showQuestion();
    else showResult();
  }, 250);
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}
function partScore(a, b) { var n = 0; for (var i = a; i < b; i++) if (answersLog[i] && answersLog[i].ok) n++; return n; }
function partLine() { return "① for·of " + partScore(0, 10) + "/10 · ② 상상 문장 " + partScore(10, 20) + "/10 · ③ 본문 " + partScore(20, 30) + "/10"; }

function showResult() {
  clearSaved();
  document.getElementById("quiz-card").classList.add("hidden");
  document.getElementById("result-card").classList.remove("hidden");
  window.scrollTo(0, 0);
  document.getElementById("score-line").textContent = correctCount + " / " + QUESTIONS.length;

  var ul = document.createElement("div");
  ul.className = "sub"; ul.id = "unknown-line"; ul.style.textAlign = "center";
  ul.innerHTML = partLine() + "<br>" + unknownLine();
  document.getElementById("score-line").insertAdjacentElement("afterend", ul);
  var expBox = document.getElementById("explanations");
  QUESTIONS.forEach(function (q, i) {
    var log = answersLog[i];
    var d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>Q" + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 → 정답: " + q.answer : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });

  engfitSubmitWithStatus({
    quizId: QUIZ_ID,
    quizTitle: QUIZ_TITLE,
    student: studentName,
    score: correctCount,
    total: QUESTIONS.length,
    wrong: wrongNumbers,
    unknown: unknownNumbers,
    durationSec: elapsedBefore + Math.round((Date.now() - startTime) / 1000),
    detail: answersLog
  });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 8과 쉬운 개념+퀴즈 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + QUESTIONS.length +
            "\n" + partLine() +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n" + unknownLine();
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});
</script>
