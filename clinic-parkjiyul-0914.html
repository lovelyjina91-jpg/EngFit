<style>

<script>
"use strict";

/* ═══════════ 소리 (Web Speech API — 미국인 여성 목소리만) ═══════════ */
var soundOn = true, voice = null, voicesReady = false;
var MALE = /david|mark|alex|fred|guy|daniel|thomas|aaron|ralph|eddy|reed|rocko|junior|bruce|male|yuri|oliver|george|james|christopher|eric|roger|steffan|tom\b/i;
var FEMALE_PREF = ["Samantha","Google US English","Microsoft Zira","Zira","Microsoft Aria","Aria","Microsoft Jenny","Jenny","Microsoft Michelle","Ava","Allison","Susan","Nicky","Joelle","Karen","Serena","Victoria","Female"];

function pickVoice(){
  if(!("speechSynthesis" in window)) return null;
  var all = window.speechSynthesis.getVoices() || [];
  if(!all.length) return null;
  var us = all.filter(function(v){ return /^en[-_]US/i.test(v.lang); });
  var pool = us.length ? us : all.filter(function(v){ return /^en/i.test(v.lang); });
  if(!pool.length) return null;
  for(var i=0;i<FEMALE_PREF.length;i++){
    for(var j=0;j<pool.length;j++){
      if(pool[j].name.indexOf(FEMALE_PREF[i]) !== -1) return pool[j];
    }
  }
  var f = pool.filter(function(v){ return !MALE.test(v.name); });
  return f.length ? f[0] : null;
}
function initVoices(){
  voice = pickVoice();
  if(voice){ voicesReady = true; }
}
if("speechSynthesis" in window){
  initVoices();
  window.speechSynthesis.onvoiceschanged = function(){ initVoices(); };
  setTimeout(initVoices, 400);
  setTimeout(initVoices, 1200);
}
function say(text){
  if(!soundOn || !text) return;
  if(!("speechSynthesis" in window)) return;
  if(!voicesReady || !voice) { initVoices(); if(!voicesReady || !voice) return; }
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.voice = voice; u.lang = "en-US"; u.rate = 0.88; u.pitch = 1.05;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function stopSay(){ try{ window.speechSynthesis.cancel(); }catch(e){} }

/* 코너 완료 팡파르 (짧은 상승음) */
var actx = null;
function fanfare(){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    var notes=[523.25,659.25,783.99,1046.5], t0=actx.currentTime;
    notes.forEach(function(f,i){
      var o=actx.createOscillator(), g=actx.createGain();
      o.type="triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0+i*0.11);
      g.gain.exponentialRampToValueAtTime(0.16,t0+i*0.11+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+i*0.11+0.30);
      o.connect(g); g.connect(actx.destination);
      o.start(t0+i*0.11); o.stop(t0+i*0.11+0.34);
    });
  }catch(e){}
}

document.getElementById("sound-btn").onclick = function(){
  soundOn = !soundOn;
  this.textContent = soundOn ? "🔊 소리 켜짐" : "🔇 소리 꺼짐";
  if(!soundOn) stopSay();
};

/* ═══════════ 개념 카드 ═══════════ */
var CONCEPTS = {
  A: { tag:"코너 A · 동사 모양", label:"동사모양", title:"과거·진행·명령문 — 동사 모양 바꾸기",
    rules:[
      "<b>과거 이야기</b>면 동사도 과거로. fall → <b>fell</b>, see → <b>saw</b>, throw → <b>threw</b>",
      "<b>was/were + 동사-ing</b> = 그때 하고 있던 중. was <b>running</b> (was ran ✗)",
      "<b>명령·안내문</b>은 무조건 동사원형으로 시작. Now, <b>look</b> at ~ (looking ✗)"
    ],
    chips:["He fell off the tree.","I saw an old man.","He was running away.","Now, look at the picture."] },
  B: { tag:"코너 B · 비교급·최상급", label:"비교·최상급", title:"most와 -est는 둘 중 하나만!",
    rules:[
      "<b>most</b>를 앞에 붙였으면 뒤에 <b>-est</b>를 또 붙이지 않는다. the <b>most beautiful</b> (most beautifulest ✗)",
      "<b>more</b>와 <b>-er</b>도 마찬가지. more better ✗ → <b>better</b>",
      "<b>many / some 뒤에는 복수명사</b>. many <b>stars</b> (many star ✗)"
    ],
    chips:["the most beautiful flower","the longest river","many stars in the sky"] },
  C: { tag:"코너 C · 조건 지키기", label:"조건영작", title:"영작은 '조건'까지 맞혀야 정답",
    rules:[
      "<b>단어 수 조건</b>이 있으면 세어보고 낸다. 우리말에 '강'이 두 번 나오면 영어에도 river가 필요할 때가 있다",
      "<b>also는 be동사 바로 뒤</b>, 관사 앞. There was <b>also a</b> wheelchair (a also ✗)",
      "<b>사진 찍다 = take a picture <u>of</u> ~</b> — of를 빼먹지 않기",
      "<b>제목</b>은 단어마다 첫 글자를 대문자로. Who <b>T</b>hrew a <b>C</b>ake ~?"
    ],
    chips:["May I take a picture of this painting?","There was also a wheelchair near the painting.","The Nile River is the longest river in the world."] }
};

/* ═══════════ 문제 데이터 ═══════════ */
/* sec: 코너 / ko: 우리말 안내 / say: 문제 화면 발음 듣기 문장 (없으면 버튼 숨김)
   sayAnswer: 답 고른 직후 읽어줄 영어 (틀린 문장이 정답인 문항은 비움) */
var QUESTIONS = [
  /* ─── 코너 A ─── */
  { sec:"A", ko:"사과가 나무에서 떨어져 내 머리를 쳤다.",
    q:"The apple ______ the tree and hit my head.",
    choices:["fall off","falls off","fell off","falling off"], answer:"fell off",
    say:"The apple fell off the tree and hit my head.",
    sayAnswer:"The apple fell off the tree and hit my head.",
    exp:"뒤에 <b>hit</b>(과거형)이 있으니 앞도 과거여야 해요. fall의 과거형은 <b>fell</b>.",
    tip:"짝 문장에 과거형이 하나라도 보이면 → 나머지도 전부 과거!",
    why:"시험지 7번 (1)에서 fall off 그대로 썼던 곳이에요." },

  { sec:"A", ko:"나는 돌아서서 한 노인을 보았다.",
    q:"I turned around and ______ an old man.",
    choices:["see","saw","sew","seen"], answer:"saw",
    say:"I turned around and saw an old man.",
    sayAnswer:"I turned around and saw an old man.",
    exp:"see의 과거형은 <b>saw</b>예요. <b>sew</b>는 '바느질하다'라는 완전히 다른 단어!",
    tip:"saw(봤다) / sew(꿰매다) — a인지 e인지로 갈라요.",
    why:"시험지 56번 ⓑ에서 sew로 썼던 곳이에요." },

  { sec:"A", ko:"흰머리의 한 노인이 도망가고 있었다.",
    q:"An old man with gray hair was ______ away.",
    choices:["run","ran","running","runs"], answer:"running",
    say:"An old man with gray hair was running away.",
    sayAnswer:"An old man with gray hair was running away.",
    exp:"앞에 <b>was</b>가 있으면 뒤는 반드시 <b>동사-ing</b>. was ran은 과거가 두 번이라 안 돼요.",
    tip:"was/were가 보이면 → -ing를 찾아라!",
    why:"시험지 56번 ⓒ에서 ran으로 썼던 곳이에요." },

  { sec:"A", ko:"자, 용의자들에 대한 정보를 보세요.",
    q:"Now, ______ at the information about the suspects.",
    choices:["look","looks","looking","looked"], answer:"look",
    say:"Now, look at the information about the suspects.",
    sayAnswer:"Now, look at the information about the suspects.",
    exp:"'~하세요'라고 시키는 문장(명령문)은 주어 없이 <b>동사원형</b>으로 시작해요.",
    tip:"문장 맨 앞에 주어가 없다 → 동사원형!",
    why:"시험지 60번 (C)에서 looking으로 썼던 곳이에요." },

  { sec:"A", ko:"지난 토요일, 누군가 모나리자에 케이크를 던졌다. [누적 복습]",
    q:"Last Saturday, someone ______ a cake at the Monalisa.",
    choices:["throw","threw","thrown","throwing"], answer:"threw",
    say:"Last Saturday, someone threw a cake at the Monalisa.",
    sayAnswer:"Last Saturday, someone threw a cake at the Monalisa.",
    exp:"Last Saturday(지난 토요일)니까 과거. throw의 과거형은 <b>threw</b>.",
    tip:"throw - threw - thrown. 발음이 비슷하니 소리 내어 외우기.",
    why:"5과 본문 첫 문장 — 서술형으로 자주 나와요." },

  /* ─── 코너 B ─── */
  { sec:"B", ko:"밤하늘에 많은 별들이 있었다.",

    choices:["star","stars","a star","the star"], answer:"stars",
    say:"There were many stars in the night sky.",

    exp:"<b>many</b>는 '여러 개'라는 뜻이라 뒤에 반드시 <b>복수명사(-s)</b>가 와요. 앞의 were도 복수라는 신호!",

  { sec:"B", ko:"이것은 정원에서 가장 아름다운 꽃이다.",

  { sec:"B", ko:"나일 강은 세계에서 가장 긴 강이다.",

    choices:["the longer","the longest","longest","the most long"], answer:"the longest",

    tip:"more + -er, most + -est 는 절대 같이 못 씀. 20번 실수와 똑같은 짝!",

/* ═══════════ 진행 로직 ═══════════ */
var studentName="", startTime=0;
var order=[], idx=0, phase="main";
var state=[];   /* {no, status:'ok'|'no'|'idk', chosen, wasIdk} */
var retryQueue=[], shownConcept={};

QUESTIONS.forEach(function(q,i){
  state.push({ no:i+1, status:null, chosen:"", wasIdk:false });
});

function $(id){ return document.getElementById(id); }
function show(id){ ["start-card","concept-card","quiz-card","retry-card","result-card"].forEach(function(x){ $(x).classList.toggle("hidden", x!==id); }); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

$("name-input").addEventListener("input", function(){ $("start-btn").disabled = this.value.trim().length===0; });
$("start-btn").onclick = function(){
  studentName = $("name-input").value.trim();
  startTime = Date.now();
  order = QUESTIONS.map(function(_,i){ return i; });
  idx = 0; phase="main";
  step();
};

function step(){
  if(idx >= order.length){
    if(phase==="main"){
      retryQueue = state.filter(function(s){ return s.status==="idk"; }).map(function(s){ return s.no-1; });
      if(retryQueue.length){
        phase="retry";
        $("retry-msg").textContent = "아까 「모르겠어요」로 넘긴 " + retryQueue.length + "문제만 한 번 더 물어볼게요. 이번엔 아는 만큼만 골라봐요!";
        show("retry-card");
        return;
      }
    }
    finish();
    return;
  }
  var qi = order[idx], q = QUESTIONS[qi];
  if(phase==="main" && !shownConcept[q.sec]){
    shownConcept[q.sec] = true;
    renderConcept(q.sec);
    return;
  }
  renderQuestion(qi);
}

$("retry-next").onclick = function(){ order = retryQueue; idx = 0; step(); };

function renderConcept(sec){
  var c = CONCEPTS[sec];
  $("c-tag").textContent = c.tag;
  $("c-title").textContent = c.title;
  $("c-rules").innerHTML = c.rules.map(function(r){ return '<div class="rule">'+r+'</div>'; }).join("");
  var box = $("c-chips"); box.innerHTML = "";
  c.chips.forEach(function(t){
    var b = document.createElement("button");
    b.className = "chip"; b.textContent = "🔈 " + t;
    b.onclick = function(){ say(t); };
    box.appendChild(b);
  });
  show("concept-card");
  window.scrollTo(0,0);
}
$("c-next").onclick = function(){ renderQuestion(order[idx]); };

function renderQuestion(qi){
  var q = QUESTIONS[qi], s = state[qi];
  show("quiz-card");
  window.scrollTo(0,0);
  $("bar-fill").style.width = Math.round((idx/order.length)*100) + "%";
  $("prog-left").textContent = (phase==="retry" ? "🔁 다시 도전 " : "") + (idx+1) + " / " + order.length;
  $("prog-tag").textContent = CONCEPTS[q.sec].tag;
  $("qko").textContent = q.ko;
  $("qtext").innerHTML = q.q;
  var sp = $("q-speak");
  if(q.say){ sp.classList.remove("hidden"); sp.onclick = function(){ say(q.say); }; }
  else { sp.classList.add("hidden"); }

  $("feedback").innerHTML = "";
  $("next-btn").classList.add("hidden");
  var idk = $("idk-btn");
  idk.classList.remove("hidden");
  idk.textContent = (phase==="retry") ? "아직도 모르겠어요 (해설 보기)" : "🤔 모르겠어요 — 나중에 다시 풀기";
  idk.onclick = function(){ onIdk(qi); };

  var box = $("choices"); box.innerHTML = "";
  var opts = shuffle(q.choices);
  opts.forEach(function(text, i){
    var b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = '<span class="num">' + "①②③④⑤".charAt(i) + '</span>' + text;
    b.onclick = function(){ onPick(qi, text, box); };
    box.appendChild(b);
  });
}

function lockChoices(box, q, chosen){
  Array.prototype.forEach.call(box.children, function(b){
    b.disabled = true;
    var t = b.textContent.slice(1);
    if(t === q.answer) b.classList.add("ok");
    else if(t === chosen) b.classList.add("no");
  });
}

function onPick(qi, chosen, box){
  var q = QUESTIONS[qi], s = state[qi];
  var ok = (chosen === q.answer);
  s.chosen = chosen;
  s.status = ok ? "ok" : "no";
  lockChoices(box, q, chosen);
  $("idk-btn").classList.add("hidden");
  if(q.sayAnswer) say(q.sayAnswer);
  var html = '<div class="fb ' + (ok?"ok":"no") + '">';
  html += '<b>' + (ok ? "정답이에요! ✅" : "아쉬워요 ❌") + '</b>  정답 — <b>' + q.answer + '</b><br>' + q.exp;
  html += '<span class="tip">👉 ' + q.tip + '</span></div>';
  $("feedback").innerHTML = html;
  $("next-btn").classList.remove("hidden");
  $("next-btn").textContent = (idx+1 >= order.length) ? "결과 보기 →" : "다음 문제 →";
}

function onIdk(qi){
  var q = QUESTIONS[qi], s = state[qi];
  if(phase === "main"){
    s.status = "idk"; s.wasIdk = true; s.chosen = "";
    idx++; step();
    return;
  }
  s.status = "idk"; s.chosen = "";
  lockChoices($("choices"), q, "");
  $("idk-btn").classList.add("hidden");
  $("feedback").innerHTML = '<div class="fb no"><b>괜찮아요, 여기는 같이 봐요 🙂</b>  정답 — <b>' + q.answer + '</b><br>' + q.exp + '<span class="tip">👉 ' + q.tip + '</span></div>';
  $("next-btn").classList.remove("hidden");
  $("next-btn").textContent = (idx+1 >= order.length) ? "결과 보기 →" : "다음 문제 →";
}

$("next-btn").onclick = function(){
  var prev = QUESTIONS[order[idx]];
  idx++;
  stopSay();
  if(phase==="main" && idx < order.length && QUESTIONS[order[idx]].sec !== prev.sec) fanfare();
  if(idx >= order.length) fanfare();
  step();
};

/* ═══════════ 결과 ═══════════ */
function finish(){
  stopSay();
  var total = QUESTIONS.length;
  var correct = state.filter(function(s){ return s.status==="ok"; }).length;
  var wrong = state.filter(function(s){ return s.status==="no"; });
  var idks  = state.filter(function(s){ return s.status==="idk"; });
  var recovered = state.filter(function(s){ return s.wasIdk && s.status==="ok"; }).length;
  var mins = Math.max(1, Math.round((Date.now()-startTime)/60000));

  show("result-card");
  window.scrollTo(0,0);
  $("score-line").textContent = "점수 " + correct + " / " + total;
  var sub = "틀림 " + wrong.length + "개 · 모름 " + idks.length + "개 · " + mins + "분";
  if(recovered) sub += "  |  다시 풀어서 맞힌 문항 " + recovered + "개 👏";
  $("score-sub").textContent = sub;

  var exps = $("explanations"); exps.innerHTML = "";
  state.forEach(function(s, i){
    var q = QUESTIONS[i];
    var cls = s.status==="ok" ? "" : (s.status==="idk" ? "idk" : "wrong");
    var head = "Q" + s.no + " [" + CONCEPTS[q.sec].label + "] · " +
      (s.status==="ok" ? (s.wasIdk ? "다시 풀어서 맞혔어요 👏" : "정답 ✅") : (s.status==="idk" ? "모름" : "틀림 ❌"));
    var d = document.createElement("div");
    d.className = "exp " + cls;
    d.dataset.ok = (s.status==="ok") ? "1" : "0";
    d.innerHTML = '<div class="head">' + head + '</div>' +
      (s.chosen ? '내 답 <b>' + s.chosen + '</b> / ' : '') + '정답 <b>' + q.answer + '</b><br>' +
      q.exp + '<div style="margin-top:7px;color:#6B7B7E;font-size:.85rem">※ ' + q.why + '</div>';
    exps.appendChild(d);
  });
  filterExp(true);

  /* 복사 텍스트 */
  var d = new Date(), dateStr = (d.getMonth()+1) + "/" + d.getDate();
  var lines = [];
  lines.push("[영핏] " + studentName + " · 오답클리닉(동아 5과) " + dateStr);
  lines.push("점수 " + correct + " / " + total + " · " + mins + "분 · 모름 " + idks.length);
  lines.push("");
  if(wrong.length){
    lines.push("틀린 문항 " + wrong.map(function(s){ return s.no + "번"; }).join(", "));
    wrong.forEach(function(s){
      var q = QUESTIONS[s.no-1];
      lines.push(s.no + "번 [" + CONCEPTS[q.sec].label + "] · 내 답 " + s.chosen + " / 정답 " + q.answer);
    });
    lines.push("");
  }
  if(idks.length){
    lines.push("모름 문항 " + idks.map(function(s){ return s.no + "번"; }).join(", "));
    idks.forEach(function(s){
      var q = QUESTIONS[s.no-1];
      lines.push(s.no + "번 [" + CONCEPTS[q.sec].label + "] · 모름 / 정답 " + q.answer);
    });
    lines.push("");
  }
  if(!wrong.length && !idks.length) lines.push("전부 맞혔어요! 🎉");
  if(recovered) lines.push("※ 처음엔 모름이었지만 다시 풀어 맞힌 문항 " + recovered + "개");
  window.__copyText = lines.join("\n").trim();
}

function filterExp(onlyWrong){
  Array.prototype.forEach.call($("explanations").children, function(d){
    d.style.display = (onlyWrong && d.dataset.ok==="1") ? "none" : "block";
  });
}
var expAll = false;
$("toggle-exp").onclick = function(){
  expAll = !expAll;
  filterExp(!expAll);
  this.textContent = expAll ? "틀린 것만 보기" : "전체 해설 보기";
};

$("copy-btn").onclick = function(){
  var t = window.__copyText || "";
  var btn = this;
  function done(){
    btn.textContent = "복사됐어요! 카톡에 붙여넣기 →";
    btn.style.background = "#2f9e6a";
    $("copy-msg").innerHTML = "카톡 대화창을 열고 <b>꾹 눌러 '붙여넣기'</b> 하면 돼요 🙂";
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done, function(){ fallback(t, done); });
  } else { fallback(t, done); }
};
function fallback(t, done){
  var ta = document.createElement("textarea");
  ta.value = t; ta.style.position="fixed"; ta.style.top="-1000px";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ alert(t); }
  document.body.removeChild(ta);
}
</script>
