<style>
:root{
  --navy:#1e2b55; --ink:#222a44; --sub:#5d6680; --paper:#f6f2e9; --card:#ffffff; --line:#e4dfd2;
  --org:#f4a100; --org-d:#b87400; --org-s:#fff1cf; --blue:#2f6fed; --blue-s:#e6eeff;
  --green:#178a5e; --green-s:#e2f5ec; --rose:#d2553f; --rose-s:#fdebe6; --hl:#ffe27a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--paper);color:var(--ink);
  font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;touch-action:manipulation}
.hidden{display:none !important}
#app{width:100%;max-width:780px;margin:0 auto;padding:10px 14px 90px;min-width:0}
#top{display:flex;align-items:center;gap:10px;padding:4px 2px 10px;flex-wrap:wrap}
.brand{font-weight:800;color:var(--navy);font-size:15px;white-space:nowrap}
.brand i{font-style:normal;color:var(--org-d)}
.prog{flex:1;min-width:60px;height:10px;background:#e7e1d3;border-radius:99px;overflow:hidden}
.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,#f7b733,var(--org));border-radius:99px;transition:width .4s}
.step{font-size:14px;font-weight:800;color:var(--sub);white-space:nowrap}
.snd{font-size:14px;font-weight:700;color:var(--navy);background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;white-space:nowrap}
.snd.off{color:#8a90a3;background:#eee9dd}
.card{background:var(--card);border-radius:22px;box-shadow:0 3px 18px rgba(30,43,85,.08);padding:20px 20px 22px;min-width:0;overflow-wrap:break-word;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:clamp(24px,5vw,30px);color:var(--navy);line-height:1.3;margin-bottom:10px;letter-spacing:-.4px}
.lead{font-size:17px;color:var(--sub);margin-bottom:14px}
.kick{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;font-weight:800;color:var(--org-d);margin-bottom:10px}
.kick .kt{background:var(--navy);color:#fff;border-radius:7px;padding:2px 9px;font-size:13px}
.qbox{background:#f7f8fc;border:1.5px solid #dfe4f2;border-radius:16px;padding:12px 14px;margin-bottom:10px}
.qbox .lb,.mine .lb,.why .lb,.wbox .lb{display:inline-block;font-size:13px;font-weight:800;border-radius:7px;padding:1px 8px;margin-bottom:6px}
.qbox .lb{background:var(--navy);color:#fff}
.qbox .qt{font-size:clamp(18px,3.6vw,21px);font-weight:700;color:var(--navy);line-height:1.55}
.cond{font-size:.82em;font-weight:600;color:var(--sub)}
.mine{background:var(--rose-s);border:1.5px solid #f3b8ad;border-radius:16px;padding:10px 14px;margin-bottom:12px}
.mine .lb{background:var(--rose);color:#fff}
.mine .mt{font-size:19px;font-weight:700;color:#8f2f1f}
.why{border-radius:16px;padding:12px 14px;background:#fffaf0;border:1.5px solid #f1d9a6;margin-bottom:12px}
.why .lb{background:var(--org);color:#fff}
.ln{font-size:clamp(18px,3.4vw,20px);line-height:1.6;padding:8px 10px 8px 40px;border-radius:12px;position:relative;opacity:.0;transform:translateX(-8px);transition:opacity .35s,transform .35s,background .3s}
.ln::before{content:attr(data-n);position:absolute;left:8px;top:10px;width:24px;height:24px;border-radius:50%;background:#ece7da;color:var(--sub);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ln.on{opacity:1;transform:none}
.ln.hot{background:var(--org-s)}
.ln.hot::before{background:var(--org);color:#fff}
.ln b.e{color:var(--navy)}
.ansline{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--green-s);border:1.5px solid #9fd9b4;font-size:clamp(19px,3.8vw,22px);font-weight:800;color:#0f5e40;opacity:0;transition:opacity .35s}
.ansline.on{opacity:1}
.ansline small{display:block;font-size:14px;font-weight:700;color:#2b7a57}
.vnote{font-size:13.5px;color:#8a6a2a;background:#fff6dc;border-radius:10px;padding:6px 12px;margin:6px 0;display:inline-block}
.vnote:empty{display:none}
.wbox{border-radius:16px;padding:14px;background:var(--blue-s);border:1.5px solid #c9d7fb}
.wbox .lb{background:var(--blue);color:#fff}
.wbox .ko{font-size:clamp(19px,3.8vw,22px);font-weight:800;color:var(--navy);margin:2px 0 4px}
.wbox .tip{font-size:15px;color:var(--sub);margin-bottom:10px}
.inrow{display:flex;gap:8px;align-items:stretch}
#ans-in{flex:1;min-width:0;font-family:inherit;font-size:20px;padding:12px 12px;border:2px solid #9fb3ea;border-radius:12px;background:#fff;color:var(--ink);outline:none}
#ans-in:focus{border-color:var(--blue)}
#ans-in.bad{border-color:var(--rose);animation:shake .3s}
#ans-in.good{border-color:var(--green);background:#f3fbf6}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#check-btn{flex:none;font-size:18px;font-weight:800;color:#fff;background:var(--blue);border-radius:12px;padding:0 16px;min-height:52px}
#check-btn:disabled{opacity:.5}
#fb{margin-top:10px;font-size:17px;line-height:1.55;min-height:1.2em}
#fb .bad{color:#a8331f;font-weight:700}
#fb .good{color:#0f5e40;font-weight:800}
#fb .show{display:block;margin-top:6px;padding:8px 10px;background:#fff;border-radius:10px;border:1.5px dashed #9fb3ea;font-size:19px;font-weight:800;color:var(--navy)}
.again{display:inline-block;margin-top:10px;font-size:15px;font-weight:700;color:var(--navy);background:#fff;border:1.5px solid #cfd6e8;border-radius:99px;padding:7px 14px}
#bar{position:fixed;left:0;right:0;bottom:0;background:rgba(246,242,233,.96);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:50}
#next-btn{display:block;width:100%;max-width:780px;margin:0 auto;font-size:19px;font-weight:800;color:#fff;background:var(--navy);border-radius:16px;padding:14px;min-height:56px}
#next-btn:disabled{background:#b9bfcf;color:#f4f5f8;cursor:default}
#next-btn.go{background:var(--green)}
.namein{width:100%;font-family:inherit;font-size:20px;padding:12px;border:2px solid var(--line);border-radius:12px;margin:6px 0 12px}
.bigbtn{display:block;width:100%;font-size:20px;font-weight:800;color:#fff;background:var(--navy);border-radius:16px;padding:15px;min-height:58px}
.howto{list-style:none;margin:6px 0 14px;padding:0}
.howto li{font-size:17px;padding:6px 0 6px 34px;position:relative}
.howto li::before{content:attr(data-n);position:absolute;left:0;top:7px;width:24px;height:24px;border-radius:50%;background:var(--org);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.score{text-align:center;font-size:52px;font-weight:800;color:var(--navy);line-height:1.1;margin:6px 0}
.score small{display:block;font-size:16px;color:var(--sub);font-weight:700;margin-top:4px}
#submit-status{text-align:center;font-size:16px;margin:8px 0 12px;min-height:1.4em;font-weight:700}
.sendbox{border:2.5px solid var(--org);background:#fff7ec;border-radius:18px;padding:14px 16px;margin-bottom:14px}
.sendbox .sb-h{font-size:19px;font-weight:800;color:var(--org-d);margin-bottom:6px}
.sendbox ol{margin:0 0 10px 1.3em;padding:0;font-size:17px;line-height:1.6;color:var(--navy)}
.rb{font-size:18px;font-weight:800;border-radius:16px;padding:14px;min-height:56px;background:var(--navy);color:#fff;width:100%}
.sendbox .rb.send{background:var(--org);color:#fff;font-size:19px;overflow-wrap:anywhere}
.sendbox .sb-n{font-size:16px;line-height:1.5;margin-top:10px;color:var(--navy)}
.rv-h{font-size:17px;font-weight:800;color:var(--navy);margin:4px 0 8px}
.rv{border:1.5px solid #e4dfd2;background:#fffdf8;border-radius:14px;padding:10px 12px;margin-bottom:8px}
.rv .st{font-size:13px;font-weight:800;color:var(--org-d)}
.rv .en{font-size:19px;font-weight:800;color:var(--navy)}
.rv .rl{font-size:15px;color:var(--sub)}
@media (max-width:420px){ .card{padding:16px 14px 18px} #app{padding:8px 10px 90px} .brand{display:none} }
</style>
</head>

<script>
"use strict";
/* ══════ 결과 전송 (영핏 공통 · engfit-quiz-results submit-code.js) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec"; // 2026-07-02 배포, 작동 확인됨

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    // Content-Type을 지정하지 않으면 text/plain → preflight 없이 전송됨 (Apps Script 호환)
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    // 응답을 못 읽는 환경(일부 인앱 브라우저) 대비: 발사 후 망각 모드로 재시도
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) {
      return false;
    }
  }
}

/* 결과 화면 안내 문구는 현재 규칙(카톡으로 꼭 보내기)에 맞춤 — lessonkit template 과 같음 */
var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return;
  _engfitSent = true;
  var el = document.getElementById("submit-status");
  if (el) { el.textContent = "아래 순서대로 결과를 꼭 보내 주세요"; el.style.color = "#c0392b"; }
  var ok = await engfitSubmit(r);
  if (el) {
    el.textContent = "카톡으로 결과를 꼭 보내 주세요!";
    el.style.color = "#c0392b";
  }
  return ok;
}

function showWrite() {
  stopAll(); clearLock();
  var it = ITEMS[idx];
  stage.innerHTML = '<div class="card">' +
    '<div class="kick"><span class="kt">' + (idx + 1) + "번</span>영작하기</div>" +
    '<div class="qbox"><span class="lb">원래 문제</span><div class="qt">' + it.q + "</div></div>" +
    '<div class="wbox"><span class="lb">바른 문장을 영어로 써요</span>' +
    '<div class="ko">' + esc(it.ko) + "</div>" +
    '<div class="tip">문장 전체를 한 줄에 써요. (대문자 · 마침표 · 물음표까지)</div>' +
    '<div class="inrow"><input id="ans-in" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="sentences" enterkeyhint="done" aria-label="영어 문장 쓰기">' +
    '<button id="check-btn" type="button">확인</button></div>' +
    '<div id="fb"></div></div>' +
    '<button class="again" id="again-btn" type="button">🔊 바른 문장 다시 듣기</button></div>';
  window.scrollTo(0, 0);
  $("again-btn").classList.add("hidden");
  setNext("바르게 쓰면 넘어가요", null, true);
  var inp = $("ans-in");
  $("check-btn").addEventListener("click", check);
  inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); check(); } });
  setTimeout(function () { try { inp.focus(); } catch (e) {} }, 150);
  speak("이제 바른 문장을 영어로 써 봐요.", "ko");
}
function check() {
  var it = ITEMS[idx], inp = $("ans-in"), fb = $("fb"), v = inp.value;
  if (!v.trim()) { inp.focus(); return; }
  if ($("check-btn").disabled) return;
  if (!tries) firstTry = v.trim();
  tries++;
  if (isRight(v, it)) {
    inp.classList.remove("bad"); inp.classList.add("good"); inp.readOnly = true;
    $("check-btn").disabled = true;
    fb.innerHTML = '<span class="good">잘했어요! 바르게 썼어요.</span>';
    answersLog.push({ no: idx + 1, ok: tries === 1, chosen: firstTry, answer: it.ans, tag: it.tag, tries: tries, src: it.u + " · " + it.sec, before: it.her });
    idx++; saveProgress();
    setNext(idx < ITEMS.length ? "다음 문제 ▶" : "결과 보기 ▶", function () { idx < ITEMS.length ? showExplain() : showResult(); }, true);
    var lk = lockNext(idx < ITEMS.length ? "다음 문제 ▶" : "결과 보기 ▶");
    stopAll();
    var tk = SP.token;
    speak("잘했어요!", "ko").then(function (g) { return g && speak(it.ans, "en"); }).then(function () { if (tk === SP.token) unlockNext(lk); });
    var ab = $("again-btn"); ab.classList.remove("hidden");
    ab.onclick = function () { stopAll(); speak(it.ans, "en"); };
    return;
  }
  inp.classList.remove("bad"); void inp.offsetWidth; inp.classList.add("bad");
  if (tries >= 3) {
    fb.innerHTML = '<span class="bad">괜찮아요. 바른 문장을 보고 그대로 따라 써 봐요.</span><span class="show">' + esc(it.ans) + "</span>";
    stopAll(); speak("괜찮아요. 바른 문장을 보고 그대로 따라 써 봐요.", "ko").then(function (g) { return g && speak(it.ans, "en"); });
  } else {
    fb.innerHTML = '<span class="bad">아쉬워요, 한 번 더 써 봐요.</span><br>' + hintFor(v, it);
    stopAll(); speak("아쉬워요, 힌트를 보고 한 번 더 써 봐요.", "ko");
  }
  inp.focus();
}

/* ── 결과 ── */
function showResult() {
  stopAll(); clearLock(); clearSaved();
  $("prog-bar").style.width = "100%"; $("step-label").textContent = "끝!";
  $("bar").classList.add("hidden");
  var correct = answersLog.filter(function (a) { return a.ok; }).length;
  var wrong = answersLog.filter(function (a) { return !a.ok; }).map(function (a) { return a.no; });
  var h = '<div class="card">' +
    '<div class="kick" style="justify-content:center"><span class="kt">결과</span>오답 설명 클리닉</div>' +
    '<h1 style="text-align:center">수고했어요, ' + esc(studentName) + "!</h1>" +
    '<div class="score" id="score-line">' + correct + " / " + ITEMS.length + "<small>한 번에 바르게 쓴 문장</small></div>" +
    '<div id="submit-status"></div>' +
    '<div class="sendbox"><div class="sb-h">[꼭 하기] 결과를 선생님께 보내요</div>' +
    '<ol><li>아래 <b>결과 복사하기</b> 버튼을 눌러요.</li><li>카톡 선생님 방에 <b>붙여 넣고 보내요.</b></li></ol>' +
    '<button class="rb send" id="kakao-btn" type="button">결과 복사하기</button>' +
    '<div class="sb-n">카톡을 못 쓰면 <b>이 결과 화면을 사진으로 찍어서</b> 선생님께 보여 주세요.</div></div>' +
    '<div class="rv-h">오늘 바르게 고쳐 쓴 문장</div><div id="review-list"></div></div>';
  stage.innerHTML = h; window.scrollTo(0, 0);
  var list = $("review-list");
  answersLog.forEach(function (a) {
    var it = ITEMS[a.no - 1], d = document.createElement("div");
    d.className = "rv";
    d.innerHTML = '<div class="st">' + a.no + "번 · " + esc(it.u) + " · " + (a.ok ? "한 번에 바르게 썼어요" : a.tries + "번 만에 바르게 썼어요") + '</div><div class="en">' + esc(it.ans) + '</div><div class="rl">' + esc(it.hint) + "</div>";
    list.appendChild(d);
  });
  $("kakao-btn").addEventListener("click", function () {
    var msg = "[" + QUIZ_TITLE + "]\n학생: " + studentName +
      "\n점수: " + correct + "/" + ITEMS.length + " (한 번에 바르게 쓴 문장)" +
      "\n다시 쓴 문항: " + (wrong.length ? wrong.join(", ") : "없음") +
      "\n모름: 없음";
    var done = function () { $("kakao-btn").textContent = "복사 완료! 이제 카톡에 붙여 넣고 보내요 ✓"; };
    try { navigator.clipboard.writeText(msg).then(done).catch(function () { prompt("아래 내용을 길게 눌러 복사하세요", msg); }); }
    catch (e) { prompt("아래 내용을 길게 눌러 복사하세요", msg); }
  });
  var payload = {
    quizId: QUIZ_ID,
    quizTitle: QUIZ_TITLE,
    student: studentName,
    score: correct,
    total: ITEMS.length,
    wrong: wrong,
    unknown: [],
    durationSec: elapsedBefore + Math.round((Date.now() - startTime) / 1000),
    detail: answersLog
  };
  if (TEACHER_MODE) { _engfitSent = true; var st = $("submit-status"); st.textContent = "(선생님 들어 보기 모드: 결과를 보내지 않아요)"; st.style.color = "#888"; }
  else engfitSubmitWithStatus(payload);
  wait(300).then(function (g) { if (g) speak("수고했어요! 결과 복사하기를 눌러서 카톡으로 선생님께 꼭 보내 주세요.", "ko"); });
}

$("snd-btn").addEventListener("click", function () {
  SP.muted = !SP.muted;
  this.textContent = SP.muted ? "소리 끔" : "🔊 소리 켬";
  this.classList.toggle("off", SP.muted);
  if (SP.muted && SP.ok) { try { window.speechSynthesis.cancel(); } catch (e) {} }
  voiceNote();
});
renderStart();
</script>
