<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>영핏 오답 클리닉 · 이하진 9/10</title>
<style>
  :root { --teal:#2F7C83; --teal-d:#235E64; --teal-l:#E6F1F1; --line:#DBE4E5; --text:#2B3A3D; --sub:#6B7B7E; --cream:#FFF6E8; --ok:#2E8B57; --ok-l:#E8F5EE; --no:#C0504D; --no-l:#FBECEB; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #EEF3F3; color: var(--text); min-height: 100vh; padding: 18px 14px 40px; line-height: 1.55; }
  button { font-family: inherit; cursor: pointer; -webkit-appearance: none; }
  .wrap { max-width: 540px; margin: 0 auto; }
  .brand { font-size: .8rem; font-weight: 700; color: var(--teal); letter-spacing: .04em; margin: 0 4px 8px; }
  .card { background: #fff; border-radius: 16px; padding: 24px 20px; box-shadow: 0 2px 12px rgba(35,94,100,.08); }
  .hidden { display: none !important; }
  h1 { font-size: 1.35rem; color: var(--teal-d); line-height: 1.35; margin-bottom: 6px; }
  h2 { font-size: 1.15rem; color: var(--teal-d); margin-bottom: 12px; line-height: 1.4; }
  .sub { color: var(--sub); font-size: .9rem; }
  .notice { background: var(--cream); border-radius: 10px; padding: 12px 14px; font-size: .9rem; margin: 16px 0; }
  .notice b { color: #9A5B12; }
  .info { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .pill { background: var(--teal-l); color: var(--teal-d); font-size: .82rem; font-weight: 700; padding: 5px 10px; border-radius: 999px; }
  input[type=text] { width: 100%; padding: 14px; font-size: 1.05rem; border: 1.5px solid var(--line); border-radius: 10px; font-family: inherit; }
  input[type=text]:focus { outline: none; border-color: var(--teal); }
  .btn { display: block; width: 100%; margin-top: 16px; padding: 15px; font-size: 1.05rem; font-weight: 700; color: #fff; background: var(--teal); border: none; border-radius: 12px; }
  .btn:active { background: var(--teal-d); }
  .btn:disabled { background: #B8C6C7; }
  .btn.ghost { background: #fff; color: var(--teal-d); border: 1.5px solid var(--line); margin-top: 10px; padding: 11px; font-size: .95rem; }
  /* 진행 */
  .topbar { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; color: var(--sub); margin-bottom: 6px; }
  .corner-tag { font-weight: 700; color: var(--teal); }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
  .bar i { display: block; height: 100%; background: var(--teal); width: 0; transition: width .3s; }
  /* 개념 카드 */
  .lesson p { margin-bottom: 10px; }
  .row { border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; margin-bottom: 9px; }
  .row .k { font-weight: 700; color: var(--teal-d); }
  .row .ex { font-size: .92rem; color: var(--sub); margin-top: 3px; }
  .ex b, .row b { color: var(--text); }
  .tag { display: inline-block; min-width: 26px; text-align: center; font-size: .78rem; font-weight: 700; border-radius: 6px; padding: 1px 6px; margin-right: 6px; color: #fff; }
  .S { background: #3A7BD5; } .V { background: #D9534F; } .O { background: #E0922F; } .C { background: #2E8B57; } .M { background: #8A96A0; }
  .s { color: #3A7BD5; font-weight: 700; } .v { color: #D9534F; font-weight: 700; } .o { color: #C77A1A; font-weight: 700; } .c { color: #2E8B57; font-weight: 700; } .m { color: #8A96A0; font-weight: 700; }
  .key { background: var(--teal-l); border-radius: 10px; padding: 12px 14px; font-weight: 700; color: var(--teal-d); margin-top: 12px; }
  .bad { color: var(--no); font-weight: 700; } .good { color: var(--ok); font-weight: 700; }
  /* 문제 */
  .qno { font-size: .85rem; font-weight: 700; color: var(--teal); margin-bottom: 4px; }
  .qtext { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
  .qsent { font-size: 1.08rem; background: #F6F9F9; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; line-height: 1.7; }
  .qsent u { text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .choice { display: flex; align-items: flex-start; width: 100%; text-align: left; padding: 13px 14px; margin-bottom: 9px; font-size: 1rem; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; color: var(--text); }
  .choice .n { color: var(--teal); font-weight: 700; margin-right: 8px; flex-shrink: 0; }
  .choice.right { background: var(--ok-l); border-color: var(--ok); }
  .choice.wrong { background: var(--no-l); border-color: var(--no); }
  .choice:disabled { cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 10px 13px; font-size: 1rem; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; color: var(--text); }
  .chip.picked { background: var(--teal-l); border-color: var(--teal); }
  .chip.right { background: var(--ok-l); border-color: var(--ok); }
  .chip.wrong { background: var(--no-l); border-color: var(--no); }
  .answer-line { min-height: 58px; border: 2px dashed var(--line); border-radius: 12px; padding: 8px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .answer-line .ph { color: #A9B5B7; font-size: .9rem; padding-left: 6px; }
  .bank-label { font-size: .82rem; color: var(--sub); margin: 4px 0 8px; }
  /* 피드백 */
  .fb { border-radius: 12px; padding: 14px; margin-top: 16px; font-size: .95rem; }
  .fb.ok { background: var(--ok-l); border-left: 5px solid var(--ok); }
  .fb.no { background: var(--no-l); border-left: 5px solid var(--no); }
  .fb .head { font-weight: 800; font-size: 1.05rem; margin-bottom: 6px; }
  .fb.ok .head { color: var(--ok); } .fb.no .head { color: var(--no); }
  .fb .ans { margin-bottom: 8px; }
  .fb .tip { background: #fff; border-radius: 8px; padding: 9px 11px; font-weight: 700; color: var(--teal-d); margin-bottom: 8px; }
  /* 결과 */
  .score-big { font-size: 2.6rem; font-weight: 800; color: var(--teal-d); text-align: center; margin: 8px 0 2px; }
  .time { text-align: center; color: var(--sub); margin-bottom: 12px; }
  .copy-btn { font-size: 1.15rem; padding: 18px; background: #F2B705; color: #3A2A00; }
  .copy-btn:active { background: #D9A300; }
  .copy-btn.done { background: var(--ok); color: #fff; }
  .copy-guide { text-align: center; font-size: .92rem; color: var(--sub); margin-top: 8px; }
  #copy-fallback { width: 100%; height: 150px; margin-top: 10px; font-size: .9rem; padding: 10px; border-radius: 10px; border: 1.5px solid var(--line); }
  .rev { border-left: 4px solid var(--ok); background: #F7FAF9; border-radius: 8px; padding: 10px 12px; margin-bottom: 9px; font-size: .9rem; }
  .rev.x { border-left-color: var(--no); }
  .rev .t { font-weight: 700; }
  .rev.x .t { color: var(--no); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">ENG FIT · 영어를 핏하다</div>

  <!-- 시작 -->
  <div class="card" id="start-card">
    <h1>하진이의 오답 클리닉</h1>
    <p class="sub">Unit 140 분사의 역할 · 문장 형식 기초부터 차근차근</p>
    <div class="info">
      <span class="pill">개념 카드 5장</span>
      <span class="pill">문제 12개</span>
      <span class="pill">약 15분</span>
    </div>
    <div class="notice"><b>중간에 나가면 답이 사라져요.</b><br>한 번에 다 풀어주세요!</div>
    <input type="text" id="name-input" placeholder="이름을 써주세요" maxlength="20" autocomplete="off">
    <button class="btn" id="start-btn" disabled>시작하기</button>
  </div>

  <!-- 진행 화면 -->
  <div class="card hidden" id="step-card">
    <div class="topbar"><span class="corner-tag" id="corner-tag"></span><span id="count"></span></div>
    <div class="bar"><i id="bar"></i></div>
    <div id="step-body"></div>
  </div>

  <!-- 결과 -->
  <div class="card hidden" id="result-card">
    <h1 style="text-align:center">수고했어, 하진아!</h1>
    <div class="score-big" id="score-line"></div>
    <div class="time" id="time-line"></div>
    <button class="btn copy-btn" id="copy-btn">결과 복사</button>
    <p class="copy-guide" id="copy-guide">카톡으로 지나티처에게 붙여넣어 보내주세요</p>
    <textarea id="copy-fallback" class="hidden" readonly></textarea>
    <h2 style="margin-top:26px">다시 보기</h2>
    <div id="review"></div>
  </div>
</div>

<script>
"use strict";
var QUIZ_ID = "clinic-leehajin-0910";
var QUIZ_LABEL = "오답클리닉 9/10";

/* ═════════ 개념 카드 + 문제 ═════════ */
var STEPS = [
  { type: "lesson", corner: "기초 1", html:
    '<h2>문장을 만드는 부품 4개</h2>' +
    '<p>영어 문장은 레고처럼 <b>부품</b>을 끼워서 만들어요. 오늘은 부품 이름부터 알고 가자!</p>' +
    '<div class="row"><span class="tag S">주어</span><span class="k">누가 · 무엇이 (은/는/이/가)</span><div class="ex"><span class="s">My sister</span> plays the piano.</div></div>' +
    '<div class="row"><span class="tag V">동사</span><span class="k">~하다 · ~이다 → 문장마다 딱 하나!</span><div class="ex">My sister <span class="v">plays</span> the piano.</div></div>' +
    '<div class="row"><span class="tag O">목적어</span><span class="k">~을 / ~를</span><div class="ex">My sister plays <span class="o">the piano</span>.</div></div>' +
    '<div class="row"><span class="tag C">보어</span><span class="k">주어나 목적어가 어떤 상태인지 채워주는 말</span><div class="ex">She looks <span class="c">tired</span>. → 그녀 = 피곤한 상태<br>빼면 "She looks." 문장이 허전해져요.</div></div>' +
    '<div class="row"><span class="tag M">꾸밈말</span><span class="k">빼도 문장이 멀쩡한 말</span><div class="ex">My sister plays the piano <span class="m">in her room</span>.</div></div>'
  },
  { type: "lesson", corner: "기초 2", html:
    '<h2>1~5형식 = 부품 조립법 5가지</h2>' +
    '<div class="row"><span class="k">1형식</span> &nbsp;<span class="tag S">S</span><span class="tag V">V</span><div class="ex">Birds <span class="v">fly</span>. 새들이 난다.</div></div>' +
    '<div class="row"><span class="k">2형식</span> &nbsp;<span class="tag S">S</span><span class="tag V">V</span><span class="tag C">C</span><div class="ex"><span class="s">She</span> <span class="v">looks</span> <span class="c">tired</span>. → <b>주어 = 보어</b> (그녀 = 피곤한)</div></div>' +
    '<div class="row"><span class="k">3형식</span> &nbsp;<span class="tag S">S</span><span class="tag V">V</span><span class="tag O">O</span><div class="ex">I <span class="v">love</span> <span class="o">pizza</span>. 나는 피자를 좋아한다.</div></div>' +
    '<div class="row"><span class="k">4형식</span> &nbsp;<span class="tag S">S</span><span class="tag V">V</span><span class="tag O">O</span><span class="tag O">O</span><div class="ex">I <span class="v">gave</span> <span class="o">her</span> <span class="o">an egg</span>. 그녀<b>에게</b> 달걀<b>을</b> 줬다.</div></div>' +
    '<div class="row"><span class="k">5형식</span> &nbsp;<span class="tag S">S</span><span class="tag V">V</span><span class="tag O">O</span><span class="tag C">C</span><div class="ex">I <span class="v">found</span> <span class="o">my car</span> <span class="c">covered</span> with snow. → <b>목적어 = 보어</b> (차 = 덮인)</div></div>' +
    '<div class="key">보어가 나오는 건 2형식과 5형식뿐!<br>분사(-ing, p.p.)는 바로 이 보어 자리에도 들어가요.</div>'
  },
  { type: "lesson", corner: "코너 A", html:
    '<h2>코너 A · 진짜 동사 찾기</h2>' +
    '<p>동사는 <b>문장에 딱 하나</b>. 현재·과거 같은 <b>시제</b>를 가진 말이 진짜 동사예요. (is, are, was, plays, found ...)</p>' +
    '<p><b>-ing</b>나 <b>p.p.</b>(taken, written)는 <b>혼자서는 동사가 못 돼요.</b> 앞 명사를 꾸미는 꾸밈말일 뿐!</p>' +
    '<div class="row"><div class="ex" style="margin:0"><span class="s">The dog</span> <span class="m">sleeping on the sofa</span> <span class="v">is</span> Coco.<br>소파에서 자고 있는 개는 코코다.</div></div>' +
    '<div class="row"><div class="ex" style="margin:0"><span class="bad">×</span> The dog <b>is</b> sleeping on the sofa Coco.<br>→ is를 앞으로 끌어오면 뒤에 Coco가 둥둥 떠서 문장이 깨져요.</div></div>' +
    '<div class="key">주어 덩어리(명사 + 꾸밈말)가 다 끝난 뒤에 진짜 동사!</div>'

  { type: "tap", corner: "코너 A", no: 1,
    q: "진짜 동사를 눌러보세요.",
    tokens: ["The boy", "wearing", "a blue cap", "is", "my cousin."],
    answer: "is",
    tip: "시제가 있는 말이 진짜 동사. -ing 혼자서는 동사가 못 된다.",
    exp: "wearing a blue cap은 The boy를 꾸미는 꾸밈말이에요. 시제(현재)를 가진 <b>is</b>가 진짜 동사! → 파란 모자를 쓰고 있는 소년은 내 사촌이다." },
  { type: "mc", corner: "코너 A", no: 2,
    q: "동사가 있어서 <b>완전한 문장</b>이 된 것은?",
    choices: ["The fallen leaves covering the ground.", "The fallen leaves covered the ground.", "The leaves fallen on the ground.", "The fallen leaves on the ground."],

    tip: "-ing나 p.p.만 있고 시제 있는 동사가 없으면 문장이 아니다.",
    exp: "covered는 '덮었다'라는 과거 동사 → 떨어진 나뭇잎들이 땅을 덮었다. 나머지 셋은 '땅을 덮고 있는 나뭇잎들', '땅에 떨어진 나뭇잎들'처럼 <b>이름만 길어졌을 뿐</b> '~했다'가 없어서 문장이 끝나지 않아요." },
  { type: "order", corner: "코너 A", no: 3,
    q: "우리말에 맞게 배열하세요.",
    ko: "빨간 모자를 쓰고 있는 소녀는 내 여동생이다.",
    chunks: ["is", "The girl", "a red cap", "wearing", "my sister."],
    answer: "The girl wearing a red cap is my sister.",
    tip: "주어 덩어리(The girl wearing a red cap)가 끝난 뒤에 동사 is.",
    exp: "'빨간 모자를 쓰고 있는 소녀는'까지가 주어 → The girl wearing a red cap. 그다음 동사 is, 마지막에 my sister. <span class='bad'>The girl is wearing a red cap my sister.</span>는 동사 뒤에 명사가 둥둥 떠서 틀려요." },
  { type: "order", corner: "코너 A", no: 4,
    q: "우리말에 맞게 배열하세요.",
    ko: "나는 제주도에서 찍은 사진들이 있다.",
    chunks: ["taken", "I", "in Jeju.", "photos", "have"],
    answer: "I have photos taken in Jeju.",
    tip: "'~이 있다' → have가 동사, taken은 photos를 꾸미는 말.",
    exp: "<span class='bad'>I have taken photos in Jeju.</span>는 '제주도에서 사진을 찍었다'라는 다른 뜻이에요. 우리말은 '찍은 사진들이 <b>있다</b>' → I <b>have</b>(가지고 있다) + photos taken in Jeju(제주도에서 찍힌 사진들)." },

  { type: "lesson", corner: "코너 B", html:
    '<h2>코너 B · 분사가 어느 자리에 있니?</h2>' +
    '<p>분사의 역할은 <b>자리</b>를 보면 알 수 있어요.</p>' +
    '<div class="row"><span class="k">① 주어 뒤, 진짜 동사 앞 → 명사수식</span><div class="ex">The man <span class="m">standing at the door</span> <span class="v">is</span> my dad.<br>빼도 "The man is my dad." 멀쩡!</div></div>' +
    '<div class="row"><span class="k">② 동사 바로 뒤 → 주격보어 (2형식)</span><div class="ex">He <span class="v">stood</span> <span class="c">waiting</span> for me. → 그 = 기다리는 상태<br>sit · stand · look · lie 뒤에 잘 나와요.</div></div>' +

  { type: "mc", corner: "코너 B", no: 6,

    sent: "The girls <u>dancing</u> on the stage are my classmates.",
    choices: ["명사수식", "주격보어", "목적격보어"],
    answer: "명사수식",

    choices: ["명사수식", "주격보어", "목적격보어"],
    answer: "목적격보어",

  { type: "order", corner: "코너 B", no: 8,
    q: "우리말에 맞게 배열하세요.",
    ko: "그는 그의 심장이 빠르게 뛰는 것을 느꼈다.",
    chunks: ["his heart", "He", "fast.", "felt", "beating"],
    answer: "He felt his heart beating fast.",
    tip: "5형식 순서 고정: 동사(felt) → 목적어(his heart) → 보어(beating).",
    exp: "심장이 뛰는 중이니까 beating. <span class='bad'>felt beating his heart</span>처럼 보어를 목적어 앞에 두면 틀려요. 참고 · '빠르게'는 <b>fast</b> (fastly라는 단어는 없어요), '심장'은 <b>heart</b>." },

  { type: "lesson", corner: "코너 C", html:
    '<h2>코너 C · -ing냐 p.p.냐?</h2>' +
    '<p>분사 앞에 있는 명사 뒤에 <b>숨은 be동사</b>를 넣어서 읽어 보세요.</p>' +
    '<div class="row"><span class="k">명사가 직접 하면 → -ing</span><div class="ex">the boy (is) <span class="c">running</span> → 소년이 달린다 <span class="good">○</span></div></div>' +
    '<div class="row"><span class="k">명사가 당하면 · 되면 → p.p.</span><div class="ex">the door (is) <span class="c">repaired</span> → 문이 고쳐진다 <span class="good">○</span><br>the door (is) repairing → 문이 무언가를 고친다?? <span class="bad">×</span></div></div>' +
    '<div class="row"><div class="ex" style="margin:0">I made the door <b>repaired</b>. &nbsp;/&nbsp; The fruits <b>sold</b> at the market are fresh.<br>문 · 과일 · 사진 · 기회 같은 <b>사물</b> 뒤에 -ing가 오면 한 번 의심!</div></div>' +
    '<div class="key">명사가 "하는" 거야, "당하는" 거야?</div>'
  },
  { type: "mc", corner: "코너 C", no: 9,
    q: "빈칸에 알맞은 말은?",
    sent: "I had my bike ______ yesterday. <span class='sub'>(fix)</span>",
    choices: ["fixed", "fixing", "fixes", "to fix"],
    answer: "fixed",
    tip: "my bike (is) fixed → 자전거가 고쳐진다 ○",
    exp: "자전거는 스스로 고칠 수 없죠. 누가 고쳐준 거니까 <b>fixed</b> → 나는 어제 자전거를 수리 받았다. fixing을 넣으면 '자전거가 무언가를 고친다'가 돼요." },
  { type: "mc", corner: "코너 C", no: 10,
    q: "빈칸에 알맞은 말은?",
    sent: "The bags ______ in Italy are very expensive. <span class='sub'>(make)</span>",
    choices: ["made", "making", "makes", "to make"],
    answer: "made",
    tip: "the bags (are) made → 가방이 만들어진다 ○ / 가방이 만든다 ×",
    exp: "진짜 동사는 are. 빈칸은 The bags를 꾸미는 자리예요. 가방은 '만들어진' 것 → <b>made</b> in Italy(이탈리아에서 만들어진 가방들). makes를 넣으면 동사가 2개가 돼서 틀려요." },
  { type: "mc", corner: "코너 C", no: 11,
    q: "빈칸에 들어갈 말이 순서대로 짝지어진 것은?",
    sent: "(a) Listen to the sound of ______ rain. <span class='sub'>(fall)</span><br>(b) A ______ chance never comes back. <span class='sub'>(lose)</span>",
    choices: ["falling - lost", "fallen - losing", "falling - losing", "fallen - lost"],
    answer: "falling - lost",
    tip: "비는 직접 내린다 → falling / 기회는 잃어버림을 당한다 → lost",
    exp: "(a) rain (is) falling → 비가 내리고 있다 ○ → 내리는 빗소리를 들어봐.<br>(b) chance (is) lost → 기회가 잃어버려졌다 ○ → 놓친 기회는 다시 오지 않는다. 기회가 뭔가를 잃는 게 아니죠!" },
  { type: "mc", corner: "코너 C", no: 12,
    q: "밑줄 친 부분이 어법상 <b>틀린</b> 것은?",
    choices: ["I found a letter <u>written</u> in French.", "Look at the baby <u>sleeping</u> on the bed.", "The man <u>called</u> Tom is my uncle.", "She showed me a photo <u>taking</u> in Paris."],
    answer: "She showed me a photo <u>taking</u> in Paris.",
    tip: "사진은 찍히는 것 → taken. 사물 뒤 -ing는 한 번 의심!",
    exp: "a photo (is) taking → 사진이 찍는다?? × → <b>a photo taken in Paris</b>(파리에서 찍은 사진).<br>나머지는 모두 맞아요: 편지가 쓰여진(written) ○ / 아기가 자는(sleeping) ○ / 남자가 Tom이라고 불리는(called) ○" }
];

/* ═════════ 상태 ═════════ */
var QUESTIONS = STEPS.filter(function (s) { return s.type !== "lesson"; });
var TOTAL = QUESTIONS.length;
var studentName = "", stepIdx = 0, startTime = 0, finished = false;
var log = []; // {no, ok, chosen, answer}

function $(id) { return document.getElementById(id); }
function plain(html) { var d = document.createElement("div"); d.innerHTML = html; return d.textContent.replace(/\s+/g, " ").trim(); }
function norm(s) { return s.replace(/\s+/g, " ").trim(); }
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function shuffleNotSame(arr) { if (arr.length < 2) return arr.slice(); var a; var tries = 0; do { a = shuffle(arr); tries++; } while (a.join("|") === arr.join("|") && tries < 10); return a; }
var CIRCLED = ["①", "②", "③", "④", "⑤"];

$("name-input").addEventListener("input", function () { $("start-btn").disabled = $("name-input").value.trim().length === 0; });
$("start-btn").addEventListener("click", function () {
  studentName = $("name-input").value.trim();
  if (!studentName) return;
  startTime = Date.now();
  $("start-card").classList.add("hidden");
  $("step-card").classList.remove("hidden");
  renderStep();
});
window.addEventListener("beforeunload", function (e) {
  if (startTime && !finished) { e.preventDefault(); e.returnValue = ""; }
});

function renderStep() {
  var s = STEPS[stepIdx];
  $("corner-tag").textContent = s.corner;
  $("count").textContent = s.type === "lesson" ? "개념 카드" : "문제 " + s.no + " / " + TOTAL;
  $("bar").style.width = Math.round((log.length / TOTAL) * 100) + "%";
  var body = $("step-body");
  body.innerHTML = "";
  window.scrollTo(0, 0);
  if (s.type === "lesson") {
    var wrap = document.createElement("div"); wrap.className = "lesson"; wrap.innerHTML = s.html;
    var b = document.createElement("button"); b.className = "btn"; b.id = "next-btn"; b.textContent = "알겠어요, 다음 →";
    b.addEventListener("click", next);
    body.appendChild(wrap); body.appendChild(b);
    return;
  }
  var head = document.createElement("div");
  head.innerHTML = '<div class="qno">Q' + s.no + '</div><div class="qtext">' + s.q + '</div>' +
    (s.sent ? '<div class="qsent">' + s.sent + '</div>' : '') +
    (s.ko ? '<div class="qsent">' + s.ko + '</div>' : '');
  body.appendChild(head);
  if (s.type === "mc") renderMC(s, body);
  else if (s.type === "tap") renderTap(s, body);
  else if (s.type === "order") renderOrder(s, body);
}

function renderMC(s, body) {
  var box = document.createElement("div"); box.id = "choices";
  var order = shuffle(s.choices);
  order.forEach(function (c, i) {
    var b = document.createElement("button");
    b.className = "choice"; b.dataset.value = c;
    b.innerHTML = '<span class="n">' + CIRCLED[i] + '</span><span>' + c + '</span>';
    b.addEventListener("click", function () {
      if (box.dataset.locked) return; box.dataset.locked = "1";
      var ok = c === s.answer;
      Array.prototype.forEach.call(box.children, function (el) {
        el.disabled = true;
        if (el.dataset.value === s.answer) el.classList.add("right");
        else if (el === b) el.classList.add("wrong");
      });
      record(s, ok, plain(c), plain(s.answer), body);
    });
    box.appendChild(b);
  });
  body.appendChild(box);
}

function renderTap(s, body) {
  var box = document.createElement("div"); box.className = "chips qsent"; box.id = "tokens";
  s.tokens.forEach(function (t) {
    var b = document.createElement("button"); b.className = "chip"; b.textContent = t; b.dataset.value = t;
    b.addEventListener("click", function () {
      if (box.dataset.locked) return; box.dataset.locked = "1";
      var ok = t === s.answer;
      Array.prototype.forEach.call(box.children, function (el) {
        el.disabled = true;
        if (el.dataset.value === s.answer) el.classList.add("right");
        else if (el === b) el.classList.add("wrong");
      });
      record(s, ok, t, s.answer, body);
    });
    box.appendChild(b);
  });
  body.appendChild(box);
}

function renderOrder(s, body) {
  var line = document.createElement("div"); line.className = "answer-line"; line.id = "answer-line";
  var label = document.createElement("div"); label.className = "bank-label"; label.textContent = "단어를 순서대로 눌러요 · 잘못 넣은 건 다시 누르면 빠져요";
  var bank = document.createElement("div"); bank.className = "chips"; bank.id = "bank";
  var checkBtn = document.createElement("button"); checkBtn.className = "btn"; checkBtn.id = "check-btn"; checkBtn.textContent = "확인"; checkBtn.disabled = true;
  var picked = [];
  var locked = false;
  function draw() {
    line.innerHTML = "";
    if (!picked.length) line.innerHTML = '<span class="ph">여기에 문장이 만들어져요</span>';
    picked.forEach(function (idx, pos) {
      var c = document.createElement("button"); c.className = "chip picked"; c.textContent = s.chunks[idx];
      c.addEventListener("click", function () { if (locked) return; picked.splice(pos, 1); draw(); });
      line.appendChild(c);
    });
    Array.prototype.forEach.call(bank.children, function (el) {
      el.classList.toggle("hidden", picked.indexOf(+el.dataset.idx) !== -1);
    });
    checkBtn.disabled = picked.length !== s.chunks.length;
  }
  shuffleNotSame(s.chunks.map(function (_, i) { return i; })).forEach(function (idx) {
    var b = document.createElement("button"); b.className = "chip"; b.textContent = s.chunks[idx]; b.dataset.idx = idx;
    b.addEventListener("click", function () { if (locked) return; picked.push(idx); draw(); });
    bank.appendChild(b);
  });
  checkBtn.addEventListener("click", function () {
    if (locked || picked.length !== s.chunks.length) return;
    locked = true;
    var built = norm(picked.map(function (i) { return s.chunks[i]; }).join(" "));
    var ok = built === norm(s.answer);
    Array.prototype.forEach.call(line.children, function (el) { el.disabled = true; el.classList.add(ok ? "right" : "wrong"); });
    bank.classList.add("hidden"); label.classList.add("hidden"); checkBtn.classList.add("hidden");
    record(s, ok, built, s.answer, body);
  });
  body.appendChild(line); body.appendChild(label); body.appendChild(bank); body.appendChild(checkBtn);
  draw();
}

function record(s, ok, chosen, answer, body) {
  log.push({ no: s.no, ok: ok, chosen: chosen, answer: answer, tip: s.tip });
  $("bar").style.width = Math.round((log.length / TOTAL) * 100) + "%";
  var fb = document.createElement("div");
  fb.className = "fb " + (ok ? "ok" : "no"); fb.id = "feedback";
  fb.innerHTML = '<div class="head">' + (ok ? "○ 정답!" : "× 아쉬워요") + '</div>' +
    (ok ? "" : '<div class="ans">정답 · <b>' + answer + '</b></div>') +
    '<div class="tip">' + s.tip + '</div><div>' + s.exp + '</div>';
  var b = document.createElement("button"); b.className = "btn"; b.id = "next-btn";
  b.textContent = stepIdx === STEPS.length - 1 ? "결과 보기 →" : "다음 →";
  b.addEventListener("click", next);
  body.appendChild(fb); body.appendChild(b);
  fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function next() {
  stepIdx++;
  if (stepIdx < STEPS.length) renderStep(); else showResult();
}

function minutes() { return Math.max(1, Math.round((Date.now() - startTime) / 60000)); }

function buildResultText() {
  var score = log.filter(function (l) { return l.ok; }).length;
  var wrong = log.filter(function (l) { return !l.ok; });
  var lines = [
    "[영핏] " + studentName + " · " + QUIZ_LABEL,
    "점수 " + score + " / " + TOTAL + " · " + minutes() + "분",
    ""
  ];
  if (!wrong.length) lines.push("틀린 문항 없음");
  else {
    lines.push("틀린 문항 " + wrong.map(function (w) { return w.no + "번"; }).join(", "));
    wrong.forEach(function (w) { lines.push(w.no + "번 · 내 답 " + w.chosen + " / 정답 " + w.answer); });
  }
  return lines.join("\n");
}

var resultText = "";
function showResult() {
  finished = true;
  $("step-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  window.scrollTo(0, 0);
  var score = log.filter(function (l) { return l.ok; }).length;
  $("score-line").textContent = score + " / " + TOTAL;
  $("time-line").textContent = minutes() + "분 걸렸어요";
  resultText = buildResultText();
  var rev = $("review");
  log.forEach(function (l) {
    var d = document.createElement("div");
    d.className = "rev" + (l.ok ? "" : " x");
    d.innerHTML = '<div class="t">Q' + l.no + (l.ok ? " ○" : " × · 내 답 " + escapeHtml(l.chosen)) + '</div>' +
      (l.ok ? "" : '<div>정답 · ' + escapeHtml(l.answer) + '</div>') + '<div>' + l.tip + '</div>';
    rev.appendChild(d);
  });
}
function escapeHtml(t) { return t.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

function copyDone() {
  var b = $("copy-btn");
  b.textContent = "복사됐어요! 카톡에 붙여넣기 →";
  b.classList.add("done");
  $("copy-guide").textContent = "카톡 열고 지나티처 대화창에 붙여넣기 해서 보내주세요";
}
function legacyCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "-1000px";
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}
function showFallback(text) {
  var f = $("copy-fallback");
  f.value = text; f.classList.remove("hidden"); f.focus(); f.select();
  $("copy-guide").textContent = "자동 복사가 안 됐어요. 아래 글을 길게 눌러 전체 복사해서 카톡으로 보내주세요";
}
$("copy-btn").addEventListener("click", function () {
  var text = resultText || buildResultText();
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(copyDone).catch(function () {
      if (legacyCopy(text)) copyDone(); else showFallback(text);
    });
  } else if (legacyCopy(text)) copyDone();
  else showFallback(text);
});
</script>
