<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>정혜인 개념 수업 ① be동사 am·is·are 11/11</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
  :root {
    --ink: #1e2b55; --ink2: #4d5873; --mute: #8a90a3;
    --bg: #f4f2ec; --card: #ffffff; --line: #e4e1d7; --soft: #f7f6f1;
    --acc: #f4a100; --acc-soft: #fff2cf; --blue: #2f6fd6; --blue-soft: #e8f0fd;
    --ok: #1f7a5a; --ok-soft: #e3f3ec; --bad: #c0392b; --bad-soft: #fcebe8;
    --idk: #b9770e; --idk-soft: #fdf3e2; --hl: #ffe39a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--ink);
         -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; word-break: keep-all; overflow-wrap: break-word; }
  button { font-family: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  .hidden { display: none !important; }

  /* ---------- 틀 ---------- */
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 1040px; margin: 0 auto; }
  header { padding: 14px 24px 6px; }
  .bar { height: 10px; background: #e5e2d8; border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 99px; transition: width .35s ease; }
  .hrow { display: flex; align-items: center; gap: 12px; margin-top: 12px; min-height: 48px; }
  .htitle { flex: 1; font-size: clamp(19px, 2.5vw, 25px); font-weight: 800; line-height: 1.3; }
  .count { font-size: 15px; color: var(--mute); font-weight: 600; white-space: nowrap; }
  .kt { display: inline-block; font-size: .72em; font-weight: 700; color: var(--ink); border: 1.5px solid #c9cde0; border-radius: 7px;
        padding: 1px 7px 2px; margin-right: 6px; vertical-align: .12em; background: #fff; letter-spacing: -.01em; }
  .kt.o { color: #9a6400; border-color: #f4c766; background: #fff8e6; }
  .relisten { border: 1.5px solid #cfd3e2; background: #fff; border-radius: 999px; padding: 10px 16px; font-size: 16px; font-weight: 700; white-space: nowrap; min-height: 48px; }
  .relisten:active { background: #eef0f7; }
  .vnote { margin-top: 8px; font-size: 14px; color: #8a5a00; background: var(--acc-soft); border-radius: 10px; padding: 7px 12px; }
  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 24px 14px; }
  footer { display: flex; gap: 12px; padding: 10px 24px calc(14px + env(safe-area-inset-bottom)); }
  .nav { min-height: 64px; border-radius: 16px; font-size: 21px; font-weight: 800; border: none; }
  .nav.prev { flex: 0 0 28%; background: #fff; border: 2px solid #d6d9e5; color: var(--ink2); }
  .nav.next { flex: 1; background: var(--ink); color: #fff; }
  .nav:disabled { opacity: .35; cursor: default; }
  .nav.next.ready { animation: ready 1.6s ease-in-out infinite; }
  @keyframes ready { 0%,100% { box-shadow: 0 0 0 0 rgba(30,43,85,.35); } 50% { box-shadow: 0 0 0 9px rgba(30,43,85,0); } }

  .slide { animation: enter .35s ease both; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ---------- 시작 ---------- */
  .start { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 0; }
  .scard { width: 100%; max-width: 640px; background: var(--card); border-radius: 26px; padding: 36px 34px 30px; box-shadow: 0 6px 30px rgba(30,43,85,.08); }
  .s-k { font-size: 16px; color: var(--ink2); font-weight: 700; margin-bottom: 10px; }
  .s-t { font-size: clamp(28px, 4vw, 38px); font-weight: 800; line-height: 1.25; margin-bottom: 18px; }
  .greet { font-size: clamp(21px, 2.7vw, 25px); line-height: 1.55; background: var(--acc-soft); border-radius: 18px; padding: 18px 20px; margin-bottom: 22px; font-weight: 600; }
  .lbl { display: block; font-size: 15px; color: var(--ink2); font-weight: 700; margin-bottom: 6px; }
  .name { width: 100%; padding: 15px 16px; font-size: 21px; font-family: inherit; color: var(--ink); border: 2px solid #d6d9e5; border-radius: 14px; background: #fff; }
  .name:focus { outline: none; border-color: var(--ink); }
  .go { display: block; width: 100%; margin-top: 18px; min-height: 72px; font-size: 25px; font-weight: 800; color: #fff; background: var(--ink); border: none; border-radius: 18px; }
  .go:disabled { background: #b9bdcc; }
  .hint { margin-top: 16px; font-size: 15px; color: var(--ink2); line-height: 1.65; }
  .hint b { color: var(--ink); }

  /* ---------- 설명 ---------- */
  .exp { display: grid; gap: 18px; grid-template-columns: 1fr; align-items: start; }
  @media (min-width: 900px) and (min-aspect-ratio: 1/1) { .exp { grid-template-columns: 44fr 56fr; gap: 26px; } }
  .lines { display: flex; flex-direction: column; gap: 10px; }
  .ln { font-size: clamp(19px, 2.3vw, 23px); line-height: 1.6; padding: 10px 14px 10px 16px; border-radius: 14px; border-left: 5px solid transparent;
        opacity: .38; transition: opacity .3s, background .3s, border-color .3s; }
  .ln.done { opacity: 1; }
  .ln.now { opacity: 1; background: #fff; border-left-color: var(--acc); box-shadow: 0 2px 12px rgba(30,43,85,.07); }
  .ln b { color: var(--ink); font-weight: 800; }
  .en-i { font-weight: 700; color: var(--blue); }
  .vis { background: var(--card); border-radius: 22px; padding: 22px; box-shadow: 0 3px 18px rgba(30,43,85,.06); }
  .rv { opacity: 0; transform: translateY(10px); transition: opacity .45s ease, transform .45s ease; }
  .rv.on { opacity: 1; transform: none; }
  .lit { background: var(--acc-soft) !important; box-shadow: inset 0 0 0 2.5px var(--acc) !important; }
  table.rt { width: 100%; border-collapse: separate; border-spacing: 0 8px; font-size: clamp(17px, 2vw, 20px); }
  table.rt th { font-size: 14px; color: var(--mute); text-align: left; font-weight: 700; padding: 0 12px; }
  table.rt td { background: var(--soft); padding: 12px; line-height: 1.45; transition: background .3s, box-shadow .3s; }
  table.rt td:first-child { border-radius: 12px 0 0 12px; }
  table.rt td:last-child { border-radius: 0 12px 12px 0; }
  table.rt tr.lit td { background: var(--acc-soft); }
  table.rt tr.lit td:first-child { box-shadow: inset 4px 0 0 var(--acc); }
  .big { font-size: 1.35em; font-weight: 800; color: var(--ink); }
  .eg { font-size: .9em; color: var(--ink2); }
  .eg b, .ensent b { color: var(--blue); }
  .cards3 { display: grid; gap: 10px; }
  .mcard { background: var(--soft); border-radius: 14px; padding: 14px 16px; transition: background .3s, box-shadow .3s; }
  .mcard .mk { font-size: 15px; font-weight: 800; color: var(--ink2); margin-bottom: 4px; }
  .mcard .me { font-size: clamp(19px, 2.3vw, 23px); font-weight: 600; }
  .mcard .mko { font-size: 15px; color: var(--mute); margin-top: 2px; }
  .chips { display: flex; gap: 12px; justify-content: center; margin-top: 16px; }
  .chip { font-size: 28px; font-weight: 800; background: var(--ink); color: #fff; border-radius: 14px; padding: 8px 22px; }
  .routine { margin-top: 16px; border: 2px dashed #cdd1e0; border-radius: 16px; padding: 12px 14px; font-size: 14.5px; line-height: 1.55; color: var(--ink2); }
  .routine .rh { font-weight: 800; color: var(--ink); margin-bottom: 6px; font-size: 15.5px; }
  .routine .st { display: inline; border-radius: 6px; padding: 1px 3px; transition: background .3s; }
  .routine .st.lit { box-shadow: none !important; font-weight: 800; color: var(--ink); }
  .ensent { font-size: clamp(21px, 2.6vw, 26px); font-weight: 600; line-height: 1.5; }
  .arrow { text-align: center; font-size: 26px; color: var(--mute); margin: 4px 0; }
  .ins { display: inline-block; color: #fff; background: var(--acc); border-radius: 8px; padding: 0 8px; font-weight: 800; }
  .rv.on .ins, .rv.on .fly { animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; }
  .fly { display: inline-block; color: #fff !important; background: var(--blue); border-radius: 8px; padding: 0 8px; }
  .rv.on .fly { animation: flyin .8s cubic-bezier(.2,1.2,.4,1) both; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes flyin { from { transform: translateX(180px); opacity: 0; } to { transform: none; opacity: 1; } }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .pill { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: clamp(17px, 2vw, 20px); text-align: center; }
  .warnline { margin-top: 12px; font-size: 16px; color: var(--ink2); background: var(--soft); border-radius: 12px; padding: 10px 12px; line-height: 1.5; }
  .xo { display: grid; gap: 10px; }
  .xo div { font-size: clamp(18px, 2.2vw, 21px); line-height: 1.45; padding: 10px 12px; border-radius: 12px; background: var(--soft); }
  .x { color: var(--bad); font-weight: 800; margin-right: 6px; }
  .o { color: var(--ok); font-weight: 800; margin-right: 6px; }
  s { color: var(--bad); text-decoration-thickness: 2px; }
  .colh { font-size: 15px; font-weight: 800; color: var(--ink2); margin-bottom: 6px; }
  .sbox { border-radius: 14px; padding: 12px 14px; background: var(--soft); transition: background .3s, box-shadow .3s; }
  .send { color: var(--bad); font-weight: 800; transition: opacity .6s, color .4s; }
  .rv.on.gone .send, .gone .send { opacity: .25; text-decoration: line-through; }
  .sin { color: var(--acc); font-weight: 900; }

  /* ---------- 예문 ---------- */
  .tools { display: flex; align-items: center; justify-content: flex-end; margin: -10px -24px 10px; padding: 10px 24px 8px; position: sticky; top: -10px; z-index: 5; background: var(--bg); }
  .toggle { border: 2px solid #d6d9e5; background: #fff; border-radius: 999px; padding: 10px 18px; font-size: 17px; font-weight: 800; color: var(--ink2); min-height: 50px; }
  .toggle[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .exs { display: flex; flex-direction: column; gap: 12px; }
  .ex { background: var(--card); border-radius: 20px; padding: 14px 18px; box-shadow: 0 3px 16px rgba(30,43,85,.05); border: 2.5px solid transparent; opacity: .55; transition: opacity .3s, border-color .3s; }
  .ex { scroll-margin-top: 80px; }
  .ex.active { opacity: 1; border-color: var(--acc); }
  .ex.done { opacity: 1; }
  .en { display: flex; align-items: flex-start; gap: 14px; }
  .spk { flex: 0 0 auto; width: 56px; height: 56px; border-radius: 50%; border: 2px solid #d6d9e5; background: #fff; font-size: 24px; line-height: 1; }
  .spk:active, .spk.playing { background: var(--acc-soft); border-color: var(--acc); }
  .sent { font-size: clamp(24px, 3vw, 31px); font-weight: 700; line-height: 1.6; padding-top: 4px; }
  .w { border-radius: 7px; transition: background .12s; padding: 0 1px; }
  .w.now { background: var(--hl); }
  .sent.speaking { color: var(--ink); }
  .sent.speaking.nob { background: linear-gradient(transparent 62%, var(--hl) 62%); }
  .grp { position: relative; display: inline; border-radius: 999px; transition: box-shadow .45s ease, background .45s; }
  .grp.subj { padding: 0 3px; }
  .ex.mk-subj .grp.subj { box-shadow: 0 0 0 3px var(--blue); background: var(--blue-soft); }
  .grp.verb { background-image: linear-gradient(var(--acc), var(--acc)); background-repeat: no-repeat; background-position: 0 100%; background-size: 0% 5px;
              transition: background-size .7s ease; border-radius: 0; padding-bottom: 3px; }
  .ex.mk-verb .grp.verb { background-size: 100% 5px; }
  .end { transition: color .4s; }
  .ex.mk-verb .end { color: var(--acc); }
  .ko { margin: 6px 0 0 70px; font-size: clamp(17px, 2vw, 20px); color: var(--ink2); opacity: 0; transition: opacity .4s; }
  .pt { margin: 8px 0 0 70px; font-size: clamp(17px, 2vw, 20px); line-height: 1.55; color: var(--ink); background: var(--soft); border-radius: 12px; padding: 8px 12px; opacity: 0; transition: opacity .4s; }
  .pt .ptn { opacity: .35; transition: opacity .3s; }
  .pt .ptn.on { opacity: 1; }
  .ex.show-ko .ko, .ex.show-pt .pt { opacity: 1; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 15px; color: var(--ink2); }
  .lg-s { display: inline-block; border: 3px solid var(--blue); border-radius: 999px; padding: 0 8px; background: var(--blue-soft); font-weight: 700; }
  .lg-v { display: inline-block; border-bottom: 5px solid var(--acc); font-weight: 700; }

  /* ---------- 헷갈렸던 문장 ---------- */
  .mine { background: var(--card); border-radius: 24px; padding: 26px 26px 22px; box-shadow: 0 3px 18px rgba(30,43,85,.06); max-width: 860px; margin: 0 auto; }
  .mh { font-size: 19px; font-weight: 800; margin-bottom: 18px; }
  .mrow { display: flex; align-items: center; gap: 14px; font-size: clamp(25px, 3.3vw, 34px); font-weight: 700; line-height: 1.5; background: var(--bad-soft); border-radius: 18px; padding: 18px 20px; transition: background .5s; }
  .mrow .mk { flex: 0 0 auto; width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900; color: #fff; background: var(--bad); transition: background .5s, transform .5s; }
  .mrow .mk .mo { display: none; }
  .msent { flex: 1; }
  .sw { display: inline-flex; flex-direction: column; vertical-align: bottom; position: relative; }
  .wr { color: var(--bad); transition: opacity .5s; position: relative; }
  .wr::after { content: ''; position: absolute; left: -2px; right: -2px; top: 52%; height: 4px; background: var(--bad); transform: scaleX(0); transform-origin: left; transition: transform .6s ease; }
  .rt2 { color: var(--ok); font-weight: 900; max-height: 0; overflow: hidden; opacity: 0; transition: max-height .6s ease, opacity .6s ease; }
  .mine.s1 .wr { background: #ffd8d1; border-radius: 8px; }
  .mine.s2 .wr::after { transform: scaleX(1); }
  .mine.s3 .wr { display: none; }
  .mine.s3 .rt2 { max-height: 60px; opacity: 1; animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; }
  .mine.s3 .mrow { background: var(--ok-soft); }
  .mine.s3 .mrow .mk { background: var(--ok); transform: rotate(360deg); }
  .mine.s3 .mrow .mk .mx { display: none; }
  .mine.s3 .mrow .mk .mo { display: inline; }
  .mine .why { margin-top: 18px; font-size: clamp(18px, 2.2vw, 21px); line-height: 1.65; color: var(--ink2); opacity: .35; transition: opacity .4s; }
  .mine .why.on { opacity: 1; color: var(--ink); }
  .mine .bookbox { margin-top: 18px; font-size: 15px; color: var(--mute); }
  .mine .again { margin-top: 16px; display: flex; gap: 12px; align-items: center; font-size: 18px; color: var(--ink2); }

  /* ---------- 풀기 ---------- */
  .intro { max-width: 720px; margin: 0 auto; background: var(--card); border-radius: 24px; padding: 30px; box-shadow: 0 3px 18px rgba(30,43,85,.06); }
  .intro h2 { font-size: clamp(25px, 3vw, 31px); margin-bottom: 14px; }
  .intro p { font-size: clamp(18px, 2.2vw, 21px); line-height: 1.7; margin-bottom: 10px; }
  .q { max-width: 820px; margin: 0 auto; }
  .qk { font-size: clamp(20px, 2.5vw, 24px); font-weight: 800; line-height: 1.5; margin-bottom: 14px; }
  .qs { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border-radius: 20px; padding: 18px 20px; margin-bottom: 16px; box-shadow: 0 3px 16px rgba(30,43,85,.05); }
  .qs .sent { font-size: clamp(24px, 3vw, 31px); }
  .qh { font-size: .75em; color: var(--mute); font-weight: 600; }
  .blank { display: inline-block; min-width: 3.2em; border-bottom: 3px solid var(--ink); text-align: center; color: var(--ok); transition: background .3s; border-radius: 4px 4px 0 0; }
  .blank.pulse { background: var(--hl); }
  .choices { display: grid; gap: 12px; }
  .choice { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; min-height: 70px; padding: 14px 18px; font-size: clamp(20px, 2.5vw, 24px); font-weight: 600;
            background: var(--card); border: 2.5px solid #dcdfe9; border-radius: 16px; line-height: 1.4; transition: background .2s, border-color .2s; }
  .choice .num { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; background: var(--soft); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px; color: var(--ink2); }
  .choice:active { background: var(--soft); }
  .choice.right { border-color: var(--ok); background: var(--ok-soft); }
  .choice.picked { border-color: var(--bad); background: var(--bad-soft); }
  .choice:disabled { cursor: default; }
  .typerow { display: flex; gap: 12px; }
  .typein { flex: 1; min-width: 0; font-family: inherit; font-size: clamp(23px, 2.8vw, 28px); font-weight: 700; color: var(--ink); padding: 14px 18px; border: 2.5px solid #d6d9e5; border-radius: 16px; background: #fff; }
  .typein:focus { outline: none; border-color: var(--ink); }
  .typein.shake { animation: shake .35s; }
  @keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .typeok { flex: 0 0 auto; min-width: 120px; border: none; border-radius: 16px; background: var(--ink); color: #fff; font-size: 21px; font-weight: 800; }
  .typeok:disabled { opacity: .4; }
  .idk { display: block; width: 100%; margin-top: 14px; min-height: 60px; padding: 12px; font-size: 19px; font-weight: 700; color: #555; background: #fff; border: 2.5px dashed #b9c0cc; border-radius: 16px; }
  .idk:active { background: #f1f1f1; }
  .idk:disabled { opacity: .45; }
  .fb { margin-top: 16px; border-radius: 18px; padding: 16px 18px; font-size: clamp(18px, 2.2vw, 21px); line-height: 1.6; background: var(--card); border-left: 7px solid var(--ok); box-shadow: 0 3px 16px rgba(30,43,85,.06); animation: enter .3s ease both; }
  .fb.wrong { border-left-color: var(--blue); }
  .fb.unknown { border-left-color: var(--idk); }
  .fb .fh { font-weight: 800; margin-bottom: 4px; }
  .fb .full { display: flex; align-items: center; gap: 12px; margin-top: 10px; font-size: clamp(20px, 2.5vw, 24px); font-weight: 700; }
  .fb .full .spk { width: 48px; height: 48px; font-size: 20px; }
  .keyhint { margin-top: 10px; font-size: 14px; color: var(--mute); text-align: center; }

  /* ---------- 결과 ---------- */
  .res { max-width: 820px; margin: 0 auto; }
  .rcard { background: var(--card); border-radius: 24px; padding: 28px; box-shadow: 0 3px 18px rgba(30,43,85,.06); margin-bottom: 16px; }
  .score { text-align: center; font-size: clamp(44px, 6vw, 58px); font-weight: 900; margin: 6px 0; }
  .score small { font-size: .38em; color: var(--idk); font-weight: 800; }
  #submit-status { text-align: center; font-size: 16px; margin: 10px 0 4px; min-height: 1.3em; }
  .rbtns { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-top: 14px; }
  .rbtn { min-height: 64px; border-radius: 16px; font-size: 19px; font-weight: 800; border: none; background: var(--ink); color: #fff; }
  .rbtn.sec { background: #fff; color: var(--ink); border: 2px solid #d6d9e5; }
  .rv-h { font-size: 21px; font-weight: 800; margin-bottom: 12px; }
  .ritem { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-top: 1px solid var(--line); }
  .ritem:first-of-type { border-top: none; }
  .ritem .spk { width: 50px; height: 50px; font-size: 21px; }
  .ritem .rs { font-size: clamp(20px, 2.4vw, 23px); font-weight: 700; line-height: 1.45; }
  .ritem .rr { font-size: 16px; color: var(--ink2); line-height: 1.55; margin-top: 3px; }
  .ritem .rtag { font-size: 14px; color: var(--mute); font-weight: 700; margin-bottom: 2px; }
  .ritem.unknown .rtag { color: var(--idk); }
  .empty { font-size: 18px; color: var(--ink2); line-height: 1.6; }

  @media (max-width: 600px) {
    header, main, footer { padding-left: 16px; padding-right: 16px; }
    .scard { padding: 26px 20px; }
    .ko, .pt { margin-left: 0; }
    .rbtns { grid-template-columns: 1fr; }
    .two { grid-template-columns: 1fr; }
    .nav.prev { flex-basis: 30%; }
  }
  @media (max-height: 700px) and (min-width: 900px) {
    .ex { padding: 12px 18px; } .exs { gap: 10px; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="hdr" class="hidden">
    <div class="bar"><i id="bar"></i></div>
    <div class="hrow">
      <div class="htitle" id="htitle"></div>
      <span class="count" id="count"></span>
      <button class="relisten" id="relisten" type="button">🔊 다시 듣기</button>
    </div>
    <div class="vnote hidden" id="vnote"></div>
  </header>
  <main id="main"></main>
  <footer id="ftr" class="hidden">

/* ══════ 도우미 ══════ */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function strip(h) { var d = document.createElement("div"); d.innerHTML = h; return (d.textContent || "").replace(/\s+/g, " ").trim(); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/* 한국어 설명 안의 영어는 영어 목소리로 읽기: "주어가 he, she면" → [ko 주어가][en he, she][ko 면] */
function segs(say, shown) {
  if (say) return say.map(function (s) { return s.indexOf("en:") === 0 ? { lang: "en", text: s.slice(3) } : { lang: "ko", text: s }; });
  var t = strip(shown), out = [];
  var re = /[A-Za-z][A-Za-z'’ ,.?!\-]*[A-Za-z.?!']|[A-Za-z]/g, last = 0, m;
  while ((m = re.exec(t))) {
    if (m.index > last) out.push({ lang: "ko", text: t.slice(last, m.index) });
    out.push({ lang: "en", text: m[0] });
    last = m.index + m[0].length;
  }
  if (last < t.length) out.push({ lang: "ko", text: t.slice(last) });
  return out.filter(function (s) { return /[A-Za-z가-힣0-9]/.test(s.text); })
            .map(function (s) { s.text = s.text.replace(/^[\s,.·→]+|[\s,·→]+$/g, ""); return s; });
}

/* ══════ 읽어 주기 (Web Speech API) ══════ */
var Speech = (function () {
  var syn = window.speechSynthesis || null;
  var api = !!(syn && window.SpeechSynthesisUtterance);
  var voice = { ko: null, en: null };
  var dead = { ko: !api, en: !api };
  var listed = false, token = 0;
  var PREF = {
    en: [/google us english/i, /samantha/i, /natural/i, /enhanced/i, /premium/i, /neural/i, /online/i, /google/i, /ava|allison|aria|jenny|nicky/i],
    ko: [/natural/i, /enhanced|premium|neural/i, /online/i, /google/i, /yuna|sora|heami|sunhi|injoon/i]
  };
  function best(list, prefs) {
    var top = null, topScore = -1;
    list.forEach(function (v) {
      var s = 0;
      for (var i = 0; i < prefs.length; i++) if (prefs[i].test(v.name)) { s = prefs.length - i; break; }
      if (v.localService === false) s += 0.5;
      if (s > topScore) { top = v; topScore = s; }
    });
    return top;
  }
  function pick() {
    if (!api) return;
    var vs = syn.getVoices() || [];
    if (!vs.length) return;
    listed = true;
    var ko = vs.filter(function (v) { return /^ko/i.test(v.lang); });
    var us = vs.filter(function (v) { return /^en[-_]US/i.test(v.lang); });
    var en = us.length ? us : vs.filter(function (v) { return /^en/i.test(v.lang); });
    voice.ko = best(ko, PREF.ko); voice.en = best(en, PREF.en);
    if (!voice.ko) markDead("ko"); else dead.ko = false;
    if (!voice.en) markDead("en"); else dead.en = false;
  }
  var onNote = function () {};
  function markDead(lang) { if (!dead[lang]) { dead[lang] = true; } onNote(); }
  if (api) {
    pick();
    if (syn.addEventListener) syn.addEventListener("voiceschanged", pick); else syn.onvoiceschanged = pick;
    var polls = 0, poll = setInterval(function () { if (listed || ++polls > 16) { clearInterval(poll); if (!listed) pick(); } else pick(); }, 250);
  }
  function estimate(lang, text, rate) {
    var ms = lang === "ko" ? Math.max(900, text.length * 105) : Math.max(700, text.split(/\s+/).length * 400);
    return ms / (rate || 1);
  }
  function speakOne(st, tk) {
    return new Promise(function (resolve) {
      var rate = st.rate || (st.lang === "ko" ? 1.0 : 0.9);
      var est = estimate(st.lang, st.text, rate);
      var fin = false;
      function done() { if (!fin) { fin = true; clearTimeout(t1); clearTimeout(t2); if (st.onend) st.onend(); resolve(); } }
      var t1 = 0, t2 = 0;
      if (dead[st.lang]) {           /* 목소리가 없으면 소리 없이 같은 순서로 진행 */
        if (st.onstart) st.onstart(false);
        t2 = setTimeout(done, est);
        return;
      }
      var u = new SpeechSynthesisUtterance(st.text);
      var v = voice[st.lang];
      u.lang = v ? v.lang : (st.lang === "ko" ? "ko-KR" : "en-US");
      if (v) u.voice = v;
      u.rate = rate; u.pitch = 1; u.volume = 1;
      var started = false, forced = false;
      u.onstart = function () { started = true; if (st.onstart) st.onstart(true); };
      u.onboundary = function (e) { if (st.onboundary) st.onboundary(e); };
      u.onend = function () { if (!forced) done(); };
      u.onerror = function (e) {
        if (forced) return;
        if (!started && e && e.error && e.error !== "interrupted" && e.error !== "canceled") markDead(st.lang);
        done();
      };
      /* 3초 안에 시작을 안 하면 그 언어 목소리가 없는 것으로 보고 조용히 진행 */
      t1 = setTimeout(function () {
        if (started || fin || tk !== token) return;
        forced = true; markDead(st.lang); try { syn.cancel(); } catch (e) {}
        if (st.onstart) st.onstart(false);
        t2 = setTimeout(done, est);
      }, 3000);
      t2 = setTimeout(done, est * 2.5 + 5000);   /* onend가 안 오는 브라우저 대비 */
      try { syn.speak(u); } catch (e) { markDead(st.lang); forced = true; t2 = setTimeout(done, est); }
    });
  }
  function run(steps) {
    var tk = ++token;
    if (api) { try { syn.cancel(); } catch (e) {} }
    return (async function () {
      await wait(api ? 120 : 0);
      for (var i = 0; i < steps.length; i++) {
        if (tk !== token) return false;
        var s = steps[i];
        if (s.fn) { s.fn(); continue; }
        if (s.pause) { await wait(s.pause); continue; }
        if (!s.text) continue;
        await speakOne(s, tk);
        if (tk !== token) return false;
        await wait(s.gap == null ? 160 : s.gap);
      }
      return tk === token;
    })();
  }
  function stop() { token++; if (api) { try { syn.cancel(); } catch (e) {} } }
  function unlock() {          /* 첫 터치 때 한 번 (iPad·iPhone 소리 잠금 풀기) */
    if (!api) return;
    try { var u = new SpeechSynthesisUtterance(" "); u.volume = 0; u.lang = "en-US"; syn.speak(u); } catch (e) {}
    pick();
  }
  return { run: run, stop: stop, unlock: unlock, dead: dead, api: api, setNote: function (f) { onNote = f; } };
})();

var dotbak = false;   /* 「한 번 더 또박또박」 켜짐 */
function enRate() { return dotbak ? 0.75 : 0.9; }

function showVoiceNote() {
  var n = $("#vnote"), msg = "";
  if (!Speech.api || (Speech.dead.ko && Speech.dead.en)) msg = "이 기기에서는 읽어 주는 소리가 나오지 않아요. 글을 보면서 똑같이 진행하면 돼요.";
  else if (Speech.dead.ko) msg = "이 기기에는 한국어 목소리가 없어요. 설명은 글로 보고, 영어 문장은 소리로 들어요.";
  else if (Speech.dead.en) msg = "이 기기에는 영어 목소리가 없어요. 영어 문장은 글로 보면서 진행해요.";
  if (msg) { n.textContent = msg; n.classList.remove("hidden"); } else n.classList.add("hidden");

/* 영어 문장 표시: [주어] {동사} , {wash^es} = 끝 글자 강조 */
function parseMarked(src) {
  var toks = src.split(" "), html = "", plain = [], words = [], pos = 0;
  toks.forEach(function (tok, k) {
    var open = null, close = false;
    if (tok.charAt(0) === "[") { open = "subj"; tok = tok.slice(1); }
    else if (tok.charAt(0) === "{") { open = "verb"; tok = tok.slice(1); }
    if (/[\]\}]$/.test(tok)) { close = true; tok = tok.slice(0, -1); }
    if (open) html += '<span class="grp ' + open + '">';
    var text = tok.replace("^", ""), inner;
    if (tok.indexOf("^") >= 0) { var p = tok.split("^"); inner = esc(p[0]) + '<span class="end">' + esc(p[1]) + "</span>"; }
    else inner = esc(tok);
    html += '<span class="w">' + inner + "</span>";
    if (close) html += "</span>";
    if (k < toks.length - 1) html += " ";
    words.push({ start: pos, len: text.length }); pos += text.length + 1; plain.push(text);
  });
  return { html: html, plain: plain.join(" "), words: words };
}

/* 영어 문장 읽기 + 단어 따라 칠하기 (onboundary 없으면 문장 전체 칠하기) */
function enSteps(sentEl, plain, words, rate) {
  var ws = $$(".w", sentEl), gotB = false;
  function clear() { ws.forEach(function (w) { w.classList.remove("now"); }); sentEl.classList.remove("speaking", "nob"); }
  return [{
    lang: "en", text: plain, rate: rate || enRate(),
    onstart: function () { clear(); sentEl.classList.add("speaking"); gotB = false;
      setTimeout(function () { if (!gotB && sentEl.classList.contains("speaking")) sentEl.classList.add("nob"); }, 700); },
    onboundary: function (e) {
      if (e.name && e.name !== "word") return;
      gotB = true; sentEl.classList.remove("nob");
      var ci = e.charIndex, hit = 0;
      for (var i = 0; i < words.length; i++) if (words[i].start <= ci) hit = i;
      ws.forEach(function (w, i) { w.classList.toggle("now", i === hit); });
    },
    onend: clear
  }];
}

function setHeader(tag, title) {
  $("#htitle").innerHTML = (tag ? '<span class="kt">' + tag + "</span>" : "") + title;
  var total = SL.length - 1, at = Math.min(cur, total);
  $("#bar").style.width = Math.round(at / total * 100) + "%";
  var c = $("#count"), s = SL[cur];
  c.textContent = s.type === "item" ? (s.n + 1) + " / " + L.items.length : "";
}
function setNav(o) {
  var f = $("#ftr"), p = $("#prev"), n = $("#next");
  f.classList.toggle("hidden", !o);
  if (!o) return;
  p.classList.toggle("hidden", !o.prev);
  p.disabled = o.prev === "off";
  n.classList.toggle("hidden", !o.next);
  n.textContent = o.next || "다음";
  n.classList.remove("ready");
}
function ready() { $("#next").classList.add("ready"); }

var narr = null;   /* 지금 화면의 설명 읽기 함수 */
function go(i) {
  Speech.stop();
  cur = i; narr = null;
  main.scrollTop = 0;
  var s = SL[i];
  $("#hdr").classList.toggle("hidden", s.type === "start");
  $("#relisten").classList.toggle("hidden", s.type === "start" || s.type === "result");
  main.innerHTML = "";
  var el = document.createElement("div");
  el.className = "slide";
  main.appendChild(el);
  R[s.type](s, el);
  if (narr) narr();
}
function next() {
  var s = SL[cur];
  if (replay && cur + 1 >= LESSON_END) { replay = false; go(SL.length - 1); return; }
  if (s.type === "item" && !answers[s.n]) return;
  if (cur < SL.length - 1) go(cur + 1);
}
function prev() {
  var s = SL[cur];
  if (s.type === "item" || s.type === "result" || s.type === "start") return;
  if (cur > 1) go(cur - 1);
}
$("#next").addEventListener("click", next);
$("#prev").addEventListener("click", prev);
$("#relisten").addEventListener("click", function () { go(cur); });

/* 설명 화면: 문장마다 읽기 + 그 문장 칠하기 + 그림 바꾸기 */
function act(el, a) {
  if (!a) return;
  a.split(";").forEach(function (x) {
    x = x.trim(); if (!x) return;
    var k = x.split(":")[0], sel = x.slice(k.length + 1);
    if (k === "hl") { $$(".lit", el).forEach(function (n) { n.classList.remove("lit"); }); if (sel) $$(sel, el).forEach(function (n) { n.classList.add("lit"); }); }
    else if (k === "on") $$(sel, el).forEach(function (n) { n.classList.add("on"); });
    else if (k === "cls") { var p = sel.split("+"); $$(p[0], el).forEach(function (n) { n.classList.add(p[1]); }); }
  });
}
R.explain = function (s, el) {

    '</div><div class="vis">' + d.vis + "</div></div>";
  var lns = $$(".ln", el);
  narr = function () {
    lns.forEach(function (n) { n.classList.remove("now", "done"); });
    act(el, "hl:");
    $$(".rv", el).forEach(function (n) { n.classList.remove("on"); });
    $$(".gone", el).forEach(function (n) { n.classList.remove("gone"); });
    var steps = [];
    d.lines.forEach(function (l, i) {
      segs(l.say, l.t).forEach(function (sg, j) {
        if (j === 0) sg.onstart = function () {
          lns.forEach(function (n, k) { n.classList.toggle("now", k === i); if (k < i) n.classList.add("done"); });
          act(el, l.a);
        };
        if (sg.lang === "en") sg.rate = 0.9;
        steps.push(sg);
      });
      steps.push({ pause: 250 });
    });
    steps.push({ fn: function () {
      lns.forEach(function (n) { n.classList.remove("now"); n.classList.add("done"); });
      $$(".rv", el).forEach(function (n) { n.classList.add("on"); });

};

    }).join("") + "</div>";
  var exs = $$(".ex", el), lastI = 0;
  function reset(i) { var e = exs[i]; e.classList.remove("active", "mk-subj", "mk-verb", "show-ko", "show-pt"); $$(".ptn", e).forEach(function (p) { p.classList.remove("on"); }); }
  function stepsFor(i, withPoint) {
    var e = exs[i], x = d.items[i], st = [];
    st.push({ fn: function () { lastI = i; exs.forEach(function (o, k) { o.classList.toggle("active", k === i); }); e.scrollIntoView({ block: "nearest", behavior: "smooth" }); } });
    st = st.concat(enSteps($(".sent", e), parsed[i].plain, parsed[i].words));
    st.push({ fn: function () { e.classList.add("show-ko"); } }, { pause: 350 });
    if (withPoint) {
      st.push({ fn: function () { e.classList.add("show-pt"); } });
      x.pt.forEach(function (p, k) {
        segs(p[2] || null, p[0]).forEach(function (sg, j) {
          if (j === 0) sg.onstart = function () {
            $$(".ptn", e)[k].classList.add("on");
            if (p[1]) p[1].split(",").forEach(function (m) { e.classList.add("mk-" + m); });
          };
          if (sg.lang === "en") sg.rate = 0.9;
          st.push(sg);
        });
      });
      st.push({ fn: function () { e.classList.remove("active"); e.classList.add("done"); } }, { pause: 300 });
    }
    return st;
  }
  narr = function () {
    exs.forEach(function (e, i) { reset(i); e.classList.remove("done"); });
    var steps = [];
    d.items.forEach(function (x, i) { steps = steps.concat(stepsFor(i, true)); });
    steps.push({ fn: function () { exs.forEach(function (e) { e.classList.add("done", "show-ko", "show-pt", "mk-subj", "mk-verb"); $$(".ptn", e).forEach(function (p) { p.classList.add("on"); }); }); ready(); } });
    Speech.run(steps);
  };
  function playOne(i) {
    var e = exs[i];
    var keep = e.classList.contains("done");
    Speech.run(enSteps($(".sent", e), parsed[i].plain, parsed[i].words).concat([{ fn: function () {
      e.classList.add("show-ko"); if (keep) e.classList.add("done");
      exs.forEach(function (o) { o.classList.remove("active"); });
      lastI = i;
    } }]));
    exs.forEach(function (o, k) { o.classList.toggle("active", k === i); });
  }
  exs.forEach(function (e, i) { $(".spk", e).addEventListener("click", function (ev) { ev.stopPropagation(); playOne(i); }); });
  var tg = $(".toggle", el);
  tg.addEventListener("click", function () {
    dotbak = !dotbak; tg.setAttribute("aria-pressed", String(dotbak));
    if (dotbak) playOne(lastI);
  });
};

    '<div class="why">' + d.why + "</div>" +

  var box = $(".mine", el), why = $(".why", el);

  function speakGood() { return { lang: "en", text: good, rate: enRate() }; }
  narr = function () {
    box.classList.remove("s1", "s2", "s3"); why.classList.remove("on");
    var steps = [];
    d.say.forEach(function (l) {
      segs(l.say, l.t).forEach(function (sg, j) {
        if (j === 0) sg.onstart = function () { if (l.a) l.a.split(",").forEach(function (c) { if (c === "why") why.classList.add("on"); else box.classList.add(c); }); };
        if (sg.lang === "en") sg.rate = 0.9;
        steps.push(sg);
      });
      steps.push({ pause: 300 });
    });
    steps.push(speakGood());
    steps.push({ fn: function () { box.classList.add("s1", "s2", "s3"); why.classList.add("on"); ready(); } });
    Speech.run(steps);
  };
  $(".again .spk", el).addEventListener("click", function () { box.classList.add("s1", "s2", "s3"); why.classList.add("on"); Speech.run([speakGood()]); });
};

/* 문항 */
var IDK = "모름";
var CIRCLED = ["①", "②", "③", "④", "⑤"];
function sentHTML(sent) {
  return esc(sent).replace("___", '<span class="blank">&nbsp;</span>');
}
function sentSteps(el, q) {     /* 빈칸은 잠깐 쉬면서 깜빡 */
  if (!q.sent) return [];
  var parts = q.sent.split("___"), st = [], bl = $(".blank", el);
  if (parts.length === 1) return [{ lang: "en", text: q.sent, rate: enRate() }];
  if (parts[0].trim()) st.push({ lang: "en", text: parts[0].trim(), rate: enRate(), gap: 0 });
  st.push({ fn: function () { if (bl) bl.classList.add("pulse"); } }, { pause: 650 }, { fn: function () { if (bl) bl.classList.remove("pulse"); } });
  if (parts[1].replace(/[.?!\s]/g, "")) st.push({ lang: "en", text: parts[1].trim(), rate: enRate() });
  return st;
}
R.item = function (s, el) {
  var q = s.d, n = s.n;
  setHeader("풀기", "바로 풀기 · " + q.tag);
  setNav({ prev: false, next: answers[n] ? "다음" : null });
  var h = '<div class="q"><div class="qk">' + (n + 1) + ". " + q.q + "</div>";
  if (q.sent) h += '<div class="qs"><button class="spk" type="button" aria-label="문장 듣기">🔊</button><span class="sent">' + sentHTML(q.sent) +
                   (q.hint ? ' <span class="qh">' + esc(q.hint) + "</span>" : "") + "</span></div>";
  var shown = [];
  if (q.type === "choice") {
    shown = q.fixed ? q.choices.slice() : shuffle(q.choices);
    h += '<div class="choices">' + shown.map(function (c, i) {
      return '<button class="choice" type="button" data-i="' + i + '"><span class="num">' + CIRCLED[i] + "</span><span>" + esc(c) + "</span></button>";
    }).join("") + "</div>";
  } else {
    h += '<div class="typerow"><input class="typein" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="여기에 쓰기" aria-label="답 쓰기">' +
         '<button class="typeok" type="button">확인</button></div>';
  }
  h += '<button class="idk" type="button">🤔 모름 (찍지 않고 넘어가기)</button><div class="fbx"></div></div>';
  el.innerHTML = h;
  s.shown = shown;
  var spk = $(".qs .spk", el);
  if (spk) spk.addEventListener("click", function () { Speech.run(sentSteps(el, q)); });
  if (q.type === "choice") $$(".choice", el).forEach(function (b, i) { b.addEventListener("click", function () { answer(shown[i]); }); });
  else {
    var inp = $(".typein", el);
    $(".typeok", el).addEventListener("click", function () { submitTyped(); });
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); if (answers[n]) next(); else submitTyped(); } });
  }
  $(".idk", el).addEventListener("click", function () { answer(IDK); });
  function submitTyped() {
    var v = inp.value.trim();
    if (!v) { inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); inp.focus(); return; }
    answer(v);
  }
  narr = function () {
    Speech.run(segs(q.qsay || null, q.q).concat(sentSteps(el, q)));
  };
};
function norm(t) { return String(t).toLowerCase().replace(/[’‘`´]/g, "'").replace(/\s+/g, " ").replace(/[.!?]+$/, "").trim(); }
function answer(choice) {
  var s = SL[cur]; if (s.type !== "item") return;
  var q = s.d, n = s.n; if (answers[n]) return;
  var unknown = choice === IDK, ok;
  if (unknown) ok = false;
  else if (q.type === "choice") ok = choice === q.answer;
  else ok = (q.accept || [q.answer]).some(function (a) { return norm(a) === norm(choice); });
  answers[n] = { no: n + 1, ok: ok, chosen: choice, answer: q.answer, tag: q.tag, unknown: unknown };
  var el = main.firstChild;
  $$(".choice", el).forEach(function (b, i) {
    b.disabled = true;
    if (s.shown[i] === q.answer) b.classList.add("right");
    else if (s.shown[i] === choice) b.classList.add("picked");
  });
  var inp = $(".typein", el);
  if (inp) { inp.readOnly = true; $(".typeok", el).disabled = true; }
  $(".idk", el).disabled = true;
  var bl = $(".blank", el);
  if (bl) bl.classList.remove("pulse");
  if (bl && q.fill) { bl.textContent = q.fill; }
  var head = ok ? "[정답] " + esc(q.answer)
           : unknown ? "[모름] 괜찮아요. 정답은 " + esc(q.answer) + " — 이제 알게 됐어요!"
           : "[다시 보기] 정답은 " + esc(q.answer) + (q.type === "type" ? " (내가 쓴 답: " + esc(choice) + ")" : "");
  var fb = document.createElement("div");
  fb.className = "fb" + (ok ? "" : unknown ? " unknown" : " wrong");
  fb.innerHTML = '<div class="fh">' + head + "</div><div>" + q.rule + "</div>" +
    '<div class="full"><button class="spk" type="button" aria-label="바른 문장 듣기">🔊</button><span class="sent">' + esc(q.full) + "</span></div>";
  $(".fbx", el).appendChild(fb);
  var fs = $(".full .sent", fb);
  var fp = parseMarked(q.full);
  fs.innerHTML = fp.html;
  function playFull() { return enSteps(fs, fp.plain, fp.words); }
  $(".full .spk", fb).addEventListener("click", function () { Speech.run(playFull()); });
  setNav({ prev: false, next: n === L.items.length - 1 ? "결과 보기" : "다음" });
  fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
  Speech.run(playFull().concat(segs(q.rsay || null, q.rule).map(function (sg) { if (sg.lang === "en") sg.rate = 0.9; return sg; })).concat([{ fn: ready }]));
}

/* 결과 */
var resultBuilt = null;
R.result = function (s, el) {
  setHeader("결과", "오늘 수업 정리");
  setNav(null);
  var score = answers.filter(function (a) { return a.ok; }).length;
  var wrong = answers.filter(function (a) { return !a.ok; }).map(function (a) { return a.no; });
  var unknown = answers.filter(function (a) { return a.unknown; }).map(function (a) { return a.no; });
  var total = L.items.length;
  var list = L.items.map(function (q, i) { return { q: q, a: answers[i] }; }).filter(function (x) { return !x.a.ok; });
  el.innerHTML = '<div class="res"><div class="rcard">' +
    '<div style="text-align:center;font-size:20px;font-weight:800">' + esc(studentName) + ", 오늘 수업 끝!</div>" +
    '<div class="score">' + score + " / " + total + (unknown.length ? " <small>(🤔 모름 " + unknown.length + ")</small>" : "") + "</div>" +
    '<div id="submit-status"></div>' +
    '<div class="rbtns"><button class="rbtn sec" id="again" type="button">🔊 다시 듣기</button>' +
    '<button class="rbtn" id="kakao" type="button">지나티처에게 보낼 결과 복사 (백업용)</button></div></div>' +
    '<div class="rcard"><div class="rv-h"><span class="kt">다시</span>다시 볼 문장</div>' +
    (list.length ? list.map(function (x) {
      var tg = x.a.unknown ? "🤔 모름 · 문제 " + x.a.no : "문제 " + x.a.no;
      return '<div class="ritem' + (x.a.unknown ? " unknown" : "") + '" data-no="' + x.a.no + '"><button class="spk" type="button" aria-label="문장 듣기">🔊</button><div>' +
        '<div class="rtag">' + tg + " · " + esc(x.q.tag) + '</div><div class="rs">' + esc(x.q.full) + '</div><div class="rr">' + x.q.rule + "</div></div></div>";
    }).join("") : '<p class="empty">다시 볼 문장이 없어요. 오늘 배운 문장을 한 번 더 듣고 싶으면 「다시 듣기」를 눌러요.</p>') + "</div></div>";
  $$(".ritem", el).forEach(function (r) {
    var q = L.items[+r.dataset.no - 1];
    $(".spk", r).addEventListener("click", function () { Speech.run([{ lang: "en", text: q.full, rate: enRate() }]); });
  });
  $("#again", el).addEventListener("click", function () { replay = true; go(1); });
  $("#kakao", el).addEventListener("click", function () {
    var msg = "[" + L.quizTitle + "]\n학생: " + studentName +
      "\n점수: " + score + "/" + total +
      "\n틀린 문항: " + (wrong.length ? wrong.join(", ") : "없음") +
      "\n모름: " + (unknown.length ? unknown.join(", ") : "없음");
    var btn = $("#kakao", el);
    function fallback() { prompt("아래 내용을 길게 눌러 복사하세요", msg); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(msg).then(function () { btn.textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓"; }).catch(fallback);
    } else fallback();
  });
  if (!resultBuilt) {
    resultBuilt = {
      quizId: L.quizId,
      quizTitle: L.quizTitle,
      student: studentName,
      score: score,
      total: total,
      wrong: wrong,
      unknown: unknown,
      durationSec: Math.round((Date.now() - startTime) / 1000),
      detail: answers
    };
    engfitSubmitWithStatus(resultBuilt);
  } else {
    var st = $("#submit-status");
    st.textContent = _lastSubmitText || ""; st.style.color = _lastSubmitColor || "";
  }
  narr = function () {
    Speech.run([{ lang: "ko", text: list.length ? "오늘 수업 끝! 다시 볼 문장은 스피커를 눌러서 한 번 더 들어 봐." : "오늘 수업 끝! 다시 듣고 싶으면 다시 듣기를 눌러." }]);
  };
};
/* 결과 화면을 다시 그릴 때 전송 문구 유지 */
var _lastSubmitText = "", _lastSubmitColor = "";
new MutationObserver(function () {
  var st = document.getElementById("submit-status");
  if (st && st.textContent) { _lastSubmitText = st.textContent; _lastSubmitColor = st.style.color; }
}).observe(main, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["style"] });

/* ══════ 키보드 ══════ */
document.addEventListener("keydown", function (e) {
  var s = SL[cur], t = e.target, typing = t && t.tagName === "INPUT";
  if (s.type === "start") return;
  if (s.type === "item") {
    var a = answers[s.n];
    if (!a && !typing) {
      if (e.key === "0") { answer(IDK); return; }
      var k = parseInt(e.key, 10);
      if (s.d.type === "choice" && k >= 1 && k <= s.shown.length) { answer(s.shown[k - 1]); return; }
    }
    if (a && !typing && (e.key === "Enter" || e.key === "ArrowRight")) { e.preventDefault(); next(); }
    return;
  }
  if (typing) return;
  if (e.key === "ArrowRight" || (e.key === "Enter" && !(t && t.tagName === "BUTTON"))) { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
});
document.addEventListener("visibilitychange", function () { if (document.hidden) Speech.stop(); });

go(0);
</script>
