<title>박정민 가주어 It 오답 클리닉 · 영핏 지나티처</title>
<style>
:root{color-scheme:light;--teal:#2F7C83;--teal-d:#235E64;--teal-l:#E6F1F1;--line:#DBE4E5;--ink:#2B3A3D;--sub:#6B7B7E;--cream:#FFF6E8;--ok:#2E7D4F;--okbg:#E8F5EC;--bad:#B4443B;--badbg:#FBEDEB}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:#F4F8F8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 60px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:8px}
.lg{width:34px;height:34px;border-radius:9px;background:var(--teal);color:#fff;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center}
.lt{display:flex;flex-direction:column;line-height:1.15}
.lt b{font-size:15px;color:var(--teal-d)}
.lt i{font-style:normal;font-size:10.5px;color:var(--sub)}
.mute{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.card{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:12px}
h1{font-size:21px;margin:0 0 4px;color:var(--teal-d)}
h2{font-size:18px;margin:0 0 6px;color:var(--teal-d)}
.sub{color:var(--sub);font-size:14px}
.btn{display:block;width:100%;background:var(--teal);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px;text-align:center}
.btn:disabled{background:#B9CACB;color:#fff;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--teal-d);border:1.5px solid var(--teal)}
.btn.small{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:6px 6px 0 0}
input.name{width:100%;font-size:17px;padding:13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-top:8px}
.sec{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;cursor:pointer}
.sec b{display:block;font-size:16px;color:var(--teal-d)}
.sec span{font-size:13px;color:var(--sub)}
.sec.done{background:var(--teal-l);border-color:var(--teal)}
.sec .st{float:right;font-size:13px;color:var(--teal-d);font-weight:700}
.note{background:var(--cream);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14.5px;margin:10px 0}
.rule{background:var(--teal-l);color:var(--ink);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px}
.ex{display:block;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0}
.chip{display:inline-block;background:#fff;color:var(--teal-d);border:1px solid var(--teal);border-radius:999px;padding:3px 11px;margin:3px 4px 3px 0;font-size:15px;cursor:pointer}
.k{color:var(--teal-d);font-weight:800}
.u{text-decoration:underline;text-underline-offset:3px;font-weight:700}
.prog{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:6px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--teal)}
.tag{display:inline-block;background:var(--teal-l);color:var(--teal-d);font-size:12px;border-radius:6px;padding:2px 8px;margin-bottom:8px}
.q{font-size:17px;font-weight:600;margin:4px 0 12px}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;font-size:16px;cursor:pointer}
.opt:active{background:var(--teal-l)}
.opt.sel{background:var(--teal-l);border-color:var(--teal);color:var(--ink)}
.say{background:#fff;color:var(--teal-d);border:1.5px solid var(--teal);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;margin-bottom:8px}
.ans{min-height:52px;border:1.5px dashed var(--teal);border-radius:12px;padding:10px;background:#fff;color:var(--ink);font-size:17px;margin-bottom:8px}
.pc{display:inline-block;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:7px 13px;margin:4px 5px 4px 0;font-size:17px;cursor:pointer}
.pc.used{opacity:.3;pointer-events:none}
.pc.in{border-color:var(--teal);background:var(--teal-l);color:var(--ink)}
.warn{color:var(--bad);font-size:14px;margin-top:6px;min-height:20px}
.big{font-size:34px;font-weight:800;color:var(--teal-d)}
.ri{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:#fff;color:var(--ink)}
.ri.ok{border-left:5px solid var(--ok)}
.ri.no{border-left:5px solid var(--bad)}
.ri .ca{color:var(--ok);font-weight:700}
.ri .wa{color:var(--bad)}
.ri .xp{background:var(--cream);color:var(--ink);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:14.5px}
.copybox{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;background:#fff;color:var(--ink)}
.foot{text-align:center;color:var(--sub);font-size:12px;margin-top:20px}
</style>
</head>

<script>

var SECS=[
{
 title:"1영역 · 진짜 주어 찾기 + It 문장 만들기",

 cards:[

  {h:"규칙 카드 · 가주어 It",b:

   EX('<span class="k">It</span> is exciting <b>to travel all around the world</b>.')+

 qs:[

  {t:"mc",tag:"연습A 1번 유형 · 심화",q:'다음 문장에서 <b>진짜 주어</b>(진주어)를 고르세요.<br><b>It is dangerous to swim in the river.</b>',

  {t:"ord",tag:"서술형 4번 유형",q:'<b>A:</b> How do you feel about learning English?<br>"interesting, learn English"를 이용해서, <b>가주어 It</b>으로 대답을 완성하세요.',

  {t:"ord",tag:"서술형 4번 유형 · 심화",q:'<b>A:</b> What do you think about exercising?<br>"good, exercise every day"를 이용해서, <b>가주어 It</b>으로 대답을 완성하세요.',

{
 title:"2영역 · not 자리 배열 + 짝 맞추기",

  {h:"왜 틀렸을까?",b:

 qs:[

  {t:"ord",tag:"서술형 8번 유형",q:'우리말에 맞게 배열하세요. (가주어 It을 사용할 것)<br><b>늦게 자는 것은 좋지 않다.</b> [sleep, not, to, good]',

  {t:"ord",tag:"서술형 8번 유형 · 심화",q:'우리말에 맞게 배열하세요. (가주어 It을 사용할 것)<br><b>길에서 뛰는 것은 안전하지 않다.</b> [run, not, to, safe]',

   o:["It – to drink – To get up early","That – to drink – To get up early","It – drink – To get up early","It – to drink – Get up early"],a:0,

   exp:"① 가주어 자리라서 <b>It</b>, ② 진주어는 <b>to drink</b>(to + 동사원형), ③ 문장 맨 앞 주어가 되는 to부정사는 <b>To get up early</b>예요. 'That – ...'은 첫 칸이 틀렸고, 'It – drink – ...'는 to가 빠졌고, 'It – to drink – Get up early'는 ③에서 동사만 써서(Get) 주어가 안 돼요."},

{

/* ---------- 상태 ---------- */
var st=null;
function loadSt(){try{var r=localStorage.getItem(SAVE_KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function saveSt(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(st))}catch(e){}}
st=loadSt()||{name:"",secs:{}};
var app=document.getElementById("app");

/* ---------- 발음 (미국 여성 목소리, 로딩 후에만) ---------- */
var VOICE=null,muted=false,pendingSay=null;
function pickVoice(){
  try{
    var vs=window.speechSynthesis.getVoices();
    if(!vs||!vs.length)return;
    var male=/david|alex|mark|fred|daniel|guy|james|george|tom|ryan|eric|christopher|steffan|brandon|roger|davis|andrew|brian|jason|tony|aaron|evan|oliver|rishi|junior/i;
    var us=vs.filter(function(v){return /^en[-_]US$/i.test(v.lang)&&!male.test(v.name)});
    var pref=["Google US English","Zira","Samantha","Aria","Jenny","Michelle","Ava","Allison","Susan","Nicky","Joelle"];
    var v=null;
    for(var i=0;i<pref.length&&!v;i++){v=us.filter(function(x){return x.name.indexOf(pref[i])>=0})[0]||null}
    VOICE=v||us[0]||null;
    if(VOICE&&pendingSay){var t=pendingSay;pendingSay=null;speak(t)}
  }catch(e){}
}
try{
  if(window.speechSynthesis){
    pickVoice();
    window.speechSynthesis.onvoiceschanged=pickVoice;
    setTimeout(pickVoice,400);setTimeout(pickVoice,1200);
  }
}catch(e){}
function speak(t){
  try{
    if(muted||!t||!window.speechSynthesis)return;
    if(!VOICE){pendingSay=t;return}
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);
    u.voice=VOICE;u.lang="en-US";u.rate=0.9;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
document.getElementById("muteBtn").onclick=function(){
  muted=!muted;this.textContent=muted?"소리 켜기":"소리 끄기";
  if(muted){try{window.speechSynthesis.cancel()}catch(e){}pendingSay=null}
};
document.addEventListener("click",function(e){
  var c=e.target.closest&&e.target.closest("[data-say]");
  if(c){speak(c.getAttribute("data-say"))}
});

/* ---------- 영역 완료 팡파르 (유일한 효과음) ---------- */
function fanfare(){
  if(muted)return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    var ac=new AC(),n=[523.25,659.25,783.99,1046.5],t=ac.currentTime;
    n.forEach(function(f,i){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type="triangle";o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*0.13);
      g.gain.exponentialRampToValueAtTime(0.18,t+i*0.13+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.13+0.28);
      o.connect(g);g.connect(ac.destination);o.start(t+i*0.13);o.stop(t+i*0.13+0.3);
    });
  }catch(e){}
}

/* ---------- 유틸 ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function makeLayout(sec){
  var mcIdx=[];sec.qs.forEach(function(q,i){if(q.t==="mc")mcIdx.push(i)});
  var pos={},use=[0,0,0,0],hist=[];
  mcIdx.forEach(function(qi){
    var cand=[0,1,2,3].filter(function(p){
      var l=hist.length;return !(l>=2&&hist[l-1]===p&&hist[l-2]===p)
    });
    var min=Math.min.apply(null,cand.map(function(p){return use[p]}));
    var best=cand.filter(function(p){return use[p]===min});
    var p=best[Math.floor(Math.random()*best.length)];
    pos[qi]=p;use[p]++;hist.push(p);
  });
  return sec.qs.map(function(q,i){
    if(q.t==="mc"){
      var others=shuffle([0,1,2,3].filter(function(x){return x!==q.a}));
      var order=[],k=0;
      for(var s=0;s<4;s++){order.push(s===pos[i]?q.a:others[k++])}
      return order;
    }
    return shuffle(q.seq.concat(q.extra||[]));
  });
}
var scrollTop=function(){try{window.scrollTo(0,0)}catch(e){}};
function secState(si){return st.secs[si]}
var CIRC=["①","②","③","④","⑤"];

/* ---------- 화면: 이름 입력 ---------- */
function showGate(){

   '<div class="note">오늘 오답노트의 <b>가주어 It</b>를 개념 카드와 유사문제로 한 번 더 익혀 봐요. 모르는 낱말은 🔊를 눌러 원어민 발음을 들어 보세요.</div>'+
   '<label class="sub">이름을 꼭 입력해 주세요</label><input class="name" id="nm" type="text" placeholder="예: 박정민" value="'+esc(st.name||"")+'" autocomplete="off">'+
   '<button class="btn" id="go" type="button">시작하기</button></div>';
  var nm=document.getElementById("nm"),go=document.getElementById("go");

  go.onclick=function(){var v=nm.value.trim();if(!v)return;st.name=v;saveSt();showChooser()};
}

/* ---------- 화면: 영역 선택 ---------- */
function showChooser(){
  scrollTop();
  var all=true,h='<div class="card"><h2>'+esc(st.name)+' 학생, 영역을 골라서 시작해요</h2><div class="sub">한 영역씩 풀어도 되고, 순서는 자유예요.</div>';
  SECS.forEach(function(s,i){
    var ss=st.secs[i],label="시작하기";
    if(ss&&ss.done){label="완료 "+ss.score+"/"+s.qs.length}
    else{all=false;if(ss&&ss.idx>0)label="이어하기 "+ss.idx+"/"+s.qs.length}
    h+='<button class="sec'+(ss&&ss.done?' done':'')+'" data-i="'+i+'" type="button"><span class="st">'+label+'</span><b>'+esc(s.title)+'</b><span>'+esc(s.sub)+'</span></button>';
  });
  h+='</div>';
  if(all&&SECS.length){h+='<div class="card"><h2>전체 결과</h2><button class="btn" id="allcopy" type="button">전체 결과 복사하기</button><div class="sub" id="allmsg" style="margin-top:6px"></div></div>'}
  app.innerHTML=h;
  var bs=app.querySelectorAll(".sec");
  for(var i=0;i<bs.length;i++){bs[i].onclick=function(){startSec(parseInt(this.getAttribute("data-i"),10))}}
  var ac=document.getElementById("allcopy");
  if(ac)ac.onclick=function(){copyText(allText(),function(ok){document.getElementById("allmsg").textContent=ok?"복사됐어요! 카톡에 붙여넣기 해서 보내 주세요.":"복사가 안 되면 글자를 길게 눌러 복사해 주세요."})};
}

function startSec(si){
  var ss=st.secs[si];
  if(ss&&ss.done){showResult(si);return}
  if(ss&&ss.idx>0){showQ(si);return}
  st.secs[si]={idx:0,lay:makeLayout(SECS[si]),ans:[],done:false,score:0};
  saveSt();showCard(si,0);
}

/* ---------- 화면: 카드 ---------- */
function showCard(si,ci){
  scrollTop();
  var s=SECS[si],c=s.cards[ci];
  app.innerHTML='<div class="card"><span class="tag">'+esc(s.title)+' · 카드 '+(ci+1)+'/'+s.cards.length+'</span><h2>'+c.h+'</h2>'+c.b+
   '<button class="btn" id="nx" type="button">'+(ci<s.cards.length-1?'다음 카드':'문제 풀기')+'</button>'+
   (ci>0?'<button class="btn ghost" id="pv" type="button">이전 카드</button>':'')+'</div>';
  document.getElementById("nx").onclick=function(){if(ci<s.cards.length-1)showCard(si,ci+1);else showQ(si)};
  var pv=document.getElementById("pv");if(pv)pv.onclick=function(){showCard(si,ci-1)};
}

/* ---------- 화면: 문제 ---------- */
var busy=false;
function showQ(si){
  var s=SECS[si],ss=st.secs[si],i=ss.idx;
  if(i>=s.qs.length){finishSec(si);return}
  scrollTop();
  var q=s.qs[i],lay=ss.lay[i];
  var h='<div class="card"><div class="prog"><span>'+esc(s.title.split(" · ")[0])+'</span><span>'+(i+1)+' / '+s.qs.length+'</span></div><div class="bar"><i style="width:'+Math.round(i/s.qs.length*100)+'%"></i></div>'+
   '<span class="tag">'+esc(q.tag||"")+'</span>';
  h+='<div class="q">'+q.q+'</div>';
  if(q.sayQ){h+='<button class="say" id="sq" type="button">🔊 발음 듣기</button>'}
  if(q.t==="mc"){
    for(var k=0;k<4;k++){h+='<button class="opt" data-k="'+lay[k]+'" type="button">'+CIRC[k]+' '+esc(q.o[lay[k]])+'</button>'}
  }else{
    h+='<div class="ans" id="ab">'+(q.pre?'<span class="sub">'+esc(q.pre)+'</span>':'')+'<span id="ap"></span></div><div id="pool">';
    lay.forEach(function(p,k){h+='<span class="pc" data-k="'+k+'">'+esc(p)+'</span>'});
    h+='</div><div class="warn" id="wn"></div>'+
     '<button class="btn small ghost" id="und" type="button">한 칸 지우기</button><button class="btn small ghost" id="rst" type="button">처음부터</button>'+
     '<button class="btn" id="ok" type="button">확인</button>';
  }
  h+='</div>';
  app.innerHTML=h;busy=false;
  var sq=document.getElementById("sq");if(sq)sq.onclick=function(){speak(q.sayQ)};
  if(q.t==="mc"){
    var os=app.querySelectorAll(".opt");
    for(var a=0;a<os.length;a++){os[a].onclick=function(){
      if(busy)return;busy=true;
      var pick=parseInt(this.getAttribute("data-k"),10);
      this.className+=" sel";
      record(si,i,pick===q.a,q.o[pick]);
    }}
  }else{
    var picked=[],warned=false;
    var ap=document.getElementById("ap"),pool=document.getElementById("pool"),wn=document.getElementById("wn");
    function draw(){
      ap.innerHTML=picked.map(function(k){return '<span class="pc in">'+esc(lay[k])+'</span>'}).join(" ")+(picked.length?'<span class="sub">'+esc(q.end||"")+'</span>':'');
      var ps=pool.querySelectorAll(".pc");
      for(var z=0;z<ps.length;z++){var kk=parseInt(ps[z].getAttribute("data-k"),10);ps[z].className="pc"+(picked.indexOf(kk)>=0?" used":"")}
    }
    var ps=pool.querySelectorAll(".pc");
    for(var z=0;z<ps.length;z++){ps[z].onclick=function(){if(busy)return;picked.push(parseInt(this.getAttribute("data-k"),10));wn.textContent="";draw()}}
    document.getElementById("und").onclick=function(){if(busy)return;picked.pop();draw()};
    document.getElementById("rst").onclick=function(){if(busy)return;picked=[];draw()};
    document.getElementById("ok").onclick=function(){
      if(busy)return;
      if(!picked.length){wn.textContent="낱말 조각을 눌러서 문장을 만들어 보세요.";return}
      if(picked.length<q.seq.length&&!warned){warned=true;wn.textContent="아직 문장이 덜 만들어진 것 같아요. 그래도 제출하려면 한 번 더 '확인'을 눌러요.";return}
      busy=true;
      var words=picked.map(function(k){return lay[k]});
      record(si,i,words.join(" ")===q.seq.join(" "),words.join(" ")+(q.end||""));
    };
    draw();
  }
}
function record(si,i,ok,given){
  var ss=st.secs[si],q=SECS[si].qs[i];
  ss.ans[i]={ok:!!ok,given:given};
  ss.idx=i+1;saveSt();
  if(q.say)speak(q.say);
  setTimeout(function(){showQ(si)},250);
}
function finishSec(si){
  var s=SECS[si],ss=st.secs[si],sc=0;
  ss.ans.forEach(function(a){if(a&&a.ok)sc++});
  ss.score=sc;ss.done=true;saveSt();
  fanfare();
  showResult(si);
}

/* ---------- 결과 ---------- */
function secText(si){
  var s=SECS[si],ss=st.secs[si];
  var wrong=[];ss.ans.forEach(function(a,i){if(a&&!a.ok)wrong.push(i+1)});
  return s.title.split(" · ")[0]+" "+ss.score+"/"+s.qs.length+" (틀린 문항: "+(wrong.length?wrong.join(", ")+"번":"없음")+")";
}
function allText(){
  var t="[영핏 지나티처 오답 클리닉 결과]\n학생: "+st.name+"\n단원: 가주어 It (쌍둥이네 문법 10/3~10/11)\n";
  var tot=0,max=0;
  SECS.forEach(function(s,i){var ss=st.secs[i];if(ss&&ss.done){t+="· "+secText(i)+"\n";tot+=ss.score}max+=s.qs.length});
  t+="합계 "+tot+"/"+max;
  return t;
}
function copyText(t,cb){
  function fb(){
    try{
      var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
      document.body.appendChild(ta);ta.select();var ok=document.execCommand("copy");document.body.removeChild(ta);cb(ok)
    }catch(e){cb(false)}
  }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){cb(true)},fb)}
    else fb();
  }catch(e){fb()}
}
function showResult(si){
  scrollTop();
  var s=SECS[si],ss=st.secs[si];
  var h='<div class="card" style="text-align:center"><div class="logo" style="justify-content:center;margin-bottom:8px"><span class="lg">영</span><span class="lt"><b>영핏 지나티처</b><i>영어를 핏하다</i></span></div>'+
   '<div class="sub">'+esc(st.name)+' · '+esc(s.title)+'</div><div class="big">'+ss.score+' / '+s.qs.length+'</div>'+
   '<div>'+(ss.score===s.qs.length?'모두 맞혔어요! 정말 잘했어요.':'틀린 문제는 아래 해설을 읽고 다시 한 번 살펴봐요. 금방 익숙해져요.')+'</div></div>';
  h+='<div class="card"><h2>결과를 카톡으로 보내요</h2><textarea class="copybox" id="ct" readonly>'+esc("[영핏 지나티처 오답 클리닉 결과]\n학생: "+st.name+"\n"+s.title+"\n"+secText(si))+'</textarea>'+
   '<button class="btn" id="cp" type="button">결과 복사하기</button><div class="sub" id="cm" style="margin-top:6px">복사한 뒤 카톡에 붙여넣어 선생님께 보내 주세요.</div></div>';
  h+='<div class="card"><h2>문항별 해설</h2>';
  s.qs.forEach(function(q,i){
    var a=ss.ans[i]||{ok:false,given:"(안 풀었어요)"};
    var right=q.t==="mc"?q.o[q.a]:q.fin;
    h+='<div class="ri '+(a.ok?'ok':'no')+'"><b>'+(i+1)+'번 '+(a.ok?'⭕ 정답':'❌ 오답')+'</b> <span class="sub">'+esc(q.tag||"")+'</span><div style="margin-top:4px">'+q.q+'</div>'+
     (a.ok?'':'<div class="wa">내 답: '+esc(a.given)+'</div>')+
     '<div class="ca">정답: '+esc(right)+'</div><div class="xp">'+q.exp+'</div>'+
     (q.say?'<button class="say" style="margin-top:8px" data-say="'+esc(q.say)+'" type="button">🔊 정답 문장 듣고 따라 읽기</button>':'')+'</div>';
  });
  h+='</div><button class="btn" id="bk" type="button">다른 영역 고르기</button><button class="btn ghost" id="rs" type="button">이 영역 다시 풀기</button>';
  app.innerHTML=h;
  document.getElementById("cp").onclick=function(){
    copyText(document.getElementById("ct").value,function(ok){document.getElementById("cm").textContent=ok?"복사됐어요! 카톡에 붙여넣기 해서 보내 주세요.":"복사가 안 되면 위 글자를 길게 눌러 복사해 주세요."})
  };
  document.getElementById("bk").onclick=showChooser;
  document.getElementById("rs").onclick=function(){delete st.secs[si];saveSt();startSec(si)};
}

showGate();
