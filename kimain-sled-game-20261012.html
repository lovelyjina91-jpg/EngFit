async function engfitSubmit(r) {

    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;

}

var muted = false;

function pickVoice() {
  var vs = [];
  try { vs = window.speechSynthesis.getVoices() || []; } catch (e) {}
  var us = vs.filter(function (v) { return /^en[-_]US$/i.test(v.lang || ""); });
  var ok = us.filter(function (v) { return !MALE.test(v.name || ""); });
  for (var i = 0; i < FEMALE_PREF.length; i++) {
    for (var j = 0; j < ok.length; j++) {
      if ((ok[j].name || "").indexOf(FEMALE_PREF[i]) >= 0) return ok[j];
    }

  return ok.length ? ok[0] : null;

function flushPending() {
  if (pendingSay) { var p = pendingSay; pendingSay = null; speak(p.t, p.o); }

function initVoices() {
  if (!window.speechSynthesis) return;
  function load() {
    var n = 0;

function speak(text, opts) {
  opts = opts || {};

function fanfare() {
  if (muted) return;
  try {
    var C = new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
      var o = C.createOscillator(), g = C.createGain();

      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);

    });

function key(t) { return String(t).toLowerCase().replace(/[^a-z]/g, ""); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function sayOf(k) { var w = W[k]; return w ? (w.say || w.en) : k; }
function posSeq(n, k) {
  for (var tries = 0; tries < 200; tries++) {
    var seq = [];
    while (seq.length < n) seq = seq.concat(shuffle(Array.apply(null, { length: k }).map(function (_, i) { return i; })));
    seq = seq.slice(0, n);
    var bad = false;
    for (var i = 2; i < n; i++) if (seq[i] === seq[i - 1] && seq[i] === seq[i - 2]) bad = true;
    if (!bad) return seq;
  }
  return seq;
}
function place(correct, others, pos) { var a = others.slice(); a.splice(pos, 0, correct); return a; }
function logoHtml() { return '<div class="logo"><div class="mark">영</div><div class="name">영핏 지나티처</div></div>'; }
function lsGet(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function buildArea(id) {
  var qs = [], order, ps;

    order = ["glen", "rides", "black", "sled", "blue", "blades", "flames", "slide", "glass", "lake", "up", "down", "stop", "into"];
    ps = posSeq(order.length, 4);
    order.forEach(function (k, i) {
      var w = W[k];
      var pool = shuffle(order.filter(function (x) { return x !== k && W[x].ko !== w.ko; }).map(function (x) { return W[x].ko; })).slice(0, 3);
      qs.push({ t: "mc", kind: "meaning", key: k, say: sayOf(k), opts: place(w.ko, pool, ps[i]), ans: ps[i], ansLabel: w.ko,
        tag: "Unit 1 · 낱말 뜻",

    });
  } else if (id === 2) {
    order = ["flames", "black", "slide", "glen", "blades", "sled", "glass", "blue"];
    ps = posSeq(order.length, 4);
    order.forEach(function (k, i) {

      qs.push({ t: "mc", kind: "sound", key: k, say: sayOf(k), opts: place(b, others, ps[i]), ans: ps[i], ansLabel: b,
        tag: "Unit 1 · 첫소리",

    });
  } else if (id === 3) {
    order = ["sled", "blue", "glen", "flames", "glass", "blades", "black", "slide"];
    ps = posSeq(order.length, 4);
    order.forEach(function (k, i) {
      var w = W[k], b = BL[k];
      qs.push({ t: "mc", kind: "spell", key: k, say: sayOf(k), opts: place(w.en, SP[k], ps[i]), ans: ps[i], ansLabel: w.en,
        tag: "Unit 1 · 글자 모양",
        exp: '"' + w.ko + '" 은(는) <b>' + w.en + '</b> 이에요. 맨 앞 <b>' + b + '</b> 가 "' + BLK[b] + '" 소리를 만들어요. 다른 글자(' + SP[k].map(function (x) { return x.slice(0, 2); }).join(", ").toLowerCase() + ')로 시작하면 다른 소리가 나요.' });
    });
  } else if (SGROUP[id]) {
    SGROUP[id].forEach(function (si) {
      var s = SENT[si], toks = s.en.split(" ");
      [1, 2, 3].forEach(function (r) {
        qs.push({ t: "ord", round: r, si: si, toks: toks, en: s.en, ko: s.ko,
          tag: r === 1 ? "문장 보고 똑같이 만들기" : (r === 2 ? "우리말 보고 만들기" : "듣고 만들기"),
          ansLabel: s.en,
          exp: '"' + s.en + '" → ' + s.ko + ' (낱말 순서: ' + toks.join(" → ") + ')' });
      });
    });
  } else if (id === 7) {
    var F = [
      { t: "find", mode: "hear", target: "stop", text: "The flames stop. Down, down, down!" },
      { t: "find", mode: "hear", target: "it",   text: "Glen on the sled rides a slide. It is a glass slide." },
      { t: "find", mode: "hear", target: "into", text: "Down, down, down! Into the blue lake!" },
      { t: "find", mode: "hear", target: "down", text: "Up, up, up! Down, down, down!" },
      { t: "find", mode: "ko",   target: "it",   text: "The black sled has flames. It is a glass slide." },
      { t: "find", mode: "ko",   target: "stop", text: "The flames stop." },
      { t: "find", mode: "ko",   target: "into", text: "The flames stop. Into the blue lake!" },
      { t: "find", mode: "ko",   target: "down", text: "Down, down, down! The flames stop." }
    ];
    F.forEach(function (f) {
      var w = W[f.target];
      f.toks = f.text.split(" ");

      qs.push(f);
    });
  }
  qs.forEach(function (q, i) { q.no = i + 1; });
  return qs;
}

function setMsg(t, cls) { var m = document.getElementById("msg"); if (m) { m.textContent = t; m.className = "msg " + (cls || ""); } }

/* mc */
function pick(i) {
  var q = ST.qs[ST.i];
  if (ST.locked || q.t !== "mc") return;
  var btns = document.querySelectorAll(".ch");
  if (!btns[i] || btns[i].classList.contains("no")) return;
  var ok = (i === q.ans);
  recordFirst(q, ok, q.opts[i]);
  if (ok) {
    ST.locked = true;
    btns[i].classList.add("ok");
    setMsg("⭕ 맞아요! " + (q.kind === "meaning" ? W[q.key].en + " = " + W[q.key].ko : q.ansLabel), "good");
    speak(q.say, { rate: 0.75, queue: true });
    setTimeout(nextQ, 250);
  } else {
    btns[i].classList.add("no", "shake");
    setMsg("아쉬워요! 소리를 다시 듣고 골라 봐요 👂", "bad");
    speak(q.say, { rate: 0.75 });
  }
}

/* ord */
function drawOrd(q) {
  var s = "", n = q.toks.length;
  for (var i = 0; i < n; i++) {
    if (i < q.picked.length) s += '<button class="slot f" data-act="slot" data-i="' + i + '">' + esc(q.toks[q.order[q.picked[i]]]) + '</button>';
    else s += '<span class="slot n">' + (i + 1) + '</span>';
  }
  document.getElementById("slots").innerHTML = s;
  var p = "";
  q.order.forEach(function (ti, pi) {
    var used = q.picked.indexOf(pi) >= 0;
    var kk = key(q.toks[ti]);
    var sub = (q.round === 1 && W[kk]) ? '<small>' + W[kk].ko + '</small>' : '';
    p += '<button class="tile' + (used ? " used" : "") + '" data-act="tile" data-i="' + pi + '"' + (used ? " disabled" : "") + '>' + esc(q.toks[ti]) + sub + '</button>';
  });
  document.getElementById("pool").innerHTML = p;
}
function tile(pi) {
  var q = ST.qs[ST.i];
  if (q.t !== "ord" || q.done || q.picked.indexOf(pi) >= 0 || q.picked.length >= q.toks.length) return;
  q.picked.push(pi);
  speak(sayOf(key(q.toks[q.order[pi]])), { rate: 0.75 });
  setMsg("");
  drawOrd(q);
  if (q.picked.length === q.toks.length) { ST.locked = true; setTimeout(checkOrd, 350); }
}
function slotRemove(i) {
  var q = ST.qs[ST.i];
  if (q.t !== "ord" || q.done || ST.locked) return;
  q.picked.splice(i, 1); setMsg(""); drawOrd(q);
}
function resetOrd() {
  var q = ST.qs[ST.i];
  if (q.t !== "ord" || q.done) return;
  q.picked = []; ST.locked = false; setMsg(""); drawOrd(q);
}
function checkOrd() {
  var q = ST.qs[ST.i];
  var got = q.picked.map(function (pi) { return q.toks[q.order[pi]]; });
  var ok = got.map(key).join(" ") === q.toks.map(key).join(" ");
  recordFirst(q, ok, got.join(" "));
  if (ok) {
    q.done = true;
    document.getElementById("slots").innerHTML = q.toks.map(function (t) { return '<span class="slot f">' + esc(t) + '</span>'; }).join("");
    document.getElementById("pool").innerHTML = "";
    document.getElementById("doneZone").innerHTML = '<div class="donebox"><div class="en">' + esc(q.en) + '</div><div class="kr">' + q.ko + '</div>⭕ 잘 만들었어요!</div>' +
      '<button class="btn" data-act="next">' + (ST.i + 1 >= ST.qs.length ? "결과 보기 ▶" : "다음 ▶") + '</button>';
    var rb = document.querySelector('[data-act="reset"]'); if (rb) rb.style.display = "none";
    speak(q.en, { rate: 0.75 });
  } else {
    var slots = document.getElementById("slots");
    slots.classList.add("shake");
    setMsg("어? 순서가 달라요. 소리 내어 읽으며 다시 만들어 봐요!", "bad");
    setTimeout(function () { slots.classList.remove("shake"); q.picked = []; ST.locked = false; setMsg(""); drawOrd(q); }, 1100);
    speak(q.en, { rate: 0.75 });
  }
}

/* find */
function tok(i) {
  var q = ST.qs[ST.i];
  if (ST.locked || q.t !== "find") return;
  var b = document.querySelectorAll(".tok")[i];
  if (!b || b.classList.contains("no")) return;
  var ok = key(q.toks[i]) === q.target;
  recordFirst(q, ok, q.toks[i]);
  if (ok) {
    ST.locked = true; b.classList.add("ok");
    setMsg("⭕ 찾았어요! " + W[q.target].en + " = " + W[q.target].ko, "good");
    speak(q.say, { rate: 0.75, queue: true });
    setTimeout(nextQ, 250);
  } else {
    b.classList.add("no", "shake");
    setMsg("아쉬워요! 다시 한 번 찾아봐요 🔍", "bad");
    speak(q.say, { rate: 0.75 });
  }
}

/* ===== 결과 ===== */
function buildCopy(areaId, score, total, wrong, sec) {
  var a = AREAS[areaId - 1];
  var m = Math.floor(sec / 60), s = sec % 60;
  return "[영핏 지나티처] " + ST.name + " · 썰매 낱말 게임(Unit 1) · " + areaId + ". " + a.title + "\n" +
    "결과: " + score + " / " + total + "  " + stars(score / total) + "\n" +
    "한 번에 못 맞힌 문항: " + (wrong.length ? wrong.join(", ") + "번" : "없음 (모두 한 번에 맞혔어요!)") + "\n" +
    "걸린 시간: " + (m ? m + "분 " : "") + s + "초";
}
function renderResult() {
  var total = ST.qs.length;
  var detail = ST.qs.map(function (q, i) { var r = ST.res[i] || { no: q.no, ok: false, chosen: "", answer: q.ansLabel }; return { no: r.no, ok: r.ok, chosen: r.chosen, answer: r.answer }; });
  var wrong = detail.filter(function (d) { return !d.ok; }).map(function (d) { return d.no; });
  var score = total - wrong.length;
  var sec = Math.round((Date.now() - ST.t0) / 1000);
  DONE[ST.area] = { score: score, total: total, wrong: wrong, sec: sec };
  lsSet("kimain-sled-done", JSON.stringify(DONE));
  var a = AREAS[ST.area - 1];
  var h = '<div class="card">' + logoHtml() + '<h1>' + a.ic + ' ' + a.title + ' 끝!</h1><div class="stars">' + stars(score / total) + '</div><div class="score">' + score + ' / ' + total + '</div>' +
    '<p class="sub" style="text-align:center">' + (wrong.length ? "한 번 더 보면 더 단단해져요. 아래 낱말을 소리 내어 읽어 봐요!" : "와! 모두 한 번에 맞혔어요! 최고예요! 🎉") + '</p>';
  if (wrong.length) {
    h += '<h2>🌱 다시 보면 좋은 문제</h2>';
    wrong.forEach(function (no) {
      var q = ST.qs[no - 1];
      h += '<div class="rev"><b>' + no + '번</b> · ' + q.exp + '<br><button class="rb" data-act="say" data-say="' + esc(q.t === "ord" ? q.en : q.say) + '" data-rate="0.75">🔊 듣기</button></div>';
    });
  }
  h += '<details class="all"><summary>전체 해설 보기</summary>';
  ST.qs.forEach(function (q) { h += '<div class="rev"><b>' + q.no + '번</b> ' + (detail[q.no - 1].ok ? "⭕" : "🌱") + ' · ' + q.exp + '</div>'; });
  h += '</details>';
  var txt = buildCopy(ST.area, score, total, wrong, sec);
  h += '<button class="btn" data-act="copy">📋 결과 카톡으로 복사하기</button><textarea class="copybox" id="ctext" rows="4" readonly>' + esc(txt) + '</textarea>' +
    '<div class="note">복사한 글을 지나티처에게 카톡으로 보내 주세요.</div><div id="submit-status"></div>' +
    '<button class="btn light" data-act="again">↺ 이 영역 한 번 더 하기</button><button class="btn gray" data-act="home">← 영역 고르기</button></div>';
  app.innerHTML = h;
  fanfare();
  engfitSubmitWithStatus({
    quizId: "kimain-sled-1012-p" + ST.area,
    quizTitle: "김아인 썰매 낱말 게임 " + ST.area + "영역 " + a.title + " 10/12",
    student: ST.name, score: score, total: total, wrong: wrong, durationSec: sec, detail: detail
  });
}
function copyText(t, done) {
  function fb() {
    try { var ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); done(true); } catch (e) { done(false); }
  }
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { done(true); }, fb); else fb(); } catch (e) { fb(); }
}

/* ===== 이벤트 ===== */
app.addEventListener("click", function (e) {
  var el = e.target.closest ? e.target.closest("[data-act]") : null;
  if (!el || el.disabled) return;
  var act = el.getAttribute("data-act"), i = parseInt(el.getAttribute("data-i"), 10);
  if (act === "say") speak(el.getAttribute("data-say"), { rate: parseFloat(el.getAttribute("data-rate")) || 0.8 });
  else if (act === "area") { if (ST.name) renderCard(parseInt(el.getAttribute("data-id"), 10)); }
  else if (act === "startq") startQuiz();
  else if (act === "home") renderHome();
  else if (act === "again") startQuiz();
  else if (act === "pick") pick(i);
  else if (act === "tile") tile(i);
  else if (act === "slot") slotRemove(i);
  else if (act === "reset") resetOrd();
  else if (act === "next") nextQ();
  else if (act === "tok") tok(i);
  else if (act === "copy") copyText(document.getElementById("ctext").value, function (ok) { el.textContent = ok ? "✓ 복사됐어요! 카톡에 붙여넣기 해요" : "아래 글을 길게 눌러 복사해 주세요"; });
  else if (act === "copyall") {
    var lines = ["[영핏 지나티처] " + ST.name + " · 썰매 낱말 게임(Unit 1) 전체 결과"];
    AREAS.forEach(function (a) { var d = DONE[a.id]; lines.push(a.id + ". " + a.title + " : " + (d ? d.score + "/" + d.total : "아직")); });
    var t = lines.join("\n");
    copyText(t, function (ok) { el.textContent = ok ? "✓ 복사됐어요! 카톡에 붙여넣기 해요" : "아래 글을 길게 눌러 복사해 주세요"; document.getElementById("allcopy").innerHTML = '<textarea class="copybox" rows="6" readonly>' + esc(t) + '</textarea>'; });
  }
});
document.addEventListener("keydown", function (e) {
  var q = ST.qs[ST.i];
  if (ST.area && q && q.t === "mc" && /^[1-4]$/.test(e.key) && document.querySelector(".ch")) pick(parseInt(e.key, 10) - 1);
});
document.getElementById("snd").addEventListener("click", function () {
  muted = !muted; lsSet("engfit-sound", muted ? "off" : "on"); refreshSnd();
  if (muted) { try { window.speechSynthesis.cancel(); } catch (e) {} }
});

ST.name = lsGet("kimain-sled-name", "");
refreshSnd(); initVoices(); renderHome();
</script>
</body>
