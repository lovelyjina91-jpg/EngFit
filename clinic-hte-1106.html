<script>
"use strict";

/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#2e7d6e"; }
  else { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#c0392b"; }
}


/* ══════ 문제 데이터 (개념 페이지 + 쌍둥이 문제) ══════ */
var STEPS = [
 {
  "type": "concept",
  "html": "<div class='ctitle'>① 의미상 주어 for / of — It is + 형용사 + for/of + 목적격 + to 동사원형 (7과)</div><div class='box'><div class='lab'>교과서 · 문법 문장 (7과)</div>It is important for students to read books. / It is kind of you to help me.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>It is kind <b>for</b> you ~ / It is important <b>of</b> students ~ / of <b>your</b> to ~</div><div class='box ok'><div class='lab'>정답 모양</div>판단(easy, hard, important) → <b>for</b> · 성격(kind, wise, rude) → <b>of</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>둘 다 '~가'로 해석돼서 뜻으로는 못 골라요. <b>형용사를 보고</b> 골라요. 그 형용사가 <b>사람의 성격·태도</b>를 칭찬하거나 꾸짖는 말이면 <b>of</b>, 일이 쉽다·어렵다·중요하다 같은 <b>판단</b>이면 <b>for</b>. 뒤에는 꼭 <b>목적격</b>(me, you, him, us)!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>It is dangerous <b class='hl'>for</b> kids to play near the road. (위험한 일 → 판단)</li><li>It is careless <b class='hl'>of</b> him to leave the door open. (부주의한 사람 → 성격)</li></ul></div><div class='trap'>⚠️ 함정: kind · wise · rude · careless · polite · foolish 는 of! · for/of 뒤 주격(he, we)·소유격(your) ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>It was wise ______ Minji to check the weather first.</div>",
  "choices": ["for", "of", "to", "with"],
  "answer": "of",
  "exp": "wise(현명한)는 사람의 <b>성격·태도</b> → <b>of</b> + 목적격 → It was wise <b>of Minji</b> to ~."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (초보자가 이 언덕을 스키로 내려가는 것은 어렵다)<div class='pass'>It is difficult ______ beginners to ski down this hill.</div>",
  "choices": ["of", "to", "for", "by"],
  "answer": "for",
  "exp": "difficult(어려운)는 성격이 아니라 일에 대한 <b>판단</b> → <b>for</b> + 목적격 → It is difficult <b>for</b> beginners to ~."
 },
 {
  "type": "twin",
  "q": "어법상 <b>옳은</b> 문장은?",
  "choices": ["It was rude for you to interrupt the speaker.", "It was rude of your to interrupt the speaker.", "It was rude of you to interrupt the speaker.", "It was rude of you interrupt the speaker."],
  "answer": "It was rude of you to interrupt the speaker.",
  "exp": "rude(무례한) → 성격이라 <b>of</b>, 뒤는 목적격 <b>you</b>(your ✕), 진주어는 <b>to interrupt</b>(to 빠뜨리기 ✕)."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>② 현재완료 계속 for / since · 경험 Have(Has) ~ ever (8과)</div><div class='box'><div class='lab'>교과서 · 문법 문장 (8과 Wrap Up)</div>My grandparents have lived in this city for 10 years. / We have lived here since last year. / Have you ever seen a musical before?</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>have lived ~ <b>since</b> 10 years / <b>for</b> last year / <b>Did</b> you ever seen ~?</div><div class='box ok'><div class='lab'>정답 모양</div><b>for</b> + 기간(숫자) · <b>since</b> + 시작 시점 · <b>Have/Has</b> + 주어 + ever + p.p.?</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>for와 since 모두 '~ 동안 / ~부터'로 해석돼요. 뒤를 보세요. <b>얼마 동안</b>(10 years, two months)이면 <b>for</b>, <b>언제부터</b>(2020, last year, I was ten)면 <b>since</b>. since 뒤에는 주어 + 동사(과거)도 올 수 있어요. 경험을 물을 때는 Did가 아니라 <b>Have/Has</b>로 시작하고 동사는 <b>p.p.</b>!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>I have known her <b class='hl'>for</b> five years. / <b class='hl'>since</b> 2021. / <b class='hl'>since</b> I was ten.</li><li><b class='hl'>Has</b> he ever <b class='hl'>visited</b> Jeju? — Yes, he <b class='hl'>has</b>. / No, he <b class='hl'>hasn't</b>.</li></ul></div><div class='trap'>⚠️ 함정: since + 기간 ✕ · for + 시점 ✕ · ago 와 현재완료 ✕ · Did ~ ever + p.p. ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (지나는 7년 동안 첼로를 연주해 왔다)<div class='pass'>Jina has played the cello ______ seven years.</div>",
  "choices": ["since", "ago", "for", "during"],
  "answer": "for",
  "exp": "seven years는 <b>기간(얼마 동안)</b> → <b>for</b>. since는 시작 시점, ago는 현재완료와 같이 못 써요."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (우리는 1학년 때부터 가장 친한 친구였다)<div class='pass'>We have been best friends ______ we were in first grade.</div>",
  "choices": ["for", "since", "ago", "during"],
  "answer": "since",
  "exp": "뒤에 <b>시작 시점</b>(we were in first grade, 주어 + 동사) → <b>since</b>. for·during 뒤에는 주어 + 동사가 못 와요."
 },
 {
  "type": "twin",
  "q": "대화의 빈칸에 알맞은 말은?<div class='pass'>A: ______ your brother ever tried scuba diving?<br>B: Yes, he has. He loved it.</div>",
  "choices": ["Did", "Have", "Does", "Has"],
  "answer": "Has",
  "exp": "tried가 p.p. 자리 + 대답이 he <b>has</b> → 현재완료 의문문 <b>Has</b> + 주어(your brother, 한 명) + ever + p.p.? Have는 주어가 여럿·I·you일 때."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>③ 지각동사 see / hear / feel + 목적어 + 동사원형 / -ing (8과)</div><div class='box'><div class='lab'>교과서 문장 (8과 본문 · Time Travel)</div>He felt the machine moving under his feet.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>felt the machine <b>to move</b></div><div class='box ok'><div class='lab'>정답 모양</div>felt the machine <b>move</b> / <b>moving</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>want me <b>to</b> go처럼 '목적어가 ~하는 것'에 to를 붙이는 동사가 많아서, 지각동사에도 to를 붙이고 싶어져요. 하지만 <b>보고(see, watch) · 듣고(hear) · 느끼는(feel)</b> 동사는 목적어 뒤에 <b>동사원형</b> 또는 <b>-ing</b>만! 진행 중인 느낌을 살리면 -ing예요.</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>I <b class='hl'>saw</b> him <b class='hl'>cross</b> the street. / <b class='hl'>crossing</b> the street.</li><li>She <b class='hl'>heard</b> the dog <b class='hl'>bark</b>. (to bark ✕)</li></ul></div><div class='trap'>⚠️ 함정: 지각동사 + 목적어 + to 동사원형 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (나는 복도에서 누군가가 내 이름을 부르는 것을 들었다)<div class='pass'>I heard someone ______ my name in the hallway.</div>",
  "choices": ["to call", "call", "calls", "to calling"],
  "answer": "call",
  "exp": "지각동사 <b>hear + 목적어 + 동사원형</b>(또는 -ing) → heard someone <b>call</b>. to call ✕."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["We saw the sun rise over the sea.", "She felt the ground shaking.", "They heard the baby crying.", "I saw my dad to fix the car."],
  "answer": "I saw my dad to fix the car.",
  "exp": "see는 지각동사 → saw my dad <b>fix</b>(또는 fixing) the car. 목적어 뒤 to ✕."
 },
 {
  "type": "twin",
  "q": "우리말을 영어로 바르게 옮긴 것은?<div class='pass'>나는 무언가가 내 다리를 건드리는 것을 느꼈다.</div>",
  "choices": ["I felt something to touch my leg.", "I felt to something touch my leg.", "I felt something touching to my leg.", "I felt something touch my leg."],
  "answer": "I felt something touch my leg.",
  "exp": "<b>feel + 목적어(something) + 동사원형(touch)</b>. to ✕, touch 뒤에 to ✕ (touch my leg)."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>④ want / tell / ask + 목적어 + to 동사원형 (8과)</div><div class='box'><div class='lab'>교과서 문장 (8과 본문 · Time Travel)</div>I don't want you to do anything foolish. / You don't want it to see you.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>want you <b>do</b> / want you <b>doing</b> / want <b>that you</b> ~</div><div class='box ok'><div class='lab'>정답 모양</div>want + <b>목적격</b> + <b>to 동사원형</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>③의 지각동사와 반대예요! <b>want · tell · ask</b>는 '목적어가 ~하기를 원하다 / ~하라고 말하다 / 부탁하다'라서 목적어 뒤에 꼭 <b>to</b>가 와요. 목적어 자리는 목적격(me, him, my sister)!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>The teacher <b class='hl'>told</b> us <b class='hl'>to be</b> quiet.</li><li>I <b class='hl'>asked</b> her <b class='hl'>to help</b> me.</li></ul></div><div class='trap'>⚠️ 함정: 지각동사(see/hear/feel)는 to ✕ · want/tell/ask 는 to ○ — 짝을 바꾸지 않기!</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (의사는 할아버지께 채소를 더 드시라고 말했다)<div class='pass'>The doctor told my grandpa ______ more vegetables.</div>",
  "choices": ["eat", "eating", "to eat", "eats"],
  "answer": "to eat",
  "exp": "<b>tell + 목적어 + to 동사원형</b> → told my grandpa <b>to eat</b>. tell은 지각동사가 아니라 to가 꼭 필요해요."
 },
 {
  "type": "twin",
  "q": "우리말을 영어로 바르게 옮긴 것은?<div class='pass'>삼촌은 내가 자기 개를 산책시켜 주기를 원한다.</div>",
  "choices": ["My uncle wants me walk his dog.", "My uncle wants me to walk his dog.", "My uncle wants that I to walk his dog.", "My uncle wants my to walk his dog."],
  "answer": "My uncle wants me to walk his dog.",
  "exp": "<b>want + 목적격(me) + to 동사원형(to walk)</b>. to 빠뜨리기 ✕, 소유격 my ✕."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>⑤ must not + 동사원형 (강한 금지) (8과)</div><div class='box'><div class='lab'>교과서 문장 (8과 본문 · Time Travel)</div>You must not leave it at any time. Do not touch anything.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div><b>not must</b> leave / must not <b>to leave</b> / must not <b>leaving</b></div><div class='box ok'><div class='lab'>정답 모양</div><b>must not</b> + <b>동사원형</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>우리말 '~하면 안 된다'에 끌려 not을 앞에 두거나, 뒤에 to를 붙이기 쉬워요. 조동사(must, can, will) 뒤에는 늘 <b>동사원형</b>, not은 조동사 <b>바로 뒤</b>!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>You <b class='hl'>must not run</b> by the pool.</li><li>부정 명령: <b class='hl'>Don't</b> / <b class='hl'>Do not</b> + 동사원형 (Not leave ✕)</li></ul></div><div class='trap'>⚠️ 함정: not must ✕ · must not to ✕ · must not -ing ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>You must not ______ photos inside the art gallery.</div>",
  "choices": ["to take", "take", "taking", "took"],
  "answer": "take",
  "exp": "<b>must not + 동사원형</b> → must not <b>take</b>. to · -ing · 과거형 ✕."
 },
 {
  "type": "twin",
  "q": "어법상 <b>옳은</b> 문장은?",
  "choices": ["Visitors must not to feed the animals.", "Visitors not must feed the animals.", "Visitors must not feed the animals.", "Visitors must not feeding the animals."],
  "answer": "Visitors must not feed the animals.",
  "exp": "not은 must <b>바로 뒤</b>, 그다음 <b>동사원형</b> → must not <b>feed</b>."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>⑥ Every + 단수 명사 → 단수 동사 (지난 클리닉 오답)</div><div class='box'><div class='lab'>지난번에 틀린 모양</div>Every child in the class ______ a pencil case.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>Every child ~ <b>have</b> / Every player ~ <b>practice</b></div><div class='box ok'><div class='lab'>정답 모양</div>Every + <b>단수 명사</b> + 동사<b>-s</b> (has, wears)</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>'모든'이라는 뜻 때문에 여럿이라고 생각하기 쉬워요. 하지만 every는 '<b>하나하나 모두</b>'라서 뒤에 <b>단수 명사</b>, 동사도 <b>단수</b>! 중간에 in the class 같은 꾸미는 말이 끼어도 진짜 주어는 Every ~ 예요. Everyone · Everything도 단수!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li><b class='hl'>Every</b> bus <b class='hl'>stops</b> here.</li><li><b class='hl'>Everyone</b> in my family <b class='hl'>likes</b> pizza.</li></ul></div><div class='trap'>⚠️ 함정: Every + 복수 명사 ✕ · Every ~ + have / are ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>Every student in our class ______ a yellow T-shirt on Sports Day.</div>",
  "choices": ["wear", "wears", "are wearing", "were"],
  "answer": "wears",
  "exp": "<b>Every student</b>는 단수 → <b>wears</b>. in our class는 꾸미는 말이에요."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["Every room in this hotel has a big window.", "Everyone likes her bright smile.", "Every player on the team practice hard.", "Every morning, my dad jogs in the park."],
  "answer": "Every player on the team practice hard.",
  "exp": "Every player는 단수 → <b>practices</b> hard. on the team은 꾸미는 말이라 동사와 상관없어요."

var QUIZ_ID = "clinic-hte-1106";
var QUIZ_TITLE = "한태은 사진 클리닉 개념+쌍둥이 11/06";
var TW = STEPS.filter(function (x) { return x.type === "twin"; });
var CONCEPT_OF = {};
(function () { var last = ""; STEPS.forEach(function (x, i) { if (x.type === "concept") last = x.html; else CONCEPT_OF[i] = last; }); })();

var studentName = "", cur = 0, twinNo = 0, correctCount = 0, wrongNumbers = [], unknownNumbers = [], answersLog = [], startTime = 0, locked = false;
var nameInput = document.getElementById("name-input"), startBtn = document.getElementById("start-btn");
var CIRCLED = ["①", "②", "③", "④", "⑤"];
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function $(id) { return document.getElementById(id); }

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  $("start-card").classList.add("hidden");
  $("quiz-card").classList.remove("hidden");
  show();
});
$("read-btn").addEventListener("click", function () { cur++; show(); });

function show() {
  if (cur >= STEPS.length) return showResult();
  var st = STEPS[cur];
  $("bar-fill").style.width = Math.round(cur / STEPS.length * 100) + "%";
  $("fb").innerHTML = "";
  if (st.type === "concept") {
    $("progress").textContent = "틀린 이유 읽기 · 쌍둥이 문제 " + (twinNo + 1) + "번 전";
    $("part").classList.add("hidden");
    $("concept-box").innerHTML = st.html; $("concept-box").classList.remove("hidden");
    $("read-btn").classList.remove("hidden");
    $("qtext").innerHTML = ""; $("choices").innerHTML = "";
    window.scrollTo(0, 0);
  } else {
    $("progress").textContent = "쌍둥이 문제 " + (twinNo + 1) + " / " + TW.length;
    $("concept-box").classList.add("hidden"); $("read-btn").classList.add("hidden");
    $("qtext").innerHTML = "Q" + (twinNo + 1) + ". " + st.q;
    var box = $("choices"); box.innerHTML = "";
    shuffle(st.choices).forEach(function (c, i) {
      var b = document.createElement("button"); b.className = "choice"; b.setAttribute("data-c", c);
      b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
      b.addEventListener("click", function () { pick(c); });
      box.appendChild(b);
    });
    var u = document.createElement("button"); u.className = "unk"; u.id = "unk-btn"; u.textContent = "🤔 모름";
    u.addEventListener("click", function () { unknown(); });
    box.appendChild(u);
    window.scrollTo(0, 0);
  }
}

function pick(choice) {
  if (locked) return; locked = true;
  var st = STEPS[cur], ok = choice === st.answer;
  if (ok) correctCount++; else wrongNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: ok, chosen: choice, answer: st.answer });
  [].forEach.call($("choices").children, function (b) {
    b.disabled = true;
    if (b.getAttribute("data-c") === st.answer) b.classList.add("right");
    else if (b.getAttribute("data-c") === choice) b.classList.add("bad");
  });
  var h = '<div class="exp' + (ok ? "" : " wrong") + '"><b>' + (ok ? "정답! 🎉" : "아쉬워요 — 정답: " + st.answer) + "</b><br>" + st.exp + "</div>";
  if (!ok) h += '<div class="lab2">📖 개념 정리 다시 보기</div>' + CONCEPT_OF[cur];
  h += '<button class="btn" id="next-btn">' + (twinNo + 1 < TW.length ? "다음 ▶" : "결과 보기") + "</button>";
  $("fb").innerHTML = h;
  $("next-btn").addEventListener("click", function () { locked = false; twinNo++; cur++; show(); });
}

function unknown() {
  if (locked) return; locked = true;
  var st = STEPS[cur];
  wrongNumbers.push(twinNo + 1); unknownNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: false, chosen: "모름", answer: st.answer, unknown: true });
  locked = false; twinNo++; cur++; show();
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}

function showResult() {
  $("quiz-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  $("score-line").textContent = correctCount + " / " + TW.length;
  var um = document.createElement("div"); um.id = "unknown-line"; um.className = "sub"; um.style.textAlign = "center"; um.textContent = unknownLine();
  $("score-line").parentNode.insertBefore(um, $("submit-status"));
  var expBox = $("explanations");
  TW.forEach(function (q, i) {
    var log = answersLog[i], d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>쌍둥이 " + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 (정답: " + q.answer + ")" : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correctCount, total: TW.length, wrong: wrongNumbers,
    unknown: unknownNumbers, durationSec: Math.round((Date.now() - startTime) / 1000), detail: answersLog });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 사진 클리닉 11/06 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + TW.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n" + unknownLine();
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});

</script>
</body>
</html>
