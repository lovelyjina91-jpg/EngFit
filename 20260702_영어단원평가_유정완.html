<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>유정완 영어 단원평가 — Good for Your Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Noto Sans KR', 'Nunito', sans-serif; background: #f2f4f8; color: #22304a; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #1a2550 0%, #24346e 60%, #1a2550 100%); padding: 22px 16px 20px; text-align: center; }
  .header img { height: 44px; filter: brightness(0) invert(1); display: block; margin: 0 auto 8px; }
  .header h1 { color: #fff; font-size: 1.12rem; font-weight: 700; letter-spacing: -0.3px; }
  .header .badge { display: inline-block; margin-top: 8px; background: rgba(201,168,62,0.18); border: 1px solid #c9a83e; color: #ecd98b; font-size: 0.78rem; font-weight: 500; padding: 3px 12px; border-radius: 20px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 14px 40px; }
  .card { background: #fff; border-radius: 18px; padding: 26px 22px; box-shadow: 0 3px 14px rgba(26,37,80,0.08); margin-bottom: 14px; }
  h2 { font-size: 1.15rem; color: #1a2550; margin-bottom: 8px; }
  .sub { font-size: 0.9rem; color: #7a86a0; line-height: 1.6; margin-bottom: 16px; }
  input[type=text] { width: 100%; padding: 14px; font-size: 1.05rem; font-family: inherit; border: 1.5px solid #cfd6e4; border-radius: 12px; outline: none; }
  input[type=text]:focus { border-color: #c9a83e; }
  .btn { display: block; width: 100%; margin-top: 14px; padding: 15px; font-size: 1.05rem; font-weight: 700; font-family: inherit; color: #fff; background: #1a2550; border: none; border-radius: 12px; cursor: pointer; }
  .btn:disabled { background: #b9c1d4; cursor: default; }
  .btn.gold { background: #c9a83e; color: #1a2550; }
  /* sticky progress */
  .sticky { position: sticky; top: 0; z-index: 10; background: #f2f4f8; padding: 10px 0 8px; }
  .bar-outer { height: 8px; background: #dde2ee; border-radius: 6px; overflow: hidden; }
  .bar-inner { height: 100%; width: 0%; background: linear-gradient(90deg, #c9a83e, #e2c565); border-radius: 6px; transition: width .3s; }
  .dots { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: 8px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #d5dae8; }
  .dot.cur { background: #c9a83e; transform: scale(1.25); }
  .dot.ok { background: #3bb273; }
  .dot.no { background: #e2596b; }
  .progress-label { text-align: center; font-size: 0.8rem; color: #8a94ac; margin-top: 6px; font-weight: 500; }
  .qtag { display: inline-block; font-size: 0.72rem; font-weight: 700; color: #1a2550; background: #f0e6c4; padding: 3px 10px; border-radius: 12px; margin-bottom: 10px; }
  .qtext { font-size: 1.08rem; line-height: 1.65; margin-bottom: 18px; font-weight: 700; color: #22304a; word-break: keep-all; }
  .qtext .en { font-family: 'Nunito', 'Noto Sans KR', sans-serif; }
  .qtext .kr { display: block; font-size: 0.88rem; color: #7a86a0; font-weight: 500; margin-top: 7px; }
  .choice { display: block; width: 100%; text-align: left; padding: 14px 15px; margin-bottom: 10px; font-size: 1rem; font-family: inherit; background: #f7f8fc; border: 1.6px solid #e0e5f0; border-radius: 12px; cursor: pointer; line-height: 1.5; color: #22304a; transition: background .15s, border-color .15s; word-break: keep-all; }
  .choice .num { color: #c9a83e; font-weight: 800; margin-right: 7px; font-family: 'Nunito', sans-serif; }
  .choice.correct { background: #e8f7ef; border-color: #3bb273; }
  .choice.wrong { background: #fdecee; border-color: #e2596b; }
  .choice:disabled { cursor: default; }
  .feedback { border-radius: 12px; padding: 14px 15px; margin-top: 4px; font-size: 0.93rem; line-height: 1.6; word-break: keep-all; }
  .feedback.ok { background: #e8f7ef; border-left: 4px solid #3bb273; }
  .feedback.no { background: #fdecee; border-left: 4px solid #e2596b; }
  .feedback b { color: #1a2550; }
  .fb-title { font-weight: 900; margin-bottom: 4px; }
  .feedback.ok .fb-title { color: #2e8f5d; }
  .feedback.no .fb-title { color: #c73e50; }
  /* result */
  .grade { font-family: 'Nunito', sans-serif; font-size: 3.4rem; font-weight: 800; text-align: center; color: #c9a83e; line-height: 1.1; }
  .score-line { text-align: center; font-size: 1.15rem; font-weight: 700; color: #1a2550; margin: 6px 0 2px; }
  .pct { text-align: center; font-size: 0.9rem; color: #7a86a0; margin-bottom: 10px; }
  #submit-status { text-align: center; font-size: 0.92rem; margin: 12px 0; min-height: 1.2em; }
  .review-item { background: #f7f8fc; border-radius: 12px; padding: 13px 14px; margin-bottom: 10px; font-size: 0.9rem; line-height: 1.6; border-left: 4px solid #3bb273; word-break: keep-all; }
  .review-item.wrong { border-left-color: #e2596b; }
  .review-item .rq { font-weight: 700; color: #1a2550; margin-bottom: 3px; }
  .review-item .ra { color: #556; }
  .review-item .ra .me { color: #c73e50; font-weight: 700; }
  .review-item .ra .an { color: #2e8f5d; font-weight: 700; }
  .review-item .rexp { margin-top: 5px; color: #445; }
  .hidden { display: none; }
</style>
</head>

/* ══════ 진행 로직 ══════ */
var studentName = "";
var current = 0;
var correctCount = 0;
var wrongNumbers = [];
var answersLog = [];
var startTime = 0;
var CIRCLED = ["①", "②", "③", "④"];

var nameInput = document.getElementById("name-input");
var startBtn = document.getElementById("start-btn");

nameInput.addEventListener("input", function () {
  startBtn.disabled = nameInput.value.trim().length === 0;
});

startBtn.addEventListener("click", startQuiz);

function startQuiz() {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  current = 0; correctCount = 0; wrongNumbers = []; answersLog = [];
  document.getElementById("start-card").classList.add("hidden");
  document.getElementById("result-card").classList.add("hidden");
  document.getElementById("progress-zone").classList.remove("hidden");
  document.getElementById("quiz-card").classList.remove("hidden");
  buildDots();
  showQuestion();
}

function buildDots() {
  var box = document.getElementById("dots");
  box.innerHTML = "";
  QUESTIONS.forEach(function (_, i) {
    var d = document.createElement("div");
    d.className = "dot"; d.id = "dot-" + i;
    box.appendChild(d);
  });
}

function updateProgress() {
  document.getElementById("bar").style.width = (current / QUESTIONS.length * 100) + "%";
  document.getElementById("progress-label").textContent = (current + 1) + " / " + QUESTIONS.length;
  QUESTIONS.forEach(function (_, i) {
    var d = document.getElementById("dot-" + i);
    d.classList.remove("cur");
    if (i === current) d.classList.add("cur");
  });
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

var locked = false;

function showQuestion() {
  locked = false;
  updateProgress();
  var q = QUESTIONS[current];
  document.getElementById("qtag").textContent = q.tag;
  document.getElementById("qtext").innerHTML = "Q" + (current + 1) + ". " + q.q;
  document.getElementById("feedback-zone").innerHTML = "";
  document.getElementById("next-btn").classList.add("hidden");
  var box = document.getElementById("choices");
  box.innerHTML = "";
  shuffle(q.choices).forEach(function (c, i) {
    var b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
    b.dataset.value = c;
    b.addEventListener("click", function () { pick(c, CIRCLED[i], b); });
    box.appendChild(b);
  });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function pick(choice, mark, btnEl) {
  if (locked) return; locked = true;
  var q = QUESTIONS[current];
  var ok = choice === q.answer;
  var dot = document.getElementById("dot-" + current);

  Array.prototype.forEach.call(document.querySelectorAll(".choice"), function (b) {
    b.disabled = true;
    if (b.dataset.value === q.answer) b.classList.add("correct");
  });

  if (ok) {
    correctCount++;
    dot.classList.add("ok");
  } else {
    wrongNumbers.push(current + 1);
    dot.classList.add("no");
    btnEl.classList.add("wrong");
  }
  answersLog.push({ no: current + 1, ok: ok, chosen: choice, answer: q.answer });

  var fb = document.createElement("div");
  fb.className = "feedback " + (ok ? "ok" : "no");
  fb.innerHTML = '<div class="fb-title">' + (ok ? "⭕ 정답이에요!" : "❌ 아쉬워요! 정답: " + q.answer) + "</div>" + q.exp;
  document.getElementById("feedback-zone").appendChild(fb);

  if (ok) {
    setTimeout(nextQuestion, 1300);
  } else {
    document.getElementById("next-btn").classList.remove("hidden");
  }
}

document.getElementById("next-btn").addEventListener("click", nextQuestion);

function nextQuestion() {
  current++;
  if (current < QUESTIONS.length) showQuestion();
  else showResult();
}

function gradeOf(pct) {
  if (pct === 100) return "S";
  if (pct >= 90) return "A";
  if (pct >= 80) return "B";
  if (pct >= 70) return "C";
  if (pct >= 60) return "D";
  return "F";
}

function showResult() {
  document.getElementById("bar").style.width = "100%";
  document.getElementById("quiz-card").classList.add("hidden");
  document.getElementById("progress-zone").classList.add("hidden");
  document.getElementById("result-card").classList.remove("hidden");

  var pct = Math.round(correctCount / QUESTIONS.length * 100);
  document.getElementById("result-name").textContent = studentName;
  document.getElementById("grade").textContent = gradeOf(pct);
  document.getElementById("score-line").textContent = correctCount + " / " + QUESTIONS.length + " 문제 정답";
  document.getElementById("pct").textContent = pct + "점 · 풀이 시간 " + fmtDur(Math.round((Date.now() - startTime) / 1000));

  var box = document.getElementById("review");
  box.innerHTML = "";
  QUESTIONS.forEach(function (q, i) {
    var log = answersLog[i];
    var d = document.createElement("div");
    d.className = "review-item" + (log.ok ? "" : " wrong");
    var qPlain = q.q.replace(/<[^>]*>/g, "");
    var html = '<div class="rq">Q' + (i + 1) + ". " + qPlain + "</div>";
    if (log.ok) {
      html += '<div class="ra">⭕ 내 답: <span class="an">' + log.chosen + "</span></div>";
    } else {
      html += '<div class="ra">❌ 내 답: <span class="me">' + log.chosen + '</span> → 정답: <span class="an">' + log.answer + "</span></div>";
      html += '<div class="rexp">' + q.exp + "</div>";
    }
    d.innerHTML = html;
    box.appendChild(d);
  });

  engfitSubmitWithStatus({
    quizId: QUIZ_ID,
    quizTitle: QUIZ_TITLE,
    student: studentName,
    score: correctCount,
    total: QUESTIONS.length,
    wrong: wrongNumbers,
    durationSec: Math.round((Date.now() - startTime) / 1000),
    detail: answersLog
  });

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function fmtDur(s) {
  var m = Math.floor(s / 60), r = s % 60;
  return m > 0 ? m + "분 " + r + "초" : r + "초";
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var pct = Math.round(correctCount / QUESTIONS.length * 100);
  var msg = "[영핏 단원평가 결과 — Good for Your Health]\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + QUESTIONS.length + " (" + pct + "점, " + gradeOf(pct) + " 등급)" +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") + "번" : "없음 🎉");
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});

document.getElementById("retry-btn").addEventListener("click", function () {
  _engfitSent = false;
  startQuiz();
});
</script>
