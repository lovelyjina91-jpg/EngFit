/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "결과 전송 중...";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "✓ 결과가 지나티처에게 자동 전송되었어요"; el.style.color = "#2e7d6e"; }

}


/* ══════ 문제 데이터 (개념 페이지 + 쌍둥이 문제) ══════ */
var STEPS = [
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">① to부정사의 의미상 주어 — for + 사람 / of + 사람<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/24 · 10/25 · 10/26 · 10/27 데일리 · 10/27 숙제 20번)<\/div>It is hard <u>for me<\/u> to ~ / It was careless <u>of you<\/u> to ~<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>to me / to him / what / (모름) / for me that answer<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>for me<\/b> / <b>for him<\/b> / <b>of<\/b> / <b>of you<\/b> / for me <b>to answer<\/b><\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">10/30 클리닉에서도 다룬 태은이의 1순위 약점이에요. to부정사 동작을 <b>누가 하는지<\/b>(의미상 주어)는 <b>for + 사람<\/b>으로 나타내요. to + 사람은 어떤 경우에도 쓰지 않아요. 단, kind · careless · rude · thoughtful · clever처럼 <b>그 사람의 성격이나 태도를 평가하는 형용사<\/b> 뒤에서는 <b>of + 사람<\/b>이에요. 그리고 for + 사람 뒤에는 that이 아니라 <b>to + 동사원형<\/b>이 와요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>It is + 형용사 + <b class=\"hl\">for / of<\/b> + 사람 + <b class=\"hl\">to 동사원형<\/b><\/p><ul><li>상황 형용사(hard, safe, boring, necessary): It is boring <b class=\"hl\">for<\/b> my brother to wait in line.<\/li><li>성격 형용사(kind, rude, clever, thoughtful): It was clever <b class=\"hl\">of<\/b> her to find the shortcut.<\/li><li>구별법: '그 사람은 ~하다'가 말이 되면 of → She is clever. (O) / My brother is boring. (뜻이 달라짐 → for)<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: 형용사가 <b>사람을 칭찬하거나 꾸짖는 말<\/b>이면 of! 나머지는 for! 그리고 사람 뒤에는 항상 to + 동사원형!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">It was thoughtful ______ Minho to save a seat for me.<\/div>",
  "choices": ["of", "for", "to", "with"],
  "answer": "of",
  "exp": "thoughtful(사려 깊은)은 민호의 성격을 칭찬하는 형용사라 <b>of + 사람<\/b>이에요. Minho is thoughtful.(민호는 사려 깊다)이 말이 되죠. 10/27 데일리의 careless of you와 같은 자리예요."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">It is necessary ______ beginners to stretch before a long run.<\/div>",
  "choices": ["of", "for", "to", "at"],
  "answer": "for",
  "exp": "necessary(필요한)는 사람의 성격을 평가하는 말이 아니라서 <b>for + 사람<\/b>이에요. 10/24 · 10/25처럼 to + 사람으로 쓰면 틀려요."
 },
 {
  "type": "twin",
  "q": "다음 우리말을 영어로 바르게 옮긴 것은?<div class=\"pass\">그가 그 소파를 혼자 옮기는 것은 불가능했다.<\/div>",
  "choices": ["It was impossible of him to move the sofa by himself.", "It was impossible for him that moves the sofa by himself.", "It was impossible for him to move the sofa by himself.", "It was impossible to him moving the sofa by himself."],
  "answer": "It was impossible for him to move the sofa by himself.",
  "exp": "<b>It was impossible + for him + to move<\/b>. impossible은 성격 형용사가 아니라 of ✕, 10/27 숙제 20번처럼 that을 쓰면 ✕, to him은 10/25와 같은 실수예요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">② 과거진행형 — was / were + 동사-ing (주어 수까지!)<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/20 클리닉 · 10/23 · 10/25 · 10/28 데일리)<\/div>~하고 있었다<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>cooked / am taking / was play / ate<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>were cooking<\/b> / <b>was taking<\/b> / <b>was playing<\/b> / <b>was eating<\/b><\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">네 번이나 같은 개념에서 틀렸어요. '~하고 있었다'는 과거 어느 순간에 <b>한창 하던 동작<\/b>이라 과거진행형이에요. 형태는 <b>was / were + 동사-ing<\/b> 두 조각이 한 세트예요. 그냥 과거(cooked, ate)는 '~했다', was play는 -ing가 빠졌고, am taking은 현재라서 틀려요. 그리고 주어가 여럿이면 was가 아니라 <b>were<\/b>예요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>~하고 있었다 = <b class=\"hl\">was / were + -ing<\/b><\/p><ul><li>I / he / she / it / 단수 → <b class=\"hl\">was<\/b> -ing: My sister <b class=\"hl\">was drawing<\/b> a cat when I came in.<\/li><li>we / you / they / 복수 → <b class=\"hl\">were<\/b> -ing: The twins <b class=\"hl\">were waiting<\/b> at the gate at seven.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: 우리말 '-하고 있었다'가 보이면 ① was / were 고르기(주어 수) ② 동사에 -ing 붙이기, 두 단계를 꼭 확인!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (정전이 됐을 때 우리는 보드게임을 하고 있었다)<div class=\"pass\">When the lights went out, we ______ a board game.<\/div>",
  "choices": ["played", "are playing", "were play", "were playing"],
  "answer": "were playing",
  "exp": "'하고 있었다'는 과거진행 <b>were playing<\/b>이에요. we는 복수라 were, 그리고 -ing까지 붙여야 해요. were play는 10/25의 was play와 같은 실수예요."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린<\/b> 문장은?",
  "choices": ["The puppies was sleeping under the table.", "Grandpa was fixing the fence all afternoon.", "What was Yuna doing at the gym?", "Two birds were singing on the roof."],
  "answer": "The puppies was sleeping under the table.",
  "exp": "The puppies는 복수라 was → <b>were<\/b> sleeping이 맞아요. 나머지는 주어 수에 맞게 was / were + -ing가 바르게 쓰였어요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">③ 비교급 강조 — much / far / even / a lot + 비교급<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/22 클리닉 2번 · 10/24 데일리 2번)<\/div>'훨씬 더 지루한' / '훨씬 더 큰'<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>much boringer / more bigger<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>much <b>more boring<\/b> / <b>much<\/b> bigger<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">'훨씬 더'는 비교급 앞에 <b>much, far, even, a lot<\/b>을 붙여요. very는 원급만 꾸미고, more는 이미 -er이 붙은 비교급 앞에 또 쓰면 안 돼요. 그리고 boring · difficult · popular처럼 긴 단어는 -er이 아니라 <b>more + 원급<\/b>으로 비교급을 만들어요. 강조어 + more + 긴 형용사 순서예요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p><b class=\"hl\">much / far / even / a lot<\/b> + 비교급 = 훨씬 더<\/p><ul><li>짧은 단어: This tent folds <b class=\"hl\">even<\/b> smaller than our last one.<\/li><li>긴 단어: Her second song became <b class=\"hl\">far<\/b> more popular.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: very는 비교급 ✕(very taller ✕) / more + -er ✕(more bigger ✕) / 긴 단어 -er ✕(difficulter ✕)!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">Riding a bike to school is ______ faster than walking.<\/div>",
  "choices": ["very", "even", "more", "so"],
  "answer": "even",
  "exp": "faster는 이미 비교급이라 '훨씬'은 <b>even<\/b>(much, far도 가능)이에요. very · so는 비교급을 꾸밀 수 없고, more faster는 비교급이 두 번이라 틀려요."
 },
 {
  "type": "twin",
  "q": "다음 우리말을 영어로 바르게 옮긴 것은?<div class=\"pass\">이 미로는 어제 것보다 훨씬 더 복잡하다.<\/div>",
  "choices": ["This maze is very more complicated than yesterday's.", "This maze is far complicateder than yesterday's.", "This maze is far more complicated than yesterday's.", "This maze is much most complicated than yesterday's."],
  "answer": "This maze is far more complicated than yesterday's.",
  "exp": "complicated는 긴 단어라 비교급이 <b>more complicated<\/b>, 그 앞에 강조어 <b>far<\/b>예요. very more ✕, complicateder ✕(10/22 boringer와 같은 실수), most는 최상급이라 than과 못 써요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">④ 현재완료 vs 과거 — 과거 시점 말이 있으면 과거시제<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (8과 현재완료 · 데일리 단골 함정 · 9/24 테스트 16번)<\/div>yesterday · last ~ · ~ ago · When ~? 와 함께 쓰는 시제<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">자주 하는 실수<\/div>He <u>has broken<\/u> his glasses last Sunday.<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>He <b>broke<\/b> his glasses last Sunday.<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">8과에서 배우는 현재완료(have / has + p.p.)는 <b>과거의 일이 지금까지 이어지거나 지금과 연결될 때<\/b> 써요. 그래서 yesterday, last Friday, two years ago, in 2020처럼 <b>딱 끝난 과거 시점<\/b>을 말하는 말과는 함께 쓸 수 없어요. 그럴 땐 그냥 <b>과거시제<\/b>예요. 9/24 테스트 16번에서도 과거형 returned 자리를 return으로 써서, 과거 시점 단어를 보고 과거형을 고르는 연습이 필요해요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>과거 시점 단어 → <b class=\"hl\">과거시제<\/b> / since · for · ever · never · just · already · yet → <b class=\"hl\">현재완료<\/b><\/p><ul><li>He <b class=\"hl\">has kept<\/b> a diary since March. (지금까지 계속)<\/li><li>He <b class=\"hl\">started<\/b> his diary two months ago. (ago = 과거 시점)<\/li><li>When <b class=\"hl\">did<\/b> you buy that jacket? (When 질문은 현재완료 ✕)<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: 문장 끝까지 읽고 yesterday · last · ago · in + 연도 · When이 보이면 have / has를 지워요!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">Junho ______ his umbrella on the bus last Friday.<\/div>",
  "choices": ["has left", "have left", "has leaving", "left"],

 {
  "type": "concept",
  "html": "<div class=\"ctitle\">⑤ 간접의문문 — 의문사 + 주어 + 동사(-s) / if + 주어 + 동사<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/18 · 10/22 · 10/24 데일리 · 10/27 숙제 2 · 5 · 8번 · 10/27 데일리 9번)<\/div>Do you know where he ___? / I wonder ___ it will snow.<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>he live / the movie start / the bus stop / the library open / I wonder it will snow<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>he <b>lives<\/b> / the movie <b>starts<\/b> / the bus <b>stops<\/b> / the library <b>opens<\/b> / I wonder <b>if<\/b> it will snow<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">태은이가 가장 많이 틀린 개념이에요. 의문문을 문장 속에 넣으면 do / does가 사라지고 <b>의문사 + 주어 + 동사<\/b> 순서가 돼요. 이때 does의 -s는 <b>동사로 옮겨 가요<\/b>(live → lives). 그리고 의문사가 없는 Yes / No 질문은 <b>if(~인지)<\/b>를 꼭 넣어야 해요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>Where does your cat hide? → I wonder where my cat <b class=\"hl\">hides<\/b>.<\/p><ul><li>How long does the lesson last? → Ask him how long his lesson <b class=\"hl\">lasts<\/b>.<\/li><li>Does Mina eat spicy food? → I wonder <b class=\"hl\">if<\/b> Mina <b class=\"hl\">eats<\/b> spicy food.<\/li><li>주어가 복수면 원형: I wonder where the boys <b>practice<\/b>.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: does를 지우고 -s까지 지우면 ✕! '~인지'가 보이면 if부터! that은 '~인지'가 아니에요.<\/div>"

 },

  "type": "concept",
  "html": "<div class=\"ctitle\">⑥ -thing + 형용사 + to부정사<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (9/24 테스트 2번 · 10/18 데일리 8번 · 8과)<\/div>마실 것 좀 줘. / 함께 이야기할 친구<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>(모름) / a friend who talk with me<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>Give me <b>something to drink<\/b>. / a friend <b>to talk with<\/b><\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">'~할 (무언가)'처럼 명사를 뒤에서 꾸밀 때는 <b>to + 동사원형<\/b>을 명사 뒤에 붙여요. 여기에 형용사까지 들어가면 something · anything · nothing 같은 -thing 단어는 형용사가 <b>뒤에<\/b> 와요. 그래서 순서는 <b>-thing + 형용사 + to부정사<\/b>예요. (cold something ✕)<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p><b class=\"hl\">something / anything / nothing + 형용사 + to 동사원형<\/b><\/p><ul><li>There is nothing <b class=\"hl\">special to eat<\/b> in the fridge.<\/li><li>She brought something <b class=\"hl\">sweet to share<\/b> with us.<\/li><li>의문문 · 부정문은 anything: Do you have anything <b>fun to do<\/b>?<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: 일반 명사는 형용사가 앞(a bright color), -thing은 형용사가 뒤(something bright)! to 다음은 동사원형(-ing ✕)!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (이 작은 마을에 볼 만한 재미있는 것이 있니?)<div class=\"pass\">Is there ______ in this small town?<\/div>",

  "answer": "anything interesting to see",

 },
 {

  "q": "빈칸에 알맞은 말은? (우리는 캠핑 여행 때 입을 따뜻한 것을 찾고 있었다)<div class=\"pass\">We were looking for ______ for the camping trip.<\/div>",
  "choices": ["warm something to wear", "something warm to wear", "something to wear warm", "something warm wearing"],
  "answer": "something warm to wear",

 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">⑦ 주어-동사 수일치 — 관계절 동사는 선행사에 맞추기<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/22 데일리 5번 · 10/29 클리닉 14번)<\/div>The teacher ___ English to us. / 3인칭 단수 동사<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>teach / repares<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>teaches<\/b> / <b>repairs<\/b><\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">동사는 언제나 <b>주인(주어)의 수<\/b>에 맞춰요. 관계대명사 who / that 뒤의 동사도 마찬가지인데, 이때 주인은 who가 아니라 <b>who 앞의 명사(선행사)<\/b>예요. 선행사가 한 명이면 -s, 여럿이면 원형이에요. who를 보고 무조건 -s를 붙이면 틀려요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>선행사 단수 → 동사 <b class=\"hl\">-s<\/b> / 선행사 복수 → 동사 <b class=\"hl\">원형<\/b><\/p><ul><li>The man who <b class=\"hl\">sells<\/b> fish at the market smiles a lot. (the man = 한 명)<\/li><li>Kids who <b class=\"hl\">read<\/b> every day learn new words fast. (kids = 여럿)<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: who 바로 앞 명사에 손가락을 대고 '한 명? 여럿?'을 먼저 확인해요!<\/div>"
 },
 {

var QUIZ_ID = "clinic-hte-1031";
var QUIZ_TITLE = "한태은 사진 클리닉 개념+쌍둥이 10/31";
var TW = STEPS.filter(function (x) { return x.type === "twin"; });
var CONCEPT_OF = {};
(function () { var last = ""; STEPS.forEach(function (x, i) { if (x.type === "concept") last = x.html; else CONCEPT_OF[i] = last; }); })();

var studentName = "", cur = 0, twinNo = 0, correctCount = 0, wrongNumbers = [], unknownNumbers = [], answersLog = [], startTime = 0, locked = false;
var nameInput = document.getElementById("name-input"), startBtn = document.getElementById("start-btn");
var CIRCLED = ["①", "②", "③", "④", "⑤"];
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function $(id) { return document.getElementById(id); }

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  $("start-card").classList.add("hidden");
  $("quiz-card").classList.remove("hidden");
  show();
});
$("read-btn").addEventListener("click", function () { cur++; show(); });

function show() {
  if (cur >= STEPS.length) return showResult();
  var st = STEPS[cur];
  $("bar-fill").style.width = Math.round(cur / STEPS.length * 100) + "%";
  $("fb").innerHTML = "";
  if (st.type === "concept") {
    $("progress").textContent = "틀린 이유 읽기 · 쌍둥이 문제 " + (twinNo + 1) + "번 전";
    $("part").classList.add("hidden");
    $("concept-box").innerHTML = st.html; $("concept-box").classList.remove("hidden");
    $("read-btn").classList.remove("hidden");
    $("qtext").innerHTML = ""; $("choices").innerHTML = "";
    window.scrollTo(0, 0);
  } else {
    $("progress").textContent = "쌍둥이 문제 " + (twinNo + 1) + " / " + TW.length;
    $("concept-box").classList.add("hidden"); $("read-btn").classList.add("hidden");
    $("qtext").innerHTML = "Q" + (twinNo + 1) + ". " + st.q;
    var box = $("choices"); box.innerHTML = "";
    shuffle(st.choices).forEach(function (c, i) {
      var b = document.createElement("button"); b.className = "choice"; b.setAttribute("data-c", c);
      b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
      b.addEventListener("click", function () { pick(c); });
      box.appendChild(b);
    });
    var u = document.createElement("button"); u.className = "unk"; u.id = "unk-btn"; u.textContent = "🤔 모름";
    u.addEventListener("click", function () { unknown(); });
    box.appendChild(u);
    window.scrollTo(0, 0);
  }
}

function pick(choice) {
  if (locked) return; locked = true;
  var st = STEPS[cur], ok = choice === st.answer;
  if (ok) correctCount++; else wrongNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: ok, chosen: choice, answer: st.answer });
  [].forEach.call($("choices").children, function (b) {
    b.disabled = true;
    if (b.getAttribute("data-c") === st.answer) b.classList.add("right");
    else if (b.getAttribute("data-c") === choice) b.classList.add("bad");
  });
  var h = '<div class="exp' + (ok ? "" : " wrong") + '"><b>' + (ok ? "정답! 🎉" : "아쉬워요 — 정답: " + st.answer) + "</b><br>" + st.exp + "</div>";
  if (!ok) h += '<div class="lab2">📖 개념 정리 다시 보기</div>' + CONCEPT_OF[cur];
  h += '<button class="btn" id="next-btn">' + (twinNo + 1 < TW.length ? "다음 ▶" : "결과 보기") + "</button>";
  $("fb").innerHTML = h;
  $("next-btn").addEventListener("click", function () { locked = false; twinNo++; cur++; show(); });
}

function unknown() {
  if (locked) return; locked = true;
  var st = STEPS[cur];
  wrongNumbers.push(twinNo + 1); unknownNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: false, chosen: "모름", answer: st.answer, unknown: true });
  locked = false; twinNo++; cur++; show();
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}

function showResult() {
  $("quiz-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  $("score-line").textContent = correctCount + " / " + TW.length;
  var um = document.createElement("div"); um.id = "unknown-line"; um.className = "sub"; um.style.textAlign = "center"; um.textContent = unknownLine();
  $("score-line").parentNode.insertBefore(um, $("submit-status"));
  var expBox = $("explanations");
  TW.forEach(function (q, i) {
    var log = answersLog[i], d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>쌍둥이 " + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 (정답: " + q.answer + ")" : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correctCount, total: TW.length, wrong: wrongNumbers,
    unknown: unknownNumbers, durationSec: Math.round((Date.now() - startTime) / 1000), detail: answersLog });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 사진 클리닉 10/31 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + TW.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n" + unknownLine();
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});

</script>
