<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>영핏 개념 수업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
:root{
  --navy:#1e2b55; --ink:#222a44; --sub:#5d6680; --paper:#f6f2e9; --card:#ffffff; --line:#e4dfd2;
  --org:#f4a100; --org-d:#b87400; --org-s:#fff1cf; --blue:#2f6fed; --blue-s:#e6eeff;
  --green:#178a5e; --green-s:#e2f5ec; --rose:#d2553f; --rose-s:#fdebe6; --hl:#ffe27a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--paper);color:var(--ink);
  font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;width:100%;max-width:1180px;min-width:0;margin:0 auto}
.hidden{display:none !important}

/* ── 위쪽 바 ── */
#top{flex:none;display:flex;align-items:center;gap:14px;padding:10px 20px 8px}
.brand{font-weight:800;color:var(--navy);font-size:15px;white-space:nowrap;letter-spacing:-.2px}
.brand i{font-style:normal;color:var(--org-d)}
.prog{flex:1;min-width:20px;height:10px;background:#e7e1d3;border-radius:99px;overflow:hidden}
.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,#f7b733,var(--org));border-radius:99px;transition:width .45s ease}
.step{font-size:14px;font-weight:700;color:var(--sub);white-space:nowrap;min-width:92px;text-align:right}
.snd{font-size:14px;font-weight:700;color:var(--navy);background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:7px 13px;white-space:nowrap}
.snd.off{color:#8a90a3;background:#eee9dd}

/* ── 무대 ── */
#stage{flex:1;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:4px 20px 10px;display:flex;flex-direction:column}
.slide{flex:1 0 auto;background:var(--card);border-radius:24px;box-shadow:0 3px 18px rgba(30,43,85,.08);padding:22px 28px 22px;
  display:flex;flex-direction:column;animation:rise .35s ease both;position:relative;min-width:0;max-width:100%;overflow-wrap:break-word}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kick{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--org-d);letter-spacing:.2px}
.kick .kt{background:var(--navy);color:#fff;border-radius:7px;padding:2px 9px;font-size:13px}
h2.tt{font-size:clamp(24px,3vw,30px);line-height:1.25;color:var(--navy);font-weight:800;margin:4px 0 14px;letter-spacing:-.5px}
.e,b.e{font-family:'Pretendard',sans-serif;font-weight:800;color:var(--navy)}

/* ── 설명 슬라이드 ── */
.ex-grid{flex:1;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px;align-items:center}
.lines{display:flex;flex-direction:column;gap:10px;min-width:0}
.ln{position:relative;font-size:clamp(19px,2.15vw,22px);line-height:1.5;padding:10px 14px 10px 44px;border-radius:14px;
  opacity:0;transform:translateX(-10px);transition:opacity .4s,transform .4s,background .3s}
.ln::before{content:attr(data-n);position:absolute;left:10px;top:11px;width:26px;height:26px;border-radius:50%;background:#ece7da;color:var(--sub);
  font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;transition:background .3s,color .3s}
.ln.on{opacity:1;transform:none}
.ln.hot{background:var(--org-s)}
.ln.hot::before{background:var(--org);color:#fff}
.ln b{color:var(--navy);font-weight:800}
.ln u{text-decoration:none;box-shadow:inset 0 -.45em 0 var(--hl)}
.vis{display:flex;flex-direction:column;gap:12px;justify-content:center;min-width:0}
[data-on]{opacity:0;transform:translateY(8px);transition:opacity .45s,transform .45s,background .3s,box-shadow .3s}
[data-on].on{opacity:1;transform:none}

.tiles{display:flex;gap:12px}
.tile{flex:1;min-width:0;text-align:center;font-size:34px;font-weight:800;color:var(--navy);background:var(--blue-s);border-radius:18px;padding:12px 0}
.tile.hot{background:var(--org-s);box-shadow:0 0 0 3px var(--org)}
.mean{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:128px minmax(0,1fr);gap:4px 12px;align-items:center;background:#faf8f2;border:1.5px solid var(--line);border-radius:14px;padding:9px 14px}
.mrow .k{font-weight:800;color:var(--org-d);font-size:17px}
.mrow .x{font-size:20px;font-weight:600}
.mrow .x b{color:var(--blue)}
.mrow .m{grid-column:2;font-size:15px;color:var(--sub);margin-top:-4px}
.routine{background:var(--navy);color:#fff;border-radius:14px;padding:11px 16px;font-size:17px;line-height:1.5}
.routine b{color:#ffd76b}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--blue-s);color:var(--navy);font-weight:700;font-size:20px;border-radius:99px;padding:6px 16px}
.chip.o{background:var(--org-s);color:var(--org-d)}
.cap2{font-size:15px;font-weight:800;color:var(--sub);margin-bottom:-4px}

table.rt{width:100%;border-collapse:separate;border-spacing:0 7px;font-size:18px}
table.rt th{font-size:14px;color:var(--sub);font-weight:800;text-align:left;padding:0 12px}
table.rt td{background:#faf8f2;border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line);padding:9px 12px;vertical-align:middle;transition:background .3s,border-color .3s}
table.rt td:first-child{border-left:1.5px solid var(--line);border-radius:14px 0 0 14px}
table.rt td:last-child{border-right:1.5px solid var(--line);border-radius:0 14px 14px 0}
table.rt tr.hot td{background:var(--org-s);border-color:var(--org)}
table.rt td b{color:var(--navy);font-weight:800}
table.rt td.big{font-size:26px;font-weight:800;color:var(--blue);white-space:nowrap}
table.rt td small{font-size:14px;color:var(--sub)}
table.rt td .x b{color:var(--blue)}
table.rt td .ar{color:var(--org-d);font-weight:800;padding:0 3px}

.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.pane{border:1.5px solid var(--line);background:#faf8f2;border-radius:16px;padding:12px 14px}
.pane.hot{background:var(--org-s);border-color:var(--org)}
.pane .ph{display:inline-block;font-size:14px;font-weight:800;color:#fff;background:var(--navy);border-radius:8px;padding:2px 10px;margin-bottom:6px}
.pane .ph.o{background:var(--org-d)}
.pane .px{font-size:21px;font-weight:600;line-height:1.45}
.pane .px b{color:var(--blue)}
.pane .pk{font-size:16px;color:var(--sub);margin-top:4px}
.pane .pk b{color:var(--navy)}
.strip{border-radius:16px;padding:12px 16px;background:#faf8f2;border:1.5px solid var(--line);font-size:21px;font-weight:600;line-height:1.5}
.strip.hot{background:var(--org-s);border-color:var(--org)}
.strip b{color:var(--blue)}
.strip small{display:block;font-size:15px;font-weight:500;color:var(--sub)}
.strip .ar{color:var(--org-d);font-weight:800}
.strip s{color:var(--rose);text-decoration-thickness:2.5px}
.strip .bad{color:var(--rose);font-weight:800;margin-right:4px}
.strip .ok{color:var(--green);font-weight:800;margin-right:4px}
.strip .pop{display:inline-block;background:var(--hl);border-radius:7px;padding:0 6px;color:var(--navy);font-weight:800}
.flow{display:flex;flex-direction:column;gap:8px}
.fstep{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:center;border:1.5px solid var(--line);background:#faf8f2;border-radius:16px;padding:10px 14px;font-size:18px;line-height:1.45}
.fstep.hot{background:var(--org-s);border-color:var(--org)}
.fstep i{font-style:normal;width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.fstep b{color:var(--navy);font-weight:800}
.fstep em{font-style:normal;color:var(--blue);font-weight:800}

/* ── 예문 슬라이드 ── */
.legend{display:flex;gap:14px;font-size:14px;font-weight:700;color:var(--sub);margin:-6px 0 10px;flex-wrap:wrap}
.legend .ls{border:2.5px solid var(--org);border-radius:99px;padding:0 9px;color:var(--org-d)}
.legend .lv{box-shadow:inset 0 -4px 0 var(--blue);color:var(--blue);padding:0 2px}
.sents{flex:1;display:flex;flex-direction:column;gap:10px;justify-content:flex-start}
.s-example{padding-top:16px;padding-bottom:14px}
.s-example h2.tt{margin-bottom:10px}
.sent{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;border:2px solid var(--line);border-radius:20px;padding:8px 16px 10px 20px;background:#fffdf8;
  opacity:.0;transform:translateY(10px);transition:opacity .4s,transform .4s,border-color .3s,box-shadow .3s}
.sent.on{opacity:1;transform:none}
.sent.act{border-color:var(--org);box-shadow:0 4px 16px rgba(244,161,0,.18)}
.sent .body{min-width:0}
.en{font-size:clamp(25px,3.1vw,32px);font-weight:700;line-height:1.3;color:var(--ink);padding-top:19px;letter-spacing:-.2px}
.w{display:inline-block;max-width:100%;border-radius:8px;padding:0 3px;margin:0 1px;transition:background .12s}
.spk .w{color:var(--ink)}
.w.now{background:var(--hl)}
.en.spk{color:var(--navy)}
.g{position:relative;display:inline-block;max-width:100%;border-radius:99px;transition:box-shadow .5s,background .5s}
.g::before{position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:12.5px;font-weight:800;white-space:nowrap;opacity:0;transition:opacity .4s;letter-spacing:0}
.g.s::before{content:"주어";color:var(--org-d)}
.g.v::before{content:"동사";color:var(--blue)}
.g.b::before{content:"be동사";color:var(--blue)}
.mk .g.s{box-shadow:0 0 0 3px var(--org);background:var(--org-s)}
.g.v,.g.b{border-radius:0;background:linear-gradient(var(--blue),var(--blue)) left bottom/0 4px no-repeat;transition:background-size .6s}
.mk .g.v,.mk .g.b{background-size:100% 4px}
.mk .g.v .w,.mk .g.b .w{color:var(--blue)}
.mk .g::before{opacity:1}
.mk .g.k{background:var(--hl);border-radius:8px}
.g.o .w{color:var(--green);font-weight:800}
.g.o{box-shadow:inset 0 -4px 0 #9bdcc0;border-radius:0}
.ko{font-size:17px;color:var(--sub);margin-top:2px;opacity:0;transition:opacity .4s}
.pt{font-size:17px;line-height:1.45;color:var(--ink);margin-top:4px;opacity:0;transition:opacity .4s}
.pt .kt,.why .kt,.fb .kt{display:inline-block;background:var(--navy);color:#fff;border-radius:6px;font-size:12.5px;font-weight:800;padding:1px 7px;margin-right:6px;vertical-align:1px}
.sent .ko.on,.sent .pt.on{opacity:1}
.sbtn{display:flex;flex-direction:column;gap:7px;align-items:stretch;min-width:0}
.sb{font-size:15px;font-weight:800;border-radius:12px;padding:9px 12px;min-height:42px;background:var(--blue-s);color:var(--navy);white-space:nowrap}
.sb.t{background:#fff;border:1.5px solid #c9d6f5;color:var(--blue)}
.sb:active{transform:scale(.97)}

/* ── 실제로 헷갈렸던 문장 ── */
.mine{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:820px;width:100%;margin:0 auto}
.mrow2{display:grid;grid-template-columns:54px minmax(0,1fr);gap:14px;align-items:center;border-radius:20px;padding:14px 18px;border:2px solid var(--line);background:#fffdf8;
  opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s}
.mrow2.on{opacity:1;transform:none}
.mrow2 .mark{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.mrow2 .mark svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.mrow2.bad{background:var(--rose-s);border-color:#f3c4b9}.mrow2.bad .mark{background:#fff;color:var(--rose)}
.mrow2.good{background:var(--green-s);border-color:#a9dcc5}.mrow2.good .mark{background:var(--green);color:#fff;transform:scale(.3);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.mrow2.good.on .mark{transform:scale(1)}
.mrow2 .en{padding-top:0;font-size:clamp(24px,3vw,30px)}
.g.x{border-radius:0}
.g.x::after{content:"";position:absolute;left:-2px;right:-2px;top:52%;height:4px;border-radius:2px;background:var(--rose);transform:scaleX(0);transform-origin:left;transition:transform .5s}
.struck .g.x::after{transform:scaleX(1)}
.struck .g.x .w{color:#b98a80}
.marrow{text-align:center;font-size:26px;font-weight:800;color:var(--org-d);line-height:1;opacity:0;transition:opacity .4s}
.marrow.on{opacity:1}
.why{border-left:5px solid var(--org);background:var(--org-s);border-radius:0 16px 16px 0;padding:12px 16px;font-size:18px;line-height:1.55;opacity:0;transition:opacity .45s}
.why.on{opacity:1}

/* ── 바로 풀기 ── */
.bridge{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.bridge .bn{font-size:68px;font-weight:800;color:var(--org);line-height:1}
.bridge p{font-size:20px;max-width:560px}
.bridge .idknote{border:2px dashed #b9bfd0;border-radius:16px;padding:12px 18px;font-size:18px;color:var(--ink);background:#fafbff}
.itemwrap{flex:1;display:flex;flex-direction:column;max-width:800px;width:100%;margin:0 auto}
.ins{font-size:clamp(19px,2.3vw,22px);font-weight:800;color:var(--navy);margin:6px 0 12px;line-height:1.4}
.qbox{background:#fffdf8;border:2px solid var(--line);border-radius:20px;padding:14px 20px 16px;margin-bottom:14px}
.qbox .pre{font-size:22px;font-weight:600;color:var(--sub);margin-bottom:2px}
.qbox .pre .ar{color:var(--org-d);font-weight:800;margin-left:6px}
.qbox .en{padding-top:4px}
.qbox .pre+.en{padding-top:17px}      /* 위의 '주어' 표시가 윗줄 글자와 겹치지 않게 */
.qbox .kocue{font-size:17px;color:var(--sub);margin-top:4px}
.blank{display:inline-block;min-width:min(104px,34%);height:1.2em;vertical-align:-.22em;margin:0 6px;border-radius:10px;background:var(--org-s);border:2.5px dashed var(--org)}
.hintv{display:inline-block;font-size:17px;font-weight:800;color:var(--org-d);background:var(--org-s);border-radius:9px;padding:1px 10px;margin-left:8px;vertical-align:.2em}
.chs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chs.col{grid-template-columns:minmax(0,1fr)}
.ch{display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left;min-width:0;overflow-wrap:break-word;font-size:clamp(21px,2.5vw,25px);font-weight:700;background:#fff;border:2.5px solid #d5dbec;border-radius:18px;
  padding:14px 16px;min-height:66px;transition:transform .1s,background .2s,border-color .2s}
.ch .num{color:var(--blue);font-weight:800;font-size:.85em}
.ch:active{transform:scale(.98);background:var(--blue-s)}
.ch.right{background:var(--green-s);border-color:var(--green);color:#0f5e40}
.ch.mine-x{background:#fff7ec;border-color:#f1c27a;color:#8a6a3a}
.ch.dim{opacity:.55}
.typ{display:flex;gap:12px}
.typ input{flex:1;min-width:0;font-family:inherit;font-size:26px;font-weight:700;color:var(--ink);padding:12px 18px;border:2.5px solid #d5dbec;border-radius:18px;background:#fff;outline:none}
.typ input:focus{border-color:var(--blue)}
.typ button{font-size:20px;font-weight:800;color:#fff;background:var(--navy);border-radius:18px;padding:0 28px;min-height:62px}
.typ button:disabled{background:#c3c8d6}
.idk{display:block;width:100%;margin-top:12px;padding:13px;font-size:18px;font-weight:700;color:#555d75;background:#fff;border:2px dashed #b3b9cb;border-radius:18px;min-height:54px}
.idk:active{background:#f3f3f6}
.fb{margin-top:14px;border-radius:20px;padding:14px 18px;background:var(--green-s);border:2px solid #a9dcc5;animation:rise .3s ease both}
.fb.no{background:#fff7ec;border-color:#f1c27a}
.fb.un{background:#fff4dd;border-color:var(--org)}
.fb h3{font-size:21px;font-weight:800;color:#0f5e40;margin-bottom:4px}
.fb.no h3,.fb.un h3{color:#8a5a00}
.fb p{font-size:18px;line-height:1.5}
.fb .fbtn{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.fb .sb{background:#fff;border:1.5px solid #cfd6e8}

/* ── 시작 ── */
.start{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.scard{width:100%;max-width:600px;min-width:0;overflow-wrap:break-word;background:#fff;border-radius:28px;box-shadow:0 6px 30px rgba(30,43,85,.12);padding:34px 34px 28px;text-align:center}
.scard .lg{font-size:14px;font-weight:800;color:var(--org-d);letter-spacing:.4px}
.scard h1{font-size:clamp(26px,3.6vw,34px);line-height:1.3;color:var(--navy);font-weight:800;margin:10px 0 6px;letter-spacing:-.6px}
.scard h1 em{font-style:normal;box-shadow:inset 0 -.42em 0 var(--hl)}
.scard .un{font-size:16px;color:var(--sub);margin-bottom:20px}
.scard label{display:block;text-align:left;font-size:14px;font-weight:800;color:var(--sub);margin:0 0 6px 6px}
.scard input{width:100%;font-family:inherit;font-size:22px;font-weight:700;padding:13px 18px;border:2.5px solid #d5dbec;border-radius:16px;color:var(--ink);outline:none}
.scard input:focus{border-color:var(--blue)}
.bigbtn{display:block;width:100%;margin-top:14px;font-size:24px;font-weight:800;color:#fff;background:var(--navy);border-radius:20px;padding:18px;min-height:68px;box-shadow:0 5px 0 #111a38}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #111a38}
.bigbtn:disabled{background:#c3c8d6;box-shadow:none}
.scard .hint{font-size:15px;color:var(--sub);margin-top:16px;line-height:1.6}
.vnote{font-size:13.5px;color:#8a6a2a;background:#fff6dc;border-radius:10px;padding:6px 12px;margin-top:12px;display:inline-block}
.vnote:empty{display:none}

/* ── 결과 ── */
.res{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column}
.res h2{text-align:center}
.score{text-align:center;font-size:60px;font-weight:800;color:var(--navy);line-height:1.1}
.score small{font-size:20px;color:var(--org-d);font-weight:800;margin-left:8px}
#submit-status{text-align:center;font-size:16px;margin:8px 0 12px;min-height:1.4em;font-weight:700}
.rbtns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:16px}
.rb{font-size:18px;font-weight:800;border-radius:16px;padding:14px;min-height:56px;background:var(--navy);color:#fff}
.rb.w{background:#fff;border:2px solid #cfd6e8;color:var(--navy)}
.rbtns.one{grid-template-columns:minmax(0,1fr)}
.sendbox{border:2.5px solid var(--org);background:#fff7ec;border-radius:18px;padding:14px 16px;margin-bottom:12px}
.sendbox .sb-h{font-size:19px;font-weight:800;color:var(--org-d);margin-bottom:6px}
.sendbox ol{margin:0 0 10px 1.3em;padding:0;font-size:17px;line-height:1.6;color:var(--navy)}
.sendbox .rb.send{width:100%;background:var(--org);color:#fff;font-size:19px;overflow-wrap:anywhere}
.sendbox .sb-n{font-size:16px;line-height:1.5;margin-top:10px;color:var(--navy)}
.rv-h{font-size:17px;font-weight:800;color:var(--navy);margin:4px 0 8px}
.rv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1.5px solid #f1c27a;background:#fffaf0;border-radius:16px;padding:11px 14px;margin-bottom:9px}
.rv.un{border-style:dashed;border-color:var(--org)}
.rv .en{font-size:22px;padding-top:0}
.rv .g::before{display:none}

      "\n모름: " + (unknownNumbers.length ? unknownNumbers.join(", ") : "없음");
    var done = function () { $("kakao-btn").textContent = "복사 완료! 이제 카톡에 붙여 넣고 보내요 ✓"; };
    try { navigator.clipboard.writeText(msg).then(done).catch(function () { prompt("아래 내용을 길게 눌러 복사하세요", msg); }); }
    catch (e) { prompt("아래 내용을 길게 눌러 복사하세요", msg); }
  });
  $("review-btn").addEventListener("click", function () { mode = "review"; si = 0; showSlide(); });

  engfitSubmitWithStatus({
    quizId: LESSON.quizId,
    quizTitle: LESSON.quizTitle,
    student: studentName,
    score: correctCount,
    total: ITEMS.length,
    wrong: wrongNumbers,
    unknown: unknownNumbers,

}
/* 다시 듣기를 마치고 결과 화면으로 (전송은 다시 하지 않음) */
function backToResult() {
  stopAll(); mode = "result";
  showResultAgain();
}
var _resultNode = null;
function showResultAgain() {
  setChrome(false); $("top").classList.remove("hidden");
  setProgress(SLIDES.length + ITEMS.length, "끝!");
  stage.innerHTML = ""; stage.scrollTop = 0;
  if (_resultNode) { stage.appendChild(_resultNode); curRoot = _resultNode; }
}

/* ── 이동 ── */
function next() {
  if (mode === "lesson" || mode === "review") {
    var list = lessonSlides();
    if (si < list.length - 1) { si++; showSlide(); }
    else if (mode === "review") backToResult();
    else { qi = 0; showItem(); }
  } else if (mode === "quiz") {
    if (!answered) return;
    if (qi < ITEMS.length - 1) { qi++; showItem(); }
    else { showResult(); _resultNode = curRoot; }
  }
}
function prev() { if ((mode === "lesson" || mode === "review") && si > 0) { si--; showSlide(); } }
nextBtn.addEventListener("click", next);
prevBtn.addEventListener("click", prev);
replayBtn.addEventListener("click", function () { if (mode === "lesson" || mode === "review") { AU.fails = 0; AU.dead = false; voiceNote(); showSlide(); } });
$("snd-btn").addEventListener("click", function () {
  SP.muted = !SP.muted;
  this.textContent = SP.muted ? "🔊 소리 끔" : "🔊 소리 켬";
  this.classList.toggle("off", SP.muted);
  if (AU.el) { try { AU.el.muted = SP.muted; } catch (e) {} }
  if (SP.muted && SP.ok) { try { window.speechSynthesis.cancel(); } catch (e) {} }
});
document.addEventListener("keydown", function (e) {
  var a = document.activeElement;
  if (a && a.tagName === "INPUT") return;
  if (mode === "quiz" && !answered) {
    if (e.key === "0") { pick(IDK); return; }
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= curChoices.length) pick(curChoices[n - 1]);
    return;
  }
  if (mode === "start" || mode === "result") return;
  if (e.key === "ArrowRight" || e.key === "Enter" || e.key === " ") { e.preventDefault(); if (!nextBtn.disabled) next(); }
  else if (e.key === "ArrowLeft") prev();
});
window.addEventListener("pagehide", function () { if (SP.ok) { try { window.speechSynthesis.cancel(); } catch (e) {} } if (AU.el) { try { AU.el.pause(); } catch (e) {} } });

$("brand-no").textContent = LESSON.no;
renderStart();
</script>

    if (card) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "relock"; b.id = "relock-btn"; b.textContent = "잠금 다시 걸기";
      b.addEventListener("click", function () { forget(); location.reload(); });
      card.appendChild(b);
    }
  }

  var card = $("lk-card"), pin = $("lk-pin"), btn = $("lk-btn"), msg = $("lk-msg"), keep = $("lk-keep"), busy = false;
  function say(t, bad) { msg.textContent = t; msg.classList.toggle("bad", !!bad); }
  if (!C.num) { pin.setAttribute("inputmode", "text"); pin.removeAttribute("pattern"); }
  pin.setAttribute("maxlength", String(C.n || 8));
  if (!window.crypto || !crypto.subtle || !window.TextEncoder) {
    card.classList.remove("hidden"); pin.disabled = true; btn.disabled = true;
    say("이 브라우저에서는 열 수 없어요. 크롬이나 사파리로 열어 주세요.", true);
    return;
  }
  function tryPin() {
    var v = pin.value.trim();
    if (busy || !v) return;
    busy = true; btn.disabled = true; pin.disabled = true; say("확인하고 있어요…");
    var key;
    derive(v).then(function (k) { key = k; return openWith(k); }).then(function (p) {
      if (keep.checked) {
        crypto.subtle.exportKey("raw", key).then(function (raw) {
          try { localStorage.setItem(STORE, JSON.stringify({ s: C.s, i: C.i, k: b64(raw) })); } catch (e) {}
        }).catch(function () {});
      }
      start(p, key);
    }).catch(function () {
      busy = false; btn.disabled = false; pin.disabled = false; pin.value = "";
      say("비밀번호가 달라요. 선생님께 받은 숫자를 다시 넣어 볼까요?", true);
      try { pin.focus(); } catch (e) {}
    });
  }
  btn.addEventListener("click", tryPin);
  pin.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); tryPin(); } });
  pin.addEventListener("input", function () {
    if (C.num) pin.value = pin.value.replace(/\D/g, "");
    if (msg.classList.contains("bad")) say("");
    if (C.n && pin.value.length >= C.n) tryPin();
  });
  function ask() { card.classList.remove("hidden"); try { pin.focus(); } catch (e) {} }
  var saved = load();
  if (!saved) { ask(); return; }
  crypto.subtle.importKey("raw", u8(saved.k), "AES-GCM", false, ["decrypt"]).then(function (k) {
    return openWith(k).then(function (p) { start(p, k); });
  }).catch(function () { forget(); ask(); });      /* 비밀번호가 바뀌었으면 다시 물어봄 */
})();
</script>
