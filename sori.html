<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>영핏 소리 듣기 🔊</title>
<meta property="og:title" content="영핏 소리 듣기 🔊">
<meta property="og:description" content="학습지 단어를 눌러서 소리를 들어요!">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#fffaf0;color:#1e2b55;padding:16px 16px 40px}
.top{background:#0d6e4f;color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:14px}
.top h1{font-size:24px}.top div{font-size:14px;opacity:.9;margin-top:4px}
.how{background:#fff;border:2px dashed #f4a100;border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.6;margin-bottom:14px}
.all{display:block;width:100%;font-size:20px;font-weight:800;color:#fff;background:#f4a100;border:0;border-radius:16px;padding:14px;margin-bottom:14px}
h2{font-size:17px;margin:16px 0 8px;color:#0d6e4f}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
button.w{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #ffb3c7;border-radius:16px;padding:12px;font:inherit;text-align:left;width:100%}
button.w .e{font-size:34px;line-height:1}
button.w .t{font-family:"Comic Sans MS","Segoe UI",sans-serif;font-size:26px;font-weight:700;color:#1e2b55;flex:1}
button.w .s{font-size:22px}
button.sn{border-color:#8fb8ff}
button.sn .t{font-size:21px}
button.on{background:#fff3c4;border-color:#f4a100}
.sp{display:flex;gap:8px;margin-top:10px;font-size:15px;align-items:center;flex-wrap:wrap}
.sp button{font:inherit;border:2px solid #0d6e4f;background:#fff;border-radius:12px;padding:6px 12px;color:#0d6e4f}
.sp button.on{background:#0d6e4f;color:#fff}
.no{display:none;background:#ffe9ec;border:2px solid #e0383e;border-radius:12px;padding:10px;margin-bottom:12px;font-size:15px}
.vc{display:flex;gap:8px;margin-top:10px;font-size:15px;align-items:center;flex-wrap:wrap}.vc button{font:inherit;border:2px solid #8a4fd6;background:#fff;border-radius:12px;padding:6px 10px;color:#5a2fa6}.vc button.on{background:#8a4fd6;color:#fff}.vc small{width:100%;font-size:12px;color:#888}
.foot{margin-top:24px;text-align:center;font-size:12px;color:#999}
</style></head><body>
<div class="top"><h1 id="h">🔊 소리 듣기</h1><div id="d"></div></div>
<div class="no" id="no">이 기기에서는 소리가 안 나와요 😢 다른 폰이나 패드로 QR을 찍어 주세요.</div>
<div class="how">👆 단어를 <b>누르면 소리</b>가 나와요. 듣고 → 따라 말하고 → 학습지에 해요!<br>소리가 안 나면 <b>무음 모드</b>를 끄고 볼륨을 올려 주세요.</div>
<button class="all" id="all">▶ 처음부터 다 듣기</button>
<div id="list"></div>
<div class="sp">빠르기: <button data-r="0.55">천천히 🐢</button><button data-r="0.8">보통 🐰</button></div>
<div class="foot">영핏영어교습소 · English Fit</div>
<script src="voice/jde/list.js?v=20261112"></script>
<script>
// 학습지 QR 전용 (원장님 2026-11-06 "아인이랑 다은이 소리숙제 큐알 박아줘")
// ?n=학생키&d=날짜&t=학습지이름&w=단어,단어&r=복습단어,…&s=문장~문장  — 단어 목록은 학습지가 QR에 직접 넣는다.
var NAME={kai:'아인',jde:'다은',jhi:'혜인',hje:'주은',kse:'성언'},TN={ws:'소리 계단 학습지',hw:'소리 숙제',jw:'쓰고 읽기 학습지',dict:'듣기 받아쓰기',listen:'귀 쫑긋 듣기',daily:'데일리 10'};
// h=1 (원장님 2026-11-09 혜인 받아쓰기): 글자를 숨기고 「1번」「2번」 버튼만 보여 준다 — 듣고 써야 하니까
var EM={stop:'🛑',star:'⭐',stamp:'📮',stick:'🥢',step:'👣',stand:'🧍',black:'⬛',blue:'🔵',block:'🧱',blanket:'🛌',blow:'🌬️',blink:'😉',green:'🟢',grass:'🌿',grape:'🍇',grow:'🌱',grin:'😁',grab:'🤏',plane:'✈️',plate:'🍽️',plant:'🪴',plug:'🔌',play:'⚽',plus:'➕',drum:'🥁',dress:'👗',drink:'🥤',drop:'💧',draw:'✏️',dream:'💭',
 flag:'🚩',glass:'🥛',slow:'🐢',whale:'🐋',three:'3️⃣',brush:'🪥',snake:'🐍',ship:'🚢',tree:'🌳',train:'🚆',glove:'🧤',thumb:'👍',bed:'🛏️',dog:'🐶',
 ant:'🐜',bear:'🐻',ball:'⚽',cow:'🐄',car:'🚗',door:'🚪',desk:'📚',egg:'🥚',elephant:'🐘',fish:'🐟',fox:'🦊',girl:'👧',gorilla:'🦍',hat:'🎩',hand:'✋',house:'🏠',igloo:'🧊',insect:'🐛',iguana:'🦎',jet:'✈️',jam:'🍓',jacket:'🧥',kangaroo:'🦘',kid:'🧒',king:'🤴',lamp:'💡',lion:'🦁',leaf:'🍃',
 monster:'👾',mouse:'🐭',map:'🗺️',nest:'🪺',nut:'🥜',ox:'🐂',octopus:'🐙',pen:'🖊️',pig:'🐷',pizza:'🍕',queen:'👸',robot:'🤖',ring:'💍',rabbit:'🐰',sun:'☀️',sock:'🧦',six:'6️⃣',tiger:'🐯',tent:'⛺',umbrella:'☂️',van:'🚐',vase:'🏺',violin:'🎻',web:'🕸️',wolf:'🐺',watch:'⌚',box:'📦',ax:'🪓',yellow:'<i style="display:inline-block;width:.9em;height:.9em;background:#ffe100;border:2px solid #d9b800;border-radius:.18em;vertical-align:-.1em"></i>',zero:'0️⃣','yo-yo':'🪀',yacht:'⛵',zebra:'🦓'};
var q=new URLSearchParams(location.search);
function arr(k,sep){var v=q.get(k);return v?v.split(sep).map(function(x){return x.trim();}).filter(Boolean):[];}
var nm=NAME[q.get('n')]||'';
document.getElementById('h').textContent='🔊 '+(nm?nm+'이의 ':'')+'소리 듣기';
document.title=document.getElementById('h').textContent;
document.getElementById('d').textContent=[TN[q.get('t')]||q.get('t')||'',q.get('d')||''].filter(Boolean).join(' · ');
var HID=q.get('h')=='1',NO=0;
if(HID)document.querySelector('.how').innerHTML='👆 <b>번호를 누르면</b> 소리가 나와요. 잘 듣고 학습지 같은 번호에 써요! (2~3번 들어도 돼요)<br>소리가 안 나면 <b>무음 모드</b>를 끄고 볼륨을 올려 주세요.';
var G=[['🌟 오늘의 단어',arr('w',','),0],['🔁 복습 단어',arr('r',','),0],[HID?'🎧 받아쓰기':'📚 문장',arr('s','~'),1]];
// 데일리 10 (원장님 2026-11-12 "다은·아인 데일리 듣기평가는 큐알, 다은이는 12월까지 문제도 읽어줘"): q=번호!말(글자 숨김 = 듣기 문제) ~ 번호_말(글자 보임 = 문제 읽어 주기)
var QI=arr('q','~').map(function(x){var m=x.match(/^(\d+)([!_])(.*)$/);return m?{no:m[1],hid:m[2]=='!',say:m[3]}:null;}).filter(Boolean),QN={};
// 원장님 목소리 (원장님 2026-11-12 "목소리 내껄로 해준다며"): 번호_@id → voice/jde/list.js 문장. 녹음(VOICE_HAVE) 있으면 원장님 녹음 재생, 없으면 한국어 기계 목소리
var VJ=window.VOICE_JDE||{},VH=window.VOICE_HAVE||{},AU=null;
QI.forEach(function(it){var m=it.say.match(/^@(\d+)$/);if(!m)return;it.vid=m[1];it.show=VJ[m[1]]||'';it.say=it.show.replace(/○/g,'동그라미');});
if(QI.length){document.querySelector('.how').innerHTML='👆 <b>번호를 누르면</b> 소리가 나와요. 🎧 표시는 <b>듣기 문제</b> — 잘 듣고 데일리 같은 번호에 답해요! (2~3번 들어도 돼요)<br>소리가 안 나면 <b>무음 모드</b>를 끄고 볼륨을 올려 주세요.';
 document.getElementById('all').style.display='none';}
var L=document.getElementById('list'),BTN=[];
G.forEach(function(g){if(!g[1].length)return;var h=document.createElement('h2');h.textContent=g[0];L.appendChild(h);
 var box=document.createElement('div');box.className=g[2]?'':'g';if(g[2])box.style.cssText='display:grid;gap:10px';L.appendChild(box);
 g[1].forEach(function(t){var b=document.createElement('button');b.className='w'+(g[2]?' sn':'');
  b.innerHTML=(g[2]?'':'<span class="e">'+(EM[t.toLowerCase()]||'')+'</span>')+'<span class="t"></span><span class="s">🔊</span>';
  b.dataset.say=t;NO++;b.querySelector('.t').textContent=HID?NO+'번':t;b.onclick=function(){say([b]);};box.appendChild(b);BTN.push(b);});});
var RATE=0.55,voice=null,ss=window.speechSynthesis;
if(!ss)document.getElementById('no').style.display='block';
// 목소리: 무조건 미국 여자 (원장님 2026-11-11 "무조건 미국여자 목소리만해" — 고르기 버튼 없앰)
var PITCH=1,F_RE=/Samantha|Aria|Jenny|Zira|Allison|Ava|Susan|Michelle|Female|여성/i,M_RE=/Daniel|Alex|Fred|Guy|David|Mark|Aaron|Ryan|Tom|Christopher|Eric|Male|남성/i;
function pick(){if(!ss)return;var us=ss.getVoices().filter(function(x){return /^en[-_]US/i.test(x.lang);});
 voice=us.filter(function(x){return F_RE.test(x.name)&&!M_RE.test(x.name);})[0]||us.filter(function(x){return !M_RE.test(x.name);})[0]||us[0]||null;}
// 한글 문제 읽기 (원장님 2026-11-12 "정다은은 아직 어려서 문제를 한글로 읽어줘"): 한글이 들어간 말은 ko-KR 목소리(여자 우선)로 읽는다. 영어는 위 미국 여자 그대로.
var kvoice=null,KF_RE=/SunHi|Yuna|Heami|Sora|Jimin|Seoyeon|Female|여성|여자/i;
function pickK(){if(!ss)return;var ks=ss.getVoices().filter(function(x){return /^ko/i.test(x.lang);});kvoice=ks.filter(function(x){return KF_RE.test(x.name)&&!M_RE.test(x.name);})[0]||ks.filter(function(x){return !M_RE.test(x.name);})[0]||ks[0]||null;}
if(ss){pick();pickK();ss.onvoiceschanged=function(){pick();pickK();};}
function say(bs){if(!ss)return;ss.cancel();BTN.forEach(function(x){x.classList.remove('on');});
 bs.forEach(function(b,i){var KO=/[가-힣]/.test(b.dataset.say);var u=new SpeechSynthesisUtterance(b.dataset.say);if(KO){u.lang=kvoice?kvoice.lang:'ko-KR';if(kvoice)u.voice=kvoice;u.rate=Math.min(1,RATE+0.3);}else{u.lang=voice?voice.lang:'en-US';if(voice)u.voice=voice;u.rate=RATE;}u.pitch=PITCH;
  u.onstart=function(){BTN.forEach(function(x){x.classList.remove('on');});b.classList.add('on');b.scrollIntoView({block:'nearest',behavior:'smooth'});};
  u.onend=function(){if(i==bs.length-1)b.classList.remove('on');};ss.speak(u);});}
if(QI.length){var h2=document.createElement('h2');h2.textContent='📝 데일리 문제';L.appendChild(h2);var bx=document.createElement('div');bx.style.cssText='display:grid;gap:10px';L.appendChild(bx);
 QI.forEach(function(it){var b=document.createElement('button');b.className='w sn';if(it.hid)b.style.borderColor='#f4a100';
  b.innerHTML='<span class="t"></span><span class="s">'+(it.hid?'🎧':'🔊')+'</span>';b.dataset.say=it.say;
  b.querySelector('.t').innerHTML='<b style="color:#0d6e4f">'+it.no+'번</b> '+(it.hid?'<span style="color:#b06d00">듣기 문제</span>':(it.show||it.say).replace(/&/g,'&amp;').replace(/</g,'&lt;'));
  b.onclick=function(){if(AU){AU.pause();AU=null;}
   if(it.vid&&VH[it.vid]){if(ss)ss.cancel();BTN.forEach(function(x){x.classList.remove('on');});b.classList.add('on');
    AU=new Audio('voice/jde/'+it.vid+'.'+VH[it.vid]+'?v='+(window.VOICE_VER||1));AU.onended=function(){b.classList.remove('on');};
    AU.play().catch(function(){b.classList.remove('on');say([b]);});return;}
   say([b]);};bx.appendChild(b);BTN.push(b);});}
document.getElementById('all').onclick=function(){say(BTN);};
var SP=document.querySelectorAll('.sp button');
SP.forEach(function(b){if(+b.dataset.r==RATE)b.classList.add('on');b.onclick=function(){RATE=+b.dataset.r;SP.forEach(function(x){x.classList.toggle('on',x==b);});};});
</script>
</body></html>
