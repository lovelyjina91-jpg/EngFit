<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .wrap { width: 100%; max-width: 520px; }

<body>

<script>
"use strict";

/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "결과 전송 중...";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "✓ 결과가 지나티처에게 자동 전송되었어요"; el.style.color = "#2e7d6e"; }
  else { el.textContent = "전송이 안 됐어요 — 아래 버튼으로 복사해서 카톡으로 보내주세요!"; el.style.color = "#c0392b"; }
}


/* ══════ 문제 데이터 ══════ */
var QUESTIONS = [
{"q": "다음 우리말을 영어로 바르게 옮긴 것은?<br>우리 할머니는 그 시계를 20년 동안 가지고 계신다.", "choices": ["My grandma has the watch for twenty years.", "My grandma has had the watch for twenty years.", "My grandma has have the watch for twenty years.", "My grandma has had the watch since twenty years."], "answer": "My grandma has had the watch for twenty years.", "exp": "과거부터 지금까지 계속 → 현재완료 <b>has + had(p.p.)</b>, 기간 앞은 <b>for</b> (since는 시작 시점 앞). 10/30 데일리 3번에서 has만 썼던 부분이에요.", "part": "Part 1 · 7과 현재완료"},
{"q": "다음 우리말을 영어로 바르게 옮긴 것은?<br>나는 부산에 한 번 가 본 적이 있다.", "choices": ["I have went to Busan once.", "I have be to Busan once.", "I have been to Busan once.", "I went to Busan ever."], "answer": "I have been to Busan once.", "exp": "'~에 가 본 적이 있다'(경험) = <b>have been to</b>. went는 과거형이라 have 뒤에 못 와요. 10/30 데일리 4번에서 모름으로 남긴 표현이에요."},
{"q": "다음 우리말을 영어로 바르게 옮긴 것은?<br>너는 그 소설을 벌써 다 읽었니? (yet)", "choices": ["Have you readed the novel yet?", "Do you read the novel yet?", "Have you reading the novel yet?", "Have you read the novel yet?"], "answer": "Have you read the novel yet?", "exp": "완료 의문문 <b>Have + 주어 + p.p. ~ yet?</b> read의 p.p.는 그대로 <b>read</b>. 10/30 데일리 9번에서 Do you finish ~ yet?으로 썼던 실수예요."},
{"q": "틀린 곳을 바르게 고친 문장은?<br>My aunt lives in Seoul since 2018.", "choices": ["My aunt has lived in Seoul since 2018.", "My aunt has live in Seoul since 2018.", "My aunt is living in Seoul since 2018.", "My aunt lived in Seoul for 2018."], "answer": "My aunt has lived in Seoul since 2018.", "exp": "<b>since + 시점</b>이 있으면 현재완료 → has + <b>lived</b>(p.p.). 10/25 데일리 10번 has worked ~ since를 완성하지 못했던 부분이에요."},
{"q": "다음 우리말을 영어로 바르게 옮긴 것은?<br>이것은 이 도시에서 가장 오래된 건물들 중 하나이다.", "choices": ["This is one of the oldest building in this city.", "This is one of oldest buildings in this city.", "This is one of the oldest buildings in this city.", "This is one of the most old buildings in this city."], "answer": "This is one of the oldest buildings in this city.", "exp": "<b>one of the + 최상급 + 복수명사</b>. the와 복수 -s 둘 다 꼭! old는 짧은 형용사라 oldest. 10/30 데일리 5번에서 the most·the를 빠뜨렸어요.", "part": "Part 2 · 7과 one of the 최상급 · every"},
{"q": "다음 우리말을 영어로 바르게 옮긴 것은?<br>그는 우리 학교에서 가장 재능 있는 화가들 중 한 명이다.", "choices": ["He is one of the most talented painter in our school.", "He is one of the most talented painters in our school.", "He is one of the talentedest painters in our school.", "He is the one of most talented painters in our school."], "answer": "He is one of the most talented painters in our school.", "exp": "talented는 긴 형용사 → <b>the most talented</b>, 뒤는 복수 <b>painters</b>. -est를 붙이거나 the 위치를 바꾸면 틀려요."},
{"q": "다음 중 어법상 <b>옳은</b> 문장은?", "choices": ["Every children in this class wears a name tag.", "Every child in this class wear a name tag.", "Every children in this class wear a name tag.", "Every child in this class wears a name tag."], "answer": "Every child in this class wears a name tag.", "exp": "<b>every + 단수명사 + 단수동사</b> → Every child ~ wears. in this class는 꾸미는 말이에요. 10/25·10/23 데일리에서 모름으로 남겼던 every 문장이에요."},
{"q": "다음 우리말을 영어로 바르게 옮긴 것은?<br>우리 형은 요리사가 되기를 바란다.", "choices": ["My brother hopes becoming a chef.", "My brother hope to become a chef.", "My brother hopes to become a chef.", "My brother hopes to becomes a chef."], "answer": "My brother hopes to become a chef.", "exp": "<b>hope + to + 동사원형</b>, 주어 My brother는 하나라 hopes. 10/30 데일리 10번 I hope to trip ~ 에서 to 뒤 동사를 잘못 골랐어요.", "part": "Part 3 · 7과 to부정사 · 수량형용사 · 관계대명사"},
{"q": "다음 우리말을 영어로 바르게 옮긴 것은?<br>그들은 새 노트북을 사기로 결정했다.", "choices": ["They decided to buy a new laptop.", "They decided buying a new laptop.", "They decided to bought a new laptop.", "They decided to buying a new laptop."], "answer": "They decided to buy a new laptop.", "exp": "<b>decide + to + 동사원형</b>. 시제는 decided에만 넣고 to 뒤는 늘 원형 buy예요. 10/25 데일리 8번 have plan to 실수와 같은 자리예요."},
{"q": "다음 우리말을 영어로 바르게 옮긴 것은?<br>병에 물이 거의 없다.", "choices": ["There is a little water in the bottle.", "There is little water in the bottle.", "There are few water in the bottle.", "There is few water in the bottle."], "answer": "There is little water in the bottle.", "exp": "water는 셀 수 없음 → little 계열, '거의 없다'는 a 없는 <b>little</b>. a little은 '조금 있다'라 뜻이 달라요. 10/22 클리닉 a little waters 실수를 기억해요."},
{"q": "다음 우리말을 영어로 바르게 옮긴 것은?<br>내가 어제 산 모자는 너무 작다.", "choices": ["The hat that I bought it yesterday is too small.", "The hat I bought yesterday are too small.", "The hat that I bought yesterday is too small.", "The hat that bought I yesterday is too small."], "answer": "The hat that I bought yesterday is too small.", "exp": "The hat + <b>that I bought</b>(목적어 빠짐) + is too small. 뒤에 it을 또 쓰지 않고, 동사는 주어 The hat(하나)에 맞춰 <b>is</b>."},
{"q": "다음 우리말을 영어로 바르게 옮긴 것은?<br>내가 어제 도와준 그 소년은 내 이웃이다.", "choices": ["The boy whom I helped him yesterday is my neighbor.", "The boy which I helped yesterday is my neighbor.", "The boy whom helped I yesterday is my neighbor.", "The boy whom I helped yesterday is my neighbor."], "answer": "The boy whom I helped yesterday is my neighbor.", "exp": "사람(boy) → <b>whom(who, that)</b>, 사물에 쓰는 which ✕. 관계대명사 뒤는 <b>주어 + 동사</b> 순서, him을 또 쓰지 않아요."},
{"q": "다음 우리말을 영어로 바르게 옮긴 것은?<br>네가 우산을 가져가지 않으면 젖을 것이다.", "choices": ["Unless you don't take an umbrella, you will get wet.", "Unless you take an umbrella, you will get wet.", "If you take an umbrella, you will get wet.", "Unless you will take an umbrella, you get wet."], "answer": "Unless you take an umbrella, you will get wet.", "exp": "<b>Unless = If ~ not</b>이라 안에 not을 또 쓰지 않아요. 조건절은 현재시제(take), 주절은 will. 8과 핵심 문법!", "part": "Part 4 · 8과 If · Unless · 감탄문"},
{"q": "다음 우리말을 영어로 바르게 옮긴 것은?<br>만약 내일 눈이 오면, 우리는 눈사람을 만들 것이다.", "choices": ["If it will snow tomorrow, we will make a snowman.", "If it snow tomorrow, we will make a snowman.", "If it snows tomorrow, we will make a snowman.", "Unless it snows tomorrow, we will make a snowman."], "answer": "If it snows tomorrow, we will make a snowman.", "exp": "조건의 If 절은 미래라도 <b>현재시제</b>, 주어 it은 3인칭 단수라 <b>snows</b>. Unless를 쓰면 '눈이 안 오면'이 되어 뜻이 반대예요."},
{"q": "다음 우리말을 영어로 바르게 옮긴 것은?<br>정말 귀여운 강아지구나!", "choices": ["What cute a puppy it is!", "What a cute puppy it is!", "How a cute puppy it is!", "What a cute puppy is it!"], "answer": "What a cute puppy it is!", "exp": "<b>What + a + 형용사 + 명사 + 주어 + 동사!</b> 감탄문은 주어·동사 순서 그대로(it is). 7과 대화문 What a great deal! 과 같은 모양이에요."}
]
;

var QUIZ_ID = "clinic-hsj-1103";
var QUIZ_TITLE = "한승주 사진 클리닉 11/03";
var KEEP = false;
var SAVE_KEY = "engfit-" + QUIZ_ID;

/* ══════ 진행 로직 ══════ */
var studentName = "";
var current = 0;
var correctCount = 0;
var wrongNumbers = [];
var unknownNumbers = [];
var answersLog = [];
var startTime = 0;
var elapsedBefore = 0;

var nameInput = document.getElementById("name-input");
var startBtn = document.getElementById("start-btn");

function loadSaved() {
  if (!KEEP) return null;
  try { var s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function saveProgress() {
  if (!KEEP) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ name: studentName, current: current, correctCount: correctCount, wrongNumbers: wrongNumbers, unknownNumbers: unknownNumbers, answersLog: answersLog, elapsed: elapsedBefore + Math.round((Date.now() - startTime) / 1000) })); } catch (e) {}
}
function clearSaved() { if (!KEEP) return; try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

var saved = loadSaved();
if (saved && saved.answersLog && saved.answersLog.length > 0 && saved.answersLog.length < QUESTIONS.length) {
  var note = document.getElementById("resume-note");
  note.textContent = "이어 풀기 가능: " + saved.answersLog.length + "/" + QUESTIONS.length + " 풀었어요. 시작하기를 누르면 이어서 풀어요.";
  note.classList.remove("hidden");
  if (saved.name) nameInput.value = saved.name;
}

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  var sv = loadSaved();
  if (sv && sv.name === studentName && sv.answersLog && sv.answersLog.length > 0 && sv.answersLog.length < QUESTIONS.length) {
    current = sv.current; correctCount = sv.correctCount; wrongNumbers = sv.wrongNumbers; unknownNumbers = sv.unknownNumbers || []; answersLog = sv.answersLog; elapsedBefore = sv.elapsed || 0;
  }
  document.getElementById("start-card").classList.add("hidden");
  document.getElementById("quiz-card").classList.remove("hidden");
  showQuestion();
});

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

var CIRCLED = ["①", "②", "③", "④", "⑤"];

function partFor(idx) {
  for (var i = idx; i >= 0; i--) if (QUESTIONS[i].part) return QUESTIONS[i].part;
  return "";
}

function showQuestion() {
  var q = QUESTIONS[current];
  document.getElementById("progress").textContent = (current + 1) + " / " + QUESTIONS.length;
  document.getElementById("bar-fill").style.width = Math.round(current / QUESTIONS.length * 100) + "%";
  var pt = document.getElementById("part"), ptxt = partFor(current);
  if (ptxt) { pt.textContent = ptxt; pt.classList.remove("hidden"); } else pt.classList.add("hidden");
  document.getElementById("qtext").innerHTML = "Q" + (current + 1) + ". " + q.q;
  var box = document.getElementById("choices");
  box.innerHTML = "";
  shuffle(q.choices).forEach(function (c, i) {
    var b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
    b.addEventListener("click", function () { pick(c, CIRCLED[i]); });
    box.appendChild(b);
  });
  var u = document.createElement("button");
  u.className = "unknown"; u.id = "unknown-btn";
  u.textContent = "🤔 모름";
  u.addEventListener("click", function () { pick("모름", "", true); });
  box.appendChild(u);
}

var locked = false;
function pick(choice, mark, unknown) {
  if (locked) return; locked = true;
  var q = QUESTIONS[current];
  var ok = !unknown && choice === q.answer;
  if (ok) correctCount++;
  else wrongNumbers.push(current + 1);
  var entry = { no: current + 1, ok: ok, chosen: choice, answer: q.answer };
  if (unknown) { entry.unknown = true; unknownNumbers.push(current + 1); }
  answersLog.push(entry);
  current++;
  saveProgress();
  setTimeout(function () {
    locked = false;
    if (current < QUESTIONS.length) showQuestion();
    else showResult();
  }, 250);
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}

function showResult() {
  clearSaved();
  document.getElementById("quiz-card").classList.add("hidden");
  document.getElementById("result-card").classList.remove("hidden");
  document.getElementById("score-line").textContent = correctCount + " / " + QUESTIONS.length;

  var ul = document.createElement("div");
  ul.className = "sub"; ul.id = "unknown-line"; ul.style.textAlign = "center";
  ul.textContent = unknownLine();
  document.getElementById("score-line").insertAdjacentElement("afterend", ul);
  var expBox = document.getElementById("explanations");
  QUESTIONS.forEach(function (q, i) {
    var log = answersLog[i];
    var d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>Q" + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 → 정답: " + q.answer : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });

  engfitSubmitWithStatus({
    quizId: QUIZ_ID,
    quizTitle: QUIZ_TITLE,
    student: studentName,
    score: correctCount,
    total: QUESTIONS.length,
    wrong: wrongNumbers,
    unknown: unknownNumbers,
    durationSec: elapsedBefore + Math.round((Date.now() - startTime) / 1000),
    detail: answersLog
  });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 사진 클리닉 11/03 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + QUESTIONS.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n" + unknownLine();
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});
</script>
</body>
</html>
