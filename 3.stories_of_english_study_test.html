<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EngFit 단어 학습+테스트 · Stories of English Words and Expressions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2b2b; --ink-d:#111111; --sub:#7a7d76;
    --bg:#dcdfd8; --card:#f4f5f1;
    --green:#4f7d4e; --green-bg:#ecf4ea;
    --red:#c0564b; --red-bg:#faeceb;
    --blue:#3a5a8c; --blue-bg:#eaf0f8;
    --line:#c9cdc2; --shadow:0 14px 36px rgba(43,43,43,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Noto Sans KR',sans-serif;color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    min-height:100dvh;padding:16px;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.35) 0%, transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(43,43,43,.05) 0%, transparent 40%),
      var(--bg);
    position:relative;overflow-x:hidden;
  }
  .deco{position:fixed;pointer-events:none;z-index:0;color:var(--ink);font-size:20px;opacity:.85;}
  .deco.big{font-size:28px;}
  .eng{font-family:'Patrick Hand',cursive;}
  .app{
    width:100%;max-width:460px;background:var(--card);
    border-radius:18px;box-shadow:var(--shadow);
    overflow:hidden;position:relative;min-height:640px;
    display:flex;flex-direction:column;z-index:1;border:2px solid var(--ink);
  }
  .logo{display:flex;align-items:center;}
  .logo svg{display:block;}
  .screen{flex:1;display:none;flex-direction:column;padding:26px 22px 24px;}
  .screen.on{display:flex;}

  #start{align-items:center;justify-content:center;text-align:center;gap:6px;background:var(--card);}
  #start .badge{
    margin:6px 0 12px;width:190px;height:190px;border-radius:50%;
    background:#fbfcf9;border:2px solid var(--ink);
    box-shadow:0 0 0 6px var(--card), 0 0 0 8px var(--ink), 0 14px 26px rgba(43,43,43,.16);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;
  }
  .badge .star{color:var(--ink);font-size:14px;letter-spacing:5px;}
  #start h1{
    margin:10px 0 2px;font-size:1.7em;font-weight:900;
    color:transparent;-webkit-text-stroke:1.3px var(--ink);letter-spacing:2px;
  }
  #start .unit{font-family:'Patrick Hand',cursive;font-size:1.18em;color:var(--ink);letter-spacing:1px;}
  #start .meta{margin-top:5px;font-size:.92em;color:var(--sub);}
  .btn{
    border:none;border-radius:14px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;
    font-weight:700;transition:transform .08s, box-shadow .2s, background .2s;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{
    background:var(--ink);color:#f4f5f1;font-size:1.08em;padding:16px 20px;width:100%;
    box-shadow:0 8px 18px rgba(43,43,43,.3);
  }
  .btn-primary:active{background:var(--ink-d);}
  .btn-study{
    background:var(--blue);color:#fff;font-size:1.08em;padding:16px 20px;width:100%;
    box-shadow:0 8px 18px rgba(58,90,140,.3);
  }
  #start .startwrap{width:100%;margin-top:20px;display:flex;flex-direction:column;gap:11px;}
  .kbdhint{margin-top:12px;font-size:.8em;color:var(--sub);}
  .kbdhint b{color:var(--ink);}

  #study{padding-top:18px;background:var(--card);}
  .stop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .stitle{font-size:.84em;font-weight:700;color:var(--blue);background:var(--blue-bg);padding:5px 12px;border-radius:99px;}
  .scount{font-size:.92em;color:var(--sub);font-weight:700;}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px;}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ink),#5a5d56);border-radius:99px;transition:width .3s;}
  .wcard{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    background:#fbfcf9;border:2px solid var(--line);border-radius:18px;
    padding:26px 20px;text-align:center;gap:12px;min-height:330px;
  }
  .wcard .num-badge{font-size:.78em;color:var(--sub);font-weight:700;letter-spacing:1px;}
  .wcard .w-en{font-family:'Patrick Hand',cursive;font-size:2.7em;line-height:1.1;color:var(--ink);word-break:break-word;}
  .wcard .w-ko{font-family:'Noto Sans KR',sans-serif;font-size:1.65em;font-weight:700;line-height:1.3;color:var(--blue);}
  .wcard .divider{width:46px;height:3px;background:var(--line);border-radius:99px;margin:4px auto;}
  .wcard .ex-label{font-size:.74em;color:var(--sub);font-weight:700;letter-spacing:2px;}
  .wcard .ex-en{font-family:'Patrick Hand',cursive;font-size:1.4em;line-height:1.35;color:var(--ink);}
  .wcard .ex-en b{color:var(--red);font-weight:400;border-bottom:2px solid var(--red);}
  .wcard .ex-ko{font-size:.98em;color:var(--sub);line-height:1.45;}
  .snav{display:flex;gap:10px;margin-top:16px;}
  .snav .btn-ghost{flex:1;}
  .btn-ghost{background:#e2e5dd;color:var(--ink);font-size:1em;padding:14px;width:100%;}
  .btn-ghost:disabled{opacity:.4;cursor:default;}
  #study .gotest{margin-top:10px;}
  .skbd{margin-top:10px;font-size:.78em;color:var(--sub);text-align:center;}
  .skbd b{color:var(--ink);}

  #quiz{padding-top:18px;background:var(--card);}
  .qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .count{font-size:.92em;color:var(--sub);font-weight:700;}
  .prompt{
    flex:0 0 auto;min-height:120px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:8px;margin-bottom:22px;
  }
  .qtag{font-size:.82em;font-weight:700;color:var(--ink);background:rgba(43,43,43,.08);padding:5px 12px;border-radius:99px;border:1px solid var(--line);}
  .qword-en{font-family:'Patrick Hand',cursive;font-size:2.6em;line-height:1.1;color:var(--ink);}
  .qword-ko{font-family:'Noto Sans KR',sans-serif;font-size:1.65em;font-weight:700;line-height:1.3;color:var(--ink);}
  .choices{display:flex;flex-direction:column;gap:11px;margin-top:auto;}
  .choice{
    width:100%;text-align:center;background:#fbfcf9;border:2px solid var(--line);
    border-radius:14px;padding:15px 14px;cursor:pointer;color:var(--ink);
    transition:border-color .15s, background .15s, transform .08s;
  }
  .choice:active{transform:scale(.98);}
  .choice.ko{font-family:'Noto Sans KR',sans-serif;font-size:0.96em;font-weight:500;}
  .choice.en{font-family:'Patrick Hand',cursive;font-size:1.44em;}
  .choice.correct{border-color:var(--green);background:var(--green-bg);color:var(--green);font-weight:700;}
  .choice.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red);}
  .choice.lock{pointer-events:none;}
  .choice .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:7px;margin-right:9px;
    background:rgba(43,43,43,.07);color:var(--sub);
    font-family:'Noto Sans KR',sans-serif;font-size:.72rem;font-weight:700;vertical-align:middle;
  }
  .choice.correct .num{background:rgba(79,125,78,.15);color:var(--green);}
  .choice.wrong .num{background:rgba(192,86,75,.15);color:var(--red);}

  .typebox{display:flex;flex-direction:column;gap:11px;margin-top:auto;}
  .typebox input{
    width:100%;text-align:center;background:#fbfcf9;border:2px solid var(--line);
    border-radius:14px;padding:14px;color:var(--ink);outline:none;
    font-family:'Patrick Hand',cursive;font-size:1.44em;
    transition:border-color .15s, background .15s;
  }
  .typebox input:focus{border-color:var(--ink);}
  .typebox input.correct{border-color:var(--green);background:var(--green-bg);color:var(--green);font-weight:700;}
  .typebox input.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red);}
  .typeanswer{text-align:center;font-size:1em;color:var(--green);font-weight:700;display:none;}
  .typeanswer .eng{font-size:1.35em;}
  .typehint{text-align:center;font-size:.8em;color:var(--sub);}

  #result{padding-top:20px;background:var(--card);}
  #result .logo{justify-content:center;margin-bottom:8px;}
  .scorecard{text-align:center;margin:6px 0 18px;}
  .scorecard .emoji{font-size:46px;}
  .scorecard .score{font-size:2.4em;font-weight:900;margin-top:4px;color:var(--ink);}
  .scorecard .score small{font-size:.42em;color:var(--sub);font-weight:700;}
  .scorecard .pct{font-size:1em;color:var(--ink);font-weight:700;margin-top:2px;}
  .reviewhead{font-size:.95em;font-weight:700;margin:6px 2px 10px;display:flex;justify-content:space-between;align-items:center;color:var(--ink);}
  .reviewhead .ok{color:var(--green);font-size:.92em;}
  .review{display:flex;flex-direction:column;gap:9px;max-height:240px;overflow-y:auto;padding:2px;}
  .ritem{border:1.5px solid var(--red-bg);background:#fbfcf9;border-radius:14px;padding:11px 13px;border-left:5px solid var(--red);}
  .ritem .q{font-size:.8em;color:var(--sub);font-weight:600;margin-bottom:3px;}
  .ritem .ans{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-size:.95em;}
  .ritem .yours{color:var(--red);} .ritem .yours s{opacity:.8;}
  .ritem .right{color:var(--green);font-weight:700;}
  .ritem b.eng{font-family:'Patrick Hand',cursive;font-size:1.2em;font-weight:400;color:var(--ink);}
  .allright{text-align:center;color:var(--green);font-weight:700;padding:18px;background:var(--green-bg);border-radius:14px;}
  .actions{margin-top:16px;display:flex;flex-direction:column;gap:10px;}
  .btn-kakao{background:#FEE500;color:#3a1d1d;font-size:1.04em;padding:15px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;}
  .toast{
    position:absolute;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#f4f5f1;padding:11px 18px;border-radius:99px;font-size:.9em;font-weight:600;
    opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

  <section id="quiz" class="screen">

<script>
const WORDS = [
  {en:"come from", ko:"~에서 유래하다", ex:"Many English words <b>come from</b> Latin.", exKo:"많은 영어 단어가 라틴어에서 유래한다."},
  {en:"be used for", ko:"~에 사용되다", ex:"This room <b>is used for</b> meetings.", exKo:"이 방은 회의에 사용된다."},
  {en:"massage", ko:"마사지, 안마", ex:"A good <b>massage</b> helps you relax.", exKo:"좋은 마사지는 긴장을 풀어 준다."},
  {en:"trader", ko:"상인, 거래자", ex:"The <b>trader</b> bought goods directly from producers.", exKo:"그 상인은 생산자에게서 직접 물건을 샀다."},
  {en:"introduce", ko:"소개하다, 전하다", ex:"Traders <b>introduced</b> new words to other countries.", exKo:"상인들이 다른 나라에 새로운 단어를 전했다."},
  {en:"enter", ko:"들어가다", ex:"Please knock before you <b>enter</b> the room.", exKo:"방에 들어가기 전에 노크해 주세요."},
  {en:"present", ko:"현재의, 현 ~", ex:"The <b>present</b> meaning of the word is different.", exKo:"그 단어의 현재 의미는 다르다."},
  {en:"soap", ko:"비누", ex:"Wash your hands with <b>soap</b>.", exKo:"비누로 손을 씻어라."},
  {en:"play", ko:"희곡, 연극", ex:"We watched a <b>play</b> at the theater.", exKo:"우리는 극장에서 연극을 봤다."},
  {en:"design", ko:"설계하다, 고안하다", ex:"She <b>designed</b> a new app.", exKo:"그녀는 새로운 앱을 고안했다."},

/* ===== 학습 모드 ===== */
let sList=[], sIdx=0;
function startStudy(){
  if(wrongs.length>0 && document.getElementById('result').classList.contains('on')){
    const wset=new Set(wrongs.map(w=>w.en));
    sList=WORDS.filter(w=>wset.has(w.en));
  }else{
    sList=WORDS.slice();
  }
  sIdx=0;
  document.getElementById('stotal').textContent=sList.length;
  show('study');
  renderStudy();
}
function renderStudy(){
  const w=sList[sIdx];
  document.getElementById('scur').textContent=sIdx+1;
  document.getElementById('snum').textContent='WORD '+(sIdx+1);
  document.getElementById('sen').textContent=w.en;
  document.getElementById('sko').textContent=w.ko;
  document.getElementById('sexen').innerHTML=w.ex;
  document.getElementById('sexko').textContent=w.exKo;
  document.getElementById('sprog').style.width=((sIdx+1)/sList.length*100)+'%';
  document.getElementById('sprev').disabled = sIdx===0;
  document.getElementById('snext').disabled = sIdx===sList.length-1;
}
function studyMove(d){
  const n=sIdx+d;
  if(n<0||n>=sList.length) return;
  sIdx=n; renderStudy();
}

/* ===== 테스트 모드 ===== */
let queue=[], idx=0, score=0, wrongs=[], locked=false;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');}

function buildQuestion(word){
  const canType = !/[.?…]/.test(word.en);
  if(canType && Math.random()<0.35){
    return {word, type:'typing'};
  }
  const dir = Math.random()<0.5 ? 'en2ko' : 'ko2en';
  const key = dir==='en2ko' ? 'ko' : 'en';
  const distractPool = shuffle(WORDS.filter(w=>w.en!==word.en && w.ko!==word.ko));
  const opts=[word];
  for(const w of distractPool){
    if(opts.length>=4) break;
    if(opts.some(o=>o[key]===w[key])) continue;
    opts.push(w);
  }
  return {word, type:'mc', dir, key, options:shuffle(opts)};
}

function startQuiz(){
  queue = shuffle(WORDS).map(buildQuestion);
  idx=0; score=0; wrongs=[];
  document.getElementById('total').textContent=queue.length;
  show('quiz');
  render();
}

function render(){
  locked=false;
  const q=queue[idx];
  document.getElementById('cur').textContent=idx+1;
  document.getElementById('prog').style.width=((idx)/queue.length*100)+'%';

  const pw=document.getElementById('promptword');
  const tag=document.getElementById('qtag');
  const box=document.getElementById('choices');
  const tbox=document.getElementById('typebox');

  if(q.type==='typing'){
    tag.textContent='영어로 쓰기 ⏎';
    pw.className='qword-ko';
    pw.textContent=q.word.ko;
    box.style.display='none';
    tbox.style.display='flex';
    const inp=document.getElementById('typeinput');
    inp.value=''; inp.className=''; inp.disabled=false;
    document.getElementById('typeanswer').style.display='none';
    inp.focus();
    return;
  }

  tbox.style.display='none';
  box.style.display='flex';
  if(q.dir==='en2ko'){
    tag.textContent='뜻 고르기';
    pw.className='qword-en eng';
    pw.textContent=q.word.en;
  }else{
    tag.textContent='단어 고르기';
    pw.className='qword-ko';
    pw.textContent=q.word.ko;
  }

  box.innerHTML='';
  q.options.forEach((opt,i)=>{
    const b=document.createElement('button');
    const isEn = q.key==='en';
    b.className='choice '+(isEn?'en eng':'ko');
    b.dataset.val=opt[q.key];
    const num=document.createElement('span');
    num.className='num'; num.textContent=i+1;
    b.appendChild(num);
    b.appendChild(document.createTextNode(opt[q.key]));
    b.onclick=()=>choose(b,opt,q);
    box.appendChild(b);
  });
}

function choose(btn,opt,q){
  if(locked) return;
  locked=true;
  const correct = opt.en===q.word.en;
  const buttons=[...document.getElementById('choices').children];
  buttons.forEach(b=>b.classList.add('lock'));

  if(correct){
    btn.classList.add('correct');
    score++;
    setTimeout(next,250);
  }else{
    btn.classList.add('wrong');
    buttons.forEach(b=>{ if(b.dataset.val===q.word[q.key]) b.classList.add('correct'); });
    wrongs.push({dir:q.dir, en:q.word.en, ko:q.word.ko, chosen: opt[q.key], correct:q.word[q.key], key:q.key});
    setTimeout(next,900);
  }
}

function norm(s){
  return s.toLowerCase().replace(/[’‘`]/g,"'").replace(/\s+/g,' ').trim();
}
function submitTyping(){
  if(locked) return;
  const q=queue[idx];
  if(!q || q.type!=='typing') return;
  const inp=document.getElementById('typeinput');
  const val=inp.value;
  if(norm(val)==='') { inp.focus(); return; }
  locked=true;
  inp.disabled=true;
  const accepted = WORDS.filter(w=>w.ko===q.word.ko).map(w=>norm(w.en));
  const correct = accepted.indexOf(norm(val))>=0;
  if(correct){
    inp.classList.add('correct');
    score++;
    setTimeout(next,250);
  }else{
    inp.classList.add('wrong');
    const ans=document.getElementById('typeanswer');
    ans.innerHTML='정답: <b class="eng">'+q.word.en+'</b>';
    ans.style.display='block';
    wrongs.push({dir:'typing', en:q.word.en, ko:q.word.ko, chosen: val.trim(), correct:q.word.en, key:'en'});
    setTimeout(next,1500);
  }
}

document.addEventListener('keydown',function(e){
  if(document.getElementById('study').classList.contains('on')){
    if(e.key==='ArrowLeft'){ e.preventDefault(); studyMove(-1); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); studyMove(1); }
    return;
  }
  if(!document.getElementById('quiz').classList.contains('on')) return;
  const q=queue[idx];
  if(!q || locked) return;
  if(q.type==='mc'){
    const n={'1':0,'2':1,'3':2,'4':3}[e.key];
    if(n!==undefined){
      const b=document.getElementById('choices').children[n];
      if(b){ e.preventDefault(); b.click(); }
    }
  }else if(q.type==='typing' && e.key==='Enter'){
    e.preventDefault();
    submitTyping();
  }
});

function next(){
  idx++;
  if(idx>=queue.length){ finish(); }
  else render();
}

function finish(){
  document.getElementById('prog').style.width='100%';
  const total=queue.length;
  const pct=Math.round(score/total*100);
  document.getElementById('rscore').textContent=score;
  document.getElementById('rtotal').textContent=total;
  document.getElementById('rpct').textContent=pct+'%';
  document.getElementById('remoji').textContent = pct===100?'🏆': pct>=80?'🎉': pct>=60?'👍':'💪';

  const review=document.getElementById('review');
  const ok=document.getElementById('rvok');
  const title=document.getElementById('rvtitle');
  review.innerHTML='';
  if(wrongs.length===0){
    title.textContent='오답 확인';
    ok.textContent='';
    review.innerHTML='<div class="allright">완벽해요! 틀린 단어가 없어요 ✨</div>';
  }else{
    title.textContent='오답 확인 ('+wrongs.length+')';
    ok.textContent='맞은 단어 '+score+'개';
    wrongs.forEach(w=>{
      const enB='<b class="eng">'+w.en+'</b>';
      const div=document.createElement('div');
      div.className='ritem';
      div.innerHTML =
        '<div class="q">'+enB+' &nbsp;—&nbsp; '+w.ko+'</div>'+
        '<div class="ans"><span class="yours">내 답: <s>'+w.chosen+'</s></span>'+
        '<span class="right">정답: '+w.correct+'</span></div>';
      review.appendChild(div);
    });
  }
  show('result');
}

function copyResult(){
  const total=queue.length, pct=Math.round(score/total*100);
  let t='[EngFit 단어 테스트]\n3. Stories of English Words and Expressions (동아 윤정미·중3)\n\n';
  t+='학생: 이하진\n';
  t+='점수: '+score+'/'+total+' ('+pct+'%)\n';
  t+='날짜: '+new Date().toLocaleDateString('ko-KR')+'\n';
  if(wrongs.length===0){
    t+='\n🏆 모두 정답! 완벽합니다.';
  }else{
    t+='\n■ 틀린 단어 ('+wrongs.length+')\n';
    wrongs.forEach((w,i)=>{ t+=(i+1)+'. '+w.en+' - '+w.ko+'\n'; });
    t+='\n👉 틀린 단어는 학습 모드에서 예문과 함께 다시 외워 보세요!';
  }
  const done=()=>showToast('복사되었습니다!');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));
  }else{ fallbackCopy(t,done); }
}
function fallbackCopy(text,cb){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta); cb&&cb();
}
let toastT;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(function(){el.classList.remove('show');},1600);
}
function restart(){ show('start'); }
</script>
