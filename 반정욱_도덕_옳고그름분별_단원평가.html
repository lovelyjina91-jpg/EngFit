<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>반정욱 · 도덕 단원평가 | 옳고 그름을 어떻게 분별할 수 있을까?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1a2550; --navy2:#243266; --gold:#f4a823; --gold-soft:#fff4dd;
    --green:#16a34a; --green-soft:#e9f9ef; --red:#ef4444; --red-soft:#fdeef0;
    --ink:#1f2433; --muted:#6b7280; --line:#e8eaf0; --bg:#eef1f7; --card:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);
    display:flex;justify-content:center;line-height:1.6;
  }
  .app{width:100%;max-width:460px;min-height:100vh;background:var(--bg);
    display:flex;flex-direction:column;position:relative}

  /* ===== Header ===== */
  header{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);
    color:#fff;padding:16px 20px;display:flex;align-items:center;gap:11px;
    position:sticky;top:0;z-index:30;box-shadow:0 2px 14px rgba(26,37,80,.28)
  }
  header .logo{height:40px;filter:brightness(0) invert(1);flex-shrink:0}
  header .htxt{display:flex;flex-direction:column;line-height:1.15}
  header .brand{font-family:'Nunito',sans-serif;font-weight:900;font-size:19px;letter-spacing:.3px}
  header .sub{font-size:11px;color:#b9c2e6;font-weight:500;margin-top:1px}
  header .badge{margin-left:auto;background:var(--gold);color:var(--navy);
    font-weight:900;font-size:11px;padding:5px 11px;border-radius:20px;white-space:nowrap}

  /* ===== Progress ===== */
  .progwrap{position:sticky;top:72px;z-index:20;background:var(--bg);
    padding:12px 20px 8px;border-bottom:1px solid var(--line)}
  .progwrap.hidden{display:none}
  .progtop{display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:700}
  .progtop b{color:var(--navy);font-family:'Nunito',sans-serif;font-size:13px}
  .progbar{height:8px;background:#dfe3ee;border-radius:99px;overflow:hidden}
  .progfill{height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--gold),#ffc857);transition:width .35s cubic-bezier(.4,0,.2,1)}

  /* ===== Main ===== */
  main{flex:1;padding:18px 20px 28px;display:flex;flex-direction:column}

  /* ===== Start screen ===== */
  .start{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;
    padding:10px 4px 40px;animation:fade .4s ease}
  .start .cube{height:96px;margin:0 auto 22px;animation:float 3.2s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .start h1{font-size:23px;font-weight:900;color:var(--navy);line-height:1.4;margin-bottom:6px;
    word-break:keep-all}
  .start .unit{display:inline-block;background:var(--gold-soft);color:#b67400;
    font-weight:700;font-size:12.5px;padding:5px 13px;border-radius:20px;margin-bottom:18px}
  .start .desc{color:var(--muted);font-size:14px;margin-bottom:8px;word-break:keep-all}
  .start .name{font-weight:900;color:var(--navy);font-size:16px;margin-bottom:24px}
  .meta{display:flex;gap:10px;justify-content:center;margin-bottom:28px;flex-wrap:wrap}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;min-width:84px;box-shadow:0 2px 8px rgba(26,37,80,.05)}
  .chip .n{font-family:'Nunito',sans-serif;font-weight:900;font-size:21px;color:var(--navy)}
  .chip .l{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px}

  .btn{border:none;border-radius:15px;font-family:'Noto Sans KR',sans-serif;
    font-weight:700;font-size:16px;padding:16px;cursor:pointer;width:100%;
    transition:transform .12s ease,box-shadow .2s ease}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--navy);color:#fff;box-shadow:0 6px 18px rgba(26,37,80,.32)}
  .btn-primary:active{box-shadow:0 3px 10px rgba(26,37,80,.3)}
  .btn-gold{background:var(--gold);color:var(--navy);box-shadow:0 6px 18px rgba(244,168,35,.35)}
  .btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}

  /* ===== Question ===== */
  .qbox{animation:slide .35s cubic-bezier(.2,.7,.3,1)}
  @keyframes slide{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:translateX(0)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .qtag{display:inline-block;font-size:11px;font-weight:700;color:var(--gold);
    background:var(--gold-soft);padding:4px 11px;border-radius:8px;margin-bottom:12px}
  .qnum{font-family:'Nunito',sans-serif;font-weight:800;color:var(--muted);font-size:13px;margin-bottom:6px}
  .qtext{font-size:17.5px;font-weight:700;color:var(--ink);line-height:1.5;
    margin-bottom:8px;word-break:keep-all}
  .qquote{background:#f7f8fc;border-left:3px solid var(--gold);border-radius:0 10px 10px 0;
    padding:12px 14px;margin:12px 0 4px;font-size:14px;color:#3a4256;line-height:1.7}
  .qquote .row{display:flex;gap:8px;margin:3px 0}
  .qquote .lab{font-weight:700;color:var(--navy);flex-shrink:0;min-width:62px}

  .opts{display:flex;flex-direction:column;gap:11px;margin-top:18px}
  .opt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;
    padding:15px 16px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;
    font-size:15px;color:var(--ink);transition:all .16s ease;text-align:left;
    box-shadow:0 1px 4px rgba(26,37,80,.04)}
  .opt:active{transform:scale(.985)}
  .opt .key{width:25px;height:25px;border-radius:8px;background:#f0f2f8;color:var(--navy);
    font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;
    transition:all .16s ease}
  .opt .txt{flex:1;line-height:1.5;padding-top:1px;word-break:keep-all}
  .opt.correct{background:var(--green-soft);border-color:var(--green)}
  .opt.correct .key{background:var(--green);color:#fff}
  .opt.wrong{background:var(--red-soft);border-color:var(--red)}
  .opt.wrong .key{background:var(--red);color:#fff}
  .opt.dim{opacity:.55}
  .opt.locked{pointer-events:none}

  /* ===== Feedback ===== */
  .fb{margin-top:16px;border-radius:14px;padding:14px 16px;font-size:14px;
    line-height:1.65;animation:pop .3s ease;display:none}
  .fb.show{display:block}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .fb.ok{background:var(--green-soft);border:1px solid #b6e8c8}
  .fb.no{background:var(--red-soft);border:1px solid #f6c9cf}
  .fb .head{font-weight:900;font-size:14.5px;margin-bottom:5px;display:flex;align-items:center;gap:6px}
  .fb.ok .head{color:var(--green)}
  .fb.no .head{color:var(--red)}
  .fb .exp{color:#3c4356}
  .fb .exp b{color:var(--navy)}

  .navrow{margin-top:18px;display:flex;gap:10px;align-items:center}
  .navrow .btn{flex:1}
  .backbtn{width:50px;height:50px;border-radius:14px;border:1.5px solid var(--line);
    background:#fff;color:var(--navy);font-size:20px;cursor:pointer;flex:none;
    display:flex;align-items:center;justify-content:center;transition:all .15s}
  .backbtn:active{transform:scale(.94)}
  .backbtn:disabled{opacity:.35;pointer-events:none}

  /* ===== Dots ===== */
  .dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:22px;padding:0 4px}
  .dot{width:9px;height:9px;border-radius:50%;background:#cfd5e6;transition:all .25s}
  .dot.done{background:var(--green)}
  .dot.miss{background:var(--red)}
  .dot.cur{background:var(--gold);transform:scale(1.5);box-shadow:0 0 0 3px rgba(244,168,35,.25)}

  /* ===== Result ===== */
  .result{animation:fade .45s ease;text-align:center;padding:8px 4px 30px}
  .gradeCircle{width:148px;height:148px;border-radius:50%;margin:8px auto 18px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;position:relative;box-shadow:0 10px 30px rgba(26,37,80,.22)}
  .gradeCircle .g{font-family:'Nunito',sans-serif;font-weight:900;font-size:62px;line-height:1}
  .gradeCircle .gl{font-size:12px;font-weight:600;opacity:.9;margin-top:2px}
  .result h2{font-size:21px;font-weight:900;color:var(--navy);margin-bottom:4px}
  .result .rsub{color:var(--muted);font-size:14px;margin-bottom:20px}
  .scoreRow{display:flex;gap:10px;margin-bottom:22px}
  .scoreRow .sc{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:15px 8px;box-shadow:0 2px 8px rgba(26,37,80,.05)}
  .scoreRow .sc .n{font-family:'Nunito',sans-serif;font-weight:900;font-size:25px}
  .scoreRow .sc .l{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
  .sc.c1 .n{color:var(--green)} .sc.c2 .n{color:var(--red)} .sc.c3 .n{color:var(--navy)}

  .reviewTitle{text-align:left;font-weight:900;color:var(--navy);font-size:15px;
    margin:6px 2px 12px;display:flex;align-items:center;gap:7px}
  .reviewTitle .ic{width:22px;height:22px;border-radius:7px;background:var(--gold-soft);
    color:#b67400;display:flex;align-items:center;justify-content:center;font-size:13px}
  .rev{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:11px;text-align:left;box-shadow:0 1px 5px rgba(26,37,80,.04)}
  .rev .rq{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:9px;
    line-height:1.5;word-break:keep-all}
  .rev .rq .nn{color:var(--gold);font-family:'Nunito',sans-serif;font-weight:800;margin-right:5px}
  .rev .line{display:flex;gap:7px;font-size:13px;margin:4px 0;align-items:flex-start}
  .rev .line .tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;flex-shrink:0;margin-top:1px}
  .rev .tag.mine{background:var(--red-soft);color:var(--red)}
  .rev .tag.ans{background:var(--green-soft);color:var(--green)}
  .rev .line .v{flex:1;color:#3c4356;line-height:1.45;word-break:keep-all}
  .rev .rexp{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);
    font-size:12.5px;color:var(--muted);line-height:1.55;word-break:keep-all}
  .rev .rexp b{color:var(--navy)}
  .allright{background:var(--green-soft);border:1px solid #b6e8c8;border-radius:14px;
    padding:20px;color:var(--green);font-weight:700;font-size:15px;margin-bottom:18px}

  footer{text-align:center;padding:14px;font-size:11px;color:#9aa0b0}
  footer b{color:var(--navy);font-family:'Nunito',sans-serif}
</style>
</head>

function start(){ cur=0; progwrap.classList.remove('hidden'); renderQ(); }

function updateProg(){
  const done=answered.filter(Boolean).length;
  pfill.style.width=(done/QUESTIONS.length*100)+'%';
  pcur.textContent=done;
}

function renderQ(){
  updateProg();
  const Q=QUESTIONS[cur];
  let quoteHTML='';
  if(Q.quote){
    quoteHTML='<div class="qquote">'+Q.quote.map(r=>
      `<div class="row"><span class="lab">${r[0]}</span><span>${r[1]}</span></div>`).join('')+'</div>';
  }
  const optHTML=Q.opts.map((o,i)=>
    `<button class="opt" data-i="${i}" onclick="choose(${i})">
       <span class="key">${KEYS[i]}</span><span class="txt">${o}</span></button>`).join('');

  main.innerHTML=`
   <div class="qbox">
     <span class="qtag">${Q.sec}</span>
     <div class="qnum">Q${cur+1} / ${QUESTIONS.length}</div>
     <div class="qtext">${Q.q}</div>
     ${quoteHTML}
     <div class="opts" id="opts">${optHTML}</div>
     <div class="fb" id="fb"></div>
     <div class="navrow" id="navrow">
       <button class="backbtn" id="backbtn" onclick="prev()" ${cur===0?'disabled':''}>←</button>
       <button class="btn btn-ghost" id="nextbtn" onclick="next()" style="display:none">다음 문제 →</button>
     </div>
     <div class="dots" id="dots"></div>
   </div>`;
  renderDots();

  // restore answered state
  if(answered[cur]) lockAndShow(chosen[cur],true);
}

function renderDots(){
  const d=document.getElementById('dots');
  d.innerHTML=QUESTIONS.map((_,i)=>{
    let c='dot';
    if(i===cur)c+=' cur';
    else if(answered[i])c+=(chosen[i]===QUESTIONS[i].a?' done':' miss');
    return `<span class="${c}"></span>`;
  }).join('');
}

function choose(i){
  if(answered[cur])return;
  answered[cur]=true; chosen[cur]=i;
  lockAndShow(i,false);
}

function lockAndShow(i,restoring){
  const Q=QUESTIONS[cur];
  const correct=(i===Q.a);
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach((el,idx)=>{
    el.classList.add('locked');
    if(idx===Q.a)el.classList.add('correct');
    if(idx===i&&!correct)el.classList.add('wrong');
    if(idx!==Q.a&&idx!==i)el.classList.add('dim');
  });
  const fb=document.getElementById('fb');
  fb.className='fb show '+(correct?'ok':'no');
  fb.innerHTML=`<div class="head">${correct?'✓ 정답입니다!':'✕ 다시 확인해요'}</div>
    <div class="exp">${correct?'':'정답: <b>'+KEYS[Q.a]+'. '+Q.opts[Q.a]+'</b><br>'}${Q.exp}</div>`;
  renderDots();
  updateProg();

  const isLast=(cur===QUESTIONS.length-1);
  const nextbtn=document.getElementById('nextbtn');

  if(correct && !restoring && !isLast){
    // auto-advance on correct
    nextbtn.style.display='none';
    setTimeout(()=>{ if(cur<QUESTIONS.length-1){cur++;renderQ();} },1300);
  }else{
    nextbtn.style.display='block';
    nextbtn.textContent=isLast?'결과 보기 →':'다음 문제 →';
    nextbtn.className='btn '+(isLast?'btn-gold':'btn-ghost');
  }
}

function next(){
  if(cur<QUESTIONS.length-1){cur++;renderQ();}
  else renderResult();
}
function prev(){ if(cur>0){cur--;renderQ();} }

function renderResult(){
  progwrap.classList.add('hidden');
  const total=QUESTIONS.length;
  const right=chosen.filter((c,i)=>c===QUESTIONS[i].a).length;
  const wrong=total-right;
  const pct=Math.round(right/total*100);

  let g,gl,col;
  if(pct===100){g='S';gl='완벽해요!';col='linear-gradient(135deg,#f4a823,#ffce5c)';}
  else if(pct>=90){g='A';gl='훌륭해요';col='linear-gradient(135deg,#16a34a,#43c97a)';}
  else if(pct>=80){g='B';gl='잘했어요';col='linear-gradient(135deg,#2563eb,#5b8def)';}
  else if(pct>=70){g='C';gl='좋아요';col='linear-gradient(135deg,#1a2550,#3a4a86)';}
  else if(pct>=60){g='D';gl='조금 더!';col='linear-gradient(135deg,#d97706,#f0a730)';}
  else {g='F';gl='복습 필요';col='linear-gradient(135deg,#ef4444,#f47272)';}

  let reviewHTML='';
  const wrongs=QUESTIONS.map((Q,i)=>({Q,i})).filter(x=>chosen[x.i]!==x.Q.a);
  if(wrongs.length===0){
    reviewHTML=`<div class="allright">🎉 모든 문제를 맞혔어요! 완벽한 이해예요.</div>`;
  }else{
    reviewHTML=`<div class="reviewTitle"><span class="ic">✎</span>틀린 문제 다시 보기 (${wrongs.length})</div>`+
      wrongs.map(({Q,i})=>{
        const mine=chosen[i];
        return `<div class="rev">
          <div class="rq"><span class="nn">Q${i+1}</span>${Q.q}</div>
          <div class="line"><span class="tag mine">내 답</span><span class="v">${mine>=0?KEYS[mine]+'. '+Q.opts[mine]:'무응답'}</span></div>
          <div class="line"><span class="tag ans">정답</span><span class="v">${KEYS[Q.a]}. ${Q.opts[Q.a]}</span></div>
          <div class="rexp">💡 ${Q.exp}</div>
        </div>`;
      }).join('');
  }

  main.innerHTML=`
   <div class="result">
     <div class="gradeCircle" style="background:${col}">
       <div class="g">${g}</div><div class="gl">${gl}</div>
     </div>
     <h2>${right} / ${total} 정답</h2>
     <div class="rsub">정답률 ${pct}% · 반정욱 학생</div>
     <div class="scoreRow">
       <div class="sc c1"><div class="n">${right}</div><div class="l">맞은 문제</div></div>
       <div class="sc c2"><div class="n">${wrong}</div><div class="l">틀린 문제</div></div>
       <div class="sc c3"><div class="n">${pct}<span style="font-size:15px">%</span></div><div class="l">정답률</div></div>
     </div>
     ${reviewHTML}
     <button class="btn btn-primary" style="margin-top:8px" onclick="init()">↻ 다시 풀기</button>
   </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

init();
</script>
</body>
</html>
