</div>

<script>
"use strict";

/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#2e7d6e"; }
  else { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#c0392b"; }
}


/* ══════ 문제 데이터 (개념 페이지 + 쌍둥이 문제) ══════ */
var STEPS = [
 {
  "type": "concept",
  "html": "<div class='ctitle'>① 현재완료 ↔ 과거 — 과거 시점(ago · last ~ · yesterday · When)과는 과거형 (8과)</div><div class='box'><div class='lab'>교과서 문장 (8과 본문)</div>I've never seen such a huge thing. → have/has + p.p. = 과거의 일이 지금까지 이어짐</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>has broken her leg <b>two weeks ago</b> / have visited <b>last Saturday</b> / <b>When have</b> you lost ~?</div><div class='box ok'><div class='lab'>정답 모양</div>딱 그때를 말하는 말(ago, last ~, yesterday, When)이 있으면 <b>과거형</b> · for / since / ever / never / already / just 는 <b>현재완료</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>우리말로는 둘 다 '~했다'라서 헷갈려요(지난 클리닉 9번). 현재완료는 '<b>언제</b>'를 말하지 않아요. 문장에 <b>과거의 한 시점</b>이 보이면 현재완료를 버리고 과거형! 먼저 문장 끝의 시간 표현에 동그라미를 쳐 보세요.</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>I <b class='hl'>lost</b> my cap <b class='hl'>yesterday</b>. (have lost ✕)</li><li>I <b class='hl'>have lost</b> my cap. (지금도 없음) / I <b class='hl'>have had</b> it <b class='hl'>since</b> May.</li></ul></div><div class='trap'>⚠️ 함정: 현재완료 + ago / last / yesterday ✕ · When + 현재완료 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>My cousin ______ her leg two weeks ago.</div>",
  "choices": ["has broken", "broke", "have broken", "has broke"],
  "answer": "broke",
  "exp": "two weeks <b>ago</b>(과거 시점) → 현재완료 ✕, 과거형 <b>broke</b>."
 },
 {
  "type": "twin",
  "q": "대화의 빈칸에 알맞은 말은?<div class='pass'>A: When ______ you ______ to this town?<br>B: Three years ago.</div>",
  "choices": ["have – moved", "do – moved", "did – move", "have – move"],
  "answer": "did – move",
  "exp": "When 은 딱 그때를 묻는 말 → 현재완료 ✕ → <b>When did you move ~?</b>"
 },
 {
  "type": "twin",
  "q": "어법상 <b>옳은</b> 문장은?",
  "choices": ["We have visited the aquarium last Saturday.", "Dohee has finished the puzzle an hour ago.", "When have you lost your wallet?", "I have known Yerin since first grade."],
  "answer": "I have known Yerin since first grade.",
  "exp": "<b>since + 시작 시점</b>은 현재완료와 짝. last Saturday · an hour ago · When 은 과거형(visited · finished · did you lose)."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>② such + a + 형용사 + 명사 · 현재완료 경험 never (8과)</div><div class='box'><div class='lab'>교과서 문장 (8과 본문)</div>\"I've never seen <b>such a huge thing</b>. I'm so scared,\" said Eckels.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div><b>a such</b> huge thing / such <b>huge a</b> thing / have never <b>saw</b></div><div class='box ok'><div class='lab'>정답 모양</div><b>such + a(n) + 형용사 + 명사</b> · have/has + <b>never</b> + <b>p.p.</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>보통은 a 가 맨 앞에 오니까(a huge thing) such 를 어디에 둘지 헷갈려요. <b>such 가 맨 앞</b>, 그다음은 평소 순서 그대로 a + 형용사 + 명사! 그리고 never 는 have 와 p.p. <b>사이</b>, 뒤에는 과거형이 아니라 <b>과거분사</b>(see – saw – <b>seen</b>).</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>I have never seen <b class='hl'>such a huge</b> thing. (그렇게 거대한 것)</li><li>She <b class='hl'>has never eaten</b> such a sweet peach. (ate ✕)</li></ul></div><div class='trap'>⚠️ 함정: a such ✕ · such huge a ✕ · have never + 과거형 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>I've never heard ______ before.</div>",
  "choices": ["a such strange sound", "such a strange sound", "such strange a sound", "so a strange sound"],
  "answer": "such a strange sound",
  "exp": "<b>such + a + 형용사(strange) + 명사(sound)</b> 순서."
 },
 {
  "type": "twin",
  "q": "우리말을 영어로 바르게 옮긴 것은?<div class='pass'>우리는 그렇게 높은 탑을 한 번도 본 적이 없다.</div>",
  "choices": ["We never have saw such a tall tower.", "We have never seen such tall a tower.", "We have never see a such tall tower.", "We have never seen such a tall tower."],
  "answer": "We have never seen such a tall tower.",
  "exp": "have + <b>never</b> + p.p.(<b>seen</b>) + <b>such a tall tower</b>."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["She has never eaten such a spicy dish.", "I have never met such a kind person.", "He has never rode such a fast bike.", "We have never had such a long holiday."],
  "answer": "He has never rode such a fast bike.",
  "exp": "has never 뒤에는 과거분사 → ride – rode – <b>ridden</b>. (rode 는 과거형)"
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>③ during + 명사 / while + 주어 + 동사 (7과)</div><div class='box'><div class='lab'>예문 (7과 소재)</div><b>During</b> the festival, people enjoy many events. → 축제 '동안'</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div><b>While</b> the concert / <b>during</b> he was watching ~</div><div class='box ok'><div class='lab'>정답 모양</div><b>during + 명사(구)</b> · <b>while + 주어 + 동사</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>둘 다 우리말로 '~ 동안'이에요. 뜻으로는 못 고르니까 <b>뒤를 보세요</b>. 뒤에 명사만 있으면(the vacation, the test) during, 뒤에 <b>주어 + 동사</b>가 있으면(he was watching) while!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li><b class='hl'>during</b> the lunch break / <b class='hl'>during</b> our trip</li><li><b class='hl'>while</b> we were having lunch / <b class='hl'>while</b> I was traveling</li></ul></div><div class='trap'>⚠️ 함정: while + 명사 ✕ · during + 주어 + 동사 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>______ the winter vacation, Bomi learned how to skate.</div>",
  "choices": ["While", "During", "Since", "Among"],
  "answer": "During",
  "exp": "뒤에 명사(the winter vacation)만 있어요 → <b>During</b>."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>My little brother fell asleep ______ he was watching a cartoon.</div>",
  "choices": ["during", "between", "while", "about"],
  "answer": "while",
  "exp": "뒤에 주어 + 동사(he was watching) → 접속사 <b>while</b>."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["Nobody spoke during the test.", "While the concert, my phone rang twice.", "I listened to music while I was cleaning my room.", "We took many photos during our stay in Jeju."],
  "answer": "While the concert, my phone rang twice.",
  "exp": "the concert 는 명사 → <b>During</b> the concert."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>④ stay + 형용사 — 어떤 상태로 있다 (8과)</div><div class='box'><div class='lab'>교과서 문장 (8과 본문)</div>\"Just <b>stay calm</b>.\" / \"To <b>stay safe</b>, you must follow his instructions.\"</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>stay <b>calmly</b> / stay <b>safely</b></div><div class='box ok'><div class='lab'>정답 모양</div><b>stay + 형용사</b>(calm, safe, warm, healthy) · 움직임을 꾸밀 때는 <b>부사</b>(walk quietly)</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>우리말로 '차분<b>하게</b> 있어'라고 하니까 -ly 를 붙이고 싶어져요. 하지만 stay 는 '~한 <b>상태로 있다</b>'라는 뜻이라 뒤에 상태를 말하는 <b>형용사</b>가 와요. 반대로 walk, close, speak 처럼 <b>어떻게 하는지</b>를 꾸밀 때는 부사(-ly)!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>Stay <b class='hl'>calm</b>. / Stay <b class='hl'>safe</b>. (calmly ✕, safely ✕)</li><li>They walked <b class='hl'>quietly</b>. / He returned <b class='hl'>safely</b>. (동작 → 부사)</li></ul></div><div class='trap'>⚠️ 함정: stay + 부사 ✕ · 동작 동사 + 형용사 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>Drink a lot of water to stay ______ in hot weather.</div>",
  "choices": ["healthily", "health", "healthy", "to health"],
  "answer": "healthy",
  "exp": "<b>stay + 형용사</b> → stay <b>healthy</b>(건강한 상태로 있다)."
 },
 {
  "type": "twin",
  "q": "( ) 안에서 알맞은 것끼리 짝지은 것은?<div class='pass'>Stay ( warm / warmly ) and close the door ( quiet / quietly ).</div>",
  "choices": ["warm – quietly", "warmly – quietly", "warm – quiet", "warmly – quiet"],
  "answer": "warm – quietly",
  "exp": "stay + 형용사 <b>warm</b> · close(동작)를 꾸미는 말은 부사 <b>quietly</b>."
 },
 {
  "type": "twin",
  "q": "어법상 <b>옳은</b> 문장은?",
  "choices": ["The guide told us to stay calmly.", "Wear a helmet to stay safely.", "The soup stayed warmly for an hour.", "The children stayed awake until midnight."],
  "answer": "The children stayed awake until midnight.",
  "exp": "stay + 형용사 <b>awake</b>(깨어 있는). calmly → calm · safely → safe · warmly → warm."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>⑤ want / tell / ask + 목적어 + to 동사원형 ↔ 지각동사 + 목적어 + 동사원형 / -ing (8과)</div><div class='box'><div class='lab'>교과서 문장 (8과 본문)</div>I don't want you <b>to do</b> anything foolish.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>wants us <b>practice</b> / saw a shadow <b>to move</b></div><div class='box ok'><div class='lab'>정답 모양</div>want / tell / ask + 목적어 + <b>to 동사원형</b> · see / hear / feel / watch + 목적어 + <b>동사원형 / -ing</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>둘 다 '동사 + 목적어 + 동사' 모양이라 섞여요. <b>앞 동사</b>를 먼저 보세요. 바라고·말하고·부탁하는 동사(want, tell, ask)면 <b>to 를 넣고</b>, 보고·듣고·느끼는 동사(see, hear, feel, watch)면 <b>to 를 빼요</b>.</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>He <b class='hl'>told me to wait</b> here. (to 필요)</li><li>I <b class='hl'>heard her sing</b>. / I <b class='hl'>heard her singing</b>. (to ✕)</li></ul></div><div class='trap'>⚠️ 함정: want / tell / ask 뒤 to 빠뜨리기 ✕ · 지각동사 뒤 to 넣기 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>Travis didn't want Eckels ______ the path.</div>",
  "choices": ["leave", "to leave", "leaving", "left"],
  "answer": "to leave",
  "exp": "<b>want + 목적어(Eckels) + to 동사원형</b> → to leave."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>We saw a huge shadow ______ toward us.</div>",
  "choices": ["to move", "moved", "moves", "moving"],
  "answer": "moving",
  "exp": "지각동사 saw + 목적어(a huge shadow) + <b>-ing(moving)</b> 또는 동사원형. to · 과거형 · -s ✕"
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["My mom told me to wear a coat.", "I heard someone call my name.", "The coach wants us practice every day.", "Jaemin felt the wind blowing on his face."],
  "answer": "The coach wants us practice every day.",
  "exp": "want + 목적어 + <b>to practice</b>. 지각동사(heard, felt) 뒤는 동사원형 / -ing 가 맞아요."
 }
];

var QUIZ_ID = "clinic-hte-1111";
var QUIZ_TITLE = "한태은 사진 클리닉 개념+쌍둥이 11/11";
var TW = STEPS.filter(function (x) { return x.type === "twin"; });
var CONCEPT_OF = {};
(function () { var last = ""; STEPS.forEach(function (x, i) { if (x.type === "concept") last = x.html; else CONCEPT_OF[i] = last; }); })();

var studentName = "", cur = 0, twinNo = 0, correctCount = 0, wrongNumbers = [], unknownNumbers = [], answersLog = [], startTime = 0, locked = false;
var nameInput = document.getElementById("name-input"), startBtn = document.getElementById("start-btn");
var CIRCLED = ["①", "②", "③", "④", "⑤"];
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function $(id) { return document.getElementById(id); }

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  $("start-card").classList.add("hidden");
  $("quiz-card").classList.remove("hidden");
  show();
});
$("read-btn").addEventListener("click", function () { cur++; show(); });

function show() {
  if (cur >= STEPS.length) return showResult();
  var st = STEPS[cur];
  $("bar-fill").style.width = Math.round(cur / STEPS.length * 100) + "%";
  $("fb").innerHTML = "";
  if (st.type === "concept") {
    $("progress").textContent = "틀린 이유 읽기 · 쌍둥이 문제 " + (twinNo + 1) + "번 전";
    $("part").classList.add("hidden");
    $("concept-box").innerHTML = st.html; $("concept-box").classList.remove("hidden");
    $("read-btn").classList.remove("hidden");
    $("qtext").innerHTML = ""; $("choices").innerHTML = "";
    window.scrollTo(0, 0);
  } else {
    $("progress").textContent = "쌍둥이 문제 " + (twinNo + 1) + " / " + TW.length;
    $("concept-box").classList.add("hidden"); $("read-btn").classList.add("hidden");
    $("qtext").innerHTML = "Q" + (twinNo + 1) + ". " + st.q;
    var box = $("choices"); box.innerHTML = "";
    shuffle(st.choices).forEach(function (c, i) {
      var b = document.createElement("button"); b.className = "choice"; b.setAttribute("data-c", c);
      b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
      b.addEventListener("click", function () { pick(c); });
      box.appendChild(b);
    });
    var u = document.createElement("button"); u.className = "unk"; u.id = "unk-btn"; u.textContent = "🤔 모름";
    u.addEventListener("click", function () { unknown(); });
    box.appendChild(u);
    window.scrollTo(0, 0);
  }
}

function pick(choice) {
  if (locked) return; locked = true;
  var st = STEPS[cur], ok = choice === st.answer;
  if (ok) correctCount++; else wrongNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: ok, chosen: choice, answer: st.answer });
  [].forEach.call($("choices").children, function (b) {
    b.disabled = true;
    if (b.getAttribute("data-c") === st.answer) b.classList.add("right");
    else if (b.getAttribute("data-c") === choice) b.classList.add("bad");
  });
  var h = '<div class="exp' + (ok ? "" : " wrong") + '"><b>' + (ok ? "정답! 🎉" : "아쉬워요 — 정답: " + st.answer) + "</b><br>" + st.exp + "</div>";
  if (!ok) h += '<div class="lab2">📖 개념 정리 다시 보기</div>' + CONCEPT_OF[cur];
  h += '<button class="btn" id="next-btn">' + (twinNo + 1 < TW.length ? "다음 ▶" : "결과 보기") + "</button>";
  $("fb").innerHTML = h;
  $("next-btn").addEventListener("click", function () { locked = false; twinNo++; cur++; show(); });
}

function unknown() {
  if (locked) return; locked = true;
  var st = STEPS[cur];
  wrongNumbers.push(twinNo + 1); unknownNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: false, chosen: "모름", answer: st.answer, unknown: true });
  locked = false; twinNo++; cur++; show();
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}

function showResult() {
  $("quiz-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  $("score-line").textContent = correctCount + " / " + TW.length;
  var um = document.createElement("div"); um.id = "unknown-line"; um.className = "sub"; um.style.textAlign = "center"; um.textContent = unknownLine();
  $("score-line").parentNode.insertBefore(um, $("submit-status"));
  var expBox = $("explanations");
  TW.forEach(function (q, i) {
    var log = answersLog[i], d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>쌍둥이 " + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 (정답: " + q.answer + ")" : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correctCount, total: TW.length, wrong: wrongNumbers,
    unknown: unknownNumbers, durationSec: Math.round((Date.now() - startTime) / 1000), detail: answersLog });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 사진 클리닉 11/11 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + TW.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n" + unknownLine();
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});

</script>
</body>
</html>
