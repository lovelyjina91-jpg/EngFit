async function engfitSubmit(r) {

/* ══════ 문제 데이터 (개념 페이지 + 쌍둥이 문제) ══════ */
var STEPS = [
 {
  "type": "concept",
  "html": "<div class='ctitle'>① 가주어 It + 형용사 + (for/of + 목적격) + to 동사원형 (7과)</div><div class='box'><div class='lab'>교과서 · 문법 문장 (7과)</div>It is exciting to watch the parade. / It is kind of you to help me.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div><b>That</b> is fun to ~ / It is safe <b>of</b> kids ~ / It is polite <b>for</b> him ~ / It is easy for me <b>ride</b> ~</div><div class='box ok'><div class='lab'>정답 모양</div><b>It</b> is + 형용사 + (for/of + 목적격) + <b>to 동사원형</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>To 동사원형 주어가 길면 뒤로 보내고 주어 자리에 <b>It</b>을 둬요(That·This ✕). for와 of는 뜻이 같아 보여서 <b>형용사</b>로 골라요. 사람의 <b>성격·태도</b>(nice, smart, silly)면 <b>of</b>, 일이 쉽다·위험하다·필요하다 같은 <b>판단</b>이면 <b>for</b>. 그리고 뒤에 <b>to</b>를 빠뜨리지 않기!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>To walk alone at night is dangerous. → <b class='hl'>It</b> is dangerous <b class='hl'>to walk</b> alone at night.</li><li>It is necessary <b class='hl'>for</b> us to ~ (판단) / It is smart <b class='hl'>of</b> her to ~ (성격)</li></ul></div><div class='trap'>⚠️ 함정: That/This ✕ · for/of 뒤 주격·소유격 ✕ · to 빠뜨리기 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>It was silly ______ me to forget my own password.</div>",
  "choices": ["for", "of", "to", "with"],
  "answer": "of",
  "exp": "silly(어리석은)는 사람의 <b>태도</b> → <b>of</b> + 목적격 → It was silly <b>of me</b> to ~."
 },
 {
  "type": "twin",
  "q": "다음 문장을 It으로 시작하게 바르게 바꾼 것은?<div class='pass'>To save energy at home is necessary.</div>",
  "choices": ["That is necessary to save energy at home.", "It is necessary save energy at home.", "It is necessary to save energy at home.", "It is necessary of save energy at home."],
  "answer": "It is necessary to save energy at home.",
  "exp": "to부정사 주어(To save energy at home)는 뒤로, 주어 자리에 <b>It</b> → It is necessary <b>to save</b> ~. That ✕, to 빠뜨리기 ✕."
 },
 {
  "type": "twin",
  "q": "어법상 <b>옳은</b> 문장은?",
  "choices": ["It is safe of children to swim here.", "It is safe for they to swim here.", "It is safe for children swim here.", "It is safe for children to swim here."],
  "answer": "It is safe for children to swim here.",
  "exp": "safe(안전한)는 일에 대한 <b>판단</b> → <b>for</b> + 목적격(children), 그리고 <b>to swim</b>. for they ✕(목적격 them)."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>② call + A + B · 목적의 To + 동사원형 (7과)</div><div class='box'><div class='lab'>교과서 문장 (7과 본문)</div>People call this festival Holi. / To see the parade, people stand along the street.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>call this festival <b>as</b> Holi / call <b>Holi this festival</b> / <b>See</b> the parade, people ~</div><div class='box ok'><div class='lab'>정답 모양</div>call + <b>A(대상) + B(이름)</b> · <b>To + 동사원형</b> ~, 주어 + 동사</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>우리말 'A를 B라고 부르다'의 '~라고'를 as로 옮기고 싶어져요. call 뒤에는 <b>부르는 대상(A)</b>, 바로 이어서 <b>이름(B)</b>만! '~하기 위해'로 시작하는 문장은 <b>To + 동사원형</b>으로 시작하고, 콤마 뒤에 주어 + 동사가 와요.</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>We <b class='hl'>call</b> our dog <b class='hl'>Bori</b>. (as ✕)</li><li><b class='hl'>To buy</b> fresh bread, Mom goes to the bakery early.</li></ul></div><div class='trap'>⚠️ 함정: call A as B ✕ · A와 B 순서 바꾸기 ✕ · 동사원형으로 시작(명령문처럼) ✕</div>"
 },
 {
  "type": "twin",
  "q": "우리말에 맞게 바르게 영작한 것은?<br>(사람들은 그 섬을 '바람의 섬'이라고 부른다)",
  "choices": ["People call the island as the Island of Wind.", "People call the Island of Wind the island.", "People call the island the Island of Wind.", "People are called the island the Island of Wind."],
  "answer": "People call the island the Island of Wind.",
  "exp": "<b>call + A(the island) + B(the Island of Wind)</b>. as를 넣지 않고, A가 먼저!"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(좋은 자리를 얻기 위해, 우리는 일찍 도착했다)<div class='pass'>______ good seats, we arrived early.</div>",
  "choices": ["Get", "To get", "Got", "For get"],
  "answer": "To get",
  "exp": "'~하기 위해' = <b>To + 동사원형</b> → <b>To get</b> good seats, 주어(we) + 동사(arrived)."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>③ 진짜 주어 찾기 — 꾸미는 말 빼고 수일치 · 동명사 주어는 단수 (7과)</div><div class='box'><div class='lab'>시험에 자주 나오는 모양</div>The lanterns <u>in the sky</u> <b>are</b> beautiful. / <u>Throwing colored powder</u> <b>is</b> fun.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>The lanterns in the sky <b>is</b> ~ (sky 보고 is) / Throwing colored powder <b>are</b> ~ (powder·여럿 느낌)</div><div class='box ok'><div class='lab'>정답 모양</div>( ) 묶은 꾸미는 말 빼고 <b>맨 앞 명사</b>에 맞춤 · <b>-ing 주어 = 하나</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>동사 바로 앞에 있는 명사를 주어로 착각해요. <b>in ~, on ~, with ~, who ~</b>는 꾸미는 말이니 ( )로 묶고 진짜 주어를 찾아요. -ing로 시작하는 주어는 아무리 길어도 '~하는 것' <b>한 가지</b>라서 is / was / -s.</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>The boy (with three cats) <b class='hl'>lives</b> next door.</li><li>(Making new friends) <b class='hl'>is</b> not easy.</li></ul></div><div class='trap'>⚠️ 함정: 동사 바로 앞 명사에 맞추기 ✕ · 동명사 주어에 are ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>The flowers in my grandma's garden ______ very colorful.</div>",
  "choices": ["is", "are", "was", "has"],
  "answer": "are",
  "exp": "(in my grandma's garden)을 묶으면 진짜 주어 <b>The flowers</b>(여럿) → <b>are</b>."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>Collecting old coins ______ my dad's hobby.</div>",
  "choices": ["are", "were", "is", "be"],
  "answer": "is",
  "exp": "<b>동명사 주어</b>(Collecting old coins)는 한 가지 → <b>is</b>. coins를 보고 are ✕."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["The teacher with two sons lives near my school.", "Reading comic books makes me relaxed.", "The windows in this room are very big.", "The cookies on the plate tastes sweet."],
  "answer": "The cookies on the plate tastes sweet.",
  "exp": "(on the plate)를 묶으면 진짜 주어 <b>The cookies</b>(여럿) → <b>taste</b> sweet. plate를 보고 tastes ✕."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>④ during + 명사 / while + 주어 + 동사 (7과)</div><div class='box'><div class='lab'>시험에 자주 나오는 모양</div><b>During</b> the festival, ~ / <b>While</b> we were watching the fireworks, ~</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div><b>While</b> the festival, ~ / <b>During</b> we were watching ~</div><div class='box ok'><div class='lab'>정답 모양</div>뒤에 <b>명사</b>만 → during · 뒤에 <b>주어 + 동사</b> → while</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>둘 다 '~ 동안'이라 뜻으로는 못 골라요. <b>뒤를 보세요.</b> the vacation, the class처럼 <b>명사</b>만 오면 전치사 <b>during</b>, I was sleeping처럼 <b>주어 + 동사</b>가 오면 접속사 <b>while</b>.</p><div class='rule'><div class='lab'>개념 정리</div><ul><li><b class='hl'>during</b> the winter vacation (명사)</li><li><b class='hl'>while</b> my mom was cooking (주어 + 동사)</li></ul></div><div class='trap'>⚠️ 함정: during + 주어 + 동사 ✕ · while + 명사만 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>My phone rang ______ the science class.</div>",

  "answer": "during",
  "exp": "뒤에 명사(the science class)만 → <b>during</b>."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>______ I was taking a shower, someone knocked on the door.</div>",
  "choices": ["During", "For", "While", "Since"],
  "answer": "While",
  "exp": "뒤에 주어 + 동사(I was taking) → 접속사 <b>While</b>."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>⑤ 현재완료 have/has + p.p. — 과거 시점(ago, yesterday, last ~)과는 ✕ (8과)</div><div class='box'><div class='lab'>교과서 · 문법 문장 (8과)</div>I have already finished my homework. / She has visited Paris twice.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>I <b>have seen</b> him <b>two days ago</b>. / He has <b>went</b> ~</div><div class='box ok'><div class='lab'>정답 모양</div>정확한 과거 시점이 있으면 <b>과거형</b> · have/has 뒤는 <b>p.p.</b> (go - went - <b>gone</b>)</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>우리말로는 '~했다'로 둘 다 똑같아요. 현재완료는 <b>과거 일이 지금까지 이어진 느낌</b>이라 '언제'를 딱 찍는 말(<b>ago, yesterday, last week, in 2020</b>)과 같이 못 써요. 그리고 have/has 뒤에는 과거형이 아니라 <b>p.p.</b>!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>I <b class='hl'>lost</b> my umbrella <b class='hl'>last week</b>. (과거 시점 → 과거형)</li><li>I <b class='hl'>have</b> never <b class='hl'>ridden</b> a camel. (경험 → have + p.p.)</li></ul></div><div class='trap'>⚠️ 함정: 현재완료 + ago/yesterday/last ✕ · have + 과거형 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>Minsu ______ his grandparents in Daegu last Sunday.</div>",
  "choices": ["has visited", "visited", "have visited", "has visit"],
  "answer": "visited",
  "exp": "last Sunday는 정확한 <b>과거 시점</b> → 현재완료 ✕, 과거형 <b>visited</b>."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(우리 언니는 그 책을 벌써 다 읽었다)<div class='pass'>My sister has already ______ the book.</div>",
  "choices": ["read", "reading", "reads", "to read"],
  "answer": "read",
  "exp": "has + <b>p.p.</b> → read - read - <b>read</b> (모양은 같고 발음만 [레드]). 완료 already."
 },
 {
  "type": "twin",
  "q": "어법상 <b>옳은</b> 문장은?",
  "choices": ["We have gone to the museum two days ago.", "He has went to the bank.", "They have lived in Gwangju for ten years.", "I have meet her yesterday."],
  "answer": "They have lived in Gwangju for ten years.",
  "exp": "for + 기간(ten years) → 계속의 현재완료 <b>have lived</b> ○. ago·yesterday와 현재완료 ✕, has <b>gone</b>(went ✕), have <b>met</b>(meet ✕)."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>⑥ -thing + 형용사 · so + 형용사 + that + 주어 + 동사 (8과)</div><div class='box'><div class='lab'>교과서 문장 (8과 본문)</div>A little change here can cause something unthinkable. / It was so dark that I couldn't see anything.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div><b>new something</b> / so tired <b>than</b> ~ / <b>very</b> tired that ~</div><div class='box ok'><div class='lab'>정답 모양</div><b>something + 형용사</b> (+ to 동사원형) · <b>so</b> + 형용사 + <b>that</b> + 주어 + 동사</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>보통 형용사는 명사 앞에 오지만 <b>-thing(something, anything, nothing)</b>은 형용사가 <b>뒤</b>에 와요. '너무 ~해서 …하다'는 <b>so ~ that</b> 짝꿍! very나 than을 쓰면 틀려요. 과거 이야기면 that 뒤도 과거(couldn't).</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>I want <b class='hl'>something warm</b> to wear.</li><li>The movie was <b class='hl'>so</b> funny <b class='hl'>that</b> we laughed a lot.</li></ul></div><div class='trap'>⚠️ 함정: 형용사 + something ✕ · very ~ that ✕ · so ~ than ✕</div>"
 },
 {
  "type": "twin",
  "q": "우리말에 맞게 바르게 영작한 것은?<br>(오늘 뉴스에 새로운 것이 있니?)",
  "choices": ["Is there new anything in the news today?", "Is there anything new in the news today?", "Is there anything in the news new today?", "Is there new in anything the news today?"],
  "answer": "Is there anything new in the news today?",
  "exp": "<b>-thing + 형용사</b> → anything <b>new</b>."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(그 길은 너무 미끄러워서 우리는 천천히 걸었다)<div class='pass'>The road was ______ slippery ______ we walked slowly.</div>",
  "choices": ["very – that", "so – than", "so – that", "too – that"],
  "answer": "so – that",
  "exp": "'너무 ~해서 …하다' = <b>so</b> + 형용사 + <b>that</b> + 주어 + 동사."
 }
];

var QUIZ_ID = "clinic-hte-1107";
var QUIZ_TITLE = "한태은 사진 클리닉 개념+쌍둥이 11/07";
var TW = STEPS.filter(function (x) { return x.type === "twin"; });
var CONCEPT_OF = {};
(function () { var last = ""; STEPS.forEach(function (x, i) { if (x.type === "concept") last = x.html; else CONCEPT_OF[i] = last; }); })();

var studentName = "", cur = 0, twinNo = 0, correctCount = 0, wrongNumbers = [], unknownNumbers = [], answersLog = [], startTime = 0, locked = false;
var nameInput = document.getElementById("name-input"), startBtn = document.getElementById("start-btn");
var CIRCLED = ["①", "②", "③", "④", "⑤"];
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function $(id) { return document.getElementById(id); }

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  $("start-card").classList.add("hidden");
  $("quiz-card").classList.remove("hidden");
  show();
});
$("read-btn").addEventListener("click", function () { cur++; show(); });

function show() {
  if (cur >= STEPS.length) return showResult();
  var st = STEPS[cur];
  $("bar-fill").style.width = Math.round(cur / STEPS.length * 100) + "%";
  $("fb").innerHTML = "";
  if (st.type === "concept") {
    $("progress").textContent = "틀린 이유 읽기 · 쌍둥이 문제 " + (twinNo + 1) + "번 전";
    $("part").classList.add("hidden");
    $("concept-box").innerHTML = st.html; $("concept-box").classList.remove("hidden");
    $("read-btn").classList.remove("hidden");
    $("qtext").innerHTML = ""; $("choices").innerHTML = "";
    window.scrollTo(0, 0);
  } else {
    $("progress").textContent = "쌍둥이 문제 " + (twinNo + 1) + " / " + TW.length;
    $("concept-box").classList.add("hidden"); $("read-btn").classList.add("hidden");
    $("qtext").innerHTML = "Q" + (twinNo + 1) + ". " + st.q;
    var box = $("choices"); box.innerHTML = "";
    shuffle(st.choices).forEach(function (c, i) {
      var b = document.createElement("button"); b.className = "choice"; b.setAttribute("data-c", c);
      b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
      b.addEventListener("click", function () { pick(c); });
      box.appendChild(b);
    });
    var u = document.createElement("button"); u.className = "unk"; u.id = "unk-btn"; u.textContent = "🤔 모름";
    u.addEventListener("click", function () { unknown(); });
    box.appendChild(u);
    window.scrollTo(0, 0);
  }
}

function pick(choice) {
  if (locked) return; locked = true;
  var st = STEPS[cur], ok = choice === st.answer;
  if (ok) correctCount++; else wrongNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: ok, chosen: choice, answer: st.answer });
  [].forEach.call($("choices").children, function (b) {
    b.disabled = true;
    if (b.getAttribute("data-c") === st.answer) b.classList.add("right");
    else if (b.getAttribute("data-c") === choice) b.classList.add("bad");
  });
  var h = '<div class="exp' + (ok ? "" : " wrong") + '"><b>' + (ok ? "정답! 🎉" : "아쉬워요 — 정답: " + st.answer) + "</b><br>" + st.exp + "</div>";
  if (!ok) h += '<div class="lab2">📖 개념 정리 다시 보기</div>' + CONCEPT_OF[cur];
  h += '<button class="btn" id="next-btn">' + (twinNo + 1 < TW.length ? "다음 ▶" : "결과 보기") + "</button>";
  $("fb").innerHTML = h;
  $("next-btn").addEventListener("click", function () { locked = false; twinNo++; cur++; show(); });
}

function unknown() {
  if (locked) return; locked = true;
  var st = STEPS[cur];
  wrongNumbers.push(twinNo + 1); unknownNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: false, chosen: "모름", answer: st.answer, unknown: true });
  locked = false; twinNo++; cur++; show();
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}

function showResult() {
  $("quiz-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  $("score-line").textContent = correctCount + " / " + TW.length;
  var um = document.createElement("div"); um.id = "unknown-line"; um.className = "sub"; um.style.textAlign = "center"; um.textContent = unknownLine();
  $("score-line").parentNode.insertBefore(um, $("submit-status"));
  var expBox = $("explanations");
  TW.forEach(function (q, i) {
    var log = answersLog[i], d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>쌍둥이 " + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 (정답: " + q.answer + ")" : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correctCount, total: TW.length, wrong: wrongNumbers,
    unknown: unknownNumbers, durationSec: Math.round((Date.now() - startTime) / 1000), detail: answersLog });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 사진 클리닉 11/07 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + TW.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n" + unknownLine();
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});

</script>
