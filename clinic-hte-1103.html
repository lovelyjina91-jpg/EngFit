<script>
"use strict";

/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#2e7d6e"; }
  else { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#c0392b"; }
}


/* ══════ 문제 데이터 (개념 페이지 + 쌍둥이 문제) ══════ */
var STEPS = [
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">① 의미상 주어 자리에는 for / of 둘 중 하나만 (7과 가주어 it)<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (11/2 데일리 1 · 2번 · 10/31 · 10/30 데일리 1번)<\/div>It is ~ ___ 사람 to 동사원형 (의미상 주어 자리)<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>if / whether / for / what<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>for<\/b> / <b>for<\/b> / <b>of<\/b> / <b>of<\/b><\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">11/2 데일리에서는 if · whether(~인지)를 넣었어요. 하지만 It is + 형용사 + ___ + 사람 + to 동사원형에서 사람 앞자리는 <b>for 아니면 of<\/b>, 딱 두 가지뿐이에요. if · whether · what은 뒤에 주어 + 동사가 와야 하는 말이라 이 자리에 못 와요. 그다음 형용사를 보고 고르면 돼요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>It is + 형용사 + <b class=\"hl\">for / of<\/b> + 사람 + to 동사원형<\/p><ul><li>일이 쉽다 · 어렵다 · 위험하다(easy, hard, dangerous) → <b class=\"hl\">for<\/b><\/li><li>사람 칭찬 · 꾸중(kind, smart, careless, rude) → <b class=\"hl\">of<\/b><\/li><li>확인법: '그 사람 = 형용사'가 말이 되면 of!<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: 사람 앞 빈칸에 if · whether · what · to ✕ → 무조건 for 또는 of!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">It is hard ______ young children to sit still for an hour.<\/div>",
  "choices": ["for", "of", "if", "whether"],
  "answer": "for",
  "exp": "hard(어려운)는 아이들의 성격이 아니라 '가만히 앉아 있는 일이 어렵다'는 말 → <b>for + 사람<\/b>. if · whether는 11/2 데일리처럼 이 자리에 못 와요."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">It was foolish ______ Minho to leave his bag on the bus.<\/div>",
  "choices": ["for", "of", "if", "whether"],
  "answer": "of",
  "exp": "foolish(어리석은)는 민호를 꾸짖는 성격 형용사 → <b>of + 사람<\/b>. Minho was foolish.가 말이 되죠."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">How smart ______ your sister to solve the puzzle so quickly!<\/div>",
  "choices": ["of", "for", "whether", "what"],
  "answer": "of",
  "exp": "smart(똑똑한)는 언니를 칭찬하는 말 → <b>of + 사람<\/b>. How ~! 감탄문 모양이어도 규칙은 같아요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">② tell / ask / want + 사람 + to 동사원형 (8과)<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (11/2 데일리 10번 · 10/31 데일리 9번)<\/div>엄마는 나에게 창문을 닫으라고 말씀하셨다.<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>My mom tell me close the window.<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>My mom <b>told<\/b> me <b>to close<\/b> the window.<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">두 군데를 놓쳤어요. ① '말씀하셨다'는 지난 일이라 tell → <b>told<\/b>. ② 사람 뒤에는 동사원형만 쓰면 안 되고 꼭 <b>to + 동사원형<\/b>. 10/31에는 cleaning(-ing)으로 틀렸고, 이번엔 to가 빠졌어요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p><b class=\"hl\">told / asked / wanted<\/b> + 사람(목적격) + <b class=\"hl\">to 동사원형<\/b><\/p><ul><li>The nurse told me <b class=\"hl\">to lie<\/b> down.<\/li><li>Jisu asked her dad <b class=\"hl\">to buy<\/b> some milk.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: 지난 일인데 tell ✕ → told / 사람 뒤 동사원형만 ✕ · -ing ✕ → to + 동사원형!<\/div>"
 },
 {
  "type": "twin",
  "q": "다음 우리말을 영어로 바르게 옮긴 것은?<div class=\"pass\">어제 코치님은 우리에게 일찍 오라고 말씀하셨다.<\/div>",
  "choices": ["Yesterday the coach told us to come early.", "Yesterday the coach tell us come early.", "Yesterday the coach told us come early.", "Yesterday the coach told we to come early."],
  "answer": "Yesterday the coach told us to come early.",
  "exp": "지난 일 → <b>told<\/b>, 사람은 목적격 <b>us<\/b>, 그 뒤 <b>to come<\/b>. tell(시제) ✕, to 빠짐 ✕(11/2 데일리와 같은 실수), we(주격) ✕예요."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(형은 나에게 상자 옮기는 것을 도와 달라고 부탁했다)<div class=\"pass\">My brother asked me ______ him with the boxes.<\/div>",
  "choices": ["help", "to help", "helping", "helped"],
  "answer": "to help",
  "exp": "<b>ask + 사람 + to 동사원형<\/b> → asked me <b>to help<\/b>. 원형만(help) ✕, -ing ✕예요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">③ 과거진행형 — was / were + 동사-ing<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (11/2 데일리 3번 · 11/1 데일리 3번 · 10/28 · 10/25 데일리)<\/div>~하고 있었다 (read / sing)<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>read / was sang<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>was reading<\/b> / <b>were singing<\/b><\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">10/25부터 11/2까지 다섯 번째예요. '~하고 있었다'는 동사 하나(read)로 끝나지 않고 꼭 <b>was / were + -ing<\/b> 두 조각이 필요해요. be동사만 쓰고 과거형을 붙여도(was sang) 틀려요. 주어가 여럿이면 were!<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>~하고 있었다 = <b class=\"hl\">was / were + -ing<\/b><\/p><ul><li>I / 한 명 → was: Grandpa <b class=\"hl\">was watering<\/b> the plants.<\/li><li>여럿 → were: The puppies <b class=\"hl\">were sleeping<\/b> on the sofa.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: 우리말이 '~하고 있었다'면 과거형 하나 ✕ / was + 과거형 ✕ → was / were + -ing!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(엄마가 집에 오셨을 때 나는 내 방에서 만화책을 읽고 있었다)<div class=\"pass\">When Mom came home, I ______ a comic book in my room.<\/div>",
  "choices": ["was reading", "read", "was read", "were reading"],
  "answer": "was reading",
  "exp": "'읽고 있었다' → <b>was + reading<\/b>. read 하나만 쓰면 11/2 데일리 3번과 같은 실수, was read는 be동사 + 과거형이라 ✕, I에는 were ✕예요."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(소년들이 농구를 하고 있는 동안 비가 오기 시작했다)<div class=\"pass\">While the boys ______ basketball, it started to rain.<\/div>",
  "choices": ["were playing", "was playing", "were play", "was played"],
  "answer": "were playing",
  "exp": "the boys는 여럿 → <b>were<\/b>, 그리고 -ing → <b>were playing<\/b>. was는 주어 수가 틀리고, were play는 -ing가 빠졌어요."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린<\/b> 문장은?",
  "choices": ["My dad was cooking dinner at six.", "The students were listening to music.", "She was wrote a letter then.", "We were waiting for the bus."],
  "answer": "She was wrote a letter then.",
  "exp": "was 뒤에는 -ing → She <b>was writing<\/b> a letter then. 11/1 데일리 was sang과 같은 실수예요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">④ 간접의문문 — does를 지우면 -s는 동사로!<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/30 데일리 7번 · 10/27 숙제 2 · 5 · 8번 · 10/24 · 10/22 데일리)<\/div>what time the train ___ / if the bus ___ here<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>leave / stop<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>leaves<\/b> / <b>stops<\/b><\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">어순(의문사 + 주어 + 동사)은 잘 맞히는데, does를 지우면서 <b>-s까지 같이 지워 버리는<\/b> 실수가 반복돼요. 주어가 한 명 · 하나면 동사에 -s를 꼭 다시 붙여요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>Where does the bakery sell bread? → I know where the bakery <b class=\"hl\">sells<\/b> bread.<\/p><ul><li>Does Mr. Han teach music? → I wonder <b class=\"hl\">if<\/b> Mr. Han <b class=\"hl\">teaches<\/b> music.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: does ✕ → 동사에 -s / -es ○ (does live ✕, live ✕ → lives)<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(너희 이모가 어디에서 일하시는지 알려 줘)<div class=\"pass\">Please tell me where your aunt ______.<\/div>",
  "choices": ["works", "work", "does work", "working"],
  "answer": "works",
  "exp": "where + 주어(your aunt) + 동사. 이모는 한 명 → <b>works<\/b>. does work는 의문문 모양, work는 -s 빠짐이에요."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(그 수영장이 7시에 문을 여는지 궁금하다)<div class=\"pass\">I wonder if the pool ______ at seven.<\/div>",
  "choices": ["opens", "open", "does open", "opening"],
  "answer": "opens",
  "exp": "if + 주어(the pool) + 동사. 수영장은 하나 → <b>opens<\/b>. 10/24 데일리 if the bus stop(→ stops)과 같은 자리예요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">⑤ 관계대명사 what = ~하는 것 (that ✕)<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/28 데일리 5번 · 10/27 숙제 6번 · 10/27 데일리 5번 · 10/23 데일리 9번)<\/div>___ he showed me was an old photo.<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>That / that<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>What<\/b> he showed me was an old photo.<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">'~하는 것'이라는 뜻을 혼자 다 가진 말은 <b>what<\/b>이에요. 앞에 꾸밀 명사(선행사)가 없는데 that을 쓰면 틀려요. what 덩어리(What he showed me)가 문장 전체의 주어나 목적어가 돼요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><ul><li><b class=\"hl\">What<\/b> Mom made for lunch was delicious. (엄마가 만든 것)<\/li><li>앞에 명사가 있으면 that: the cake <b>that<\/b> Mom made<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: 빈칸 앞에 명사가 없고 '~하는 것'이면 that ✕ → what!<\/div>"
 },
 {

  "choices": ["What", "That", "Which", "It"],
  "answer": "What",
  "exp": "앞에 명사가 없고 '내가 원하는 것' → <b>What<\/b> I want. 10/28 데일리 5번처럼 That을 쓰면 ✕예요."
 },
 {

  "choices": ["that", "what", "which", "who"],
  "answer": "what",
  "exp": "is not 뒤에 꾸밀 명사가 없고 '내가 주문한 것' → <b>what<\/b> I ordered. that · which는 앞에 명사(the food 등)가 있어야 해요."
 },

 },

  "answer": "others",
  "exp": "Some of my classmates(일부 반 친구들) ↔ <b>others<\/b>(다른 친구들). another는 단수, other는 혼자 못 써요. 10/26 데일리 8번과 같은 자리예요."
 },
 {
  "type": "twin",
  "q": "다음 우리말을 영어로 바르게 옮긴 것은?<div class=\"pass\">어떤 아이들은 그림을 그리고, 다른 아이들은 노래를 부른다.<\/div>",
  "choices": ["Some kids draw pictures, and another sing songs.", "Some kids draw pictures, and others sing songs.", "Some kids draw pictures, and other sings songs.", "Some kids draws pictures, and others sing songs."],

var QUIZ_ID = "clinic-hte-1103";
var QUIZ_TITLE = "한태은 사진 클리닉 개념+쌍둥이 11/03";
var TW = STEPS.filter(function (x) { return x.type === "twin"; });
var CONCEPT_OF = {};
(function () { var last = ""; STEPS.forEach(function (x, i) { if (x.type === "concept") last = x.html; else CONCEPT_OF[i] = last; }); })();

var studentName = "", cur = 0, twinNo = 0, correctCount = 0, wrongNumbers = [], unknownNumbers = [], answersLog = [], startTime = 0, locked = false;
var nameInput = document.getElementById("name-input"), startBtn = document.getElementById("start-btn");
var CIRCLED = ["①", "②", "③", "④", "⑤"];
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function $(id) { return document.getElementById(id); }

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  $("start-card").classList.add("hidden");
  $("quiz-card").classList.remove("hidden");
  show();
});
$("read-btn").addEventListener("click", function () { cur++; show(); });

function show() {
  if (cur >= STEPS.length) return showResult();
  var st = STEPS[cur];
  $("bar-fill").style.width = Math.round(cur / STEPS.length * 100) + "%";
  $("fb").innerHTML = "";
  if (st.type === "concept") {
    $("progress").textContent = "틀린 이유 읽기 · 쌍둥이 문제 " + (twinNo + 1) + "번 전";
    $("part").classList.add("hidden");
    $("concept-box").innerHTML = st.html; $("concept-box").classList.remove("hidden");
    $("read-btn").classList.remove("hidden");
    $("qtext").innerHTML = ""; $("choices").innerHTML = "";
    window.scrollTo(0, 0);
  } else {
    $("progress").textContent = "쌍둥이 문제 " + (twinNo + 1) + " / " + TW.length;
    $("concept-box").classList.add("hidden"); $("read-btn").classList.add("hidden");
    $("qtext").innerHTML = "Q" + (twinNo + 1) + ". " + st.q;
    var box = $("choices"); box.innerHTML = "";
    shuffle(st.choices).forEach(function (c, i) {
      var b = document.createElement("button"); b.className = "choice"; b.setAttribute("data-c", c);
      b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
      b.addEventListener("click", function () { pick(c); });
      box.appendChild(b);
    });
    var u = document.createElement("button"); u.className = "unk"; u.id = "unk-btn"; u.textContent = "🤔 모름";
    u.addEventListener("click", function () { unknown(); });
    box.appendChild(u);
    window.scrollTo(0, 0);
  }
}

function pick(choice) {
  if (locked) return; locked = true;
  var st = STEPS[cur], ok = choice === st.answer;
  if (ok) correctCount++; else wrongNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: ok, chosen: choice, answer: st.answer });
  [].forEach.call($("choices").children, function (b) {
    b.disabled = true;
    if (b.getAttribute("data-c") === st.answer) b.classList.add("right");
    else if (b.getAttribute("data-c") === choice) b.classList.add("bad");
  });
  var h = '<div class="exp' + (ok ? "" : " wrong") + '"><b>' + (ok ? "정답! 🎉" : "아쉬워요 — 정답: " + st.answer) + "</b><br>" + st.exp + "</div>";
  if (!ok) h += '<div class="lab2">📖 개념 정리 다시 보기</div>' + CONCEPT_OF[cur];
  h += '<button class="btn" id="next-btn">' + (twinNo + 1 < TW.length ? "다음 ▶" : "결과 보기") + "</button>";
  $("fb").innerHTML = h;
  $("next-btn").addEventListener("click", function () { locked = false; twinNo++; cur++; show(); });
}

function unknown() {
  if (locked) return; locked = true;
  var st = STEPS[cur];
  wrongNumbers.push(twinNo + 1); unknownNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: false, chosen: "모름", answer: st.answer, unknown: true });
  locked = false; twinNo++; cur++; show();
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}

function showResult() {
  $("quiz-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  $("score-line").textContent = correctCount + " / " + TW.length;
  var um = document.createElement("div"); um.id = "unknown-line"; um.className = "sub"; um.style.textAlign = "center"; um.textContent = unknownLine();
  $("score-line").parentNode.insertBefore(um, $("submit-status"));
  var expBox = $("explanations");
  TW.forEach(function (q, i) {
    var log = answersLog[i], d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>쌍둥이 " + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 (정답: " + q.answer + ")" : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correctCount, total: TW.length, wrong: wrongNumbers,
    unknown: unknownNumbers, durationSec: Math.round((Date.now() - startTime) / 1000), detail: answersLog });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 사진 클리닉 11/03 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + TW.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n" + unknownLine();
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});

</script>
</body>
</html>
