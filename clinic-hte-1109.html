async function engfitSubmit(r) {
  var body = JSON.stringify(r);

    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });

}

 {

 },
 {
  "type": "twin",

 },
 {

 },
 {
  "type": "twin",

 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>② call / name + A + B — A를 B라고 부르다 / 이름 짓다 (7과)</div><div class='box'><div class='lab'>교과서 문장 (7과 본문)</div>They call it the Midsummer festival. / They call this day the Day of the Dead.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>call this day <b>as</b> the Day of the Dead / call <b>the Midsummer festival it</b> / a festival → call <b>them</b></div><div class='box ok'><div class='lab'>정답 모양</div>call + <b>A(대상)</b> + <b>B(이름)</b> · as ✕</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>우리말 'A를 B<b>라고</b>'의 '라고' 때문에 as를 넣고 싶어져요. 하지만 call · name은 <b>A B를 바로 이어서</b> 써요. 순서는 언제나 <b>부르는 대상 먼저, 이름 나중</b>. 대상이 하나면 it, 여럿이면 them!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>My friends <b class='hl'>call me Jenny</b>.</li><li>They <b class='hl'>named the dog Lucky</b>. (named Lucky the dog ✕)</li></ul></div><div class='trap'>⚠️ 함정: as 넣기 ✕ · A B 순서 바꾸기 ✕ · 단수를 them으로 받기 ✕</div>"

 {

 },
 {

 },
 {

 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>④ -thing + 형용사 (+ to 동사원형) (8과)</div><div class='box'><div class='lab'>교과서 문장 (8과 본문)</div>A little change here can cause something unthinkable in the future. / I don't want you to do anything foolish.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div><b>unthinkable something</b> / <b>foolish anything</b> / something <b>to drink cold</b></div><div class='box ok'><div class='lab'>정답 모양</div><b>-thing + 형용사</b> + (to 동사원형) → something <b>cold to drink</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>보통은 a cold drink처럼 형용사가 앞에 오니까, something 앞에도 형용사를 쓰고 싶어져요. 하지만 something · anything · nothing은 형용사가 <b>뒤에서</b> 꾸며요. to 동사원형까지 붙으면 순서는 <b>-thing → 형용사 → to</b>. 부정문 · 의문문에서는 보통 anything!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>I want <b class='hl'>something special</b> for my birthday.</li><li>Do you have <b class='hl'>anything interesting to read</b>?</li></ul></div><div class='trap'>⚠️ 함정: 형용사 + -thing ✕ · to 동사원형을 형용사 앞에 ✕</div>"

 {
  "type": "concept",
  "html": "<div class='ctitle'>⑤ so + 형용사/부사 + that + 주어 + 동사 — 너무 ~해서 …하다 (8과)</div><div class='box'><div class='lab'>교과서 문장 (8과 본문)</div>He was so terrified that he left the path by accident.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div><b>very</b> terrified that ~ / <b>so that</b> 붙여 쓰기 / 과거 문장인데 that 뒤 <b>can't</b></div><div class='box ok'><div class='lab'>정답 모양</div><b>so</b> + 형용사/부사 + <b>that</b> + 주어 + 동사 (시제 맞추기)</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>'너무'라서 very나 too를 쓰고 싶어지지만, 뒤에 <b>that + 주어 + 동사</b>가 오면 꼭 <b>so</b>. 형용사는 so와 that 사이에! 그리고 앞 문장이 과거(was)면 that 뒤도 과거 — <b>couldn't · didn't</b>.</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>The music was <b class='hl'>so loud that</b> I <b class='hl'>couldn't</b> sleep.</li><li>He spoke <b class='hl'>so quickly that</b> nobody understood him.</li></ul></div><div class='trap'>⚠️ 함정: very/too ✕ · 과거 문장 + can't ✕ · that 뒤 목적어 빠뜨리기 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (그 영화는 너무 웃겨서 우리는 웃음을 멈출 수 없었다)<div class='pass'>The movie was ______ funny that we couldn't stop laughing.</div>",
  "choices": ["very", "too", "so", "such"],
  "answer": "so",
  "exp": "뒤에 <b>that + 주어 + 동사</b> → <b>so</b> + 형용사(funny) + that."
 },
 {
  "type": "twin",
  "q": "두 문장을 한 문장으로 바르게 바꾼 것은?<div class='pass'>The bag was very full. I couldn't close it.</div>",
  "choices": ["The bag was so full that I can't close it.", "The bag was too full that I couldn't close it.", "The bag was so full that I couldn't close.", "The bag was so full that I couldn't close it."],
  "answer": "The bag was so full that I couldn't close it.",
  "exp": "<b>so full that I couldn't close it</b>. 과거(was) → couldn't, 목적어 it 빠뜨리기 ✕, too ✕."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["He ran so fast that he won the race.", "She was so nervous that she can't sleep last night.", "I was so tired that I went to bed early.", "The water was so cold that we didn't swim."],
  "answer": "She was so nervous that she can't sleep last night.",
  "exp": "last night(과거) → that 뒤도 과거 <b>couldn't</b> sleep."
 }
];

var QUIZ_ID = "clinic-hte-1109";
var QUIZ_TITLE = "한태은 사진 클리닉 개념+쌍둥이 11/09";
var TW = STEPS.filter(function (x) { return x.type === "twin"; });
var CONCEPT_OF = {};
(function () { var last = ""; STEPS.forEach(function (x, i) { if (x.type === "concept") last = x.html; else CONCEPT_OF[i] = last; }); })();

var studentName = "", cur = 0, twinNo = 0, correctCount = 0, wrongNumbers = [], unknownNumbers = [], answersLog = [], startTime = 0, locked = false;
var nameInput = document.getElementById("name-input"), startBtn = document.getElementById("start-btn");
var CIRCLED = ["①", "②", "③", "④", "⑤"];
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function $(id) { return document.getElementById(id); }

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  $("start-card").classList.add("hidden");
  $("quiz-card").classList.remove("hidden");
  show();
});
$("read-btn").addEventListener("click", function () { cur++; show(); });

function show() {
  if (cur >= STEPS.length) return showResult();
  var st = STEPS[cur];
  $("bar-fill").style.width = Math.round(cur / STEPS.length * 100) + "%";
  $("fb").innerHTML = "";
  if (st.type === "concept") {
    $("progress").textContent = "틀린 이유 읽기 · 쌍둥이 문제 " + (twinNo + 1) + "번 전";
    $("part").classList.add("hidden");
    $("concept-box").innerHTML = st.html; $("concept-box").classList.remove("hidden");
    $("read-btn").classList.remove("hidden");
    $("qtext").innerHTML = ""; $("choices").innerHTML = "";
    window.scrollTo(0, 0);
  } else {
    $("progress").textContent = "쌍둥이 문제 " + (twinNo + 1) + " / " + TW.length;
    $("concept-box").classList.add("hidden"); $("read-btn").classList.add("hidden");
    $("qtext").innerHTML = "Q" + (twinNo + 1) + ". " + st.q;
    var box = $("choices"); box.innerHTML = "";
    shuffle(st.choices).forEach(function (c, i) {
      var b = document.createElement("button"); b.className = "choice"; b.setAttribute("data-c", c);
      b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
      b.addEventListener("click", function () { pick(c); });
      box.appendChild(b);
    });
    var u = document.createElement("button"); u.className = "unk"; u.id = "unk-btn"; u.textContent = "🤔 모름";
    u.addEventListener("click", function () { unknown(); });
    box.appendChild(u);
    window.scrollTo(0, 0);
  }
}

function pick(choice) {
  if (locked) return; locked = true;
  var st = STEPS[cur], ok = choice === st.answer;
  if (ok) correctCount++; else wrongNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: ok, chosen: choice, answer: st.answer });
  [].forEach.call($("choices").children, function (b) {
    b.disabled = true;
    if (b.getAttribute("data-c") === st.answer) b.classList.add("right");
    else if (b.getAttribute("data-c") === choice) b.classList.add("bad");
  });
  var h = '<div class="exp' + (ok ? "" : " wrong") + '"><b>' + (ok ? "정답! 🎉" : "아쉬워요 — 정답: " + st.answer) + "</b><br>" + st.exp + "</div>";
  if (!ok) h += '<div class="lab2">📖 개념 정리 다시 보기</div>' + CONCEPT_OF[cur];
  h += '<button class="btn" id="next-btn">' + (twinNo + 1 < TW.length ? "다음 ▶" : "결과 보기") + "</button>";
  $("fb").innerHTML = h;
  $("next-btn").addEventListener("click", function () { locked = false; twinNo++; cur++; show(); });
}

function unknown() {
  if (locked) return; locked = true;
  var st = STEPS[cur];
  wrongNumbers.push(twinNo + 1); unknownNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: false, chosen: "모름", answer: st.answer, unknown: true });
  locked = false; twinNo++; cur++; show();
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}

function showResult() {
  $("quiz-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  $("score-line").textContent = correctCount + " / " + TW.length;
  var um = document.createElement("div"); um.id = "unknown-line"; um.className = "sub"; um.style.textAlign = "center"; um.textContent = unknownLine();
  $("score-line").parentNode.insertBefore(um, $("submit-status"));
  var expBox = $("explanations");
  TW.forEach(function (q, i) {
    var log = answersLog[i], d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>쌍둥이 " + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 (정답: " + q.answer + ")" : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correctCount, total: TW.length, wrong: wrongNumbers,
    unknown: unknownNumbers, durationSec: Math.round((Date.now() - startTime) / 1000), detail: answersLog });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 사진 클리닉 11/09 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + TW.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n" + unknownLine();
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});

</script>
</body>
</html>
