<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>that절 테스트 | EngFit English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --navy: #1a2550;
    --navy-dark: #0f1838;
    --gold: #f4a623;
    --gold-light: #ffc858;
    --bg: #f5f7fc;
    --card: #ffffff;
    --ink: #1f2540;
    --ink-soft: #5a6585;
    --line: #e6e9f4;
    --correct: #16a34a;
    --correct-bg: #dcfce7;
    --wrong: #dc2626;
    --wrong-bg: #fee2e2;
    --pink: #ec4899;
    --shadow-sm: 0 2px 8px rgba(26,37,80,0.08);
    --shadow-md: 0 6px 20px rgba(26,37,80,0.10);
    --shadow-lg: 0 12px 40px rgba(26,37,80,0.18);
  }
  html, body {
    font-family: 'Noto Sans KR', 'Nunito', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg);
    min-height: 100vh;
    position: relative;
    padding-bottom: 80px;
  }

  /* === HEADER === */
  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    padding: 18px 20px 24px;
    color: white;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 140px; height: 140px;
    background: radial-gradient(circle, rgba(244,166,35,0.18), transparent 70%);
    border-radius: 50%;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -30px; left: -30px;
    width: 100px; height: 100px;
    background: radial-gradient(circle, rgba(255,255,255,0.06), transparent 70%);
    border-radius: 50%;
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    z-index: 1;
  }
  .logo {
    height: 44px;
    width: auto;
  }
  .header-title {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.5px;
    opacity: 0.85;
    margin-top: 14px;
    position: relative;
    z-index: 1;
  }
  .header-subject {
    font-size: 22px;
    font-weight: 900;
    margin-top: 4px;
    letter-spacing: -0.5px;
    position: relative;
    z-index: 1;
  }
  .header-subject .accent {
    color: var(--gold-light);
  }

  /* === PROGRESS === */
  .progress-wrap {
    background: white;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .progress-info .qnum {
    color: var(--navy);
    font-weight: 800;
    font-size: 13px;
  }
  .progress-info .qnum b { color: var(--gold); font-size: 16px; }
  .progress-bar {
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 100%);
    border-radius: 3px;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    width: 0%;
  }

  /* === DOTS NAV === */
  .dots {
    padding: 12px 16px;
    background: white;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--line);
    color: var(--ink-soft);
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    font-family: inherit;
  }
  .dot.current { background: var(--navy); color: white; transform: scale(1.15); }
  .dot.correct { background: var(--correct); color: white; }
  .dot.wrong { background: var(--wrong); color: white; }
  .dot:hover { transform: scale(1.1); }

  /* === QUESTION CARD === */
  .question-card {
    margin: 16px;
    background: var(--card);
    border-radius: 18px;
    padding: 22px 18px;
    box-shadow: var(--shadow-md);
    animation: slideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .qtype-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .qtype-badge.mc { background: #e0e7ff; color: #4338ca; }
  .qtype-badge.ox { background: #fef3c7; color: #b45309; }
  .question-text {
    font-size: 15.5px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--ink);
    margin-bottom: 18px;
  }
  .question-text b { color: var(--navy); font-weight: 800; }
  .question-text u { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .sentence {
    display: inline-block;
    background: linear-gradient(135deg, #f8fafc, #f1f5f9);
    padding: 6px 12px;
    border-radius: 8px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    color: var(--navy);
    border-left: 3px solid var(--gold);
    margin: 4px 0;
    font-size: 15px;
  }

  /* === OPTIONS (Multiple Choice) === */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    background: white;
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 13px 14px;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    font-size: 14.5px;
    color: var(--ink);
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transition: all 0.2s;
    line-height: 1.5;
  }
  .option:hover:not(:disabled) {
    border-color: var(--navy);
    background: #f8faff;
  }
  .option:disabled { cursor: default; }
  .option-num {
    flex-shrink: 0;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--line);
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Nunito', sans-serif;
  }
  .option.correct { border-color: var(--correct); background: var(--correct-bg); }
  .option.correct .option-num { background: var(--correct); color: white; }
  .option.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .option.wrong .option-num { background: var(--wrong); color: white; }

  /* === OX === */
  .ox-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .ox-btn {
    background: white;
    border: 2.5px solid var(--line);
    border-radius: 16px;
    padding: 26px 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .ox-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .ox-btn:disabled { cursor: default; }
  .ox-mark {
    font-size: 42px;
    font-weight: 900;
    line-height: 1;
    font-family: 'Nunito', sans-serif;
  }
  .ox-btn.o .ox-mark { color: var(--correct); }
  .ox-btn.x .ox-mark { color: var(--wrong); }
  .ox-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .ox-btn.selected-correct {
    border-color: var(--correct);
    background: var(--correct-bg);
  }
  .ox-btn.selected-wrong {
    border-color: var(--wrong);
    background: var(--wrong-bg);
  }
  .ox-btn.show-answer {
    border-color: var(--correct);
    background: var(--correct-bg);
  }

  /* === FEEDBACK === */
  .feedback {
    margin-top: 16px;
    padding: 14px;
    border-radius: 12px;
    font-size: 13.5px;
    line-height: 1.6;
    animation: fadeIn 0.3s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .feedback.correct {
    background: var(--correct-bg);
    color: #166534;
    border-left: 4px solid var(--correct);
  }
  .feedback.wrong {
    background: var(--wrong-bg);
    color: #991b1b;
    border-left: 4px solid var(--wrong);
  }
  .feedback-title {
    font-weight: 800;
    margin-bottom: 4px;
    font-size: 14px;
  }
  .feedback b { color: inherit; }

  /* === NAV BUTTONS === */
  .nav-buttons {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    padding: 0 16px;
  }
  .nav-btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .nav-btn.prev {
    background: white;
    color: var(--navy);
    border: 2px solid var(--line);
  }
  .nav-btn.prev:not(:disabled):hover { border-color: var(--navy); }
  .nav-btn.next {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    color: white;
    box-shadow: var(--shadow-sm);
  }
  .nav-btn.next:not(:disabled):hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }

  /* === RESULTS === */
  .results {
    margin: 16px;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    animation: slideIn 0.4s;
  }
  .results-hero {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    color: white;
    text-align: center;
    padding: 28px 20px 32px;
    position: relative;
    overflow: hidden;
  }
  .results-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 50%, rgba(244,166,35,0.2), transparent 60%);
  }
  .grade-badge {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
    font-weight: 900;
    color: var(--navy);
    margin: 0 auto 14px;
    font-family: 'Nunito', sans-serif;
    box-shadow: 0 8px 24px rgba(244,166,35,0.4);
    position: relative;
    z-index: 1;
  }
  .results-title {
    font-size: 18px;
    font-weight: 800;
    position: relative;
    z-index: 1;
  }
  .results-score {
    font-size: 28px;
    font-weight: 900;
    margin-top: 6px;
    font-family: 'Nunito', sans-serif;
    position: relative;
    z-index: 1;
  }
  .results-score b { color: var(--gold-light); }
  .results-msg {
    font-size: 13px;
    margin-top: 6px;
    opacity: 0.9;
    position: relative;
    z-index: 1;
  }
  .results-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
  }
  .stat {
    padding: 16px;
    background: white;
    text-align: center;
  }
  .stat-num {
    font-size: 22px;
    font-weight: 900;
    font-family: 'Nunito', sans-serif;
  }
  .stat-num.green { color: var(--correct); }
  .stat-num.red { color: var(--wrong); }
  .stat-label {
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 2px;
    font-weight: 600;
  }
  .review-list {
    padding: 16px;
  }
  .review-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--navy);
    margin-bottom: 10px;
  }
  .review-item {
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 13px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .review-item.correct { background: var(--correct-bg); }
  .review-item.wrong { background: var(--wrong-bg); }
  .review-num {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 50%;
    color: white;
    font-weight: 800;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Nunito', sans-serif;
  }
  .review-item.correct .review-num { background: var(--correct); }
  .review-item.wrong .review-num { background: var(--wrong); }
  .review-q { color: var(--ink); line-height: 1.5; }
  .retry-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--navy);
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
  }
  .retry-btn:hover { filter: brightness(1.05); }

  /* Hide */
  .hidden { display: none !important; }
</style>
</head>

    explanation: '맞아요! that절 전체("산타가 아이들에게 크리스마스 선물을 준다는 것")가 believes의 목적어예요.'

<script>
let currentIdx = 0;
let answers = new Array(QUESTIONS.length).fill(null); // null | correct: bool, choice: number/bool

const $ = (id) => document.getElementById(id);

function init() {
  $('total-num').textContent = QUESTIONS.length;
  renderDots();
  renderQuestion();
  $('prev-btn').addEventListener('click', prev);
  $('next-btn').addEventListener('click', next);
}

function renderDots() {
  const dots = $('dots');
  dots.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const d = document.createElement('button');
    d.className = 'dot';
    d.textContent = i + 1;
    if (i === currentIdx) d.classList.add('current');
    if (answers[i]) {
      d.classList.add(answers[i].correct ? 'correct' : 'wrong');
    }
    d.addEventListener('click', () => { currentIdx = i; renderQuestion(); renderDots(); });
    dots.appendChild(d);
  });
}

function renderQuestion() {
  const q = QUESTIONS[currentIdx];
  const ans = answers[currentIdx];

  $('cur-num').textContent = currentIdx + 1;
  const pct = Math.round(((currentIdx + 1) / QUESTIONS.length) * 100);
  $('progress-pct').textContent = pct + '%';
  $('progress-fill').style.width = pct + '%';

  // Type badge
  const badge = $('qtype-badge');
  if (q.type === 'mc') {
    badge.className = 'qtype-badge mc';
    badge.textContent = '4지선다';
  } else {
    badge.className = 'qtype-badge ox';
    badge.textContent = 'O / X 문제';
  }

  $('qtext').innerHTML = q.q;

  const area = $('answer-area');
  area.innerHTML = '';

  if (q.type === 'mc') {
    const wrap = document.createElement('div');
    wrap.className = 'options';
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.innerHTML = `<span class="option-num">${i+1}</span><span>${opt}</span>`;
      if (ans !== null) {
        btn.disabled = true;
        if (i === q.answer) btn.classList.add('correct');
        else if (i === ans.choice) btn.classList.add('wrong');
      } else {
        btn.addEventListener('click', () => answerMC(i));
      }
      wrap.appendChild(btn);
    });
    area.appendChild(wrap);
  } else {
    // OX
    const wrap = document.createElement('div');
    wrap.className = 'ox-options';
    [['o', true, 'O', '맞다'], ['x', false, 'X', '틀리다']].forEach(([cls, val, mark, label]) => {
      const btn = document.createElement('button');
      btn.className = 'ox-btn ' + cls;
      btn.innerHTML = `<span class="ox-mark">${mark}</span><span class="ox-label">${label}</span>`;
      if (ans !== null) {
        btn.disabled = true;
        if (val === q.answer) {
          btn.classList.add(ans.choice === val && ans.correct ? 'selected-correct' : 'show-answer');
        } else if (val === ans.choice) {
          btn.classList.add('selected-wrong');
        }
      } else {
        btn.addEventListener('click', () => answerOX(val));
      }
      wrap.appendChild(btn);
    });
    area.appendChild(wrap);
  }

  // Feedback
  const fb = $('feedback-area');
  fb.innerHTML = '';
  if (ans !== null) {
    const div = document.createElement('div');
    div.className = 'feedback ' + (ans.correct ? 'correct' : 'wrong');
    div.innerHTML = `<div class="feedback-title">${ans.correct ? '✓ 정답이에요!' : '✗ 틀렸어요'}</div>${q.explanation}`;
    fb.appendChild(div);
  }

  // Buttons
  $('prev-btn').disabled = currentIdx === 0;
  $('next-btn').textContent = currentIdx === QUESTIONS.length - 1 ? '결과 보기 →' : '다음 →';
  $('next-btn').disabled = ans === null;
}

function answerMC(choice) {
  const q = QUESTIONS[currentIdx];
  const correct = choice === q.answer;
  answers[currentIdx] = { choice, correct };
  renderQuestion();
  renderDots();
  if (correct) {
    setTimeout(() => {
      if (currentIdx < QUESTIONS.length - 1) next();
    }, 1100);
  }
}

function answerOX(choice) {
  const q = QUESTIONS[currentIdx];
  const correct = choice === q.answer;
  answers[currentIdx] = { choice, correct };
  renderQuestion();
  renderDots();
  if (correct) {
    setTimeout(() => {
      if (currentIdx < QUESTIONS.length - 1) next();
    }, 1100);
  }
}

function prev() {
  if (currentIdx > 0) { currentIdx--; renderQuestion(); renderDots(); }
}

function next() {
  if (currentIdx < QUESTIONS.length - 1) {
    currentIdx++;
    renderQuestion();
    renderDots();
  } else {
    showResults();
  }
}

function getGrade(pct) {
  if (pct === 100) return { grade: 'S', msg: '완벽해요! 진정한 영문법 마스터! 🏆', color: 'gold' };
  if (pct >= 90) return { grade: 'A', msg: '훌륭해요! 거의 완벽한 실력이에요! ✨', color: 'gold' };
  if (pct >= 80) return { grade: 'B', msg: '잘했어요! 조금만 더 연습하면 완벽! 💪', color: 'gold' };
  if (pct >= 60) return { grade: 'C', msg: '괜찮아요! 틀린 문제 다시 보면서 복습해요! 📚', color: 'gold' };
  if (pct >= 40) return { grade: 'D', msg: '더 연습이 필요해요! 다시 도전해봐요! 🔥', color: 'gold' };
  return { grade: 'F', msg: '걱정 마세요! 천천히 다시 공부하면 돼요! 💡', color: 'gold' };
}

function showResults() {
  const correctCount = answers.filter(a => a && a.correct).length;
  const wrongCount = QUESTIONS.length - correctCount;
  const pct = Math.round((correctCount / QUESTIONS.length) * 100);
  const { grade, msg } = getGrade(pct);

  $('quiz-screen').classList.add('hidden');
  const results = $('results-screen');
  results.classList.remove('hidden');

  let reviewHTML = '';
  answers.forEach((a, i) => {
    const q = QUESTIONS[i];
    const cls = a && a.correct ? 'correct' : 'wrong';
    let qPreview = q.q.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    if (qPreview.length > 60) qPreview = qPreview.slice(0, 58) + '…';
    reviewHTML += `<div class="review-item ${cls}"><span class="review-num">${i+1}</span><div class="review-q">${qPreview}</div></div>`;
  });

  results.innerHTML = `
    <div class="results">
      <div class="results-hero">
        <div class="grade-badge">${grade}</div>
        <div class="results-title">테스트 완료!</div>
        <div class="results-score"><b>${correctCount}</b> / ${QUESTIONS.length}점 (${pct}%)</div>
        <div class="results-msg">${msg}</div>
      </div>
      <div class="results-stats">
        <div class="stat"><div class="stat-num green">${correctCount}</div><div class="stat-label">맞은 문제</div></div>
        <div class="stat"><div class="stat-num red">${wrongCount}</div><div class="stat-label">틀린 문제</div></div>
      </div>
      <div class="review-list">
        <div class="review-title">📋 문제별 결과</div>
        ${reviewHTML}
      </div>
      <button class="retry-btn" onclick="retry()">🔄 다시 풀기</button>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function retry() {
  currentIdx = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  $('results-screen').classList.add('hidden');
  $('quiz-screen').classList.remove('hidden');
  renderDots();
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

init();
</script>
