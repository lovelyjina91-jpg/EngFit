<script>
"use strict";

/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "결과 전송 중...";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "✓ 결과가 지나티처에게 자동 전송되었어요"; el.style.color = "#2e7d6e"; }
  else { el.textContent = "전송이 안 됐어요 — 아래 버튼으로 복사해서 카톡으로 보내주세요!"; el.style.color = "#c0392b"; }
}

/* ══════ 규칙 카드 ══════ */
var R_SENSE = "<b>규칙</b> look · feel · smell · taste · sound 뒤에는 <em>형용사</em>!<br>· soft, dark, sweet, happy = 형용사 (어떤 상태) ⭕<br>· softly, darkly = 부사 (-ly) ❌ · softness, happiness = 명사 (-ness) ❌<br>예) This bed <em>feels soft</em>. / You <em>look happy</em>.";
var R_SUBJ = "<b>규칙</b> 동사는 <em>맨 앞의 진짜 주어</em>에 맞춰요!<br>· in / on / with / of 뒤에 붙은 말은 꾸며 주는 말이라 무시해요.<br>· 진짜 주어가 여럿(복수)이면 <em>are</em>, 하나면 <em>is</em><br>예) <em>The toys</em> in the box <em>are</em> new. / <em>The cup</em> of tea <em>is</em> hot.";
var R_MANY = "<b>규칙</b> 셀 수 있는 것(apples, cars) → <em>many</em> / 셀 수 없는 것(water, milk) → <em>much</em><br>· 여럿인 것은 There <em>aren't</em> + many ~<br>예) There aren't <em>many</em> books. / There isn't <em>much</em> water.";
var R_PAST = "<b>규칙</b> 과거의 일은 동사에 <em>-ed</em> 하나만 붙여요. was 를 같이 쓰지 않아요!<br>· want → <em>wanted</em> (⭕) / was want (❌)<br>예) Last week, I <em>wanted</em> a pizza.";

/* ══════ 문제 데이터: 10/16 클리닉에서 틀린 17문항 → 틀린 이유 + 쌍둥이 1개씩 ══════ */
var ITEMS = [
 { no: 1, part: "Part 1 · 감각동사 + 형용사", rule: R_SENSE,
   orig: "This blanket feels ______. (이 담요는 부드럽게 느껴진다.)", mine: "softness", right: "soft",
   why: "softness 는 '부드러움'이라는 <b>명사</b>예요. 담요가 '어떤 느낌인지'를 말할 때는 상태를 나타내는 <b>형용사 soft</b>를 써요. '부드럽게'라는 우리말 때문에 헷갈렸지만, feel 뒤에는 형용사가 와요.",
   q: "빈칸에 알맞은 것을 고르세요.<br>It feels ______. (따뜻한 느낌이야.)", choices: ["warm", "warmly", "warmth"], answer: "warm",
   exp: "feel 뒤에는 형용사 <b>warm</b>. warmly(부사), warmth(명사)는 안 돼요." },
 { no: 2, rule: R_SENSE,
   orig: "The sky looks ______ tonight. (오늘 밤 하늘이 어두워 보인다.)", mine: "darkly", right: "dark",
   why: "'어두워 보인다'라서 -ly 를 붙이고 싶었죠? 하지만 look 은 '~해 보인다'로 <b>모습(상태)</b>을 말해요. 그래서 -ly 없는 <b>형용사 dark</b>가 맞아요.",
   q: "빈칸에 알맞은 것을 고르세요.<br>It looks ______. (조용해 보여.)", choices: ["quiet", "quietly", "quietness"], answer: "quiet",
   exp: "look 뒤에는 형용사 <b>quiet</b>. '조용하게'라는 우리말에 속지 않기!" },

   q: "빈칸에 알맞은 것을 고르세요.<br>That sounds ______! (그거 좋다! 좋게 들려.)", choices: ["great", "greatly", "greatness"], answer: "great",

 { no: 18, rule: R_SUBJ,
   orig: "The windows in our classroom ______ big.", mine: "is", right: "are",
   why: "바로 앞의 classroom(하나)을 보고 is 를 골랐어요. 하지만 진짜 주어는 맨 앞의 <b>The windows</b>(여럿)예요. 그래서 <b>are</b>.",
   q: "빈칸에 알맞은 것을 고르세요.<br>The cookies in the box ______ sweet. (상자 속 쿠키들은 달아.)", choices: ["is", "are", "am"], answer: "are",
   exp: "jar 가 아니라 진짜 주어 The cookies(여럿) → <b>are</b>." },
 { no: 19, rule: R_SUBJ,
   orig: "올바른 문장 고르기 (사과가 든 그 가방은 무겁다.)", mine: "The bags of apples is heavy.", right: "The bag of apples is heavy.",

   q: "빈칸에 알맞은 것을 고르세요.<br>The box of toys ______ big. (장난감 상자는 커. 상자는 하나!)", choices: ["is", "are", "be"], answer: "is",

   q: "빈칸에 알맞은 것을 고르세요.<br>The muffins ______. (머핀들이 좋은 냄새가 나.)", choices: ["smell good", "smells good", "smell well"], answer: "smell good",
   exp: "머핀들(여럿) → <b>smell</b>, 냄새의 상태 → <b>good</b>." },
 { no: 36, rule: R_SENSE + "<br><br>" + R_SUBJ,
   orig: "올바른 문장 고르기 (합창단 소녀들은 행복하게 들린다.)", mine: "The girls in the choir sound happily.", right: "The girls in the choir sound happy.",
   why: "sound 는 잘 골랐어요(소녀들 = 여럿)! 아쉬운 건 <b>happily</b>. sound 뒤에는 형용사 <b>happy</b>예요.",
   q: "빈칸에 알맞은 것을 고르세요.<br>The boys look ______. (소년들이 신나 보여.)", choices: ["excited", "excitedly", "excitement"], answer: "excited",
   exp: "소년들(여럿) → <b>look</b>, look 뒤 → 형용사 <b>excited</b>." },
 { no: 39, rule: R_SUBJ,
   orig: "우리말에 맞는 문장 고르기 (책상 위의 연필들은 새것처럼 보인다.)", mine: "The pencils on the desk looks new.", right: "The pencils on the desk look new.",
   why: "new 는 잘 골랐어요! 그런데 바로 앞 desk(하나)를 보고 looks 를 썼어요. 진짜 주어는 <b>The pencils</b>(여럿) → <b>look</b>(s 없음).",
   q: "빈칸에 알맞은 것을 고르세요.<br>The chairs ______ old. (의자들이 낡아 보여.)", choices: ["look", "looks", "looking"], answer: "look",
   exp: "의자들(여럿) → <b>look</b>, 형용사 <b>old</b>." },
 { no: 40, rule: R_SENSE + "<br><br>" + R_PAST,
   orig: "올바른 문장 고르기 (두 마리 개를 데리고 있는 소년은 조용한 저녁을 원해서 피곤해 보였다.)", mine: "...looked tiredly because he wanted a quiet evening.", right: "...looked tired because he wanted a quiet evening.",
   why: "wanted 는 맞았어요! 딱 하나, <b>looked tiredly</b>. look 뒤에는 형용사 <b>tired</b>예요. 긴 문장도 하나씩 나눠서 확인하면 돼요.",
   q: "빈칸에 알맞은 것을 고르세요.<br>She looked ______. (그녀는 피곤해 보였어.)", choices: ["tired", "tiredly", "tires"], answer: "tired",
   exp: "looked + 형용사 <b>tired</b>, 소녀(하나)의 과거 → <b>looked</b>." }
];
var QUIZ_ID = "clinic-yjw-1022";
var QUIZ_TITLE = "유정완 이유+쌍둥이 클리닉 10/22 (쉬운 문장)";

/* ══════ 진행 ══════ */
var studentName = "", cur = 0, correct = 0, wrong = [], unknown = [], detail = [], startTime = 0, answered = false;
function $(id) { return document.getElementById(id); }
function show(id) { ["start-card", "why-card", "twin-card", "result-card"].forEach(function (c) { $(c).classList.add("hidden"); }); $(id).classList.remove("hidden"); window.scrollTo(0, 0); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function partOf(i) { for (var k = i; k >= 0; k--) if (ITEMS[k].part) return ITEMS[k].part; return ""; }
function prog(i) { return (i + 1) + " / " + ITEMS.length + " · 10/16 클리닉 " + ITEMS[i].no + "번"; }

$("start-btn").addEventListener("click", function () {
  var n = $("name-input").value.trim();
  if (!n) { $("name-input").focus(); return; }
  studentName = n; startTime = Date.now(); showWhy();
});

function showWhy() {
  var it = ITEMS[cur];
  $("why-progress").textContent = prog(cur);
  $("why-bar").style.width = (cur / ITEMS.length * 100) + "%";
  var p = it.part || "";
  if (p) { $("why-part").textContent = p; $("why-part").classList.remove("hidden"); } else { $("why-part").textContent = partOf(cur); $("why-part").classList.remove("hidden"); }
  $("why-orig").innerHTML = "<b>원래 문제</b><br>" + it.orig;
  $("why-mine").textContent = it.mine;
  $("why-right").textContent = it.right;
  $("why-text").innerHTML = "<b>왜 틀렸을까?</b><br>" + it.why;
  $("why-rule").innerHTML = it.rule;
  show("why-card");
}
$("read-btn").addEventListener("click", showTwin);

function showTwin() {
  var it = ITEMS[cur]; answered = false;
  $("twin-progress").textContent = prog(cur);
  $("twin-bar").style.width = ((cur + 0.5) / ITEMS.length * 100) + "%";
  $("twin-q").innerHTML = it.q;
  var box = $("choices"); box.innerHTML = "";
  shuffle(it.choices).forEach(function (c, k) {
    var b = document.createElement("button");
    b.className = "choice"; b.innerHTML = '<span class="num">' + (k + 1) + "</span>" + c;
    b.dataset.v = c;
    b.addEventListener("click", function () { pick(c, b); });
    box.appendChild(b);
  });
  $("unknown-btn").classList.remove("hidden");
  $("fb").classList.add("hidden"); $("next-btn").classList.add("hidden");
  show("twin-card");
}

function pick(c, btn) {
  if (answered) return; answered = true;
  var it = ITEMS[cur], ok = (c === it.answer);
  if (ok) correct++; else wrong.push(cur + 1);
  detail.push({ no: cur + 1, orig: it.no, ok: ok, chosen: c, answer: it.answer });
  Array.prototype.forEach.call(document.querySelectorAll(".choice"), function (b) {
    if (b.dataset.v === it.answer) b.classList.add("ok"); else if (b === btn) b.classList.add("no");
  });
  $("unknown-btn").classList.add("hidden");
  var fb = $("fb"); fb.classList.remove("hidden");
  fb.className = "fb " + (ok ? "good" : "bad");
  fb.innerHTML = ok ? "⭕ 맞았어요! " + it.exp : "❌ 아쉬워요. " + it.exp + "<br><br>" + it.rule;
  $("next-btn").classList.remove("hidden");
}

$("unknown-btn").addEventListener("click", function () {
  if (answered) return; answered = true;
  var it = ITEMS[cur];
  wrong.push(cur + 1); unknown.push(cur + 1);
  detail.push({ no: cur + 1, orig: it.no, ok: false, chosen: "모름", answer: it.answer, unknown: true });
  next();
});
$("next-btn").addEventListener("click", next);

function next() { cur++; if (cur < ITEMS.length) showWhy(); else finish(); }

function unkText() { return "🤔 모름: " + unknown.length + "개" + (unknown.length ? " (" + unknown.join(", ") + "번)" : ""); }

function finish() {
  var total = ITEMS.length, sec = Math.round((Date.now() - startTime) / 1000);
  $("score-line").textContent = correct + " / " + total;
  $("unk-line").textContent = unkText();
  var html = "";
  ITEMS.forEach(function (it, i) {
    var d = detail[i];
    html += '<div class="exp' + (d.ok ? "" : " wrong") + '"><b>' + (i + 1) + ". " + (d.ok ? "⭕" : (d.unknown ? "🤔 모름" : "❌")) + "</b> " + it.q.replace(/<br>/g, " ") + "<br>정답: <b>" + it.answer + "</b>" + (d.ok || d.unknown ? "" : " (고른 답: " + d.chosen + ")") + "<br>" + it.exp + "</div>";
  });
  $("explanations").innerHTML = html;
  show("result-card");
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correct, total: total, wrong: wrong, unknown: unknown, durationSec: sec, detail: detail });
}

$("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 이유+쌍둥이 클리닉 10/22 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName + "\n점수: " + correct + "/" + ITEMS.length + "\n틀린 문항: " + (wrong.length ? wrong.join(", ") : "없음") + "\n" + unkText();
  navigator.clipboard.writeText(msg).then(function () {
    $("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});
</script>
