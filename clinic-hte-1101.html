<script>
"use strict";

/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#2e7d6e"; }
  else { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#c0392b"; }
}


/* ══════ 문제 데이터 (개념 페이지 + 쌍둥이 문제) ══════ */
var STEPS = [
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">① 성격 형용사 뒤에는 of + 사람<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/30 데일리 1번 · 10/31 데일리 1번 · 10/26 데일리 2번)<\/div>It was generous ___ our neighbor to ~ / How polite ___ Junho to ~!<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>what / for / what<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>of<\/b> / <b>of<\/b> / <b>of<\/b><\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">10/30 · 10/31 데일리에서 연달아 또 틀렸어요. to부정사의 동작을 하는 사람(의미상 주어)은 보통 <b>for + 사람<\/b>이지만, generous · polite · kind · brave · foolish처럼 <b>그 사람을 칭찬하거나 꾸짖는 형용사<\/b> 뒤에서는 <b>of + 사람<\/b>이에요. what은 이 자리에 절대 못 와요. 감탄문 How polite ~! 모양이어도 규칙은 똑같아요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>It is / How + 형용사 + <b class=\"hl\">for / of<\/b> + 사람 + to 동사원형<\/p><ul><li>성격 형용사 → of: It was wise <b class=\"hl\">of<\/b> Dana to bring a map.<\/li><li>상황 형용사(easy, hard, safe, important) → for: It is important <b class=\"hl\">for<\/b> athletes to sleep well.<\/li><li>확인법: 'Dana is wise.(다나는 현명하다)'처럼 사람 = 형용사가 말이 되면 of!<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: 빈칸 앞 형용사를 먼저 보고 '사람 칭찬 · 꾸중?' → 맞으면 of, 아니면 for. what · to는 이 자리에 ✕!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">It was brave ______ the little girl to speak in front of the whole school.<\/div>",
  "choices": ["for", "of", "to", "what"],
  "answer": "of",
  "exp": "brave(용감한)는 그 아이를 칭찬하는 성격 형용사라 <b>of + 사람<\/b>이에요. The little girl was brave.가 말이 되죠. 10/31 데일리 polite of Junho와 같은 자리예요."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">It is difficult ______ my grandma to read small letters.<\/div>",
  "choices": ["for", "of", "to", "what"],
  "answer": "for",
  "exp": "difficult(어려운)는 할머니의 성격이 아니라 일이 어렵다는 말이라 <b>for + 사람<\/b>이에요. My grandma is difficult.(할머니가 까다롭다)는 뜻이 달라지니까 of ✕."
 },
 {
  "type": "twin",
  "q": "다음 우리말을 영어로 바르게 옮긴 것은?<div class=\"pass\">내 생일을 기억해 주다니 너는 정말 친절하구나!<\/div>",
  "choices": ["How kind for you to remember my birthday!", "How kind to you to remember my birthday!", "How kind of you remembering my birthday!", "How kind of you to remember my birthday!"],
  "answer": "How kind of you to remember my birthday!",
  "exp": "kind는 성격 형용사 → <b>of you<\/b>, 그 뒤는 <b>to + 동사원형<\/b>(to remember). for · to + 사람 ✕, -ing ✕예요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">② ask / tell / want + 사람 + to 동사원형<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/31 데일리 9번)<\/div>My mom asked me ___ my room. (청소하라고)<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>cleaning<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>to clean<\/b><\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">'누구에게 ~하라고 부탁하다 / 말하다 / 원하다'는 <b>동사 + 사람 + to + 동사원형<\/b> 모양이에요. 사람 뒤에 -ing를 붙이면 안 돼요. 8과에서 배운 tell + 사람 + to부정사와 같은 짝이에요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p><b class=\"hl\">ask / tell / want / advise<\/b> + 사람 + <b class=\"hl\">to 동사원형<\/b><\/p><ul><li>The coach asked us <b class=\"hl\">to wait<\/b> outside. (기다려 달라고 부탁)<\/li><li>My aunt wants me <b class=\"hl\">to visit<\/b> her this weekend. (와 주기를 원함)<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: 사람 바로 뒤 자리에 -ing ✕, 동사원형만 ✕ → 꼭 to를 붙여요!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (선생님은 우리에게 휴대폰을 끄라고 말씀하셨다)<div class=\"pass\">The teacher told us ______ off our phones.<\/div>",
  "choices": ["turning", "to turn", "turn", "turned"],
  "answer": "to turn",
  "exp": "<b>tell + 사람 + to 동사원형<\/b> → told us <b>to turn<\/b>. 10/31 데일리 cleaning처럼 -ing를 쓰면 틀려요."
 },
 {
  "type": "twin",
  "q": "다음 우리말을 영어로 바르게 옮긴 것은?<div class=\"pass\">아빠는 내가 개를 산책시키기를 원하신다.<\/div>",
  "choices": ["Dad wants me walk the dog.", "Dad wants me walking the dog.", "Dad wants me to walk the dog.", "Dad wants I walk the dog."],
  "answer": "Dad wants me to walk the dog.",
  "exp": "<b>want + 사람(me) + to 동사원형(to walk)<\/b>. to가 빠지거나 -ing ✕, 사람 자리에 I(주격) ✕예요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">③ 과거진행형 — was / were + 동사-ing (주어 수 확인!)<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (11/1 데일리 3번 · 10/28 · 10/25 데일리)<\/div>The kids ___ when the bell rang. (sing)<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>was sang<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>were singing<\/b><\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">10/30 클리닉에서 연습했는데 11/1에 또 틀렸어요. 두 가지를 놓쳤어요. ① 주어 The kids는 <b>여럿<\/b>이라 was가 아니라 <b>were<\/b>. ② was / were 뒤에는 과거형(sang)이 아니라 <b>-ing<\/b>(singing). 과거진행형은 항상 <b>was / were + 동사-ing<\/b> 두 조각이에요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>~하고 있었다 = <b class=\"hl\">was / were + -ing<\/b><\/p><ul><li>한 명 · 하나 → was: The cat <b class=\"hl\">was chasing<\/b> a butterfly.<\/li><li>여럿 → were: Ben and Lucy <b class=\"hl\">were baking<\/b> bread at noon.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: was sang ✕ / were play ✕ — be동사 뒤에는 꼭 -ing! A and B는 둘이니까 were!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (내가 전화했을 때 엄마와 이모는 이야기를 나누고 있었다)<div class=\"pass\">When I called, Mom and my aunt ______.<\/div>",
  "choices": ["were talking", "was talking", "talked", "were talk"],
  "answer": "were talking",
  "exp": "Mom and my aunt는 두 사람이라 <b>were<\/b>, 그리고 -ing까지 붙여 <b>were talking<\/b>이에요. was talking은 주어 수가 틀리고, were talk는 -ing가 빠졌어요."
 },
 {
  "type": "twin",
  "q": "어법상 <b>바른<\/b> 문장은?",
  "choices": ["The baby were crying all night.", "We was walking home in the rain.", "He was sang a song at that time.", "My friends were dancing on the stage."],
  "answer": "My friends were dancing on the stage.",
  "exp": "My friends(복수) + <b>were dancing<\/b>이 바른 문장이에요. The baby → was, We → were, was sang → was singing(11/1 데일리와 같은 실수)이 맞아요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">④ 현재완료 부정 — hasn't / haven't + p.p. (아직 ~하지 못했다)<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (11/1 데일리 10번 · 8과 현재완료)<\/div>그는 아직 숙제를 끝내지 못했다. (finish, yet)<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>He isn't finish ~<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>He <b>hasn't finished<\/b> his homework yet.<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">'아직 ~하지 못했다'는 과거부터 지금까지 안 끝난 상태라 <b>현재완료 부정<\/b>이에요. 형태는 <b>hasn't / haven't + 과거분사(p.p.)<\/b>. is · isn't는 be동사라 일반동사 finish 앞에 쓸 수 없고, 동사도 원형이 아니라 p.p.(finished)여야 해요. 끝에 <b>yet<\/b>(아직)이 자주 붙어요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>주어 + <b class=\"hl\">hasn't / haven't + p.p.<\/b> (+ yet)<\/p><ul><li>3인칭 단수 → hasn't: The package <b class=\"hl\">hasn't arrived<\/b> yet.<\/li><li>I / you / we / they / 복수 → haven't: They <b class=\"hl\">haven't chosen<\/b> a team name yet.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: isn't + 동사원형 ✕ / didn't + yet ✕ → '아직 못 했다'는 hasn't · haven't + p.p.!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (민서는 아직 마지막 장을 읽지 않았다)<div class=\"pass\">Minseo ______ the last chapter yet.<\/div>",
  "choices": ["isn't read", "hasn't read", "haven't read", "doesn't read"],
  "answer": "hasn't read",
  "exp": "'아직 ~하지 않았다'는 현재완료 부정. Minseo는 3인칭 단수라 <b>hasn't read<\/b>(read-read-read)예요. isn't read는 11/1 데일리 isn't finish와 같은 실수, haven't는 주어 수가 안 맞아요."
 },
 {
  "type": "twin",
  "q": "다음 우리말을 영어로 바르게 옮긴 것은?<div class=\"pass\">우리는 아직 새 이웃을 만나 보지 못했다.<\/div>",
  "choices": ["We aren't meet our new neighbors yet.", "We hasn't met our new neighbors yet.", "We haven't met our new neighbors yet.", "We didn't met our new neighbors yet."],
  "answer": "We haven't met our new neighbors yet.",
  "exp": "We는 복수라 <b>haven't + met<\/b>(meet-met-met). aren't meet ✕, hasn't는 3인칭 단수용 ✕, didn't 뒤에는 원형이라 met ✕예요."
 },
 {

 {
  "type": "concept",
  "html": "<div class=\"ctitle\">⑥ 간접의문문 — 의문사 + 주어 + 동사(-s) / if + 주어 + 동사<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/30 데일리 7번 · 10/27 숙제 2 · 5 · 7 · 8번 · 10/27 데일리 9번)<\/div>Do you know what time the train ___? / I wonder ___ it will snow.<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>the train leave / when the library open / why he late / if the train arrive / I wonder it will snow<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>the train <b>leaves<\/b> / the library <b>opens<\/b> / why he <b>was<\/b> late / the train <b>arrives<\/b> / I wonder <b>if<\/b> it will snow<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">10/30 데일리에서 또 -s를 빠뜨렸어요. 질문을 문장 속에 넣으면 do / does / did는 사라지고 <b>의문사 + 주어 + 동사<\/b> 순서가 돼요. does의 -s는 <b>동사로 옮겨 가고<\/b>(leave → leaves), be동사 질문(Why is he late?)은 is를 주어 뒤로 보내요(why he is late). 의문사가 없는 Yes / No 질문은 <b>if(~인지)<\/b>를 넣어요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>When does the museum open? → I know when the museum <b class=\"hl\">opens<\/b>.<\/p><ul><li>Where is the key? → Tell me where the key <b class=\"hl\">is<\/b>.<\/li><li>Does Leo play chess? → I wonder <b class=\"hl\">if<\/b> Leo <b class=\"hl\">plays<\/b> chess.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: does를 지우면서 -s까지 지우면 ✕! be동사를 빼먹으면 ✕! '~인지'는 if!<\/div>"

var QUIZ_ID = "clinic-hte-1101";
var QUIZ_TITLE = "한태은 사진 클리닉 개념+쌍둥이 11/01";
var TW = STEPS.filter(function (x) { return x.type === "twin"; });
var CONCEPT_OF = {};
(function () { var last = ""; STEPS.forEach(function (x, i) { if (x.type === "concept") last = x.html; else CONCEPT_OF[i] = last; }); })();

var studentName = "", cur = 0, twinNo = 0, correctCount = 0, wrongNumbers = [], unknownNumbers = [], answersLog = [], startTime = 0, locked = false;
var nameInput = document.getElementById("name-input"), startBtn = document.getElementById("start-btn");
var CIRCLED = ["①", "②", "③", "④", "⑤"];
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function $(id) { return document.getElementById(id); }

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  $("start-card").classList.add("hidden");
  $("quiz-card").classList.remove("hidden");
  show();
});
$("read-btn").addEventListener("click", function () { cur++; show(); });

function show() {
  if (cur >= STEPS.length) return showResult();
  var st = STEPS[cur];
  $("bar-fill").style.width = Math.round(cur / STEPS.length * 100) + "%";
  $("fb").innerHTML = "";
  if (st.type === "concept") {
    $("progress").textContent = "틀린 이유 읽기 · 쌍둥이 문제 " + (twinNo + 1) + "번 전";
    $("part").classList.add("hidden");
    $("concept-box").innerHTML = st.html; $("concept-box").classList.remove("hidden");
    $("read-btn").classList.remove("hidden");
    $("qtext").innerHTML = ""; $("choices").innerHTML = "";
    window.scrollTo(0, 0);
  } else {
    $("progress").textContent = "쌍둥이 문제 " + (twinNo + 1) + " / " + TW.length;
    $("concept-box").classList.add("hidden"); $("read-btn").classList.add("hidden");
    $("qtext").innerHTML = "Q" + (twinNo + 1) + ". " + st.q;
    var box = $("choices"); box.innerHTML = "";
    shuffle(st.choices).forEach(function (c, i) {
      var b = document.createElement("button"); b.className = "choice"; b.setAttribute("data-c", c);
      b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
      b.addEventListener("click", function () { pick(c); });
      box.appendChild(b);
    });
    var u = document.createElement("button"); u.className = "unk"; u.id = "unk-btn"; u.textContent = "🤔 모름";
    u.addEventListener("click", function () { unknown(); });
    box.appendChild(u);
    window.scrollTo(0, 0);
  }
}

function pick(choice) {
  if (locked) return; locked = true;
  var st = STEPS[cur], ok = choice === st.answer;
  if (ok) correctCount++; else wrongNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: ok, chosen: choice, answer: st.answer });
  [].forEach.call($("choices").children, function (b) {
    b.disabled = true;
    if (b.getAttribute("data-c") === st.answer) b.classList.add("right");
    else if (b.getAttribute("data-c") === choice) b.classList.add("bad");
  });
  var h = '<div class="exp' + (ok ? "" : " wrong") + '"><b>' + (ok ? "정답! 🎉" : "아쉬워요 — 정답: " + st.answer) + "</b><br>" + st.exp + "</div>";
  if (!ok) h += '<div class="lab2">📖 개념 정리 다시 보기</div>' + CONCEPT_OF[cur];
  h += '<button class="btn" id="next-btn">' + (twinNo + 1 < TW.length ? "다음 ▶" : "결과 보기") + "</button>";
  $("fb").innerHTML = h;
  $("next-btn").addEventListener("click", function () { locked = false; twinNo++; cur++; show(); });
}

function unknown() {
  if (locked) return; locked = true;
  var st = STEPS[cur];
  wrongNumbers.push(twinNo + 1); unknownNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: false, chosen: "모름", answer: st.answer, unknown: true });
  locked = false; twinNo++; cur++; show();
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}

function showResult() {
  $("quiz-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  $("score-line").textContent = correctCount + " / " + TW.length;
  var um = document.createElement("div"); um.id = "unknown-line"; um.className = "sub"; um.style.textAlign = "center"; um.textContent = unknownLine();
  $("score-line").parentNode.insertBefore(um, $("submit-status"));
  var expBox = $("explanations");
  TW.forEach(function (q, i) {
    var log = answersLog[i], d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>쌍둥이 " + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 (정답: " + q.answer + ")" : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correctCount, total: TW.length, wrong: wrongNumbers,
    unknown: unknownNumbers, durationSec: Math.round((Date.now() - startTime) / 1000), detail: answersLog });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 사진 클리닉 11/01 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + TW.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n" + unknownLine();
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});

</script>
