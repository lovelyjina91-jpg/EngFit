<script>
"use strict";

/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#2e7d6e"; }
  else { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#c0392b"; }
}


/* ══════ 문제 데이터 (개념 페이지 + 쌍둥이 문제) ══════ */
var STEPS = [
 {
  "type": "concept",
  "html": "<div class='ctitle'>① 의미상 주어 for / of — It is + 형용사 + for/of + 목적격 + to 동사원형 (7과)</div><div class='box'><div class='lab'>교과서 문장 (7과 본문)</div>They believe it is important to remember dead people. → 누가 하는지 밝히려면 for / of + 목적격</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>It was rude <b>for</b> him ~ / It is useful for <b>they</b> ~ / It was kind of <b>his</b> ~</div><div class='box ok'><div class='lab'>정답 모양</div>일에 대한 판단 → <b>for + 목적격</b> · 사람의 성격·태도 → <b>of + 목적격</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>for 와 of 둘 다 '~가'로 해석돼서 헷갈려요. 형용사를 보고 <b>사람을 칭찬하거나 꾸짖는 말</b>(kind, rude, brave, clever, generous, selfish)이면 <b>of</b>, <b>그 일이 어떤지</b>(easy, useful, dangerous, important)면 <b>for</b>. 뒤에는 꼭 목적격(him, them, me)!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>It is easy <b class='hl'>for me</b> to cook ramen. (일이 쉬움)</li><li>It was nice <b class='hl'>of them</b> to help us. (그 사람들이 착함)</li></ul></div><div class='trap'>⚠️ 함정: 성격 형용사 + for ✕ · 주격·소유격(they, his) ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>It was brave ______ to sing alone on the big stage.</div>",
  "choices": ["for her", "of her", "of hers", "her"],
  "answer": "of her",
  "exp": "brave(용감한 = 사람에 대한 칭찬) → <b>of + 목적격</b> → <b>of her</b>."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>It is useful ______ to learn how to swim.</div>",
  "choices": ["of kids", "kids", "for kids", "for kids'"],
  "answer": "for kids",
  "exp": "useful(그 일이 쓸모 있음 = 일에 대한 판단) → <b>for + 목적격</b> → <b>for kids</b>."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["It was generous of her to share her lunch.", "It is easy for me to ride a bike.", "It was cruel for him to pull the cat's tail.", "It is dangerous for children to play near the road."],
  "answer": "It was cruel for him to pull the cat's tail.",
  "exp": "cruel(잔인한 = 사람의 태도) → <b>of him</b>."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>② 현재완료 계속 for / since · 완료 just / already (8과)</div><div class='box'><div class='lab'>교과서 문장 (8과 본문)</div>I've never seen such a huge thing. → have/has + p.p. = 과거부터 지금까지 이어짐</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>have known <b>since</b> three years / has lived <b>for</b> 2019 / <b>When have</b> you met him?</div><div class='box ok'><div class='lab'>정답 모양</div><b>for + 기간</b>(three years) · <b>since + 시작 시점</b>(2019, last May) · When 으로 물으면 <b>과거형</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>for 와 since 둘 다 '~동안, ~부터'처럼 느껴져요. 뒤에 오는 말이 <b>얼마나 오래</b>(기간)인지, <b>언제부터</b>(시점)인지 보면 돼요. 그리고 When 은 '딱 그때'를 묻는 말이라 현재완료와 같이 못 써요 → When <b>did</b> you ~?</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>She <b class='hl'>has worked</b> here <b class='hl'>for</b> five years. / <b class='hl'>since</b> 2021.</li><li>I <b class='hl'>have just finished</b> lunch. / When <b class='hl'>did</b> you finish? (When have ✕)</li></ul></div><div class='trap'>⚠️ 함정: for ↔ since 바꾸기 ✕ · during / ago ✕ · When + 현재완료 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (우리는 6개월 동안 이 반에 있었다)<div class='pass'>We have been in this class ______ six months.</div>",
  "choices": ["since", "for", "during", "ago"],
  "answer": "for",
  "exp": "six months 는 <b>기간</b> → <b>for</b>. since 뒤에는 시작 시점이 와요."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>My uncle has worked at the bank ______ 2018.</div>",
  "choices": ["for", "ago", "since", "during"],
  "answer": "since",
  "exp": "2018 은 <b>시작 시점</b> → <b>since</b> 2018 (2018년부터 지금까지)."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["I have already finished my homework.", "When have you met him?", "She has just left the office.", "They have been friends since childhood."],
  "answer": "When have you met him?",
  "exp": "When 은 딱 그 과거 시점을 물어요 → <b>When did you meet him?</b>"
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>③ 지각동사 see / hear / feel / watch + 목적어 + 동사원형 / -ing (8과)</div><div class='box'><div class='lab'>한눈에 보기</div>보고 · 듣고 · 느끼는 동사 뒤: 목적어 + <b>동사원형</b> 또는 <b>-ing</b></div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>heard someone <b>to knock</b> / saw him <b>washed</b> / felt it <b>shakes</b></div><div class='box ok'><div class='lab'>정답 모양</div>see / hear / feel / watch + 목적어 + <b>동사원형</b> (진행 중이면 <b>-ing</b>)</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>want me <b>to</b> go 처럼 목적어 뒤에 to 를 쓰는 동사를 배워서, 지각동사 뒤에도 to 를 넣고 싶어져요. 하지만 지각동사는 <b>to 없이</b> 바로 동사원형! 목적어가 3인칭이어도 -s 를 붙이지 않아요.</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>I <b class='hl'>saw her dance</b> on the stage. / I <b class='hl'>saw her dancing</b>.</li><li>We <b class='hl'>heard the baby cry</b>. (to cry ✕, cries ✕)</li></ul></div><div class='trap'>⚠️ 함정: to 넣기 ✕ · 과거형·-s 붙이기 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>I saw my dad ______ the car in the yard.</div>",
  "choices": ["to wash", "wash", "washed", "washes"],
  "answer": "wash",
  "exp": "지각동사 saw + 목적어(my dad) + <b>동사원형 wash</b>(또는 washing). to ✕"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>We heard the birds ______ early in the morning.</div>",
  "choices": ["to sing", "sang", "singing", "sings"],
  "answer": "singing",
  "exp": "hear + 목적어(the birds) + <b>-ing(singing)</b> 또는 동사원형. to · 과거형 · -s ✕"
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["I felt the ground shake.", "She watched the kids play soccer.", "We heard someone to play the piano next door.", "He saw a cat running across the street."],
  "answer": "We heard someone to play the piano next door.",
  "exp": "heard + 목적어 + <b>동사원형 play</b>(또는 playing). to play ✕"
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>④ want / tell / ask + 목적어 + to 동사원형 · must not (8과)</div><div class='box'><div class='lab'>교과서 문장 (8과 본문)</div>I don't want you to do anything foolish.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>told me <b>buy</b> / asked <b>we</b> to come / You <b>not must</b> run</div><div class='box ok'><div class='lab'>정답 모양</div>want / tell / ask + <b>목적격</b> + <b>to 동사원형</b> · <b>must not</b> + 동사원형</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>지각동사와 반대로, want · tell · ask 는 목적어 뒤에 꼭 <b>to</b>! 목적어 자리는 '우리가'라도 <b>us</b>(목적격). must not 은 not 이 <b>must 뒤</b>에 와요 — '절대 ~하면 안 된다'.</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>My mom <b class='hl'>told me to clean</b> my room.</li><li>You <b class='hl'>must not</b> use your phone in class.</li></ul></div><div class='trap'>⚠️ 함정: to 빠뜨리기 ✕ · 주격(we, he) ✕ · not must ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (누나는 나에게 불을 끄라고 말했다)<div class='pass'>My sister told me ______ the light.</div>",
  "choices": ["turn off", "turning off", "to turn off", "turned off"],
  "answer": "to turn off",
  "exp": "<b>tell + 목적어(me) + to 동사원형</b> → told me <b>to turn off</b>."
 },
 {
  "type": "twin",
  "q": "우리말을 영어로 바르게 옮긴 것은?<div class='pass'>선생님은 우리에게 일찍 오라고 요청하셨다.</div>",
  "choices": ["The teacher asked us come early.", "The teacher asked we to come early.", "The teacher asked to us come early.", "The teacher asked us to come early."],
  "answer": "The teacher asked us to come early.",
  "exp": "<b>ask + 목적격(us) + to 동사원형</b>. we ✕, to 빠뜨리기 ✕"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은? (이 호수는 너무 깊어서 수영하면 절대 안 된다)<div class='pass'>You ______ swim in this lake. It's too deep.</div>",
  "choices": ["not must", "must not", "don't must", "must not to"],
  "answer": "must not",
  "exp": "강한 금지 = <b>must not + 동사원형</b>. not must ✕, must not to ✕"
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>⑤ 진짜 주어 찾기 — 꾸미는 말 빼고 수일치 · 동명사 주어는 단수 (7과)</div><div class='box'><div class='lab'>예문 (7과 소재)</div>People in Mexico <b>celebrate</b> the Day of the Dead. → 꾸미는 말(in Mexico) 빼고 People 에 맞춤</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>The books on the shelf <b>is</b> ~ / The girl with two dogs <b>live</b> ~ / Watching movies <b>are</b> ~</div><div class='box ok'><div class='lab'>정답 모양</div>[진짜 주어] (꾸미는 말) + <b>진짜 주어에 맞는 동사</b> · -ing 주어 → 단수</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>동사 바로 앞의 명사(shelf, dogs, movies)를 주어로 착각해요. <b>in ~ · on ~ · with ~</b> 같은 꾸미는 말에 괄호를 치고 맨 앞 명사만 보세요. -ing 주어는 뒤에 복수 명사가 있어도 '~하는 것 하나'라서 단수!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li><b class='hl'>The students</b> (in my class) <b class='hl'>have</b> big dreams.</li><li><b class='hl'>Playing</b> board games <b class='hl'>is</b> fun.</li></ul></div><div class='trap'>⚠️ 함정: 바로 앞 명사에 맞추기 ✕ · -ing 주어 + 복수 동사 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>The flowers in the blue vase ______ beautiful.</div>",
  "choices": ["is", "was", "are", "be"],
  "answer": "are",
  "exp": "in the blue vase 는 꾸미는 말 → 진짜 주어 <b>The flowers</b>(복수) → <b>are</b>."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>Learning to ride a horse ______ not easy.</div>",
  "choices": ["are", "is", "were", "be"],
  "answer": "is",
  "exp": "동명사 주어(Learning to ride a horse)는 '배우는 것 하나' → 단수 <b>is</b>."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>The girl with two big dogs ______ next door.</div>",
  "choices": ["live", "living", "to live", "lives"],
  "answer": "lives",
  "exp": "with two big dogs 는 꾸미는 말 → 진짜 주어 <b>The girl</b>(단수) → <b>lives</b>."
 }
];

var QUIZ_ID = "clinic-hte-1110";
var QUIZ_TITLE = "한태은 사진 클리닉 개념+쌍둥이 11/10";
var TW = STEPS.filter(function (x) { return x.type === "twin"; });
var CONCEPT_OF = {};
(function () { var last = ""; STEPS.forEach(function (x, i) { if (x.type === "concept") last = x.html; else CONCEPT_OF[i] = last; }); })();

var studentName = "", cur = 0, twinNo = 0, correctCount = 0, wrongNumbers = [], unknownNumbers = [], answersLog = [], startTime = 0, locked = false;
var nameInput = document.getElementById("name-input"), startBtn = document.getElementById("start-btn");
var CIRCLED = ["①", "②", "③", "④", "⑤"];
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function $(id) { return document.getElementById(id); }

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  $("start-card").classList.add("hidden");
  $("quiz-card").classList.remove("hidden");
  show();
});
$("read-btn").addEventListener("click", function () { cur++; show(); });

function show() {
  if (cur >= STEPS.length) return showResult();
  var st = STEPS[cur];
  $("bar-fill").style.width = Math.round(cur / STEPS.length * 100) + "%";
  $("fb").innerHTML = "";
  if (st.type === "concept") {
    $("progress").textContent = "틀린 이유 읽기 · 쌍둥이 문제 " + (twinNo + 1) + "번 전";
    $("part").classList.add("hidden");
    $("concept-box").innerHTML = st.html; $("concept-box").classList.remove("hidden");
    $("read-btn").classList.remove("hidden");
    $("qtext").innerHTML = ""; $("choices").innerHTML = "";
    window.scrollTo(0, 0);
  } else {
    $("progress").textContent = "쌍둥이 문제 " + (twinNo + 1) + " / " + TW.length;
    $("concept-box").classList.add("hidden"); $("read-btn").classList.add("hidden");
    $("qtext").innerHTML = "Q" + (twinNo + 1) + ". " + st.q;
    var box = $("choices"); box.innerHTML = "";
    shuffle(st.choices).forEach(function (c, i) {
      var b = document.createElement("button"); b.className = "choice"; b.setAttribute("data-c", c);
      b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
      b.addEventListener("click", function () { pick(c); });
      box.appendChild(b);
    });
    var u = document.createElement("button"); u.className = "unk"; u.id = "unk-btn"; u.textContent = "🤔 모름";
    u.addEventListener("click", function () { unknown(); });
    box.appendChild(u);
    window.scrollTo(0, 0);
  }
}

function pick(choice) {
  if (locked) return; locked = true;
  var st = STEPS[cur], ok = choice === st.answer;
  if (ok) correctCount++; else wrongNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: ok, chosen: choice, answer: st.answer });
  [].forEach.call($("choices").children, function (b) {
    b.disabled = true;
    if (b.getAttribute("data-c") === st.answer) b.classList.add("right");
    else if (b.getAttribute("data-c") === choice) b.classList.add("bad");
  });
  var h = '<div class="exp' + (ok ? "" : " wrong") + '"><b>' + (ok ? "정답! 🎉" : "아쉬워요 — 정답: " + st.answer) + "</b><br>" + st.exp + "</div>";
  if (!ok) h += '<div class="lab2">📖 개념 정리 다시 보기</div>' + CONCEPT_OF[cur];
  h += '<button class="btn" id="next-btn">' + (twinNo + 1 < TW.length ? "다음 ▶" : "결과 보기") + "</button>";
  $("fb").innerHTML = h;
  $("next-btn").addEventListener("click", function () { locked = false; twinNo++; cur++; show(); });
}

function unknown() {
  if (locked) return; locked = true;
  var st = STEPS[cur];
  wrongNumbers.push(twinNo + 1); unknownNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: false, chosen: "모름", answer: st.answer, unknown: true });
  locked = false; twinNo++; cur++; show();
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}

function showResult() {
  $("quiz-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  $("score-line").textContent = correctCount + " / " + TW.length;
  var um = document.createElement("div"); um.id = "unknown-line"; um.className = "sub"; um.style.textAlign = "center"; um.textContent = unknownLine();
  $("score-line").parentNode.insertBefore(um, $("submit-status"));
  var expBox = $("explanations");
  TW.forEach(function (q, i) {
    var log = answersLog[i], d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>쌍둥이 " + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 (정답: " + q.answer + ")" : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correctCount, total: TW.length, wrong: wrongNumbers,
    unknown: unknownNumbers, durationSec: Math.round((Date.now() - startTime) / 1000), detail: answersLog });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 사진 클리닉 11/10 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + TW.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n" + unknownLine();
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});

</script>
</body>
</html>
