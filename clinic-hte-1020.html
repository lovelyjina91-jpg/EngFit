<script>
"use strict";

/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "결과 전송 중...";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "✓ 결과가 지나티처에게 자동 전송되었어요"; el.style.color = "#2e7d6e"; }
  else { el.textContent = "전송이 안 됐어요 — 아래 버튼으로 복사해서 카톡으로 보내주세요!"; el.style.color = "#c0392b"; }
}


/* ══════ 문제 데이터 (개념 페이지 + 쌍둥이 문제) ══════ */
var STEPS = [
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">① 과거진행 — \"그때 하고 있던 중\"이면 was/were + -ing<\/div><div class=\"box\"><div class=\"lab\">원래 문제<\/div>When you called at 10 last night, I ______ (read) a comic book.<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>read<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>was reading<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">at 10 last night(어젯밤 10시)를 보고 <b>과거<\/b>로 쓴 것까지는 잘했어요. 그런데 문장의 뜻은 \"네가 전화한 그 순간에 나는 만화책을 <b>읽고 있었다<\/b>\"예요. read만 쓰면 \"그때 읽었다(한 번 읽고 끝)\"가 돼서 <b>한창 하는 중<\/b>이라는 느낌이 빠져요. 게다가 read는 현재형과 과거형 모양이 같아서 시제를 눈으로 구분하기 어려워요. 그래서 <b>when + 과거(called)<\/b>가 보이면 \"그 순간 진행 중이던 일\"을 먼저 떠올려야 해요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>과거의 한 시점에 <b>한창 진행 중이던 일<\/b>은 <b class=\"hl\">was / were + -ing<\/b>로 써요.<\/p><ul><li>At 9 last night, she <b>was taking<\/b> a shower. (어젯밤 9시에 샤워하는 중이었다)<\/li><li>When I got home, my dad <b>was washing<\/b> the car. (집에 왔을 때 하고 있던 중)<\/li><li>She <b>washed<\/b> the car yesterday. (어제 씻었다 — 끝난 일, 과거형)<\/li><\/ul><\/div><div class=\"trap\">⚠️ 헷갈리는 함정: read·put·cut처럼 현재와 과거가 같은 동사는 모양만 봐서는 시제를 몰라요. <b>시간 신호어(last night, when + 과거)<\/b>부터 찾아요!<\/div>"
 },
 {
  "type": "twin",
  "q": "'불이 나갔을 때 부모님은 부엌에서 저녁을 하고 계셨다.'<br>My parents ______ dinner in the kitchen when the power went out.",
  "choices": [
   "were cooking",
   "cooked",
   "are cooking",
   "have cooked"
  ],
  "answer": "were cooking",
  "exp": "<b>when + 과거(went out)<\/b>인 순간에 한창 하는 중이었으니 <b>과거진행 were cooking<\/b>이에요. cooked만 쓰면 \"요리를 했다(끝난 일)\"가 돼요. are cooking(현재진행)·have cooked(현재완료)는 과거 시점과 어울리지 않아요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">② 관계사절의 동사 — 선행사에 맞춰요<\/div><div class=\"box\"><div class=\"lab\">원래 문제<\/div>People who (live / lives) near the airport hear planes all day.<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>lives (사진에서 lives 쪽에 표시한 것으로 보여요)<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>live<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">who 바로 뒤의 동사는 <b>who 앞의 명사(선행사)<\/b>에 맞춰야 해요. 선행사는 <b>People(복수)<\/b>이라서 live가 맞아요. 가까이 있는 airport가 단수라서 \"단수니까 lives\"로 끌려가기 쉬워요. 하지만 <b>near the airport는 꾸며주는 말<\/b>일 뿐 주어가 아니에요. 진짜 주어를 찾으려면 꾸미는 말을 괄호로 묶어 지워 보세요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>who / which / that 뒤의 동사는 <b class=\"hl\">선행사의 수에 일치<\/b>시켜요. 선행사가 복수면 동사원형, 단수면 -s.<\/p><ul><li>Teenagers who <b>sleep<\/b> little feel tired. (Teenagers = 복수)<\/li><li>A student who <b>sleeps<\/b> little feels tired. (A student = 단수)<\/li><li>Children (who play outside) <b>need<\/b> sunscreen. → 괄호를 지우면 Children need<\/li><\/ul><\/div><div class=\"trap\">⚠️ 헷갈리는 함정: 가까운 명사(airport, rice, river…)가 단수여도 그건 주어가 아니에요. <b>who 바로 앞의 명사<\/b>를 확인!<\/div>"
 },
 {
  "type": "twin",
  "q": "Farmers who ______ rice near the river often wake up before sunrise.",
  "choices": [
   "grow",
   "grows",
   "growing",
   "is growing"
  ],
  "answer": "grow",
  "exp": "선행사가 <b>Farmers(복수)<\/b>라서 who 뒤 동사는 <b>grow<\/b>예요. 가까이 있는 rice·river가 단수라도 주어가 아니에요. growing은 동사가 아니라서 who 뒤에 혼자 쓸 수 없어요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">③ 관계대명사가 생략된 문장 — 두 가지 모양<\/div><div class=\"box\"><div class=\"lab\">원래 문제<\/div>I erased all the e-mails <span class=\"g\">[that were]<\/span> sent today by mistake.<br>The milk <span class=\"g\">[that]<\/span> I bought yesterday has gone bad.<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>사진에서 정확한 답을 읽기 어려웠어요 (끊어 읽기 빗금이 흔들린 흔적)<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>1) 생략된 말: that were / 2) 생략된 말: that (또는 which)<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">관계대명사가 생략되면 <b>명사 바로 뒤에 동사나 주어가 불쑥 붙어서<\/b> 문장이 이상해 보여요. 이럴 때는 명사 뒤에 무엇이 오는지 보면 돼요. e-mails 뒤에 <b>sent(과거분사)<\/b>가 오면 \"[that were]가 숨어 있구나\"! milk 뒤에 <b>I bought(주어+동사)<\/b>가 오면 \"[that]이 숨어 있구나\"! 이 신호를 모르면 sent를 문장의 동사로 읽어서 \"내가 이메일을 보냈다\"처럼 엉뚱하게 해석하게 돼요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>명사 뒤에 <b class=\"hl\">-ing / p.p.<\/b>가 오면 → [주격 관계대명사 + be동사] 생략. 명사 뒤에 <b class=\"hl\">주어 + 동사<\/b>가 오면 → [목적격 관계대명사] 생략.<\/p><ul><li>Do you know the girl <b>[who is]<\/b> standing in front of the gate? (-ing 앞)<\/li><li>Cookies <b>[that are]<\/b> made by my mother always taste good. (p.p. 앞)<\/li><li>I know the name of the girl <b>[whom]<\/b> you saw yesterday. (주어 + 동사 앞)<\/li><\/ul><\/div><div class=\"trap\">⚠️ 헷갈리는 함정: \"[that were] sent\" 전체를 한 덩어리로 묶어서 앞 명사를 꾸미는 말로 읽어요. sent를 <b>문장의 동사<\/b>로 착각하지 마세요!<\/div>"
 },
 {
  "type": "twin",
  "q": "다음 문장에서 [ ]에 생략된 말로 알맞은 것은?<div class=\"pass\">The man [ &nbsp; ] waiting at the bus stop is my English teacher.<\/div>",
  "choices": [
   "who is",
   "who are",
   "which is",
   "whom is"
  ],
  "answer": "who is",
  "exp": "man 뒤에 <b>waiting(-ing)<\/b>이 바로 오므로 [주격 관계대명사 + be동사]가 생략됐어요. man은 <b>사람 + 단수<\/b>니까 <b>who is<\/b>! which는 사물, who are은 복수, whom은 목적격이라 be동사와 함께 쓸 수 없어요."
 },
 {
  "type": "twin",
  "q": "다음 문장에서 [ ]에 생략된 관계대명사로 알맞은 것은?<div class=\"pass\">The pizza [ &nbsp; ] my sister ordered last night was too spicy.<\/div>",
  "choices": [
   "which",
   "who",
   "whose",
   "what"
  ],
  "answer": "which",
  "exp": "pizza 뒤에 <b>my sister ordered(주어 + 동사)<\/b>가 바로 오니 [목적격 관계대명사]가 생략됐어요. pizza는 <b>사물<\/b>이라 <b>which(that)<\/b>! who는 사람, whose 뒤에는 명사가 와야 하고, what은 앞에 선행사가 없을 때 써요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">④ 문장 넣기 — 단서를 찾아 앞뒤를 맞춰요<\/div><div class=\"box\"><div class=\"lab\">원래 문제<\/div>주어진 문장: <i>In Louisiana, some thieves hid bags of money in a river.<\/i><br>글: Need cash? (①) Maybe a beaver can lend you some money! (②) <b>Sometime later<\/b>, police discovered a beaver dam built with thousands of dollars! (③) Beavers usually use stones, leaves, and mud to build their dams. (④) <b>The<\/b> beavers that found <b>the bags of money<\/b> built their dam with the bills. (⑤) The police officers worked until midnight to collect all the wet bills.<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>사진에서 정확한 답을 읽기 어려웠어요 (표시가 겹쳐 있어요)<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>②번 — \"Maybe a beaver can lend you some money!\" 뒤, \"Sometime later, ...\" 앞<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">문장 넣기에서 헷갈리는 이유는 <b>내용만 보고 위치를 짐작<\/b>하기 때문이에요. 이 문제는 단서가 두 개 있어요. 첫째, <b>Sometime later(얼마 뒤)<\/b>는 \"앞에서 먼저 일어난 일\"이 있어야 쓸 수 있는 연결어예요. 도둑이 돈을 강에 숨긴 일이 먼저 나와야 \"얼마 뒤 경찰이 댐을 발견\"이 이어져요. 둘째, 뒤에 나오는 <b>the bags of money<\/b>의 정관사 the는 \"앞에서 이미 말한 그 돈 가방\"이라는 뜻이라서, bags of money가 처음 나온 주어진 문장이 그보다 앞에 와야 해요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>주어진 문장의 위치는 <b class=\"hl\">①지시어·정관사(the, this, they) ②연결어(However, Then, Sometime later) ③시간 순서<\/b> 순서로 단서를 찾아요.<\/p><ul><li>the / this / those / they → 앞에 이미 나온 말을 가리킨다 → 설명하는 문장은 그 뒤<\/li><li>However / But → 앞과 반대 내용이 먼저 있어야 한다<\/li><li>Sometime later / Then → 먼저 일어난 일이 앞에 있어야 한다<\/li><\/ul><\/div><div class=\"trap\">⚠️ 헷갈리는 함정: \"Need cash?\"처럼 <b>주제와 어울려 보이는 곳<\/b>에 끼우고 싶어져요. 하지만 연결어와 the가 가리키는 말을 먼저 확인!<\/div>"
 },
 {
  "type": "twin",
  "fixed": true,
  "q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class=\"pass\"><i>The sign said, \"Late books are sad books — please bring them home!\"<\/i><\/div><div class=\"pass\">Our town library had a problem last month. (①) Nobody returned the books on time. (②) The librarian decided to try something funny and wrote <b>a sign<\/b> for the front door. (③) Soon the books began coming back every day. (④) Many readers also tucked tiny thank-you cards into the returned books. (⑤)<\/div>",
  "choices": [
   "①",
   "②",
   "③",
   "④",
   "⑤"
  ],
  "answer": "③",
  "exp": "주어진 문장의 <b>The sign<\/b>(정관사 the)은 앞에서 <b>a sign<\/b>이 처음 나온 뒤에야 쓸 수 있어요. 그래서 ③ 앞(②번 문장 뒤)은 안 되고, 간판을 소개한 문장 바로 뒤 <b>③<\/b>이에요. 또 간판 내용을 읽은 결과로 \"Soon the books began coming back\"이 이어지니 흐름도 맞아요."
 }
];
var QUIZ_ID = "clinic-hte-1020";
var QUIZ_TITLE = "한태은 사진 클리닉 개념+쌍둥이 10/20";
var TW = STEPS.filter(function (x) { return x.type === "twin"; });
var CONCEPT_OF = {};
(function () { var last = ""; STEPS.forEach(function (x, i) { if (x.type === "concept") last = x.html; else CONCEPT_OF[i] = last; }); })();

var studentName = "", cur = 0, twinNo = 0, correctCount = 0, wrongNumbers = [], answersLog = [], startTime = 0, locked = false;
var nameInput = document.getElementById("name-input"), startBtn = document.getElementById("start-btn");
var CIRCLED = ["①", "②", "③", "④", "⑤"];
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function $(id) { return document.getElementById(id); }

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  $("start-card").classList.add("hidden");
  $("quiz-card").classList.remove("hidden");
  show();
});
$("read-btn").addEventListener("click", function () { cur++; show(); });

function show() {
  if (cur >= STEPS.length) return showResult();
  var st = STEPS[cur];
  $("bar-fill").style.width = Math.round(cur / STEPS.length * 100) + "%";
  $("fb").innerHTML = "";
  if (st.type === "concept") {
    $("progress").textContent = "틀린 이유 읽기 · 쌍둥이 문제 " + (twinNo + 1) + "번 전";
    $("part").classList.add("hidden");
    $("concept-box").innerHTML = st.html; $("concept-box").classList.remove("hidden");
    $("read-btn").classList.remove("hidden");
    $("qtext").innerHTML = ""; $("choices").innerHTML = "";
    window.scrollTo(0, 0);
  } else {
    $("progress").textContent = "쌍둥이 문제 " + (twinNo + 1) + " / " + TW.length;
    $("concept-box").classList.add("hidden"); $("read-btn").classList.add("hidden");
    $("qtext").innerHTML = "Q" + (twinNo + 1) + ". " + st.q;
    var box = $("choices"); box.innerHTML = "";
    (st.fixed ? st.choices : shuffle(st.choices)).forEach(function (c, i) {
      var b = document.createElement("button"); b.className = "choice"; b.setAttribute("data-c", c);
      b.innerHTML = st.fixed ? c : '<span class="num">' + CIRCLED[i] + "</span>" + c;
      b.addEventListener("click", function () { pick(c); });
      box.appendChild(b);
    });
    window.scrollTo(0, 0);
  }
}

function pick(choice) {
  if (locked) return; locked = true;
  var st = STEPS[cur], ok = choice === st.answer;
  if (ok) correctCount++; else wrongNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: ok, chosen: choice, answer: st.answer });
  [].forEach.call($("choices").children, function (b) {
    b.disabled = true;
    if (b.getAttribute("data-c") === st.answer) b.classList.add("right");
    else if (b.getAttribute("data-c") === choice) b.classList.add("bad");
  });
  var h = '<div class="exp' + (ok ? "" : " wrong") + '"><b>' + (ok ? "정답! 🎉" : "아쉬워요 — 정답: " + st.answer) + "</b><br>" + st.exp + "</div>";
  if (!ok) h += '<div class="lab2">📖 개념 정리 다시 보기</div>' + CONCEPT_OF[cur];
  h += '<button class="btn" id="next-btn">' + (twinNo + 1 < TW.length ? "다음 ▶" : "결과 보기") + "</button>";
  $("fb").innerHTML = h;
  $("next-btn").addEventListener("click", function () { locked = false; twinNo++; cur++; show(); });
}

function showResult() {
  $("quiz-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  $("score-line").textContent = correctCount + " / " + TW.length;
  var expBox = $("explanations");
  TW.forEach(function (q, i) {
    var log = answersLog[i], d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>쌍둥이 " + (i + 1) + ". " + (log.ok ? "정답!" : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")") + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correctCount, total: TW.length, wrong: wrongNumbers,
    durationSec: Math.round((Date.now() - startTime) / 1000), detail: answersLog });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 사진 클리닉 10/20 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + TW.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음");
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});
</script>
</body>
</html>
