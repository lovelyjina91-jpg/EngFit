<script>
"use strict";

/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#2e7d6e"; }
  else { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#c0392b"; }
}


/* ══════ 문제 데이터 (개념 페이지 + 쌍둥이 문제) ══════ */
var STEPS = [
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">① It is + 형용사 + for / of + 사람 + to 동사원형<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (11/2 데일리 1 · 2번 · 10/31 · 10/30 · 10/26 · 10/25 · 10/24 데일리 · 10/27 숙제 20번)<\/div>It is ~ ___ 사람 to 동사원형<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>if / whether / to / what<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>형용사에 따라 <b>for<\/b> 또는 <b>of<\/b><\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">2주 동안 일곱 번 나온 자리예요. 사람 앞 빈칸은 <b>for · of 두 개 중 하나<\/b>로 정해져 있어요. 먼저 '두 개 중 하나'라고 마음먹고, 그다음 형용사가 <b>일에 대한 말<\/b>인지 <b>사람 성격에 대한 말<\/b>인지만 보면 돼요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><ul><li>일이 어떤지(easy, hard, difficult, dangerous, important, fun) → <b class=\"hl\">for<\/b> + 사람<\/li><li>사람이 어떤지(kind, nice, smart, wise, rude, careless, polite) → <b class=\"hl\">of<\/b> + 사람<\/li><li>확인법: '사람 is 형용사'가 말이 되면 of (You are polite. ○ → of)<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: if · whether · what · to는 이 자리에 절대 ✕!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">It is dangerous ______ kids to play near the river.<\/div>",
  "choices": ["for", "of", "if", "whether"],
  "answer": "for",
  "exp": "dangerous(위험한)는 아이들 성격이 아니라 '강가에서 노는 일'이 위험하다는 말 → <b>for + 사람<\/b>. Kids are dangerous.는 말이 안 되죠."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">It was rude ______ Jinsu to laugh at his friend's mistake.<\/div>",
  "choices": ["for", "of", "what", "to"],
  "answer": "of",
  "exp": "rude(무례한)는 진수의 태도를 꾸짖는 말 → <b>of + 사람<\/b>. Jinsu was rude.가 말이 되니까 of!"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">It is not easy ______ me to wake up at six.<\/div>",
  "choices": ["of", "if", "for", "that"],
  "answer": "for",
  "exp": "easy(쉬운)는 '6시에 일어나는 일'에 대한 말 → <b>for me<\/b>. 10/24 데일리 to me, 10/27 숙제 for me that을 떠올려요 — 사람 앞은 for, 뒤에는 to 동사원형!"
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">② told / asked + 사람 + to 동사원형<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (11/2 데일리 10번 · 10/31 데일리 9번)<\/div>tell / ask + 사람 + ___<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>tell me close / asked me cleaning<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>told<\/b> me <b>to close<\/b> / asked me <b>to clean<\/b><\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">사람 뒤에 오는 동사 모양이 매번 달라졌어요(원형, -ing). 이 동사들은 '사람에게 <b>~하라고<\/b>' 말하는 거라 꼭 <b>to + 동사원형<\/b>이에요. 그리고 우리말이 '~했다'면 동사도 과거형(told, asked)!<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p><b class=\"hl\">tell / ask / want<\/b> + 사람(me, us, him, her) + <b class=\"hl\">to 동사원형<\/b><\/p><ul><li>Dad told me <b class=\"hl\">to wear<\/b> a coat.<\/li><li>I asked Mina <b class=\"hl\">to wait<\/b> for me.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: 사람 뒤 동사원형만 ✕ · -ing ✕ · 주격(we, he) ✕<\/div>"
 },
 {
  "type": "twin",
  "q": "다음 우리말을 영어로 바르게 옮긴 것은?<div class=\"pass\">선생님은 우리에게 조용히 하라고 말씀하셨다.<\/div>",
  "choices": ["The teacher told us be quiet.", "The teacher told us to be quiet.", "The teacher tell us to be quiet.", "The teacher told we to be quiet."],
  "answer": "The teacher told us to be quiet.",
  "exp": "지난 일 → <b>told<\/b>, 사람은 목적격 <b>us<\/b>, 그 뒤 <b>to be<\/b> quiet. to 빠짐 ✕, tell(시제) ✕, we(주격) ✕예요."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(할머니는 나에게 휴대폰을 찾아 달라고 부탁하셨다)<div class=\"pass\">Grandma asked me ______ her phone.<\/div>",
  "choices": ["find", "finding", "to find", "found"],
  "answer": "to find",
  "exp": "<b>ask + 사람 + to 동사원형<\/b> → asked me <b>to find<\/b>. 10/31 데일리처럼 -ing(finding)를 쓰면 ✕예요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">③ ~하고 있었다 = was / were + -ing<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (11/2 · 11/1 · 10/28 · 10/25 · 10/23 데일리 · 10/20 클리닉)<\/div>~하고 있었다<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>read / was sang / ate / was play / am taking / cooked<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>was reading / were singing / was eating / was playing / was taking / were cooking<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">여섯 번 모두 <b>두 조각 중 하나를 빠뜨리거나 잘못 썼어요<\/b>. 과거형 하나(read, ate), be + 과거형(was sang), be + 원형(was play), 현재 be(am taking). 과거진행은 언제나 <b>과거 be(was / were) + -ing<\/b> 두 조각!<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><ul><li>I · 한 명 · 하나 → <b class=\"hl\">was + -ing<\/b><\/li><li>you · we · they · 여럿 → <b class=\"hl\">were + -ing<\/b><\/li><li>at that time, then, when ~ 이 보이면 과거진행을 의심!<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: was + 과거형 ✕ / was + 원형 ✕ / am · is · are + -ing(현재) ✕<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(어젯밤 9시에 언니는 샤워를 하고 있었다)<div class=\"pass\">At nine last night, my sister ______ a shower.<\/div>",
  "choices": ["took", "was taking", "was took", "is taking"],
  "answer": "was taking",
  "exp": "'하고 있었다' → <b>was + taking<\/b>. took 하나만 ✕, was took(be + 과거형) ✕, is taking은 지금 일이라 ✕예요. 10/23 데일리 am taking과 같은 자리!"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(우리가 도착했을 때 아이들은 춤을 추고 있었다)<div class=\"pass\">When we arrived, the kids ______.<\/div>",
  "choices": ["was dancing", "were dance", "danced", "were dancing"],
  "answer": "were dancing",
  "exp": "the kids는 여럿 → <b>were<\/b>, 그리고 -ing → <b>were dancing<\/b>. were dance는 -ing가 빠졌어요."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린<\/b> 문장은?",
  "choices": ["I was doing my homework at that time.", "They were eating pizza in the park.", "He was sleeped on the sofa.", "My cat was chasing a ball."],
  "answer": "He was sleeped on the sofa.",
  "exp": "was 뒤에는 -ing → He <b>was sleeping<\/b> on the sofa. 11/1 데일리 was sang처럼 be + 과거형 모양이라 ✕예요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">④ 간접의문문 — 의문사 / if + 주어 + 동사(-s 살리기)<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (10/30 데일리 7번 · 10/27 숙제 2 · 5 · 8번 · 10/27 데일리 3 · 9번 · 10/24 · 10/22 데일리)<\/div>when the library ___ / I wonder ___ it will snow<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>open / (if 빠뜨림)<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>opens<\/b> / I wonder <b>if<\/b> it will snow<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">두 가지 실수가 번갈아 나와요. ① does를 지우면서 동사의 <b>-s까지 지움<\/b>. ② 의문사가 없는 질문(Yes / No 질문)을 넣을 때 <b>if를 빼먹음<\/b>. 의문사가 없으면 if(~인지)가 그 자리를 채워요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><ul><li>When does the bank close? → Do you know when the bank <b class=\"hl\">closes<\/b>?<\/li><li>Does Jun like pizza? → I wonder <b class=\"hl\">if<\/b> Jun <b class=\"hl\">likes<\/b> pizza.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: 주어가 한 명 · 하나면 동사 -s / -es 꼭! / Yes·No 질문은 if 꼭!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(네 오빠가 몇 시에 일어나는지 아니?)<div class=\"pass\">Do you know what time your brother ______ up?<\/div>",
  "choices": ["get", "does get", "gets", "getting"],
  "answer": "gets",
  "exp": "what time + 주어(your brother) + 동사. 오빠는 한 명 → <b>gets<\/b>. does get은 의문문 모양, get은 -s 빠짐이에요."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(그 가게가 일요일에 문을 닫는지 궁금하다)<div class=\"pass\">I wonder ______ the shop closes on Sundays.<\/div>",
  "choices": ["that", "if", "what", "it"],
  "answer": "if",
  "exp": "'닫는지' → 의문사가 없는 Yes / No 질문이라 <b>if<\/b>(~인지). 10/27 데일리 9번 I wonder it will snow처럼 if를 빼면 ✕예요."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(그 콘서트가 언제 시작하는지 말해 줄래?)<div class=\"pass\">Can you tell me when the concert ______?<\/div>",

 },

var QUIZ_ID = "clinic-hte-1104";
var QUIZ_TITLE = "한태은 사진 클리닉 개념+쌍둥이 11/04";
var TW = STEPS.filter(function (x) { return x.type === "twin"; });
var CONCEPT_OF = {};
(function () { var last = ""; STEPS.forEach(function (x, i) { if (x.type === "concept") last = x.html; else CONCEPT_OF[i] = last; }); })();

var studentName = "", cur = 0, twinNo = 0, correctCount = 0, wrongNumbers = [], unknownNumbers = [], answersLog = [], startTime = 0, locked = false;
var nameInput = document.getElementById("name-input"), startBtn = document.getElementById("start-btn");
var CIRCLED = ["①", "②", "③", "④", "⑤"];
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function $(id) { return document.getElementById(id); }

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  $("start-card").classList.add("hidden");
  $("quiz-card").classList.remove("hidden");
  show();
});
$("read-btn").addEventListener("click", function () { cur++; show(); });

function show() {
  if (cur >= STEPS.length) return showResult();
  var st = STEPS[cur];
  $("bar-fill").style.width = Math.round(cur / STEPS.length * 100) + "%";
  $("fb").innerHTML = "";
  if (st.type === "concept") {
    $("progress").textContent = "틀린 이유 읽기 · 쌍둥이 문제 " + (twinNo + 1) + "번 전";
    $("part").classList.add("hidden");
    $("concept-box").innerHTML = st.html; $("concept-box").classList.remove("hidden");
    $("read-btn").classList.remove("hidden");
    $("qtext").innerHTML = ""; $("choices").innerHTML = "";
    window.scrollTo(0, 0);
  } else {
    $("progress").textContent = "쌍둥이 문제 " + (twinNo + 1) + " / " + TW.length;
    $("concept-box").classList.add("hidden"); $("read-btn").classList.add("hidden");
    $("qtext").innerHTML = "Q" + (twinNo + 1) + ". " + st.q;
    var box = $("choices"); box.innerHTML = "";
    shuffle(st.choices).forEach(function (c, i) {
      var b = document.createElement("button"); b.className = "choice"; b.setAttribute("data-c", c);
      b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
      b.addEventListener("click", function () { pick(c); });
      box.appendChild(b);
    });
    var u = document.createElement("button"); u.className = "unk"; u.id = "unk-btn"; u.textContent = "🤔 모름";
    u.addEventListener("click", function () { unknown(); });
    box.appendChild(u);
    window.scrollTo(0, 0);
  }
}

function pick(choice) {
  if (locked) return; locked = true;
  var st = STEPS[cur], ok = choice === st.answer;
  if (ok) correctCount++; else wrongNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: ok, chosen: choice, answer: st.answer });
  [].forEach.call($("choices").children, function (b) {
    b.disabled = true;
    if (b.getAttribute("data-c") === st.answer) b.classList.add("right");
    else if (b.getAttribute("data-c") === choice) b.classList.add("bad");
  });
  var h = '<div class="exp' + (ok ? "" : " wrong") + '"><b>' + (ok ? "정답! 🎉" : "아쉬워요 — 정답: " + st.answer) + "</b><br>" + st.exp + "</div>";
  if (!ok) h += '<div class="lab2">📖 개념 정리 다시 보기</div>' + CONCEPT_OF[cur];
  h += '<button class="btn" id="next-btn">' + (twinNo + 1 < TW.length ? "다음 ▶" : "결과 보기") + "</button>";
  $("fb").innerHTML = h;
  $("next-btn").addEventListener("click", function () { locked = false; twinNo++; cur++; show(); });
}

function unknown() {
  if (locked) return; locked = true;
  var st = STEPS[cur];
  wrongNumbers.push(twinNo + 1); unknownNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: false, chosen: "모름", answer: st.answer, unknown: true });
  locked = false; twinNo++; cur++; show();
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}

function showResult() {
  $("quiz-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  $("score-line").textContent = correctCount + " / " + TW.length;
  var um = document.createElement("div"); um.id = "unknown-line"; um.className = "sub"; um.style.textAlign = "center"; um.textContent = unknownLine();
  $("score-line").parentNode.insertBefore(um, $("submit-status"));
  var expBox = $("explanations");
  TW.forEach(function (q, i) {
    var log = answersLog[i], d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>쌍둥이 " + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 (정답: " + q.answer + ")" : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correctCount, total: TW.length, wrong: wrongNumbers,
    unknown: unknownNumbers, durationSec: Math.round((Date.now() - startTime) / 1000), detail: answersLog });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 사진 클리닉 11/04 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + TW.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n" + unknownLine();
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});

</script>
