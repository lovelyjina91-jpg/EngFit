<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Are You Money Smart? | 중2 영어 대화 순서 퀴즈</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--g:#1B4332;--g2:#103826;--gl:#E8F5EE;--rd:#B91C1C;--rdl:#FEF2F2;--bg:#F4F3EF;--sf:#FFFFFF;--dk:#141410;--br:#E3E2DC;--tx:#141410;--tx2:#5A5A52;--tx3:#9A9A92;--r:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:15px;line-height:1.6}
.site-header{background:var(--dk);padding:14px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.hicon{width:38px;height:38px;background:var(--g);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;letter-spacing:-.5px;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.htxt h1{font-size:15px;font-weight:800;letter-spacing:-0.02em;color:#fff;text-transform:uppercase}
.htxt p{font-size:11px;color:#8a8a82;margin-top:1px}
.htxt p b{color:#6FCF97}
.hscore{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:6px 13px;border-radius:99px}
main{max-width:680px;margin:0 auto;padding:22px 16px 90px}
.pw{margin-bottom:18px}
.pr{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--tx3);margin-bottom:8px}
.pl{font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pn{font-family:'JetBrains Mono',monospace;font-weight:500;color:var(--tx2)}
.pb{height:5px;background:var(--br);border-radius:99px;overflow:hidden}
.pbi{height:100%;border-radius:99px;background:var(--g);transition:width .4s}
.card{background:var(--sf);border:1.5px solid var(--br);border-radius:var(--r);padding:20px;margin-bottom:16px}
.qs{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--g);letter-spacing:.08em;text-transform:uppercase}
.qko{font-size:13px;color:var(--tx2);margin-top:4px;margin-bottom:14px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 11px;border-radius:99px;background:var(--gl);color:var(--g2);border:1px solid var(--g);margin-bottom:12px}
.slbl{font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase;margin:16px 0 8px}
.line{background:var(--bg);border:1.5px solid var(--br);border-radius:10px;padding:11px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.lt{font-size:14.5px}
.chip{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--g);background:var(--gl);border:1.5px solid var(--g);min-width:26px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;margin-top:2px;flex-shrink:0}
.line.given .chip{background:var(--dk);border-color:var(--dk);color:#fff}
.line.target{border-style:dashed;border-color:var(--g);background:var(--gl)}
.blank{display:inline-block;min-width:90px;border-bottom:2.5px solid var(--g);color:var(--g);font-weight:800;text-align:center;font-family:'JetBrains Mono',monospace}
.opt{display:block;width:100%;text-align:left;background:var(--sf);border:1.5px solid var(--br);border-radius:10px;padding:12px 15px;margin-bottom:9px;font-size:14.5px;font-family:inherit;cursor:pointer;transition:border-color .15s,background .15s;line-height:1.55;color:var(--tx)}
.opt:hover:not(:disabled){border-color:var(--g);background:var(--gl)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--g);background:var(--gl);color:var(--g2);font-weight:600}
.opt.ng{border-color:var(--rd);background:var(--rdl);color:var(--rd)}
.opt .seq{font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:.03em}
.onum{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--tx3);margin-right:9px}
.qprompt{font-size:14px;font-weight:700;margin:16px 0 12px}
.qprompt .mono{font-family:'JetBrains Mono',monospace;color:var(--g)}
.fb{border-radius:10px;padding:12px 15px;font-size:13.5px;font-weight:600;margin-top:12px;animation:drop .3s ease}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.fbok{background:var(--gl);color:var(--g2);border:1.5px solid var(--g)}
.fbng{background:var(--rdl);color:var(--rd);border:1.5px solid var(--rd)}
.fbng .ans{display:block;margin-top:5px;font-weight:700}
.fbex{background:#FFFBEB;color:#7C5800;border:1.5px solid #E7C45A;font-weight:500;line-height:1.65}
.fbex b{font-weight:800}
.btn{border:none;border-radius:9px;padding:12px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btnp{background:var(--g);color:#fff}
.btnp:hover{background:var(--g2)}
.btnrow{margin-top:14px}
.start,.result{background:var(--dk);border-radius:18px;padding:44px 28px;text-align:center;color:#fff;position:relative;overflow:hidden}
.start::after,.result::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;background:var(--g);border-radius:50%;opacity:.35}
.unit-tag{display:inline-block;font-size:13px;font-weight:700;color:#6FCF97;border:1.5px solid #6FCF97;border-radius:99px;padding:6px 16px;margin-bottom:18px;letter-spacing:.02em;position:relative;z-index:1}
.bigt{font-size:34px;font-weight:900;letter-spacing:-0.03em;line-height:1.15;text-transform:uppercase;position:relative;z-index:1}
.bigt .acc{color:#6FCF97}
.subt{font-size:14px;color:#a8a8a0;margin-top:12px;position:relative;z-index:1}
.start .btn,.result .btn{margin-top:26px;position:relative;z-index:1;font-size:15px;padding:14px 34px}
.scorebig{font-family:'JetBrains Mono',monospace;font-size:52px;font-weight:700;margin-top:18px;position:relative;z-index:1}
.scorebig small{font-size:20px;color:#a8a8a0}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px;position:relative;z-index:1}
.result .btns .btn{margin-top:0}
.btncopy{background:#FEE500;color:#191919;font-size:15px;padding:14px 28px}
.btncopy:hover{background:#F1D900}
.btncopy.copied{background:#6FCF97;color:#103826}
.copyhint{font-size:12.5px;color:#a8a8a0;margin-top:14px;position:relative;z-index:1}
</style>
</head>
<body>
<header class="site-header">
  <div class="hicon">EF</div>
  <div class="htxt"><h1>EngFit · Dialogue Order</h1><p><b>중2 · 동아(윤정미) · 4단원</b> · Are You Money Smart?</p></div>
  <div class="hscore" id="hscore">0 / 7</div>
</header>
<main id="app"></main>
<script>
// 유형 2가지: ① 전체 대화 순서 흐름 고르기  ② 빈칸에 들어갈 단어 고르기
const QUIZ=[
{type:"order",title:"Dialogue 1",ko:"친구에게 줄 기념품을 사는 상황",
 first:"Can I help you?",
 items:["Yes, I'm looking for a souvenir for my friend.","How about this key ring? It's only 5,000 won.","Perfect. I'll take it."],
 ex:"도와드릴까요? → 네, 친구에게 줄 기념품을 찾고 있어요(I'm looking for) → 이 열쇠고리는 어떠세요? 5천 원밖에 안 해요 → 딱 좋네요, 살게요(I'll take it)!의 흐름이에요."},
{type:"order",title:"Dialogue 2",ko:"여동생에게 줄 선물을 고르는 상황",
 first:"Hi, I'm looking for a gift for my younger sister. She's twelve.",
 items:["How about this small bag?","Well, can you show me something else?","How about these hairpins, then?","Oh, they're so pretty! I'll take two of them."],
 ex:"여동생 선물을 찾고 있어요 → 이 작은 가방은 어떠세요? → 음, 다른 것을 보여 주시겠어요?(something else) → 그럼 이 머리핀들은 어떠세요? → 예쁘네요, 두 개 살게요(I'll take two of them)!의 흐름이에요. 거절 후 다른 제품을 제안받는 순서에 주의!"},
{type:"word",title:"Dialogue 3",ko:"한국 전통 과자를 사는 상황",
 lines:["I'm looking for traditional Korean cookies.","Oh, we have many different kinds. Here, try one of these.","It's sweet and delicious. How much ____ they?","We're having a sale, so this box is 8,000 won.","OK, I'll take it."],
 bi:2,correct:"are",d:["is","am","be"],
 ex:"가격을 물을 때 주어가 복수(they)면 How much are they?, 단수(it)면 How much is it? — 주어와 be동사의 수 일치가 포인트예요."},
{type:"word",title:"Dialogue 4",ko:"휴대폰 케이스를 고르는 상황",
 lines:["Hi, I'm looking for a phone case.","We have a few different colors here. How do you like this case?","I don't really like blue. Can you show me something else?","Then, how about this yellow case?","Oh, that will ____. I'll take it."],
 bi:4,correct:"do",d:["does","doing","did"],
 ex:"조동사 will 뒤에는 동사원형! 여기서 do는 '적절하다, 충분하다'라는 뜻으로, That will do. = 그거면 되겠어요."},
{type:"word",title:"Dialogue 5",ko:"아빠에게 드릴 전통 기념품(갓)을 사며 할인받는 상황",
 lines:["Hi, can I help you?","Yes, I'm looking for a traditional Korean souvenir. It's for my dad.","How about this fan? It is really popular.","Hmm... can you show me something else?","How about this hat, then? This is a gat, a traditional Korean hat for men.","Oh, it's unique. I love it. How much is it?","It's 30,000 won.","That's a little expensive.","We can give you a discount if you ____ two. It'll be 25,000 won each.","That's perfect! I'll get two hats, then."],
 bi:8,correct:"buy",d:["will buy","bought","buying"],
 ex:"조건을 나타내는 if절에서는 미래의 일이라도 현재시제를 써요. if you buy two = 두 개를 사면 (will buy ✗). each는 '개당'이라는 뜻!"},
{type:"order",title:"Dialogue 6",ko:"여동생 선물로 물병을 사는 상황",
 first:"Hi, I'm looking for a gift for my sister.",
 items:["How about these hairpins?","Well, they are not her style. Can you show me something else?","How about this water bottle, then?","That looks good! I'll take it."],
 ex:"여동생 선물을 찾고 있어요 → 이 머리핀들은 어떠세요? → 그녀의 스타일이 아니에요(not her style), 다른 것 보여 주시겠어요? → 그럼 이 물병은 어떠세요? → 좋아 보이네요(That looks good), 살게요!의 흐름이에요."},
{type:"order",title:"Dialogue 7",ko:"할머니께 드릴 기념품을 사는 상황",
 first:"Can I help you?",
 items:["Yes. I'm looking for a souvenir for my grandmother.","How about these cookies? This box is 10,000 won.","Good! I'll take two."],
 ex:"도와드릴까요? → 네, 할머니께 드릴 기념품을 찾고 있어요 → 이 쿠키들은 어떠세요? 한 상자 만 원이에요 → 좋아요, 두 상자 살게요(I'll take two)!의 흐름이에요."}
];
const TOTAL=QUIZ.length;
const LBL="ABCDE";
let S;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;}
function permsOf(n){const idx=[...Array(n).keys()];const out=[];(function go(cur,rest){if(!rest.length){out.push(cur);return;}rest.forEach((r,i)=>go([...cur,r],rest.filter((_,j)=>j!==i)));})( [],idx);return out;}
function buildQ(q){
  if(q.type==="order"){
    const n=q.items.length;
    const disp=shuffle([...Array(n).keys()]);
    const correctSeq=[...Array(n).keys()].map(ci=>LBL[disp.indexOf(ci)]).join(" → ");
    let pool=permsOf(n).map(p=>p.map(ci=>LBL[disp.indexOf(ci)]).join(" → ")).filter(s=>s!==correctSeq);
    const opts=shuffle([correctSeq,...shuffle(pool).slice(0,3)]);
    return {disp,opts,answer:correctSeq};
  }else{
    const opts=shuffle([q.correct,...q.d]);
    return {opts,answer:q.correct};
  }
}
function init(){S={phase:"start",qi:0,score:0,fb:null,wrong:[],built:QUIZ.map(buildQ)};render();}
function startQuiz(){S.phase="play";S.qi=0;S.fb=null;render();}
function pick(oi){
  if(S.fb)return;
  const b=S.built[S.qi];
  const ok=b.opts[oi]===b.answer;
  if(ok)S.score++;else S.wrong.push(QUIZ[S.qi].title);
  S.fb={ok,pickIdx:oi};
  render();
  if(ok)setTimeout(nextQ,250);
}
function nextQ(){
  if(S.phase!=="play"||!S.fb)return;
  S.fb=null;
  if(S.qi<TOTAL-1){S.qi++;}else{S.phase="end";}
  render();
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function blankify(s){return esc(s).replace("____",'<span class="blank">&nbsp;?&nbsp;</span>');}
function render(){
  document.getElementById("hscore").textContent=S.score+" / "+TOTAL;
  const el=document.getElementById("app");
  if(S.phase==="start"){
    el.innerHTML=`<div class="start"><div class="unit-tag">중2 · 동아(윤정미) · 4단원</div><div class="bigt">Are You<br><span class="acc">Money Smart?</span></div>
    <div class="subt">대화 순서 퀴즈 · 총 ${TOTAL}문제 (대화당 1문제)<br>전체 대화 순서 고르기 + 빈칸 단어 고르기<br><span style="font-size:12px;color:#8a8a82">⌨️ 컴퓨터: 숫자키 1~4로 답 선택 · Enter로 시작/다음</span></div>
    <button class="btn btnp" onclick="startQuiz()">시작하기 →</button></div>`;
    return;
  }
  if(S.phase==="end"){
    const pct=Math.round(S.score/TOTAL*100);
    const msg=pct>=90?"완벽해요! 대화 흐름을 완전히 익혔어요.":pct>=70?"잘했어요! 틀린 대화만 한 번 더 복습해요.":"다시 한 번 도전! 반복하면 분명 늘어요.";
    el.innerHTML=`<div class="result"><div class="bigt">Result</div>
    <div class="scorebig">${S.score}<small> / ${TOTAL}</small></div>
    <div class="subt">${pct}% · ${msg}</div>
    <div class="btns"><button class="btn btncopy" onclick="copyResult(this)">📋 결과 복사하기</button>
    <button class="btn btnp" onclick="init();startQuiz()">다시 풀기 ↻</button></div>
    <div class="copyhint">💬 결과를 복사한 뒤, 선생님께 카카오톡으로 붙여넣어 보내 주세요!</div></div>`;
    return;
  }
  const q=QUIZ[S.qi],b=S.built[S.qi],f=S.fb;
  const pct=Math.round(S.qi/TOTAL*100);
  let body="",prompt="";
  if(q.type==="order"){
    prompt=`주어진 문장에 이어질 <span class="mono">대화의 순서</span>로 알맞은 것은?`;
    body=`<div class="line given"><span class="chip">시작</span><span class="lt">${esc(q.first)}</span></div>`;
    b.disp.forEach((ci,k)=>{body+=`<div class="line"><span class="chip">${LBL[k]}</span><span class="lt">${esc(q.items[ci])}</span></div>`;});
  }else{
    prompt=`빈칸에 <span class="mono">들어갈 단어</span>로 알맞은 것은?`;
    q.lines.forEach((t,i)=>{
      if(i===q.bi)body+=`<div class="line target"><span class="lt">${blankify(t)}</span></div>`;
      else body+=`<div class="line"><span class="lt">${esc(t)}</span></div>`;
    });
  }
  let opts="";
  b.opts.forEach((o,oi)=>{
    let cls="opt",dis=f?" disabled":"";
    if(f){if(o===b.answer)cls+=" ok";else if(oi===f.pickIdx)cls+=" ng";}
    opts+=`<button class="${cls}"${dis} onclick="pick(${oi})"><span class="onum">${oi+1}</span><span class="seq">${esc(o)}</span></button>`;
  });
  let fb="";
  if(f){
    if(f.ok){
      fb=`<div class="fb fbok">✓ 정답!</div>`;
    }else{
      fb=`<div class="fb fbng">✗ 오답<span class="ans">정답: ${esc(b.answer)}</span></div>
      <div class="fb fbex">💡 <b>해설</b> · ${esc(q.ex)}</div>
      <div class="btnrow"><button class="btn btnp" onclick="nextQ()">${S.qi<TOTAL-1?"다음 →":"결과 보기 →"} (Enter)</button></div>`;
    }
  }
  el.innerHTML=`<div class="pw"><div class="pr"><span class="pl">Dialogue Order Quiz</span><span class="pn">${S.qi+1} / ${TOTAL}</span></div><div class="pb"><div class="pbi" style="width:${pct}%"></div></div></div>
  <div class="card"><div class="qs">${q.title}</div><div class="qko">${q.ko}</div>
  <span class="badge">${q.type==="order"?"🔀 전체 대화 순서 고르기":"✏️ 빈칸 단어 고르기"}</span>
  <div class="qprompt">${prompt}</div>${body}
  <div class="slbl">보기 <span style="font-weight:500;text-transform:none">(키보드 1~4)</span></div>${opts}${fb}</div>`;
}
function copyResult(btn){
  const info=document.querySelector(".htxt p").textContent.trim();
  const pct=Math.round(S.score/TOTAL*100);
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  const ds=d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
  const txt="\uD83D\uDCDA \uC601\uD54F \uB300\uD654 \uC21C\uC11C \uD034\uC988 \uACB0\uACFC\n\uD83D\uDCD6 "+info+"\n\u2705 \uC810\uC218: "+S.score+" / "+TOTAL+" ("+pct+"%)\n"+(S.wrong.length?"\u274C \uD2C0\uB9B0 \uBB38\uC81C: "+S.wrong.join(", "):"\uD83C\uDF89 \uD2C0\uB9B0 \uBB38\uC81C \uC5C6\uC74C")+"\n\uD83D\uDD52 "+ds;
  const done=()=>{btn.textContent="\u2713 \uBCF5\uC0AC \uC644\uB8CC! \uCE74\uD1A1\uC5D0 \uBD99\uC5EC\uB123\uC5B4 \uC8FC\uC138\uC694";btn.classList.add("copied");setTimeout(()=>{btn.textContent="\uD83D\uDCCB \uACB0\uACFC \uBCF5\uC0AC\uD558\uAE30";btn.classList.remove("copied");},2500);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));}
  else fallbackCopy(txt,done);
}
function fallbackCopy(t,done){
  const ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;opacity:0";
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand("copy");done();}catch(e){alert("\uBCF5\uC0AC\uC5D0 \uC2E4\uD328\uD588\uC5B4\uC694. \uC810\uC218\uB97C \uC9C1\uC811 \uC785\uB825\uD574 \uC8FC\uC138\uC694.");}
  document.body.removeChild(ta);
}
document.addEventListener("keydown",e=>{
  if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")){
    return;
  }
  if(S.phase==="start"&&e.key==="Enter"){startQuiz();return;}
  if(S.phase==="end"&&e.key==="Enter"){init();startQuiz();return;}
  if(S.phase!=="play")return;
  if(!S.fb&&["1","2","3","4"].includes(e.key)){
    const oi=+e.key-1;
    if(oi<S.built[S.qi].opts.length)pick(oi);
    return;
  }
  if(S.fb&&!S.fb.ok&&e.key==="Enter"){nextQ();}
});
init();
</script>
</body>
</html>
