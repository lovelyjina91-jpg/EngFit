<style>

  .num { color: #1B4332; font-weight: bold; margin-right: 6px; }
  .score-big { font-size: 2rem; font-weight: bold; color: #1B4332; text-align: center; margin: 10px 0; }

  .exp { background: #f6f9f8; border-left: 4px solid #1B4332; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; font-size: 0.92rem; line-height: 1.55; }
  .exp.wrong { border-left-color: #c0392b; }

  .exp.wrong b { color: #c0392b; }

<body>
<div class="wrap">

  <div class="card" id="start-card">
    <h1>영핏 레벨 테스트 ✏️</h1>
    <p class="sub">English Fit Level Test · 초5 · 39문항 · 약 35~40분<br>
      어휘(듣고 쓰기 포함) · 문법 · 읽기 · 문장 쓰기<br>

    <div id="choices"></div>

<script>
"use strict";

/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "결과 전송 중...";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "✓ 결과가 지나티처에게 자동 전송되었어요"; el.style.color = "#1B4332"; }
  else { el.textContent = "전송이 안 됐어요 — 아래 버튼으로 복사해서 카톡으로 보내주세요!"; el.style.color = "#c0392b"; }
}

  { tag: "어휘", q: "밑줄 친 말과 뜻이 <u>비슷한</u> 것은?<div class=passage>She is a <u>diligent</u> student. She always does her best.</div>",

  /* ── C. 읽기 ── */
  { tag: "독해", q: "글을 읽고 답하세요.<div class=passage>Welcome to Sunny Farm! Our farm was opened in 1998. Fresh strawberries are picked here every morning from March to May. Visitors can pick strawberries, too. Tickets are sold at the main gate. The farm is closed on Mondays.</div>글의 내용과 <u>일치하지 않는</u> 것은?",

  { tag: "독해", q: "(위와 같은 글) 표를 살 수 있는 곳은?<div class=passage>Welcome to Sunny Farm! Our farm was opened in 1998. Fresh strawberries are picked here every morning from March to May. Visitors can pick strawberries, too. Tickets are sold at the main gate. The farm is closed on Mondays.</div>",

    choices: ["many people in Paris", "tourists", "thousands of lights", "famous buildings", "the Eiffel Tower"], answer: "many people in Paris" },
  { tag: "독해", q: "(위와 같은 글) 빈칸에 알맞은 말은?<div class=passage>At first, people in Paris thought the tower was ______, but now it is loved by many people.</div>",
    choices: ["ugly", "beautiful", "tall", "new", "cheap"], answer: "ugly" },
  { tag: "독해", q: "(위와 같은 글) 글의 내용과 <u>일치하는</u> 것은?<div class=passage>The Eiffel Tower is one of the most famous buildings in the world. It was built in Paris in 1889. At first, many people in Paris didn't like it. They thought it was ugly. But today, millions of tourists visit it every year. At night, it is lit by thousands of lights, so it looks beautiful. Now it is a symbol of France.</div>",

/* ══════ 진행 로직 ══════ */
var studentName = "";
var current = 0;
var correctCount = 0;
var wrongNumbers = [];
var unknownNumbers = [];
var answersLog = [];
var startTime = 0;
var shownChoices = [];

var nameInput = document.getElementById("name-input");
var startBtn = document.getElementById("start-btn");

nameInput.addEventListener("input", function () {
  startBtn.disabled = nameInput.value.trim().length === 0;
});
nameInput.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !startBtn.disabled) startBtn.click();
});

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  document.getElementById("start-card").classList.add("hidden");
  document.getElementById("quiz-card").classList.remove("hidden");
  showQuestion();
});

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

var CIRCLED = ["①", "②", "③", "④", "⑤"];

function norm(s) { return String(s).toLowerCase().replace(/[.,!?'"’]/g, "").replace(/\s+/g, " ").trim(); }
function speak(t) {
  try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = 0.85; speechSynthesis.speak(u); } catch (e) {}
}
function showQuestion() {
  var q = QUESTIONS[current];
  document.getElementById("progress").textContent = (current + 1) + " / " + QUESTIONS.length;
  document.getElementById("qtag").textContent = ({"철자":"A. 어휘 Vocabulary","어휘":"A. 어휘 Vocabulary","독해":"C. 읽기 Reading","어순":"D. 문장 쓰기 Writing","영작":"D. 문장 쓰기 Writing"})[q.tag] || "B. 문법 Grammar";
  document.getElementById("qtext").innerHTML = "Q" + (current + 1) + ". " + q.q;
  var box = document.getElementById("choices");
  var tb = document.getElementById("typebox");
  box.innerHTML = "";
  shownChoices = [];
  if (q.type === "spell" || q.type === "write") {
    tb.classList.remove("hidden");
    document.getElementById("say-btn").classList.toggle("hidden", q.type !== "spell");
    var inp = document.getElementById("type-input");
    inp.value = ""; inp.focus();
    if (q.type === "spell") setTimeout(function () { speak(q.say); }, 300);
    return;
  }
  tb.classList.add("hidden");
  shownChoices = q.fixed ? q.choices.slice() : shuffle(q.choices);
  shownChoices.forEach(function (c, i) {
    var b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
    b.addEventListener("click", function () { pick(c); });
    box.appendChild(b);
  });
}
document.getElementById("say-btn").addEventListener("click", function () { speak(QUESTIONS[current].say); });
function submitTyped() {
  var v = document.getElementById("type-input").value.trim();
  if (!v) return;
  pick(v);
}
document.getElementById("type-ok").addEventListener("click", submitTyped);
document.getElementById("type-input").addEventListener("keydown", function (e) { if (e.key === "Enter") submitTyped(); });

var locked = false;
var IDK = "모름";
function pick(choice) {
  if (locked) return; locked = true;
  var q = QUESTIONS[current];
  var unknown = choice === IDK;
  var ok;
  if (unknown) ok = false;
  else if (q.type === "spell") ok = norm(choice) === norm(q.answer);
  else if (q.type === "write") ok = q.free ? true : q.accept.indexOf(norm(choice)) >= 0;
  else ok = choice === q.answer;
  if (ok) correctCount++;
  else wrongNumbers.push(current + 1);
  if (unknown) unknownNumbers.push(current + 1);
  answersLog.push({ no: current + 1, ok: ok, chosen: choice, answer: q.answer, tag: q.tag, unknown: unknown });
  setTimeout(function () {
    locked = false;
    current++;
    if (current < QUESTIONS.length) showQuestion();
    else showResult();
  }, 250);
}

document.addEventListener("keydown", function (e) {
  if (document.activeElement === nameInput || document.activeElement.id === "type-input") return;
  if (document.getElementById("quiz-card").classList.contains("hidden")) return;
  if (e.key === "0") { pick(IDK); return; }
  var n = parseInt(e.key, 10);
  if (n >= 1 && n <= shownChoices.length) pick(shownChoices[n - 1]);
});
document.getElementById("idk-btn").addEventListener("click", function () { pick(IDK); });

function showResult() {
  document.getElementById("quiz-card").classList.add("hidden");
  document.getElementById("result-card").classList.remove("hidden");
  var sec = {};
  answersLog.forEach(function (l) { var k = l.tag; sec[k] = sec[k] || [0, 0]; sec[k][1]++; if (l.ok) sec[k][0]++; });
  window._secSummary = Object.keys(sec).map(function (k) { return k + " " + sec[k][0] + "/" + sec[k][1]; }).join(" · ");
  engfitSubmitWithStatus({
    quizId: "leveltest-kyc-1106",
    quizTitle: "김예찬 정기 레벨 테스트 11월 (어휘·문법·독해·서술형) — 영역별 " + window._secSummary,
    student: studentName,
    score: correctCount,
    total: QUESTIONS.length,
    wrong: wrongNumbers,
    unknown: unknownNumbers,
    durationSec: Math.round((Date.now() - startTime) / 1000),
    detail: answersLog
  });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 정기 레벨 테스트 11월]\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + QUESTIONS.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n모름: " + (unknownNumbers.length ? unknownNumbers.join(", ") : "없음") +
            "\n영역별: " + (window._secSummary || "") +
            "\n답: " + answersLog.map(function (l) { return l.no + "." + l.chosen; }).join(" | ");
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});
</script>
