<script>
"use strict";

/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#2e7d6e"; }

}


/* ══════ 문제 데이터 (개념 페이지 + 쌍둥이 문제) ══════ */
var STEPS = [
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">① 비교급 강조 — much / far / even + 비교급 (very ✕)<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (11/02 데일리 4번)<\/div>That test was ___ harder than I expected. (훨씬)<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">헷갈리기 쉬운 답<\/div>very harder / more harder<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>much<\/b> harder (far · even 도 정답)<\/div><\/div><div class=\"lab2\">왜 틀리기 쉬울까?<\/div><p class=\"why\">우리말 '훨씬'을 보면 very가 먼저 떠오르지만, <b>very는 원급만<\/b> 꾸밀 수 있어요(very hard). 비교급(harder)을 꾸밀 때는 <b>much · far · even · a lot<\/b>을 써요. 그리고 harder는 이미 비교급이라 앞에 more를 또 붙이면 안 돼요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p><b class=\"hl\">much / far / even<\/b> + 비교급 + than<\/p><ul><li>This road is <b class=\"hl\">much<\/b> safer than that one.<\/li><li>Her idea was <b class=\"hl\">far<\/b> more creative than mine.<\/li><li>원급은 very: The road is <b>very<\/b> safe.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: very + 비교급 ✕ / more + -er ✕ (more harder) → much · far · even!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(새 방은 예전 방보다 훨씬 더 크다)<div class=\"pass\">My new room is ______ bigger than my old one.<\/div>",
  "choices": ["very", "much", "more", "so"],
  "answer": "much",
  "exp": "bigger는 비교급이라 '훨씬'은 <b>much<\/b>예요. very는 원급만, more는 bigger 앞에 또 쓸 수 없고, so는 비교급을 꾸미지 못해요."
 },
 {
  "type": "twin",
  "q": "어법상 <b>바른<\/b> 문장은?",
  "choices": ["This puzzle is very harder than that one.", "This puzzle is more harder than that one.", "This puzzle is far harder than that one.", "This puzzle is much hard than that one."],
  "answer": "This puzzle is far harder than that one.",
  "exp": "<b>far + 비교급(harder)<\/b>이 바른 문장이에요. very harder ✕, more harder ✕, much hard는 비교급이 아니라서 than과 못 써요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">② 간접의문문 (과거) — did를 빼고 동사를 과거형으로<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (11/02 데일리 5 · 6번)<\/div>Tell me why did he leave early. (틀린 곳 고치기)<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">헷갈리기 쉬운 답<\/div>why did he left / why he leave<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>Tell me why he <b>left<\/b> early.<\/div><\/div><div class=\"lab2\">왜 틀리기 쉬울까?<\/div><p class=\"why\">현재일 때 does를 빼면 -s가 동사로 옮겨 갔죠(leaves). 과거도 똑같아요. <b>did를 빼면 '과거'가 동사로 옮겨 가서<\/b> 과거형(left)이 돼요. 그래서 의문사 뒤는 <b>주어 + 과거동사<\/b> 순서! did를 남겨 두면 의문문 어순이라 ✕예요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>Where did she go? → I know where she <b class=\"hl\">went<\/b>.<\/p><ul><li>What did Tom say? → Tell me what Tom <b class=\"hl\">said<\/b>.<\/li><li>Did he call? → I wonder <b class=\"hl\">if<\/b> he <b class=\"hl\">called<\/b>.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: did를 남기면 ✕ / did를 지우고 동사를 원형으로 두면 ✕ → 꼭 과거형으로!<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(너는 우산을 어디에 두었는지 기억하니?)<div class=\"pass\">Do you remember where ______ your umbrella?<\/div>",
  "choices": ["did you leave", "you left", "did you left", "you leave did"],
  "answer": "you left",
  "exp": "간접의문문은 <b>where + 주어(you) + 동사<\/b>. did를 빼고 '과거'를 동사로 옮겨서 <b>left<\/b>예요. did you leave는 의문문 어순, did you left는 did와 과거형이 겹쳐서 ✕."
 },
 {
  "type": "twin",
  "q": "다음 두 문장을 한 문장으로 바르게 쓴 것은?<div class=\"pass\">I wonder. + What did Mina buy at the store?<\/div>",
  "choices": ["I wonder what did Mina buy at the store.", "I wonder what Mina buy at the store.", "I wonder what did Mina bought at the store.", "I wonder what Mina bought at the store."],
  "answer": "I wonder what Mina bought at the store.",
  "exp": "<b>what + 주어(Mina) + 과거동사(bought)<\/b>. buy - bought - bought. what Mina buy는 시제가 사라졌고, what did Mina ~ 는 의문문 어순이라 ✕예요."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린<\/b> 문장은?",
  "choices": ["I know when the store opens.", "Tell me why you were late.", "Can you tell me where did you buy it?", "I wonder if she likes cats."],
  "answer": "Can you tell me where did you buy it?",
  "exp": "where 뒤는 <b>주어 + 동사<\/b> → Can you tell me where <b>you bought<\/b> it? 나머지 opens(-s), you were(be동사 과거), if she likes는 모두 바른 간접의문문이에요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">③ 현재완료 vs 과거 — ago · last · yesterday 가 보이면 과거형<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (11/02 데일리 9번 · 11/02 숙제 14번)<\/div>I have lost my wallet last week. / Mina ( has visited / visited ) Busan two weeks ago.<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">헷갈리기 쉬운 답<\/div>have lost / has visited<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>I <b>lost<\/b> my wallet last week. / <b>visited<\/b><\/div><\/div><div class=\"lab2\">왜 틀리기 쉬울까?<\/div><p class=\"why\">현재완료(have + p.p.)는 과거의 일이 <b>지금까지 이어지거나 영향을 줄 때<\/b> 써요. 그런데 <b>last week · two weeks ago · yesterday · in 2020<\/b>처럼 '언제'인지 딱 정해진 과거 시점이 있으면 현재완료를 쓸 수 없고 <b>과거형<\/b>만 써요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><ul><li>과거 시점 → 과거형: We <b class=\"hl\">moved<\/b> here three years ago.<\/li><li>since · for · already · yet · ever · just → 현재완료: We <b class=\"hl\">have lived<\/b> here since 2023.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: 문장 끝 시간 말을 먼저 보기! ago · last · yesterday + have p.p. ✕<\/div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(우리는 지난 일요일에 소풍을 갔다)<div class=\"pass\">We ______ a picnic last Sunday.<\/div>",
  "choices": ["have had", "has had", "had", "have"],
  "answer": "had",
  "exp": "last Sunday(지난 일요일)는 정해진 과거 시점이라 현재완료 ✕ → 과거형 <b>had<\/b>예요. have는 현재라 시제가 안 맞아요."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<br>(나는 지금까지 이 노래를 세 번 들었다)<div class=\"pass\">I ______ this song three times so far.<\/div>",
  "choices": ["have heard", "has heard", "hear", "was hearing"],
  "answer": "have heard",
  "exp": "so far(지금까지)는 과거부터 지금까지의 경험 → 현재완료. 주어 I라서 <b>have heard<\/b>(hear-heard-heard)예요. has는 3인칭 단수용이에요."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린<\/b> 문장은?",
  "choices": ["I have known Sumin since 2023.", "My uncle has bought a new car yesterday.", "They have already eaten lunch.", "Junho lost his cap two days ago."],
  "answer": "My uncle has bought a new car yesterday.",
  "exp": "yesterday는 과거 시점이라 has bought → <b>bought<\/b>여야 해요. since 2023 · already는 현재완료와 잘 어울리고, two days ago에는 과거형 lost가 맞아요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">④ 지각동사 — see / hear / watch + 목적어 + 동사원형(-ing)<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (11/02 숙제 8 · 10번 · 8과)<\/div>I heard someone ( knock / to knock ) on the door. / 나는 그녀가 무대에서 노래하는 것을 보았다.<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">헷갈리기 쉬운 답<\/div>to knock / saw her to sing<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>knock<\/b> / I saw her <b>sing<\/b> (singing) on the stage.<\/div><\/div><div class=\"lab2\">왜 틀리기 쉬울까?<\/div><p class=\"why\">ask · tell · want + 사람 + <b>to<\/b> 동사원형을 많이 연습해서 지각동사 뒤에도 to를 넣기 쉬워요. 하지만 보고 · 듣고 · 지켜보는 <b>지각동사<\/b>는 목적어 뒤에 <b>to 없이 동사원형<\/b>(진행 중인 모습이면 -ing)을 써요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p><b class=\"hl\">see / hear / watch / feel<\/b> + 목적어 + <b class=\"hl\">동사원형 / -ing<\/b><\/p><ul><li>I watched the boys <b class=\"hl\">run<\/b> to the gate.<\/li><li>비교: Mom told me <b>to clean<\/b> my room. (tell은 to!)<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: 지각동사 + 목적어 + to ✕ / 과거형 ✕ → 동사원형 또는 -ing!<\/div>"
 },
 {

  "q": "빈칸에 알맞은 말은?<br>(나는 아빠가 부엌에서 설거지하시는 것을 보았다)<div class=\"pass\">I saw my dad ______ the dishes in the kitchen.<\/div>",
  "choices": ["to wash", "washed", "wash", "washes"],

 {

 {
  "type": "concept",
  "html": "<div class=\"ctitle\">⑤ so + 형용사 + that ~ — 너무 …해서 ~하다<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (11/02 숙제 20번 · 8과)<\/div>그 상자는 너무 무거워서 나는 들 수 없었다. (so ~ that, heavy, lift)<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">헷갈리기 쉬운 답<\/div>very heavy that / too heavy that<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>The box was <b>so<\/b> heavy <b>that<\/b> I couldn't lift it.<\/div><\/div><div class=\"lab2\">왜 틀리기 쉬울까?<\/div><p class=\"why\">'너무'라는 말 때문에 very나 too를 쓰기 쉬워요. 하지만 뒤에 that + 결과(주어 + 동사)가 오는 짝은 <b>so<\/b>만 돼요. so와 that은 <b>한 세트<\/b>! that 뒤에는 꼭 <b>주어 + 동사<\/b>가 와요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>주어 + be동사 + <b class=\"hl\">so<\/b> + 형용사 + <b class=\"hl\">that<\/b> + 주어 + 동사<\/p><ul><li>The movie was <b class=\"hl\">so<\/b> funny <b class=\"hl\">that<\/b> we laughed a lot.<\/li><li>It was <b class=\"hl\">so<\/b> cold <b class=\"hl\">that<\/b> the lake froze.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: very ~ that ✕ / too ~ that ✕ / so ~ than ✕ → so ~ that!<\/div>"
 },
 {

  "choices": ["very", "too", "such", "so"],
  "answer": "so",
  "exp": "뒤에 that + 결과(I couldn't eat it)가 있으니 <b>so<\/b> hot that이에요. very · too는 that과 짝이 아니고, such는 뒤에 명사가 와야 해요."
 },
 {
  "type": "twin",
  "q": "다음 우리말을 영어로 바르게 옮긴 것은?<div class=\"pass\">그는 너무 피곤해서 일찍 잠자리에 들었다.<\/div>",
  "choices": ["He was very tired that he went to bed early.", "He was so tired than he went to bed early.", "He was so tired that he went to bed early.", "He was too tired that he went to bed early."],
  "answer": "He was so tired that he went to bed early.",
  "exp": "<b>so + 형용사(tired) + that + 주어 + 동사<\/b>. very ~ that ✕, so ~ than ✕(than은 비교급용), too ~ that ✕예요."
 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">⑥ 의미상 주어 다시 확인 — 성격이면 of, 일이면 for<\/div><div class=\"box\"><div class=\"lab\">원래 문제 (11/02 데일리 1 · 2번 · 11/02 숙제 1~6번)<\/div>It was foolish ___ the driver to ~ / It is necessary ___ students to ~<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">헷갈리기 쉬운 답<\/div>for the driver / of students<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div><b>of<\/b> the driver / <b>for<\/b> students<\/div><\/div><div class=\"lab2\">왜 틀리기 쉬울까?<\/div><p class=\"why\">11/01 클리닉은 만점이었지만 데일리와 숙제에 새 형용사(foolish, necessary, careless, silly)가 나오면 다시 헷갈리기 쉬워요. 방법은 하나! <b>'사람 = 형용사'<\/b>가 말이 되는지 확인해요. The driver is foolish.(운전자가 어리석다) → 말이 되니 <b>of<\/b>. Students are necessary.(학생들이 필요하다)는 원래 뜻과 달라서 → <b>for<\/b>.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><ul><li>성격 · 칭찬 · 꾸중 (kind, rude, wise, foolish, careless) → <b class=\"hl\">of<\/b> + 사람<\/li><li>일이 쉽다 · 어렵다 · 필요하다 · 위험하다 (easy, hard, necessary, dangerous) → <b class=\"hl\">for<\/b> + 사람<\/li><\/ul><\/div><div class=\"trap\">⚠️ 함정: 형용사 뜻을 먼저 보고 '사람 = 형용사' 확인 → of / for 결정!<\/div>"
 },
 {

  "answer": "of",
  "exp": "rude(무례한)는 진수를 꾸짖는 성격 형용사 → <b>of + 사람<\/b>. Jinsu was rude.가 말이 되죠."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class=\"pass\">It is easy ______ my little brother to ride a bike now.<\/div>",

  "answer": "for",
  "exp": "easy(쉬운)는 동생의 성격이 아니라 자전거 타는 일이 쉽다는 말 → <b>for + 사람<\/b>이에요."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린<\/b> 문장은?",
  "choices": ["It is important for us to save water.", "It is dangerous of children to swim here alone.", "It was nice of you to help me.", "It was wise of him to say sorry."],
  "answer": "It is dangerous of children to swim here alone.",
  "exp": "dangerous(위험한)는 아이들의 성격이 아니라 수영하는 일이 위험하다는 말 → <b>for children<\/b>이어야 해요. important → for, nice · wise → of가 맞아요."

var QUIZ_ID = "clinic-hte-1102";
var QUIZ_TITLE = "한태은 사진 클리닉 개념+쌍둥이 11/02";
var TW = STEPS.filter(function (x) { return x.type === "twin"; });
var CONCEPT_OF = {};
(function () { var last = ""; STEPS.forEach(function (x, i) { if (x.type === "concept") last = x.html; else CONCEPT_OF[i] = last; }); })();

var studentName = "", cur = 0, twinNo = 0, correctCount = 0, wrongNumbers = [], unknownNumbers = [], answersLog = [], startTime = 0, locked = false;
var nameInput = document.getElementById("name-input"), startBtn = document.getElementById("start-btn");
var CIRCLED = ["①", "②", "③", "④", "⑤"];
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function $(id) { return document.getElementById(id); }

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  $("start-card").classList.add("hidden");
  $("quiz-card").classList.remove("hidden");
  show();
});
$("read-btn").addEventListener("click", function () { cur++; show(); });

function show() {
  if (cur >= STEPS.length) return showResult();
  var st = STEPS[cur];
  $("bar-fill").style.width = Math.round(cur / STEPS.length * 100) + "%";
  $("fb").innerHTML = "";
  if (st.type === "concept") {
    $("progress").textContent = "틀린 이유 읽기 · 쌍둥이 문제 " + (twinNo + 1) + "번 전";
    $("part").classList.add("hidden");
    $("concept-box").innerHTML = st.html; $("concept-box").classList.remove("hidden");
    $("read-btn").classList.remove("hidden");
    $("qtext").innerHTML = ""; $("choices").innerHTML = "";
    window.scrollTo(0, 0);
  } else {
    $("progress").textContent = "쌍둥이 문제 " + (twinNo + 1) + " / " + TW.length;
    $("concept-box").classList.add("hidden"); $("read-btn").classList.add("hidden");
    $("qtext").innerHTML = "Q" + (twinNo + 1) + ". " + st.q;
    var box = $("choices"); box.innerHTML = "";
    shuffle(st.choices).forEach(function (c, i) {
      var b = document.createElement("button"); b.className = "choice"; b.setAttribute("data-c", c);
      b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
      b.addEventListener("click", function () { pick(c); });
      box.appendChild(b);
    });
    var u = document.createElement("button"); u.className = "unk"; u.id = "unk-btn"; u.textContent = "🤔 모름";
    u.addEventListener("click", function () { unknown(); });
    box.appendChild(u);
    window.scrollTo(0, 0);
  }
}

function pick(choice) {
  if (locked) return; locked = true;
  var st = STEPS[cur], ok = choice === st.answer;
  if (ok) correctCount++; else wrongNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: ok, chosen: choice, answer: st.answer });
  [].forEach.call($("choices").children, function (b) {
    b.disabled = true;
    if (b.getAttribute("data-c") === st.answer) b.classList.add("right");
    else if (b.getAttribute("data-c") === choice) b.classList.add("bad");
  });
  var h = '<div class="exp' + (ok ? "" : " wrong") + '"><b>' + (ok ? "정답! 🎉" : "아쉬워요 — 정답: " + st.answer) + "</b><br>" + st.exp + "</div>";
  if (!ok) h += '<div class="lab2">📖 개념 정리 다시 보기</div>' + CONCEPT_OF[cur];
  h += '<button class="btn" id="next-btn">' + (twinNo + 1 < TW.length ? "다음 ▶" : "결과 보기") + "</button>";
  $("fb").innerHTML = h;
  $("next-btn").addEventListener("click", function () { locked = false; twinNo++; cur++; show(); });
}

function unknown() {
  if (locked) return; locked = true;
  var st = STEPS[cur];
  wrongNumbers.push(twinNo + 1); unknownNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: false, chosen: "모름", answer: st.answer, unknown: true });
  locked = false; twinNo++; cur++; show();
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}

function showResult() {
  $("quiz-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  $("score-line").textContent = correctCount + " / " + TW.length;
  var um = document.createElement("div"); um.id = "unknown-line"; um.className = "sub"; um.style.textAlign = "center"; um.textContent = unknownLine();
  $("score-line").parentNode.insertBefore(um, $("submit-status"));
  var expBox = $("explanations");
  TW.forEach(function (q, i) {
    var log = answersLog[i], d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>쌍둥이 " + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 (정답: " + q.answer + ")" : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correctCount, total: TW.length, wrong: wrongNumbers,
    unknown: unknownNumbers, durationSec: Math.round((Date.now() - startTime) / 1000), detail: answersLog });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 사진 클리닉 11/02 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + TW.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n" + unknownLine();
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});

</script>
