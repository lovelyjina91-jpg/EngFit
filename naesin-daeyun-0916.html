<style>

// ===== Sound (Web Speech API, en-US female only) =====
let soundOn = true, voice = null, voicesReady = false;
const FEMALE = ["google us english","zira","samantha","aria","jenny","ava","allison","susan","joanna","salli","kendra","kimberly","ivy","michelle","emma","female"];
const MALE = ["david","alex","mark","guy","fred","daniel","tom","aaron","male","christopher","eric","roger","steffan","brian","matthew","justin","joey"];
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return;
  const us = vs.filter(v=>/en[-_]US/i.test(v.lang));
  const notMale = us.filter(v=>{const n=v.name.toLowerCase(); return !MALE.some(m=>new RegExp("\\b"+m+"\\b").test(n)) || /female/.test(n);});
  let best=null;
  for(const key of FEMALE){ best = notMale.find(v=>v.name.toLowerCase().includes(key)); if(best) break; }
  voice = best || null;
  voicesReady = !!voice;
}
try{ if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } }catch(e){}
function speak(t){
  try{
    if(!soundOn || !t || !("speechSynthesis" in window)) return;
    if(!voicesReady) pickVoice();
    if(!voicesReady) return; // 목소리 로딩 전에는 재생하지 않음
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.voice = voice; u.lang = "en-US"; u.rate = 0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
let actx=null;
function fanfare(){
  try{
    if(!soundOn) return;
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes=[523.25,659.25,783.99,1046.5];
    notes.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type="triangle"; o.frequency.value=f;
      const t=actx.currentTime+i*0.12;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+(i==3?0.5:0.18));
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.55);
    });
  }catch(e){}
}
const soundBtn = document.getElementById("soundBtn");
soundBtn.onclick = ()=>{
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? "🔊 소리 켜짐" : "🔇 소리 꺼짐";
  if(!soundOn){ try{ speechSynthesis.cancel(); }catch(e){} }
};

// ===== State =====
const $ = id=>document.getElementById(id);
let student="", startTime=0, order=[], pos=0, retry=false, retryQueue=[];
const rec = QUESTIONS.map(()=>({status:null, chosen:null, retried:false}));
// status: "ok" | "x" | "dk"
let shownSections = new Set();

$("nameInput").addEventListener("input",()=>{ $("startBtn").disabled = !$("nameInput").value.trim(); });
$("startBtn").onclick = ()=>{
  student = $("nameInput").value.trim();
  if(!student) return;
  startTime = Date.now();
  order = QUESTIONS.map((_,i)=>i);
  pos = 0;
  $("start").classList.add("hidden");
  next();
};

function showConcept(s, then){
  const S = SECTIONS[s];
  const c = $("concept");
  c.innerHTML = `<span class="tag">${S.name}</span><h2 style="margin-top:8px">${S.title}</h2>
   <ul class="concept">${S.points.map(p=>`<li>${p}</li>`).join("")}</ul>
   <div class="sub">낱말을 누르면 발음을 들을 수 있어요</div>
   <div class="chips">${S.chips.map(w=>`<button type="button" class="chip">🔈 ${w}</button>`).join("")}</div>
   <button class="btn" type="button" id="goBtn">문제 풀기 →</button>`;
  c.querySelectorAll(".chip").forEach((b,i)=>b.onclick=()=>speak(S.chips[i]));
  $("quiz").classList.add("hidden"); c.classList.remove("hidden");
  $("goBtn").onclick = ()=>{ c.classList.add("hidden"); then(); };
}

function next(){
  if(pos >= order.length){
    if(!retry && retryQueue.length){
      retry = true; order = retryQueue.slice(); retryQueue = []; pos = 0;
    } else { return finish(); }
  }
  const qi = order[pos];
  const s = QUESTIONS[qi].s;
  if(!retry && !shownSections.has(s)){ shownSections.add(s); return showConcept(s, render); }
  render();
}

function render(){
  const qi = order[pos], Q = QUESTIONS[qi];
  $("quiz").classList.remove("hidden");
  $("qCount").textContent = retry ? `다시 도전 ${pos+1} / ${order.length}` : `${qi+1} / ${QUESTIONS.length}번`;
  $("bar").style.width = (retry ? 100 : (qi/QUESTIONS.length*100)) + "%";
  const rb = $("retryBanner");
  if(retry){ rb.classList.remove("hidden"); rb.textContent = `🔁 다시 도전 — 아까 「모르겠어요」로 넘긴 ${order.length}문제만 한 번 더 물어볼게요.`; }
  else rb.classList.add("hidden");
  $("qTag").textContent = SECTIONS[Q.s].name + " · " + (qi+1) + "번";
  $("qText").textContent = Q.q;
  if(Q.ctx){ $("qCtx").innerHTML = Q.ctx; $("qCtx").classList.remove("hidden"); } else $("qCtx").classList.add("hidden");
  const lb = $("listenBtn");
  if(Q.listen){ lb.classList.remove("hidden"); lb.onclick=()=>speak(Q.listen); } else lb.classList.add("hidden");
  const box = $("choices"); box.innerHTML = "";
  const marks = ["①","②","③","④"];
  Q.c.forEach((t,i)=>{
    const b = document.createElement("button");
    b.type="button"; b.className="choice"; b.textContent = marks[i]+" "+t;
    b.onclick = ()=>answer(i);
    box.appendChild(b);
  });
  const dk = $("dkBtn");
  dk.classList.remove("hidden"); dk.disabled=false;
  dk.textContent = retry ? "🤔 아직도 모르겠어요 (해설 보기)" : "🤔 모르겠어요 — 나중에 다시 풀기";
  dk.onclick = dontKnow;
  $("fb").innerHTML = ""; $("nextBtn").classList.add("hidden");
  window.scrollTo(0,0);
}

function lock(){ document.querySelectorAll(".choice").forEach(b=>b.disabled=true); $("dkBtn").classList.add("hidden"); }

function answer(i){
  const qi = order[pos], Q = QUESTIONS[qi], r = rec[qi];
  lock();
  const btns = document.querySelectorAll(".choice");
  btns[Q.a].classList.add("correct");
  const ok = i === Q.a;
  if(!ok) btns[i].classList.add("wrong");
  r.chosen = Q.c[i]; r.status = ok ? "ok" : "x"; r.retried = retry;
  $("fb").innerHTML = `<div class="fb ${ok?"ok":"no"}"><b>${ok?(retry?"다시 풀어서 맞혔어요 👏":"정답이에요! 👍"):"아쉬워요! 정답은 「"+Q.c[Q.a]+"」"}</b><br>${Q.ex}<div class="rule">※ ${Q.rule}</div></div>`;
  speak(Q.say);
  showNext();
}

function dontKnow(){
  const qi = order[pos], Q = QUESTIONS[qi], r = rec[qi];
  if(!retry){
    r.status = "dk"; retryQueue.push(qi);
    pos++; afterStep(qi); return;
  }
  lock();
  r.status = "dk"; r.chosen = null; r.retried = true;
  document.querySelectorAll(".choice")[Q.a].classList.add("correct");
  $("fb").innerHTML = `<div class="fb dk"><b>괜찮아요! 정답은 「${Q.c[Q.a]}」</b><br>${Q.ex}<div class="rule">※ ${Q.rule}</div></div>`;
  speak(Q.say);
  showNext();
}

function showNext(){
  const nb = $("nextBtn"); nb.classList.remove("hidden");
  nb.onclick = ()=>{ const qi = order[pos]; pos++; afterStep(qi); };
}

function afterStep(qi){
  if(!retry){
    const nextQi = order[pos];
    const endOfSection = nextQi === undefined || QUESTIONS[nextQi].s !== QUESTIONS[qi].s;
    if(endOfSection) fanfare();
  }
  next();
}

function finish(){
  try{ speechSynthesis.cancel(); }catch(e){}
  $("quiz").classList.add("hidden"); $("concept").classList.add("hidden");
  $("result").classList.remove("hidden");
  const total = QUESTIONS.length;
  const score = rec.filter(r=>r.status==="ok").length;
  const wrong = [], dk = [], rescued = [];
  rec.forEach((r,i)=>{ if(r.status==="x") wrong.push(i); if(r.status==="dk") dk.push(i); if(r.status==="ok"&&r.retried) rescued.push(i); });
  const mins = Math.max(1, Math.round((Date.now()-startTime)/60000));
  $("rTitle").textContent = `${student}, 수고했어요!`;
  $("rScore").textContent = `${score} / ${total}`;
  $("rSub").textContent = `틀림 ${wrong.length}개 · 모름 ${dk.length}개 · ${mins}분`;

  let t = `[영핏] ${student} · ${QUIZ_TITLE}\n점수 ${score} / ${total} · ${mins}분 · 모름 ${dk.length}\n`;
  if(wrong.length){
    t += `\n틀린 문항 ${wrong.map(i=>(i+1)+"번").join(", ")}\n`;
    wrong.forEach(i=>{ const Q=QUESTIONS[i]; t += `${i+1}번 [${SECTIONS[Q.s].name}] · 내 답 ${rec[i].chosen} / 정답 ${Q.c[Q.a]}\n`; });
  } else t += `\n틀린 문항 없음\n`;
  if(dk.length){
    t += `\n모름 문항 ${dk.map(i=>(i+1)+"번").join(", ")}\n`;
    dk.forEach(i=>{ const Q=QUESTIONS[i]; t += `${i+1}번 [${SECTIONS[Q.s].name}] · 모름 / 정답 ${Q.c[Q.a]}\n`; });
  }
  if(rescued.length) t += `\n※ 처음엔 모름이었지만 다시 풀어 맞힌 문항 ${rescued.length}개 (${rescued.map(i=>(i+1)+"번").join(", ")})\n`;
  const copyText = t.trim();
  window.__copyText = copyText;

  let html = "";
  wrong.forEach(i=>{ const Q=QUESTIONS[i]; html += `<div class="rev x"><b>Q${i+1}. 틀림</b> — 내 답: ${rec[i].chosen} / 정답: <b>${Q.c[Q.a]}</b><br>※ ${Q.rule}</div>`; });
  dk.forEach(i=>{ const Q=QUESTIONS[i]; html += `<div class="rev d"><b>Q${i+1}. 모름</b> — 정답: <b>${Q.c[Q.a]}</b><br>※ ${Q.rule}</div>`; });
  rescued.forEach(i=>{ html += `<div class="rev r"><b>Q${i+1}.</b> 다시 풀어서 맞혔어요 👏</div>`; });
  $("review").innerHTML = html || `<div class="rev r">전부 맞혔어요! 시험 준비 완벽해요 🎉</div>`;
  $("bar").style.width="100%";

  $("copyBtn").onclick = async ()=>{
    let ok = false;
    try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(copyText); ok = true; } }catch(e){}
    if(!ok){
      try{
        const ta = document.createElement("textarea");
        ta.value = copyText; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.top="-1000px";
        document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 99999);
        ok = document.execCommand("copy"); document.body.removeChild(ta);
      }catch(e){}
    }
    if(ok){
      $("copyBtn").textContent = "복사됐어요! 카톡에 붙여넣기 →";
      $("copyBtn").classList.add("copied");
      $("copyMsg").textContent = "카톡으로 지나티처에게 붙여넣어 보내주세요.";
    } else {
      $("copyMsg").innerHTML = "자동 복사가 안 돼요. 아래 글을 길게 눌러 복사해 주세요.<br><textarea style='width:100%;height:160px;margin-top:8px'>"+copyText.replace(/</g,"&lt;")+"</textarea>";
    }
  };
}
</script>
