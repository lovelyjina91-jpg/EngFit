<script>
"use strict";

/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#2e7d6e"; }
  else { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#c0392b"; }
}


/* ══════ 문제 데이터 (개념 페이지 + 쌍둥이 문제) ══════ */
var STEPS = [
 {
  "type": "concept",
  "html": "<div class='ctitle'>① It is + 형용사 + for / of + 목적격 + to 동사원형 (7과)</div><div class='box'><div class='lab'>7과 소재 예문</div><b>It</b> is exciting <b>for</b> people <b>to throw</b> colored powder at the festival. → 진짜 주어는 뒤의 to ~</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>rude <b>for</b> you / kind <b>for</b> him / easy <b>of</b> me / of you <b>interrupt</b></div><div class='box ok'><div class='lab'>정답 모양</div>일에 대한 판단(easy, hard, important) → <b>for</b> · 사람의 성품(kind, rude, polite, careless, silly) → <b>of</b> · 뒤에는 꼭 <b>to + 동사원형</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>10/30 · 10/31 · 11/2 · 11/6 에 계속 나온 실수예요. for 와 of 를 감으로 고르고, to 를 빠뜨리기도 했어요. 형용사가 <b>사람을 칭찬하거나 혼내는 말</b>이면 of, 그 <b>일이 어떤지</b> 말하면 for! 그리고 목적격 뒤에 <b>to</b> 꼭!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>It was <b class='hl'>polite of</b> him <b class='hl'>to hold</b> the door. (사람 성품 → of)</li><li>It is <b class='hl'>hard for</b> me <b class='hl'>to sing</b> high notes. (일의 판단 → for)</li></ul></div><div class='trap'>⚠️ 함정: 성품 형용사 + for ✕ · 판단 형용사 + of ✕ · of you interrupt (to 빠짐) ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>It was very kind ______ you to carry my heavy bags.</div>",
  "choices": ["for", "of", "to", "with"],
  "answer": "of",
  "exp": "kind(사람의 성품) → <b>of</b> you to carry ~."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>It is difficult ______ me to wake up early on Mondays.</div>",
  "choices": ["of", "to", "for", "by"],
  "answer": "for",
  "exp": "difficult(일에 대한 판단) → <b>for</b> me to wake up ~."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["It is important for us to drink enough water.", "It was silly of him to forget his own birthday.", "It was careless for you to leave the door open.", "It is exciting for kids to watch fireworks."],
  "answer": "It was careless for you to leave the door open.",
  "exp": "careless(부주의한)는 사람의 성품 → <b>careless of you</b> to leave ~."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>② want / tell / ask + 목적어 + not to 동사원형 (8과)</div><div class='box'><div class='lab'>8과 소재 예문</div>The guide <b>told</b> Eckels <b>not to step</b> off the path. → '~하지 말라고'</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>want you <b>don't</b> worry / told us <b>to not</b> ~ / asked him <b>not eat</b></div><div class='box ok'><div class='lab'>정답 모양</div>want · tell · ask + 목적격 + <b>not to</b> + 동사원형 — not 은 <b>to 바로 앞</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>11/10 데일리에서 I want you <b>don't</b> worry 라고 썼어요. 우리말 '~하지 말라고'를 don't 로 바로 옮기고 싶어서 그래요. 목적어 뒤 자리는 to 자리! 부정이면 그 앞에 not 만 살짝 붙이세요.</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>I <b class='hl'>want you not to worry</b>. (don't worry ✕)</li><li>Dad <b class='hl'>asked me not to be</b> late. (not be ✕)</li></ul></div><div class='trap'>⚠️ 함정: 목적어 뒤 don't ✕ · to 빠뜨리기 ✕ · to 뒤에 not 넣기 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>Mom told me ______ too much time on my phone.</div>",
  "choices": ["don't spend", "not spend", "not to spend", "to spend not"],
  "answer": "not to spend",
  "exp": "tell + 목적어(me) + <b>not to</b> + 동사원형 → told me <b>not to spend</b>."
 },
 {
  "type": "twin",
  "q": "우리말을 영어로 바르게 옮긴 것은?<div class='pass'>선생님은 우리에게 복도에서 뛰지 말라고 말씀하셨다.</div>",
  "choices": ["The teacher told us don't run in the hallway.", "The teacher told we not to run in the hallway.", "The teacher told us to not running in the hallway.", "The teacher told us not to run in the hallway."],
  "answer": "The teacher told us not to run in the hallway.",
  "exp": "told + <b>us(목적격)</b> + <b>not to run</b>. don't ✕, we ✕, running ✕"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>The doctor asked Grandpa ______ salty food.</div>",
  "choices": ["not to eat", "not eat", "to not eating", "doesn't eat"],
  "answer": "not to eat",
  "exp": "ask + 목적어(Grandpa) + <b>not to</b> + 동사원형 → asked Grandpa <b>not to eat</b>."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>③ 수 일치 — Every + 단수명사 · 동명사 주어 · 꾸미는 말 빼기 (7과)</div><div class='box'><div class='lab'>7과 소재 예문</div><b>Every</b> visitor at the festival <b>throws</b> colored powder. / <b>Watching</b> the fireworks <b>makes</b> people happy.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>Every <b>girls</b> ~ / Every player <b>practice</b> / Watching cartoons <b>make</b> / The flowers in the vase <b>smells</b></div><div class='box ok'><div class='lab'>정답 모양</div><b>Every + 단수명사 + 단수동사(-s)</b> · <b>-ing 주어 = 단수</b> · in ~ / with ~ 같은 꾸미는 말은 지우고 <b>진짜 주어</b>에 맞추기</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>10/30 · 11/5 · 11/6 · 11/7 에 같은 실수가 나왔어요. 동사 <b>바로 앞 단어</b>(cartoons, the vase)에 맞춰 버려서 그래요. 동사 고르기 전에 꾸미는 말에 괄호 치고, 진짜 주어만 보세요!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li><b class='hl'>Every</b> student <b class='hl'>has</b> a locker. (have ✕)</li><li><b class='hl'>Playing</b> games <b class='hl'>is</b> fun. / The keys (on the desk) <b class='hl'>are</b> mine.</li></ul></div><div class='trap'>⚠️ 함정: Every 뒤 복수명사 ✕ · -ing 주어 + 복수동사 ✕ · 바로 앞 명사에 맞추기 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>Every student in our school ______ a name tag on Mondays.</div>",
  "choices": ["wear", "are wearing", "wears", "have worn"],
  "answer": "wears",
  "exp": "<b>Every student</b>(단수) → <b>wears</b>. in our school 은 꾸미는 말."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>Riding a bike to school ______ about twenty minutes.</div>",
  "choices": ["takes", "take", "are taking", "have taken"],
  "answer": "takes",
  "exp": "<b>Riding</b> ~(동명사 주어) = 단수 → <b>takes</b>. a bike · school 에 맞추면 ✕"
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["The stars in the night sky shine brightly.", "The girl with long braids sits next to me.", "Every room in this hotel has a big window.", "The keys in my bag belongs to my dad."],
  "answer": "The keys in my bag belongs to my dad.",
  "exp": "진짜 주어 <b>The keys</b>(여럿) → <b>belong</b> to my dad. my bag 에 맞추면 ✕"
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>④ so + 형용사 + that ~ / 형용사 + enough to ~ (8과)</div><div class='box'><div class='lab'>8과 소재 예문</div>The dinosaur was <b>so</b> big <b>that</b> Eckels couldn't move. → 너무 ~해서 …하다</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div><b>very</b> big that ~ / so big <b>than</b> ~ / <b>enough soft</b> to ~</div><div class='box ok'><div class='lab'>정답 모양</div><b>so + 형용사 + that</b> + 주어 + 동사 · <b>형용사 + enough</b> + (for 목적격) + <b>to 동사원형</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>11/12 개념 확인에서 enough soft 라고 썼어요. 우리말 '충분히 부드러운'의 순서 그대로 옮겨서 그래요. enough 는 형용사 <b>뒤</b>에 붙는 꼬리! 그리고 that 과 짝이 되는 건 very 가 아니라 <b>so</b>.</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>The water was <b class='hl'>so cold that</b> we got out. (very ✕)</li><li>The grass is <b class='hl'>soft enough to</b> lie on. (enough soft ✕)</li></ul></div><div class='trap'>⚠️ 함정: very ~ that ✕ · so ~ than ✕ · enough + 형용사 순서 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>The wind last night was ______ strong that the old tree fell down.</div>",
  "choices": ["very", "too", "so", "such"],
  "answer": "so",
  "exp": "<b>so + 형용사 + that</b> = 너무 ~해서 …하다 → <b>so</b> strong that. very · too ✕"
 },
 {
  "type": "twin",
  "q": "우리말을 영어로 바르게 옮긴 것은?<div class='pass'>이 상자는 내가 들 수 있을 만큼 충분히 가볍다.</div>",
  "choices": ["This box is enough light for me to lift.", "This box is light for me enough to lift.", "This box is light enough for me to lift.", "This box is enough for me light to lift."],
  "answer": "This box is light enough for me to lift.",
  "exp": "<b>형용사(light) + enough</b> + for me + <b>to lift</b>. enough light ✕"
 },
 {
  "type": "twin",
  "q": "어법상 <b>옳은</b> 문장은?",
  "choices": ["The movie was very boring that I fell asleep.", "The movie was so boring that I fell asleep.", "The movie was so boring than I fell asleep.", "The movie was such boring that I fell asleep."],
  "answer": "The movie was so boring that I fell asleep.",
  "exp": "<b>so</b> boring <b>that</b> ~ ○. very ✕, than ✕, such 는 such a + 형용사 + 명사."
 },
 {
  "type": "concept",

var QUIZ_ID = "clinic-hte-1114";
var QUIZ_TITLE = "한태은 사진 클리닉 개념+쌍둥이 11/14";
var TW = STEPS.filter(function (x) { return x.type === "twin"; });
var CONCEPT_OF = {};
(function () { var last = ""; STEPS.forEach(function (x, i) { if (x.type === "concept") last = x.html; else CONCEPT_OF[i] = last; }); })();

var studentName = "", cur = 0, twinNo = 0, correctCount = 0, wrongNumbers = [], unknownNumbers = [], answersLog = [], startTime = 0, locked = false;
var nameInput = document.getElementById("name-input"), startBtn = document.getElementById("start-btn");

function $(id) { return document.getElementById(id); }

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  $("start-card").classList.add("hidden");
  $("quiz-card").classList.remove("hidden");
  show();
});
$("read-btn").addEventListener("click", function () { if ($("read-btn").disabled) return; stopTwin(); cur++; show(); });
/* 원장님 11/14 "태은이는 왜 막찍고 넘어가져?" — 막 넘기기 방지: 개념은 읽을 시간만큼 잠금, 문제는 읽을 시간 뒤에 보기 열림, 정답 문장을 끝까지 들어야 다음 */
var waitTimer = null;
function textLen(html) { var d = document.createElement("div"); d.innerHTML = html; return (d.textContent || "").replace(/\s+/g, "").length; }
function holdBtn(btn, sec, label, after) {
  clearInterval(waitTimer); btn.disabled = true; btn.style.opacity = ".5";
  var left = sec; btn.textContent = "📖 읽는 중… " + left + "초";
  waitTimer = setInterval(function () { left--; if (left > 0) { btn.textContent = "📖 읽는 중… " + left + "초"; return; }
    clearInterval(waitTimer); btn.disabled = false; btn.style.opacity = ""; btn.textContent = label; if (after) after(); }, 1000);
}

function show() {
  if (cur >= STEPS.length) return showResult();
  var st = STEPS[cur];
  $("bar-fill").style.width = Math.round(cur / STEPS.length * 100) + "%";
  $("fb").innerHTML = "";
  if (st.type === "concept") {
    $("progress").textContent = "틀린 이유 읽기 · 쌍둥이 문제 " + (twinNo + 1) + "번 전";
    $("part").classList.add("hidden");
    $("concept-box").innerHTML = st.html; $("concept-box").classList.remove("hidden");
    $("read-btn").classList.remove("hidden");
    $("qtext").innerHTML = ""; $("choices").innerHTML = "";
    /* 원장님 11/14 "초반부분 설명좀 내 목소리로 읽어주던가… 애들이 뭔 재미로 글자를 보것냐" — 원장님 목소리 설명 + 지금 읽는 칸 반짝, 다 듣기 전 잠금 */
    var rb = $("read-btn"); if (!rb.getAttribute("data-label")) rb.setAttribute("data-label", rb.textContent);
    var ci = 0; for (var s = 0; s <= cur; s++) if (STEPS[s].type === "concept") ci++;
    var cb = $("concept-box"), two = cb.querySelectorAll(".two .box");
    var spots = [cb.querySelector(".ctitle"), cb.querySelector(":scope > .box"), cb.querySelector(":scope > .box"), two[0], two[1], cb.querySelector(".why"), cb.querySelector(".rule"), cb.querySelector(".trap")];
    var list = []; if (ci === 1) list.push("g"); for (var z = 1; z <= 8; z++) list.push("n" + ci + "_" + z);
    var again = document.createElement("button"); again.className = "btn"; again.style.cssText = "background:#eef3ff;color:#2c3e8f;margin-top:8px"; again.textContent = "🔊 설명 다시 듣기";
    rb.parentNode.insertBefore(again, rb.nextSibling); qAgainBtn = again;
    function lit(i) { [].forEach.call(cb.querySelectorAll(".talking"), function (e) { e.classList.remove("talking"); }); var nm = list[i] || ""; var m = /_(\d)$/.exec(nm); var el = m ? spots[+m[1] - 1] : spots[0]; if (el) { el.classList.add("talking"); try { el.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) {} } }
    function talk(first) { rb.disabled = true; rb.style.opacity = ".5"; rb.textContent = "👂 지나티처 설명 듣는 중…"; again.disabled = true; again.style.opacity = ".5";
      playList(first ? list : list.filter(function (x) { return x !== "g"; }), function () { [].forEach.call(cb.querySelectorAll(".talking"), function (e) { e.classList.remove("talking"); }); rb.disabled = false; rb.style.opacity = ""; rb.textContent = rb.getAttribute("data-label"); again.disabled = false; again.style.opacity = ""; window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); }, lit); }
    again.addEventListener("click", function () { if (!again.disabled) talk(false); });
    talk(true);
    window.scrollTo(0, 0);
  } else {
    $("progress").textContent = "쌍둥이 문제 " + (twinNo + 1) + " / " + TW.length;
    $("concept-box").classList.add("hidden"); $("read-btn").classList.add("hidden");
    $("qtext").innerHTML = "Q" + (twinNo + 1) + ". " + st.q;
    var box = $("choices"); box.innerHTML = "";
    shuffle(st.choices).forEach(function (c, i) {
      var b = document.createElement("button"); b.className = "choice"; b.setAttribute("data-c", c);
      b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
      b.addEventListener("click", function () { pick(c); });
      box.appendChild(b);
    });
    var u = document.createElement("button"); u.className = "unk"; u.id = "unk-btn"; u.textContent = "🤔 모름";
    u.addEventListener("click", function () { unknown(); });
    box.appendChild(u);
    /* 원장님 11/14 "태은이도 문제 나오면 영어문장 읽어줘야징" — 지시문(한글)→영어 문장(→영어 보기)을 끝까지 읽어 줄 때까지 보기·모름 잠금 */
    var kids = [].slice.call(box.children); kids.forEach(function (b) { b.disabled = true; b.style.opacity = ".45"; });
    var tip = document.createElement("div"); tip.style.cssText = "text-align:center;color:#8a6d00;font-weight:700;margin-top:8px"; tip.textContent = "👂 지나티처가 문제 읽는 중…"; box.appendChild(tip);
    var again = document.createElement("button"); again.className = "btn"; again.style.cssText = "background:#eef3ff;color:#2c3e8f;margin-top:8px"; again.textContent = "🔊 문제 다시 듣기"; again.disabled = true; again.style.opacity = ".5";
    box.parentNode.insertBefore(again, box.nextSibling); qAgainBtn = again;
    var n = twinNo + 1, info = QSEQ[n] || { seq: [], ch: 0 }, list = info.seq.slice();
    if (info.ch) kids.forEach(function (b) { var c = b.getAttribute("data-c"); var k = st.choices.indexOf(c); if (k >= 0 && !/[가-힣]/.test(c)) list.push("c" + n + "_" + (k + 1)); });
    function open() { kids.forEach(function (b) { b.disabled = false; b.style.opacity = ""; }); tip.remove(); again.disabled = false; again.style.opacity = ""; }
    function readQ() { again.disabled = true; again.style.opacity = ".5"; playList(list, open); }
    again.addEventListener("click", function () { if (!again.disabled && !locked) readQ(); });
    readQ();
    window.scrollTo(0, 0);
  }
}

function pick(choice) {
  if (locked) return; locked = true;
  var st = STEPS[cur], ok = choice === st.answer;
  if (ok) correctCount++; else wrongNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: ok, chosen: choice, answer: st.answer });
  [].forEach.call($("choices").children, function (b) {
    b.disabled = true;
    if (b.getAttribute("data-c") === st.answer) b.classList.add("right");
    else if (b.getAttribute("data-c") === choice) b.classList.add("bad");
  });
  feedback(ok, st);
}

/* 11/14 원장님 목소리(v4) 칭찬·틀림·모름 한 마디 → 정답 문장. 칭찬은 원장님 선택 전부 3번 */
var CHEER = { ok: ["praise/p1_3","praise/p2_3","praise/p3_3","praise/p4_3","praise/p5_3","praise/p6_3","praise/p7_3","praise/p8_3","praise/p9_3"], no: ["oops/p1_3","oops/p2_3","oops/p3_1","oops/p4_3","oops/p5_3"], un: ["oops/p6_3","oops/p7_3","oops/p8_3"] };
var cheerAud = new Audio();
function cheerHte(kind, done) {
  var list = CHEER[kind] || [], fin = false;
  function f() { if (fin) return; fin = true; cheerAud.onended = cheerAud.onerror = null; done(); }
  if (!list.length) return f();
  cheerAud.onended = f; cheerAud.onerror = f; setTimeout(f, 4000);
  try { cheerAud.pause(); cheerAud.src = "audio/fx/" + list[Math.floor(Math.random() * list.length)] + ".mp3?v=1114"; var pr = cheerAud.play(); if (pr && pr.catch) pr.catch(f); } catch (e) { f(); }
}
function feedback(ok, st, isUnknown) {
  var h = '<div class="exp' + (ok ? "" : " wrong") + '"><b>' + (ok ? "정답! 🎉" : (isUnknown ? "🤔 괜찮아요! 정답: " : "아쉬워요 — 정답: ") + st.answer) + "</b><br>" + st.exp + "</div>";
  if (!ok) h += '<div class="lab2">📖 개념 정리 다시 보기</div>' + CONCEPT_OF[cur];
  h += '<button class="btn" id="say-btn" style="background:#eef3ff;color:#2c3e8f;margin-bottom:8px">🔊 정답 문장 다시 듣기</button>';
  h += '<button class="btn" id="next-btn">' + (twinNo + 1 < TW.length ? "다음 ▶" : "결과 보기") + "</button>";
  $("fb").innerHTML = h;
  var nb = $("next-btn"), nLabel = nb.textContent;
  function ready() { nb.disabled = false; nb.style.opacity = ""; nb.textContent = nLabel; }
  function listen() { nb.disabled = true; nb.style.opacity = ".5"; nb.textContent = "👂 정답 문장 듣는 중…"; playTwin(twinNo + 1, ready); }
  nb.disabled = true; nb.style.opacity = ".5"; nb.textContent = "👂 정답 문장 듣는 중…";
  cheerHte(isUnknown ? "un" : (ok ? "ok" : "no"), listen);
  $("say-btn").addEventListener("click", listen);
  nb.addEventListener("click", function () { if (nb.disabled) return; stopTwin(); locked = false; twinNo++; cur++; show(); });
}

/* 원장님 11/14 "태은이 링크도 영어 문장은 정답 누르면 읽어줘" — 답을 고르면 정답 영어 문장을 소리로 (문항마다 다른 목소리, Eleven v4) */
var twinAud = new Audio();
var twinDone = null, twinGuard = null;
function playTwin(n, done) {
  listToken++; if (qAgainBtn) { qAgainBtn.remove(); qAgainBtn = null; }
  clearTimeout(twinGuard); twinDone = done || null;
  function fin() { clearTimeout(twinGuard); var f = twinDone; twinDone = null; if (f) f(); }
  /* 소리가 막히거나 안 나오면 6초 뒤 열어 줌 (갇히지 않게) */
  twinGuard = setTimeout(fin, 6000);
  try { twinAud.pause(); twinAud.onended = fin; twinAud.onerror = fin; twinAud.onplaying = function () { clearTimeout(twinGuard); twinGuard = setTimeout(fin, 20000); };
    twinAud.src = "audio/clinic/clinic-hte-1114/t" + n + ".mp3?v=202611140130"; var p = twinAud.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
}
var QSEQ = {"1":{"seq":["k1","p1"],"ch":0},"2":{"seq":["k2","p2"],"ch":0},"3":{"seq":["k3"],"ch":1},"4":{"seq":["k4","p4"],"ch":0},"5":{"seq":["k5","p5"],"ch":0},"6":{"seq":["k6","p6"],"ch":0},"7":{"seq":["k7","p7"],"ch":0},"8":{"seq":["k8","p8"],"ch":0},"9":{"seq":["k9"],"ch":1},"10":{"seq":["k10","p10"],"ch":0},"11":{"seq":["k11","p11"],"ch":0},"12":{"seq":["k12"],"ch":1},"13":{"seq":["k13","p13"],"ch":0},"14":{"seq":["k14","p14"],"ch":0},"15":{"seq":["k15","p15"],"ch":0}};
var qAgainBtn = null, listToken = 0;
/* 파일 여러 개를 차례로 (같은 Audio 하나로 → 휴대폰에서도 계속 소리). 막히면 파일당 6초 뒤 다음으로 */
function playList(list, done, onEach) {
  var my = ++listToken, i = 0;
  function nextOne() {
    if (my !== listToken) return;
    if (i >= list.length) { clearTimeout(twinGuard); twinDone = null; if (done) done(); return; }
    if (onEach) try { onEach(i); } catch (e) {}
    var name = list[i++]; clearTimeout(twinGuard); twinDone = null;
    twinGuard = setTimeout(nextOne, 6000);
    try { twinAud.pause(); twinAud.onended = function () { if (my === listToken) { clearTimeout(twinGuard); setTimeout(nextOne, 250); } };
      twinAud.onerror = function () { if (my === listToken) { clearTimeout(twinGuard); nextOne(); } };
      twinAud.onplaying = function () { if (my === listToken) { clearTimeout(twinGuard); twinGuard = setTimeout(nextOne, 20000); } };
      twinAud.src = "audio/clinic/clinic-hte-1114/" + name + ".mp3?v=202611140930"; var p = twinAud.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
  nextOne();
}
function stopTwin() { listToken++; if (qAgainBtn) { qAgainBtn.remove(); qAgainBtn = null; } clearTimeout(twinGuard); twinDone = null; try { twinAud.pause(); } catch (e) {} }

function unknown() {
  if (locked) return; locked = true;
  var st = STEPS[cur];
  wrongNumbers.push(twinNo + 1); unknownNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: false, chosen: "모름", answer: st.answer, unknown: true });
  /* 모름도 정답·해설 보고 정답 문장 들은 뒤 넘어가기 */
  [].forEach.call($("choices").children, function (b) { b.disabled = true; if (b.getAttribute && b.getAttribute("data-c") === st.answer) b.classList.add("right"); });
  feedback(false, st, true);
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}

function showResult() {
  $("quiz-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  $("score-line").textContent = correctCount + " / " + TW.length;
  var um = document.createElement("div"); um.id = "unknown-line"; um.className = "sub"; um.style.textAlign = "center"; um.textContent = unknownLine();
  $("score-line").parentNode.insertBefore(um, $("submit-status"));
  var expBox = $("explanations");
  TW.forEach(function (q, i) {
    var log = answersLog[i], d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>쌍둥이 " + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 (정답: " + q.answer + ")" : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correctCount, total: TW.length, wrong: wrongNumbers,
    unknown: unknownNumbers, durationSec: Math.round((Date.now() - startTime) / 1000), detail: answersLog });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 사진 클리닉 11/14 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + TW.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n" + unknownLine();
  navigator.clipboard.writeText(msg).then(function () {

  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});
