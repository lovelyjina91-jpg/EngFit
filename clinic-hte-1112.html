/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#2e7d6e"; }
  else { el.textContent = "📱 아래 버튼을 눌러 결과를 복사하고, 카톡으로 지나티처에게 꼭 보내요!"; el.style.color = "#c0392b"; }
}


/* ══════ 문제 데이터 (개념 페이지 + 쌍둥이 문제) ══════ */
var STEPS = [
 {
  "type": "concept",
  "html": "<div class='ctitle'>① 의미상 주어 for / of — It is + 형용사 + for/of + 목적격 + to 동사원형 (7과)</div><div class='box'><div class='lab'>7과 소재 예문</div>It is exciting <b>for</b> visitors to throw colorful powder at the festival.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>It was polite <b>for</b> him ~ / It is easy <b>of</b> kids ~ / for <b>I</b></div><div class='box ok'><div class='lab'>정답 모양</div>사람의 성격·태도(kind, polite, rude, brave, silly, generous) → <b>of</b> · 일에 대한 판단(easy, hard, fun, exciting, important) → <b>for</b> · 뒤는 <b>목적격</b>(me, him, her)</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>둘 다 우리말로 '~가 …하는 것은'이라 뜻으로는 못 골라요. <b>형용사</b>를 보고 '이게 그 <b>사람</b>을 칭찬·비판하는 말인가?' 물어보세요. 사람이 착하다·무례하다 → of, 그 <b>일</b>이 쉽다·어렵다 → for!</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>It was <b class='hl'>brave of</b> her to sing alone. (그녀가 용감함)</li><li>It is <b class='hl'>hard for</b> me to wake up early. (그 일이 어려움)</li></ul></div><div class='trap'>⚠️ 함정: 성격 형용사 + for ✕ · 판단 형용사 + of ✕ · for/of + 주격(I, he) ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>It was generous ______ Mr. Lim to donate his books to the library.</div>",
  "choices": ["for", "of", "to", "by"],
  "answer": "of",
  "exp": "generous(너그러운)는 사람의 성품 → <b>of</b> Mr. Lim."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>It is not easy ______ young kids to sit still for an hour.</div>",
  "choices": ["of", "to", "for", "by"],
  "answer": "for",
  "exp": "easy(쉬운)는 그 일에 대한 판단 → <b>for</b> young kids."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["It is exciting for us to watch fireworks.", "It was silly of me to forget my ticket.", "It was polite for him to hold the door.", "It is helpful for students to read every day."],
  "answer": "It was polite for him to hold the door.",
  "exp": "polite(예의 바른)는 사람의 태도 → <b>of him</b>. silly 도 성격이라 of me 가 맞아요."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>② 진짜 주어 찾기 — 꾸미는 말 빼고 수일치 · 동명사 주어는 단수 (7과)</div><div class='box'><div class='lab'>7과 소재 예문</div><b>Dancing</b> in the streets <b>is</b> part of the festival. / The lanterns <s>on the river</s> <b>are</b> bright.</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>Making masks <b>take</b> ~ / The lanterns on the bridge <b>looks</b> ~</div><div class='box ok'><div class='lab'>정답 모양</div>-ing 로 시작하는 주어 = 하나의 일 → <b>단수 동사</b>(is, takes) · 전치사구(on ~, in ~, of ~)는 지우고 <b>맨 앞 명사</b>에 맞춤</div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>동사 <b>바로 앞</b>에 있는 단어(masks, bridge)에 맞추고 싶어지기 때문이에요. 하지만 그건 꾸미는 말 속 단어일 뿐! 동사 앞부분을 손가락으로 가리고 '<b>누가/무엇이</b>' 하는지 맨 앞에서 찾으세요.</p><div class='rule'><div class='lab'>개념 정리</div><ul><li><b class='hl'>Making</b> masks <b class='hl'>takes</b> time. (만드는 일 하나)</li><li>The <b class='hl'>lanterns</b> on the bridge <b class='hl'>look</b> pretty. (lanterns 여럿)</li></ul></div><div class='trap'>⚠️ 함정: 동명사 주어 + 복수 동사 ✕ · 꾸미는 말 속 명사에 맞추기 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>Dancing with colorful powder ______ the best part of the festival.</div>",
  "choices": ["are", "is", "be", "being"],
  "answer": "is",
  "exp": "주어 <b>Dancing</b>(춤추는 일 하나) → 단수 <b>is</b>. powder 에 맞추는 게 아니에요."
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>The paper lanterns on the old bridge ______ beautiful at night.</div>",
  "choices": ["looks", "is look", "looking", "look"],
  "answer": "look",
  "exp": "on the old bridge 는 꾸미는 말 → 진짜 주어 <b>The paper lanterns</b>(여럿) → <b>look</b>."
 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["Watching parades is fun.", "Making festival masks take a lot of time.", "The people in the crowd were cheering.", "The flowers in this garden smell sweet."],
  "answer": "Making festival masks take a lot of time.",
  "exp": "주어 <b>Making</b> ~ 은 단수 → <b>takes</b>. masks 에 맞추면 ✕."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>③ 현재완료 경험·계속 ↔ 과거 시점은 과거형 (8과)</div><div class='box'><div class='lab'>8과 본문 소재</div>Eckels <b>has</b> never <b>seen</b> a dinosaur. → have/has + p.p. 는 '언제'를 말하지 않아요</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div>have visited ~ <b>two years ago</b> / <b>When have</b> you met ~? / How long <b>did</b> ~ since ~?</div><div class='box ok'><div class='lab'>정답 모양</div>ago · last ~ · yesterday · When? → <b>과거형</b> · since · for · How long · ever · never → <b>현재완료</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>지난 클리닉(11/09 9번)에서도 헷갈렸던 부분이에요. 우리말 '~했다'만 보면 둘 다 맞아 보여요. 그러니 동사보다 먼저 <b>시간 표현</b>에 동그라미! 과거의 <b>한 점</b>이면 과거형, 과거에서 <b>지금까지 이어지는 선</b>이면 현재완료.</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>I <b class='hl'>met</b> him <b class='hl'>last week</b>. (have met ✕)</li><li>I <b class='hl'>have known</b> him <b class='hl'>since</b> I was ten. / <b class='hl'>How long have</b> you <b class='hl'>lived</b> here?</li></ul></div><div class='trap'>⚠️ 함정: 현재완료 + ago / last / yesterday ✕ · When + 현재완료 ✕ · since 문장에 과거형 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>Somin ______ her history homework last night.</div>",
  "choices": ["has finished", "finished", "have finished", "has finish"],
  "answer": "finished",
  "exp": "<b>last night</b>(과거의 한 점) → 과거형 <b>finished</b>."
 },
 {
  "type": "twin",
  "q": "대화의 빈칸에 알맞은 말은?<div class='pass'>A: How long ______ you ______ the violin?<br>B: Since I was seven.</div>",
  "choices": ["did – play", "have – play", "do – played", "have – played"],
  "answer": "have – played",
  "exp": "<b>Since</b> I was seven(그때부터 지금까지) → 현재완료 <b>How long have you played</b> ~?"
 },
 {
  "type": "twin",
  "q": "어법상 <b>옳은</b> 문장은?",
  "choices": ["I have visited Gyeongju two years ago.", "When have you met Ms. Cha?", "We have seen the movie yesterday.", "She has lived in Jeonju since 2018."],
  "answer": "She has lived in Jeonju since 2018.",
  "exp": "<b>since 2018</b> → 현재완료 맞아요. two years ago · yesterday · When 은 과거형(visited · saw · did you meet)."
 },
 {
  "type": "concept",
  "html": "<div class='ctitle'>④ -thing + 형용사 (+ to 동사원형) (8과)</div><div class='box'><div class='lab'>8과 본문 소재</div>Don't do <b>anything foolish</b>. → anything 뒤에 형용사</div><div class='two'><div class='box'><div class='lab'>시험에 나오는 함정</div><b>interesting anything</b> / delicious <b>something</b> / something <b>coldly</b></div><div class='box ok'><div class='lab'>정답 모양</div><b>-thing(-one, -body) + 형용사 + to 동사원형</b> → something <b>cold to drink</b></div></div><div class='lab2'>왜 헷갈릴까?</div><p class='why'>보통은 형용사가 명사 <b>앞</b>(a cold drink)에 오니까 something 앞에도 놓고 싶어져요. 하지만 -thing 으로 끝나는 말은 형용사가 <b>뒤</b>로 가요. 순서는 언제나 <b>-thing → 형용사 → to 동사원형</b>.</p><div class='rule'><div class='lab'>개념 정리</div><ul><li>I want <b class='hl'>something cold to drink</b>. (마실 차가운 것)</li><li>Is there <b class='hl'>anything new</b>? / I met <b class='hl'>someone famous</b>.</li></ul></div><div class='trap'>⚠️ 함정: 형용사 + -thing ✕ · 형용사 대신 부사(-ly) ✕ · to 동사원형을 형용사 앞에 ✕</div>"
 },
 {
  "type": "twin",
  "q": "빈칸에 알맞은 말은?<div class='pass'>Is there ______ in the school newspaper today?</div>",
  "choices": ["interesting anything", "anything interesting", "anything interestingly", "interesting something"],
  "answer": "anything interesting",
  "exp": "<b>anything + 형용사(interesting)</b> 순서. 부사 interestingly ✕."
 },
 {
  "type": "twin",

  "choices": ["We want cold something to drink.", "We want something coldly to drink.", "We want something cold to drink.", "We want to drink cold something."],
  "answer": "We want something cold to drink.",
  "exp": "<b>something + 형용사(cold) + to 동사원형(to drink)</b>."
 },
 {

  "q": "어법상 <b>틀린</b> 문장은?",
  "choices": ["I saw something strange in the sky.", "Tell me something funny.", "She needs someone kind to help her.", "Let's eat delicious something."],
  "answer": "Let's eat delicious something.",
  "exp": "형용사는 -thing <b>뒤</b> → something <b>delicious</b>."
 },
 {

 {

  "q": "빈칸에 알맞은 말은?<div class='pass'>The suitcase was ______ heavy that Dami couldn't lift it.</div>",
  "choices": ["such", "too", "so", "very"],
  "answer": "so",
  "exp": "that 과 짝 → <b>so</b> + 형용사(heavy) + that."
 },

  "q": "두 문장을 한 문장으로 바르게 바꾼 것은?<div class='pass'>The music was very loud. We couldn't hear each other.</div>",
  "choices": ["The music was so loud that we can't hear each other.", "The music was such loud that we couldn't hear each other.", "The music was so loud that we couldn't hear each other.", "The music was so loud we that couldn't hear each other."],
  "answer": "The music was so loud that we couldn't hear each other.",

 {

  "q": "우리말을 영어로 바르게 옮긴 것은?<div class='pass'>그 퍼즐은 너무 쉬워서 내 남동생도 풀 수 있었다.</div>",
  "choices": ["The puzzle was so easily that even my little brother could solve it.", "The puzzle was very easy that even my little brother could solve it.", "The puzzle was so easy that even my little brother can solve it.", "The puzzle was so easy that even my little brother could solve it."],

var QUIZ_ID = "clinic-hte-1112";
var QUIZ_TITLE = "한태은 사진 클리닉 개념+쌍둥이 11/12";
var TW = STEPS.filter(function (x) { return x.type === "twin"; });
var CONCEPT_OF = {};
(function () { var last = ""; STEPS.forEach(function (x, i) { if (x.type === "concept") last = x.html; else CONCEPT_OF[i] = last; }); })();

var studentName = "", cur = 0, twinNo = 0, correctCount = 0, wrongNumbers = [], unknownNumbers = [], answersLog = [], startTime = 0, locked = false;
var nameInput = document.getElementById("name-input"), startBtn = document.getElementById("start-btn");
var CIRCLED = ["①", "②", "③", "④", "⑤"];
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function $(id) { return document.getElementById(id); }

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  $("start-card").classList.add("hidden");
  $("quiz-card").classList.remove("hidden");
  show();
});
$("read-btn").addEventListener("click", function () { cur++; show(); });

function show() {
  if (cur >= STEPS.length) return showResult();
  var st = STEPS[cur];
  $("bar-fill").style.width = Math.round(cur / STEPS.length * 100) + "%";
  $("fb").innerHTML = "";
  if (st.type === "concept") {
    $("progress").textContent = "틀린 이유 읽기 · 쌍둥이 문제 " + (twinNo + 1) + "번 전";
    $("part").classList.add("hidden");
    $("concept-box").innerHTML = st.html; $("concept-box").classList.remove("hidden");
    $("read-btn").classList.remove("hidden");
    $("qtext").innerHTML = ""; $("choices").innerHTML = "";
    window.scrollTo(0, 0);
  } else {
    $("progress").textContent = "쌍둥이 문제 " + (twinNo + 1) + " / " + TW.length;
    $("concept-box").classList.add("hidden"); $("read-btn").classList.add("hidden");
    $("qtext").innerHTML = "Q" + (twinNo + 1) + ". " + st.q;
    var box = $("choices"); box.innerHTML = "";
    shuffle(st.choices).forEach(function (c, i) {
      var b = document.createElement("button"); b.className = "choice"; b.setAttribute("data-c", c);
      b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
      b.addEventListener("click", function () { pick(c); });
      box.appendChild(b);
    });
    var u = document.createElement("button"); u.className = "unk"; u.id = "unk-btn"; u.textContent = "🤔 모름";
    u.addEventListener("click", function () { unknown(); });
    box.appendChild(u);
    window.scrollTo(0, 0);
  }
}

function pick(choice) {
  if (locked) return; locked = true;
  var st = STEPS[cur], ok = choice === st.answer;
  if (ok) correctCount++; else wrongNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: ok, chosen: choice, answer: st.answer });
  [].forEach.call($("choices").children, function (b) {
    b.disabled = true;
    if (b.getAttribute("data-c") === st.answer) b.classList.add("right");
    else if (b.getAttribute("data-c") === choice) b.classList.add("bad");
  });
  var h = '<div class="exp' + (ok ? "" : " wrong") + '"><b>' + (ok ? "정답! 🎉" : "아쉬워요 — 정답: " + st.answer) + "</b><br>" + st.exp + "</div>";
  if (!ok) h += '<div class="lab2">📖 개념 정리 다시 보기</div>' + CONCEPT_OF[cur];
  h += '<button class="btn" id="next-btn">' + (twinNo + 1 < TW.length ? "다음 ▶" : "결과 보기") + "</button>";
  $("fb").innerHTML = h;
  $("next-btn").addEventListener("click", function () { locked = false; twinNo++; cur++; show(); });
}

function unknown() {
  if (locked) return; locked = true;
  var st = STEPS[cur];
  wrongNumbers.push(twinNo + 1); unknownNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: false, chosen: "모름", answer: st.answer, unknown: true });
  locked = false; twinNo++; cur++; show();
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}

function showResult() {
  $("quiz-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  $("score-line").textContent = correctCount + " / " + TW.length;
  var um = document.createElement("div"); um.id = "unknown-line"; um.className = "sub"; um.style.textAlign = "center"; um.textContent = unknownLine();
  $("score-line").parentNode.insertBefore(um, $("submit-status"));
  var expBox = $("explanations");
  TW.forEach(function (q, i) {
    var log = answersLog[i], d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>쌍둥이 " + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 (정답: " + q.answer + ")" : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correctCount, total: TW.length, wrong: wrongNumbers,
    unknown: unknownNumbers, durationSec: Math.round((Date.now() - startTime) / 1000), detail: answersLog });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 사진 클리닉 11/12 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + TW.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n" + unknownLine();
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});

</script>
