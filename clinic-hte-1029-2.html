/* ══════ 결과 자동 전송 (영핏 공통) ══════ */
var ENGFIT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbz5IC3cEtaBGW10qZhrjwtjdtGugmcmYb4ZTHS4k-1LOqTRYzW-LfoAPyFB_ShjAqNp/exec";

async function engfitSubmit(r) {
  var body = JSON.stringify(r);
  try {
    var res = await fetch(ENGFIT_SUBMIT_URL, { method: "POST", body: body });
    var j = await res.json();
    return j.ok === true;
  } catch (e) {
    try {
      await fetch(ENGFIT_SUBMIT_URL, { method: "POST", mode: "no-cors", body: body });
      return true;
    } catch (e2) { return false; }
  }
}

var _engfitSent = false;
async function engfitSubmitWithStatus(r) {
  if (_engfitSent) return; _engfitSent = true;
  var el = document.getElementById("submit-status");
  el.textContent = "결과 전송 중...";
  el.style.color = "#888";
  var ok = await engfitSubmit(r);
  if (ok) { el.textContent = "✓ 결과가 지나티처에게 자동 전송되었어요"; el.style.color = "#2e7d6e"; }

}

 {

  "html": "<div class=\"ctitle\">① 3인칭 단수 현재 — 동사 끝에 -s<\/div><div class=\"box\"><div class=\"lab\">원래 문제<\/div>My friend <u>come<\/u> to school by bus. (어법상 고치기)<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>come → comes<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>come → <b>comes<\/b><\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">주어 <b>My friend<\/b>는 한 명(3인칭 단수)이고 습관을 말하는 현재 문장이에요. 이럴 때는 동사 끝에 <b>-s<\/b>를 붙여야 하는데, 태은이는 동사 원형 come을 그대로 썼어요. 영작할 때는 주어를 먼저 보고 'he / she / it으로 바꿀 수 있나?'를 확인하면 실수가 줄어요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>3인칭 단수 주어 + 일반동사 현재형<\/p><ul><li>he, she, it, 사람 한 명, 물건 하나가 주어이면 동사에 <b class=\"hl\">-s<\/b>: He <b>writes<\/b> in his diary every night.<\/li><li>I, you, we, they, 복수 주어는 동사 원형: They <b>write<\/b> in their diaries.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 헷갈리는 함정: 빈도 부사(every night, always)가 있어도 규칙은 같아요. 시간 표현을 보고 -s를 빼먹지 마세요!<\/div>"
 },
 {

  "q": "빈칸에 알맞은 말은?<div class=\"pass\">My neighbor ______ to the park by bike every morning.<\/div>",

 },
 {
  "type": "twin",
  "q": "어법상 <b>틀린<\/b> 문장은?",

 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">② -s / -es 철자 — study → studies, watch → watches<\/div><div class=\"box\"><div class=\"lab\">원래 문제<\/div>She <u>study<\/u> math every day. / Jun <u>clean<\/u> his room and <u>water<\/u> the plants.<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>(사진 속 빨간 수정 문항)<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>She <b>studies<\/b> math / Jun <b>cleans<\/b> his room and <b>waters<\/b> the plants<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">3인칭 단수 -s를 붙일 때는 단어 끝 모양에 따라 <b>-s / -es / -ies<\/b>가 달라요. study는 <b>자음 + y<\/b>로 끝나서 y를 i로 바꾸고 -es를 붙여요. 그리고 and로 이어진 두 동사(cleans, waters)는 <b>둘 다<\/b> -s가 필요해요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>동사 끝 모양에 따른 -s 붙이기<\/p><ul><li>대부분: <b class=\"hl\">+s<\/b> (clean → cleans, water → waters, drink → drinks)<\/li><li>-s, -x, -ch, -sh, -o로 끝나면: <b class=\"hl\">+es<\/b> (watch → watches, go → goes)<\/li><li>자음 + y: <b class=\"hl\">y → ies<\/b> (study → studies, fly → flies)<\/li><li>and로 이어진 동사는 각각 -s: Jun cleans his room <b>and<\/b> waters the plants.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 헷갈리는 함정: 모음 + y(play, enjoy)는 그냥 -s: plays, enjoys. study와 play를 같은 규칙으로 쓰면 틀려요!<\/div>"
 },

 },
 {

  "q": "빈칸에 알맞은 말은?<div class=\"pass\">Every child in the class ______ a pencil case.<\/div>",

 },
 {

 },
 {
  "type": "concept",
  "html": "<div class=\"ctitle\">④ doesn't 뒤에는 원형, but 뒤에서는 다시 -s<\/div><div class=\"box\"><div class=\"lab\">원래 문제<\/div>My dad doesn't drink coffee but he <u>drinks<\/u> green tea. (빈칸 영작)<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>(사진 속 빨간 수정 문항)<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>doesn't <b>drink<\/b> / he <b>drinks<\/b><\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">한 문장 안에 부정문(doesn't)과 긍정문(he drinks)이 함께 나오면 헷갈려요. <b>doesn't 바로 뒤<\/b>에는 동사원형을 쓰지만, <b>but 뒤의 새 절은 주어(he)가 따로 있는 긍정문<\/b>이라 다시 -s를 붙여야 해요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>does / doesn't 뒤는 원형, 새 절은 주어에 맞춰<\/p><ul><li>doesn't + <b class=\"hl\">동사원형<\/b>: He doesn't <b>drink<\/b> coffee. (doesn't drinks ✕)<\/li><li>but / and 뒤에 주어 + 동사가 새로 나오면 그 주어에 맞춰: he <b>drinks<\/b> green tea.<\/li><li>같은 문장 안에서도 절마다 규칙을 따로 확인해요.<\/li><\/ul><\/div><div class=\"trap\">⚠️ 헷갈리는 함정: does를 썼는데 -s까지 붙이면(does eats) 두 번 표시해서 틀려요. -s는 한 번만!<\/div>"

  "html": "<div class=\"ctitle\">⑥ 시제 일치 — and로 이어진 동사는 같은 시제<\/div><div class=\"box\"><div class=\"lab\">원래 문제<\/div>Yesterday Sora <u>got up<\/u> late and <u>missed<\/u> the bus. / Last night I watched a movie and went to bed late.<\/div><div class=\"two\"><div class=\"box\"><div class=\"lab\">태은이가 쓴 답<\/div>(사진 속 빨간 수정 문항)<\/div><div class=\"box ok\"><div class=\"lab\">정답<\/div>got up / missed (둘 다 과거) · watched / went (둘 다 과거)<\/div><\/div><div class=\"lab2\">왜 틀렸을까?<\/div><p class=\"why\">and로 이어진 두 동작은 같은 때에 일어난 일이라 <b>시제를 맞춰야<\/b> 해요. Yesterday, Last night, ago가 있으면 앞뒤 동사 <b>모두 과거형<\/b>이에요. 첫 동사만 과거로 쓰고 둘째는 현재로 쓰면 틀려요.<\/p><div class=\"rule\"><div class=\"lab\">개념 정리<\/div><p>and로 이어진 동사의 시제 일치<\/p><ul><li>문장 맨 앞에서 시간 표현을 확인: yesterday, last night, last week → <b class=\"hl\">과거<\/b><\/li><li>and 앞뒤 동사는 같은 시제: got up <b>and<\/b> missed / watched <b>and<\/b> went<\/li><li>불규칙 동사는 과거형을 외워요: go → went, get → got, eat → ate, wake → woke<\/li><\/ul><\/div><div class=\"trap\">⚠️ 헷갈리는 함정: 문장이 길어지면 첫 동사에서 시제가 정해진 걸 잊기 쉬워요. and 뒤 동사에도 yesterday가 걸려 있다고 생각하세요!<\/div>"

var QUIZ_ID = "clinic-hte-1029-2";
var QUIZ_TITLE = "한태은 사진 클리닉 개념+쌍둥이 10/29";
var TW = STEPS.filter(function (x) { return x.type === "twin"; });
var CONCEPT_OF = {};
(function () { var last = ""; STEPS.forEach(function (x, i) { if (x.type === "concept") last = x.html; else CONCEPT_OF[i] = last; }); })();

var studentName = "", cur = 0, twinNo = 0, correctCount = 0, wrongNumbers = [], unknownNumbers = [], answersLog = [], startTime = 0, locked = false;
var nameInput = document.getElementById("name-input"), startBtn = document.getElementById("start-btn");
var CIRCLED = ["①", "②", "③", "④", "⑤"];
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function $(id) { return document.getElementById(id); }

startBtn.addEventListener("click", function () {
  studentName = nameInput.value.trim();
  if (!studentName) return;
  startTime = Date.now();
  $("start-card").classList.add("hidden");
  $("quiz-card").classList.remove("hidden");
  show();
});
$("read-btn").addEventListener("click", function () { cur++; show(); });

function show() {
  if (cur >= STEPS.length) return showResult();
  var st = STEPS[cur];
  $("bar-fill").style.width = Math.round(cur / STEPS.length * 100) + "%";
  $("fb").innerHTML = "";
  if (st.type === "concept") {
    $("progress").textContent = "틀린 이유 읽기 · 쌍둥이 문제 " + (twinNo + 1) + "번 전";
    $("part").classList.add("hidden");
    $("concept-box").innerHTML = st.html; $("concept-box").classList.remove("hidden");
    $("read-btn").classList.remove("hidden");
    $("qtext").innerHTML = ""; $("choices").innerHTML = "";
    window.scrollTo(0, 0);
  } else {
    $("progress").textContent = "쌍둥이 문제 " + (twinNo + 1) + " / " + TW.length;
    $("concept-box").classList.add("hidden"); $("read-btn").classList.add("hidden");
    $("qtext").innerHTML = "Q" + (twinNo + 1) + ". " + st.q;
    var box = $("choices"); box.innerHTML = "";
    shuffle(st.choices).forEach(function (c, i) {
      var b = document.createElement("button"); b.className = "choice"; b.setAttribute("data-c", c);
      b.innerHTML = '<span class="num">' + CIRCLED[i] + "</span>" + c;
      b.addEventListener("click", function () { pick(c); });
      box.appendChild(b);
    });
    var u = document.createElement("button"); u.className = "unk"; u.id = "unk-btn"; u.textContent = "🤔 모름";
    u.addEventListener("click", function () { unknown(); });
    box.appendChild(u);
    window.scrollTo(0, 0);
  }
}

function pick(choice) {
  if (locked) return; locked = true;
  var st = STEPS[cur], ok = choice === st.answer;
  if (ok) correctCount++; else wrongNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: ok, chosen: choice, answer: st.answer });
  [].forEach.call($("choices").children, function (b) {
    b.disabled = true;
    if (b.getAttribute("data-c") === st.answer) b.classList.add("right");
    else if (b.getAttribute("data-c") === choice) b.classList.add("bad");
  });
  var h = '<div class="exp' + (ok ? "" : " wrong") + '"><b>' + (ok ? "정답! 🎉" : "아쉬워요 — 정답: " + st.answer) + "</b><br>" + st.exp + "</div>";
  if (!ok) h += '<div class="lab2">📖 개념 정리 다시 보기</div>' + CONCEPT_OF[cur];
  h += '<button class="btn" id="next-btn">' + (twinNo + 1 < TW.length ? "다음 ▶" : "결과 보기") + "</button>";
  $("fb").innerHTML = h;
  $("next-btn").addEventListener("click", function () { locked = false; twinNo++; cur++; show(); });
}

function unknown() {
  if (locked) return; locked = true;
  var st = STEPS[cur];
  wrongNumbers.push(twinNo + 1); unknownNumbers.push(twinNo + 1);
  answersLog.push({ no: twinNo + 1, ok: false, chosen: "모름", answer: st.answer, unknown: true });
  locked = false; twinNo++; cur++; show();
}

function unknownLine() {
  return "🤔 모름: " + unknownNumbers.length + "개" + (unknownNumbers.length ? " (" + unknownNumbers.join(", ") + "번)" : "");
}

function showResult() {
  $("quiz-card").classList.add("hidden");
  $("result-card").classList.remove("hidden");
  $("score-line").textContent = correctCount + " / " + TW.length;
  var um = document.createElement("div"); um.id = "unknown-line"; um.className = "sub"; um.style.textAlign = "center"; um.textContent = unknownLine();
  $("score-line").parentNode.insertBefore(um, $("submit-status"));
  var expBox = $("explanations");
  TW.forEach(function (q, i) {
    var log = answersLog[i], d = document.createElement("div");
    d.className = "exp" + (log.ok ? "" : " wrong");
    d.innerHTML = "<b>쌍둥이 " + (i + 1) + ". " + (log.ok ? "정답!" : (log.unknown ? "🤔 모름 (정답: " + q.answer + ")" : "오답 (내 답: " + log.chosen + " → 정답: " + q.answer + ")")) + "</b><br>" + q.exp;
    expBox.appendChild(d);
  });
  engfitSubmitWithStatus({ quizId: QUIZ_ID, quizTitle: QUIZ_TITLE, student: studentName, score: correctCount, total: TW.length, wrong: wrongNumbers,
    unknown: unknownNumbers, durationSec: Math.round((Date.now() - startTime) / 1000), detail: answersLog });
}

document.getElementById("kakao-btn").addEventListener("click", function () {
  var msg = "[영핏 사진 클리닉 10/29 결과]\n퀴즈ID: " + QUIZ_ID + "\n학생: " + studentName +
            "\n점수: " + correctCount + "/" + TW.length +
            "\n틀린 문항: " + (wrongNumbers.length ? wrongNumbers.join(", ") : "없음") +
            "\n" + unknownLine();
  navigator.clipboard.writeText(msg).then(function () {
    document.getElementById("kakao-btn").textContent = "복사 완료! 카톡에 붙여넣기 하세요 ✓";
  }).catch(function () {
    prompt("아래 내용을 길게 눌러 복사하세요", msg);
  });
});

</script>
